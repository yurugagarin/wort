<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORT · Almanca Defteri</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e0d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WORT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* tema, sayfa çizilmeden önce: beyaz parlama olmasın */
(function(){var p='auto';try{p=localStorage.getItem('wort:theme')||'auto';}catch(e){}
var d=p==='dark'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
if(d)document.documentElement.classList.add('dark');})();
</script>
<style>
/* ============================================================
   TASARIM KATMANI — FORM ailesi: sayfa → kart → kart2
   ============================================================ */
:root{
  --pg:#e9e0d0; --card:#fffdf9; --card2:#f9f4ea; --inset:#ffffff;
  --line:#ece1cd; --line2:#f3ecdd;
  --ink:#3a342c; --ink2:#8a7f6f; --ink3:#a8987c; --ink4:#c0b193;
  --char:#26262a; --lime:#d6e64b; --on-char:#f7f5f2;
  --pill:#3a342c; --on-pill:#f6efe1;
  /* artikel renkleri: der mavi, die gül, das yeşil */
  --der:#7c9ec4; --der-t:#e8eff6;
  --die:#c98a8f; --die-t:#f7ebeb;
  --das:#7fa88b; --das-t:#eaf1ec;
  /* beceriler */
  --les:#9b8fc0; --les-t:#efedf7;
  --hor:#7c9ec4; --hor-t:#e8eff6;
  --sch:#e0a272; --sch-t:#faefe5;
  --spr:#7fa88b; --spr-t:#eaf1ec;
  --wrn:#d9a03c; --wrn-t:#faf0dc;
  --ok:#5f9e78; --bad:#c2695a;
  --f-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);   /* iOS sheet eğrisi */
  --dur:.26s;
  --lift:0 1px 2px rgba(60,52,44,.05),0 6px 18px -8px rgba(60,52,44,.16);
  --lift2:0 2px 4px rgba(60,52,44,.06),0 14px 32px -12px rgba(60,52,44,.22);
  --tabbg:rgba(250,246,238,.78); --tabbd:rgba(255,255,255,.55);
  --bg:radial-gradient(150% 95% at 50% 0%,#f0e8da 0%,#e9e0d0 52%,#ded2bd 100%);
}
html.dark{
  --pg:#13110f; --card:#1f1c19; --card2:#292521; --inset:#11100e;
  --line:#34302a; --line2:#292521;
  --ink:#f7f5f2; --ink2:#bbb2a7; --ink3:#a49889; --ink4:#746859;
  --char:#0b0a09; --lime:#d6e64b; --on-char:#f7f5f2;
  --pill:#eadfca; --on-pill:#171513;
  --der:#93b8d8; --der-t:#1b2026; --die:#d9a1a5; --die-t:#261c1d; --das:#93c27d; --das-t:#1f2419;
  --les:#b5a6dd; --les-t:#211e27; --hor:#93b8d8; --hor-t:#1b2026;
  --sch:#e2ae72; --sch-t:#241e18; --spr:#93c27d; --spr-t:#1f2419;
  --wrn:#e3b75e; --wrn-t:#201e1b; --ok:#8fbd78; --bad:#d98a7a;
  --lift:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.5);
  --lift2:0 2px 4px rgba(0,0,0,.3),0 14px 32px -12px rgba(0,0,0,.6);
  --tabbg:rgba(31,28,25,.8); --tabbd:rgba(255,255,255,.07);
  --bg:radial-gradient(150% 95% at 50% 0%,#151311 0%,#13110f 52%,#141210 100%);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;color:var(--ink);
  background:var(--pg);background-image:var(--bg);background-attachment:fixed;min-height:100vh;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--der);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.small{font-size:12px}
[hidden]{display:none!important}

/* ---- çerçeve ---- */
.app{max-width:520px;margin:0 auto;padding:0 14px calc(112px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 4px 10px;
  background:linear-gradient(var(--pg) 70%,transparent)}
.top .lg{width:30px;height:30px;flex:none}
.top b{font-family:var(--f-disp);font-size:20px;letter-spacing:.05em;font-weight:700}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--char);color:var(--on-char);
  border-radius:999px;padding:5px 12px 5px 9px;font-size:12px;font-weight:700}
.streak i{width:8px;height:8px;border-radius:50%;background:var(--lime);display:block}
.streak.off i{background:var(--ink4)}
.gear{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid var(--line);background:var(--card)}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scr{display:flex;flex-direction:column;gap:12px;animation:tabIn .3s var(--ease) both}

/* ---- yüzeyler ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--lift);position:relative}
html:not(.dark) .card{border-color:rgba(255,255,255,.7);box-shadow:var(--lift),0 0 0 1px var(--line) inset}
.card.dom{border-top:3px solid var(--dc,var(--ink3))}
.card h2{font-size:19px;line-height:1.2}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* ---- hareket ---- */
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popNum{0%{transform:scale(1)}38%{transform:scale(1.11)}100%{transform:scale(1)}}
@keyframes fillBar{from{width:0}}
@keyframes tabIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scr > *{animation:riseIn .34s var(--ease) both}
.scr > *:nth-child(2){animation-delay:.04s}
.scr > *:nth-child(3){animation-delay:.08s}
.scr > *:nth-child(4){animation-delay:.12s}
.scr > *:nth-child(5){animation-delay:.16s}
.scr > *:nth-child(n+6){animation-delay:.2s}
.pulse{animation:popNum .42s var(--ease)}
.bar > i{animation:fillBar .55s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- düğmeler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;
  font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line);transition:transform .15s var(--ease),background .18s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--pill);border-color:var(--pill);color:var(--on-pill)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#26262a}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--pill);color:var(--on-pill)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--pill);border-color:var(--pill);color:var(--on-pill)}
.inp{width:100%;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;
  box-shadow:inset 0 1px 2px rgba(60,52,44,.07)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:15px}
.step button:active{transform:scale(.94)}
.step .v{min-width:64px;text-align:center;font-family:var(--f-disp);font-size:26px;font-weight:600;line-height:1}
.step .v small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.1em;color:var(--ink3);font-weight:700;text-transform:uppercase}

/* ---- Heute ---- */
.hero{display:flex;gap:16px;align-items:center}
.ring{width:112px;height:112px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--f-disp);font-size:36px;line-height:1;font-weight:600}
.ring .v small{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.hero .meta{min-width:0;flex:1}
.hero .date{font-family:var(--f-disp);font-size:21px;line-height:1.15;margin-top:2px}
.hero .verdict{color:var(--ink2);font-size:13px;margin-top:4px}
.segs{display:flex;gap:3px;margin-top:10px}
.segs span{height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--lift);overflow:hidden}
.trow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;transition:transform .15s var(--ease)}
.trow:active{transform:scale(.985)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink4);flex:none;display:grid;place-items:center;
  background:linear-gradient(to top,color-mix(in srgb,var(--c) 55%,transparent) var(--f,0%),transparent var(--f,0%));transition:all .25s}
.ck svg{width:14px;height:14px;stroke:var(--card);stroke-width:3;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.task.done .ck{background:var(--c);border-color:var(--c)}
.task.done .ck svg{opacity:1}
.task.part .ck{border-color:var(--c)}
.tx{min-width:0;flex:1}
.t1{display:block;font-weight:700;font-size:14px}
.t2{display:block;font-size:12px;color:var(--ink2)}
.task.done .t1{text-decoration:line-through;text-decoration-color:var(--ink4)}
.pt{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}
.task.part .pt,.task.done .pt{color:var(--c)}
.tbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;animation:fade .25s ease both;border-top:1px dashed var(--line);padding-top:12px;margin-top:-2px}
.prompt .de{font-family:var(--f-disp);font-size:17px;line-height:1.3}
.prompt .tr{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);line-height:1.4}
.minday{font-size:12px;color:var(--ink2);background:var(--wrn-t);border-radius:12px;padding:9px 12px;border:1px solid color-mix(in srgb,var(--wrn) 25%,transparent)}
.minday b{color:var(--ink)}
.sotd .de{font-family:var(--f-disp);font-size:19px;line-height:1.3;margin-top:6px}
.sotd .tr{font-size:13px;color:var(--ink2);margin-top:6px}
.sotd .why{font-size:12px;color:var(--ink2);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

/* ---- Wörter ---- */
.srs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srs div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--lift)}
.srs b{font-family:var(--f-disp);font-size:22px;display:block;line-height:1.1}
.srs span{font-size:11px;color:var(--ink2)}
.flash{text-align:center;padding:22px 18px 18px;min-height:330px;display:flex;flex-direction:column;gap:12px;justify-content:center;transition:background .3s}
.flash .src{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.flash .prog{position:absolute;top:12px;right:14px;font-size:11px;font-weight:700;color:var(--ink3)}
.word{font-family:var(--f-disp);font-size:36px;line-height:1.1;font-weight:600;overflow-wrap:anywhere}
.word .art{color:var(--ac)}
.pl{font-size:13px;color:var(--ink2)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arts button{border:1.5px solid var(--a);background:var(--at);color:var(--ink);border-radius:12px;padding:12px 0;font-weight:700;font-size:17px;transition:transform .12s var(--ease)}
.arts button:active{transform:scale(.95)}
.ans{display:flex;flex-direction:column;gap:6px}
.ans .tr{font-size:16px;font-weight:600}
.ans .ex{font-size:14px;color:var(--ink2);font-style:italic}
.ans .ex b{font-style:normal;color:var(--ink)}
.rule{font-size:12px;color:var(--ink2);background:var(--card2);border-radius:10px;padding:7px 10px;margin-top:4px}
.res{font-size:12px;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.grade button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 0;font-size:14px;font-weight:700}
.grade button small{display:block;font-size:10px;color:var(--ink3);font-weight:500}
.grade button:active{transform:scale(.96)}
.link{font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ex3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ex3 button{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ex3 button b{font-size:13px}
.ex3 button span{font-size:11px;color:var(--ink2);line-height:1.3}
.ex3 button i{width:22px;height:4px;border-radius:2px;background:var(--c);display:block;margin-bottom:4px}
.lvls{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.lvls .h{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.lvls .h span{color:var(--ink3);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink))}
.qres{display:flex;flex-direction:column;margin-top:6px}
.qres .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.qres .r:last-child{border-bottom:0}
.qres .r .w{font-weight:700}
.qres .r .m{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qres .r .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap}

/* ---- Weg ---- */
.lvl .big{font-family:var(--f-disp);font-size:30px;font-weight:600}
.track{height:12px;border-radius:6px;background:var(--line);position:relative;margin-top:10px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--pill);border-radius:6px;animation:fillBar .7s var(--ease) both}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:5px;font-weight:700}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.sk{display:flex;flex-direction:column;gap:6px}
.sk .h{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.sk .h span{color:var(--ink3);font-weight:600}
.sk .k{font-size:11px;color:var(--ink2);line-height:1.35}
.exam{background:var(--char);color:var(--on-char);border-color:transparent!important;display:flex;align-items:center;gap:14px;box-shadow:var(--lift2)!important}
.exam .n{font-family:var(--f-disp);font-size:42px;line-height:1;color:var(--lime);font-weight:600}
.exam small{display:block;opacity:.7;font-size:12px}
.exam .btn{margin-left:auto;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:var(--on-char)}
.band{margin-top:12px}
.band:first-of-type{margin-top:6px}
.band .bh{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 4px;border-bottom:1px solid var(--line)}
.band .bh b{font-family:var(--f-disp);font-size:16px}
.gl{list-style:none}
.gl li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);font-size:14px}
.gl li:last-child{border-bottom:0}
.gl .nm{flex:1;min-width:0;text-align:left;padding:10px 0;display:flex;align-items:center;gap:10px}
.gl .dot{width:8px;height:8px;border-radius:50%;flex:none}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;transition:background .2s}
.st.ok{background:var(--das-t);color:var(--das)}
.st.wip{background:var(--wrn-t);color:var(--wrn)}
.st.next{background:var(--card2);color:var(--ink3)}

/* ---- Woche ---- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.heat .dn{font-size:10px;color:var(--ink3);text-align:center;font-weight:700}
.heat .c{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);border:1.5px solid transparent;background:var(--card2)}
.heat .c.today{border-color:var(--ink)}
.heat .c.min{background:var(--wrn-t)!important;color:var(--wrn)!important;border-color:color-mix(in srgb,var(--wrn) 35%,transparent)}
.heat .c.fut{background:transparent;border:1.5px dashed var(--line)}
.heat .c.pre{background:transparent;color:var(--ink4)}
.hkey{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3);margin-top:10px;flex-wrap:wrap}
.hkey i{width:12px;height:12px;border-radius:3px;display:block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card2);border-radius:12px;padding:9px 11px}
.stats b{font-family:var(--f-disp);font-size:22px;display:block;line-height:1.1}
.stats span{font-size:11px;color:var(--ink2)}
.soon{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--ink3)}
.soon b{color:var(--ink2)}

/* ---- sekme çubuğu (FORM gtabs) ---- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:40;display:flex;gap:2px;border-radius:34px;background:var(--tabbg);
  -webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px);
  border:1px solid var(--tabbd);box-shadow:0 10px 30px rgba(50,42,30,.18),0 2px 6px rgba(50,42,30,.08);padding:6px}
.tabs button{flex:1 1 0;min-width:0;border-radius:28px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink3);transition:background .18s ease,color .18s ease,transform .18s ease}
.tabs button:active{transform:scale(.94)}
.tabs button.on{background:var(--pill);color:var(--on-pill);font-weight:700;box-shadow:0 4px 12px rgba(58,52,44,.28)}

/* ---- alt sayfa (sheet) ---- */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(30,26,22,.42);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card2);
  border-radius:24px 24px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--lift2);
  animation:sheetUp .34s var(--ease) both;overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink4);margin:4px auto 10px;opacity:.6}
.shd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shd h2{font-size:22px;line-height:1.15}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;color:var(--ink2);flex:none}
.sheet .card{box-shadow:none}
.sec{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.sec > label,.sec > .lb{font-size:12px;font-weight:700;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:5px}
.field span{font-size:12px;font-weight:700;color:var(--ink2)}

/* cümle kurma */
.sz-tr{font-size:15px;color:var(--ink2);text-align:center}
.sz-ans{min-height:96px;border:1.5px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--card);transition:border-color .2s,background .2s}
.sz-ans.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.sz-ans.no{border-style:solid;border-color:var(--bad);animation:shake .3s}
.sz-bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px}
.tok{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:16px;font-weight:600;box-shadow:var(--lift);transition:transform .12s var(--ease)}
.tok:active{transform:scale(.94)}
.sz-sol{font-family:var(--f-disp);font-size:17px;line-height:1.35;background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.dots{display:flex;gap:4px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--ink)}
.gsent{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line2)}
.gsent:last-child{border-bottom:0}
.gsent b{font-family:var(--f-disp);font-weight:500;font-size:16px}
.gsent span{font-size:12px;color:var(--ink2)}
.sum{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--les);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sum b{display:block;font-family:var(--f-disp);font-size:16px;font-weight:600;margin-bottom:3px}
.sum p{font-size:14px;line-height:1.6;color:var(--ink2)}
.sum p b{display:inline;font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--ink);margin:0}
.expl{font-size:14px;line-height:1.5;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--les);border-radius:12px;padding:10px 12px}

/* blitz ve lücke */
.blitz .word{font-size:40px;margin:18px 0 8px;text-align:center;transition:color .2s}
.blitz .word.ok{color:var(--ok)}.blitz .word.no{color:var(--bad);animation:shake .3s}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--lime);border-radius:4px}
.big{font-family:var(--f-disp);font-size:48px;line-height:1;font-weight:600}
.lsent{font-family:var(--f-disp);font-size:20px;line-height:1.4;text-align:center;padding:10px 4px}
.lsent u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 18px}
.lsent b{color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;font-weight:700;font-size:15px}
.opts button.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
.opts button.no{background:color-mix(in srgb,var(--bad) 15%,var(--card));border-color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:80;
  background:var(--char);color:var(--on-char);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;pointer-events:none;
  transition:opacity .2s,transform .3s var(--ease);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--lift2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function peek(k){return S.days[k]||null;}

/* ---------------- kelime havuzu ---------------- */
var POOL=[],PK={},NOUNS=[];
var LV=['','A1','A2','B1'];
function parsePool(){
  var lines=$('pool').textContent.split('\n');
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();if(!l||l.charAt(0)==='#')continue;
    var f=l.split('|');if(f.length<6)continue;
    var e={l:+f[0]||2,p:f[1]||'x',a:f[2]||'',w:f[3],f:f[4]||'',tr:f[5],ex:f[6]||'',t:f[7]||'',r:f[8]||''};
    e.k=(e.a?e.a+' ':'')+e.w;
    if(PK[e.k])continue;
    e.id='p:'+e.k;PK[e.k]=e;POOL.push(e);
    if(e.p==='n')NOUNS.push(e);
  }
  NOUNS.sort(function(a,b){return b.w.length-a.w.length;});
}
function card(id){
  if(id.indexOf('m:')===0){for(var i=0;i<S.mine.length;i++)if(S.mine[i].id===id)return S.mine[i];return null;}
  return PK[id.slice(2)]||null;
}
function uml(w){
  var m=w.match(/^(.*?)(au|Au|a|A|o|O|u|U)([^aouAOU]*)$/);if(!m)return w;
  var U={au:'äu',Au:'Äu',a:'ä',A:'Ä',o:'ö',O:'Ö',u:'ü',U:'Ü'};
  return m[1]+U[m[2]]+m[3];
}
function plural(c){
  if(c.p!=='n'||!c.f)return '';
  var f=c.f,w=c.w;
  if(f==='-')return w;
  if(f.charAt(0)==='¨'){w=uml(w);f=f.slice(1);if(!f||f==='-')return w;}
  if(f.charAt(0)==='-')return w+f.slice(1);
  return f;
}
/* artikel notu: önce kesin ekler, sonra bileşik isim, sonra "çoğunlukla" kuralları */
var RSTRONG=[[/ung$/,'die','-ung'],[/heit$/,'die','-heit'],[/keit$/,'die','-keit'],[/schaft$/,'die','-schaft'],
  [/tion$|sion$/,'die','-ion'],[/tät$/,'die','-tät'],[/chen$/,'das','-chen (küçültme)'],[/lein$/,'das','-lein (küçültme)'],
  [/ling$/,'der','-ling'],[/ismus$/,'der','-ismus']];
var RWEAK=[[/ment$/,'das','-ment ile bitenlerin çoğu das.'],[/um$/,'das','-um ile bitenlerin çoğu das.'],
  [/ik$/,'die','-ik ile bitenlerin çoğu die.'],[/..ei$/,'die','-ei ile bitenlerin çoğu die.'],
  [/nis$/,'das','-nis ile bitenlerin çoğu das.'],[/^Ge/,'das','Ge- ile başlayan isimlerin çoğu das.'],
  [/e$/,'die','-e ile biten isimlerin çoğu die.']];
function rule(c){
  if(c.r)return c.r;
  if(c.p!=='n'||!c.a)return '';
  var w=c.w,a=c.a,i,m;
  for(i=0;i<RSTRONG.length;i++){m=RSTRONG[i];if(m[0].test(w)){
    if(m[1]===a)return m[2]+' ile biten isimler her zaman '+a+'.';
    if(m[2]==='-chen (küçültme)')break; /* der Kuchen: küçültme değil */
    return 'Dikkat: '+m[2]+' kuralı burada tutmuyor, bu kelime '+a+'. Ezberle.';}}
  var lw=w.toLowerCase();
  for(i=0;i<NOUNS.length;i++){var n=NOUNS[i];
    if(n.w.length>=3&&n.w.length<=w.length-3&&lw.slice(-n.w.length)===n.w.toLowerCase()){
      if(n.a===a)return 'Bileşik isim: artikel son kelimeden gelir → '+n.a+' '+n.w+'.';break;}}
  for(i=0;i<RWEAK.length;i++){m=RWEAK[i];if(m[0].test(w)){
    if(m[1]===a)return m[2];
    if(m[2].charAt(0)==='-'&&m[2].indexOf('-e ')===0&&a==='der')return '-e ile bitse de der: erkek canlılar böyle (der Kollege, der Junge).';}}
  return 'Kural yok: artikeli kelimeyle birlikte ezberle.';
}
var POS={n:'isim',v:'fiil',a:'sıfat',x:'kelime'};
var SRCL={form:'FORM',ajanda:'Ajanda',kitap:'Kitap',diger:'Diğer'};
function srcLabel(c){
  if(c.src)return 'Kendi · '+(SRCL[c.src]||c.src);
  if(c.t)return 'Başlangıç · '+c.t;
  return 'Havuz · '+LV[c.l];
}
function hl(ex){return esc(ex).replace(/\*([^*]+)\*/g,'<b>$1</b>');}
function plain(ex){return ex.replace(/\*/g,'');}
function ART(a){return a==='der'?'der':a==='die'?'die':a==='das'?'das':'';}

/* ---------------- aralıklı tekrar (SM-2 benzeri) ---------------- */
function next(id,g){
  var s=S.srs[id]||{i:0,e:2.5,n:0};
  if(g===0)return 0;
  if(g===1)return s.n===0?2:Math.max(s.i+1,Math.round(s.i*1.2));
  if(g===2)return s.n===0?6:Math.max(s.i+2,Math.round(s.i*s.e));
  return 30;
}
function ivl(n){if(n<=0)return 'bugün';if(n===1)return 'yarın';if(n<31)return n+' gün';if(n<365)return Math.round(n/30)+' ay';return Math.round(n/365)+' yıl';}
function grade(id,g){
  ensureTarget();
  var t=today(),s=S.srs[id],fresh=!s,d=day();
  if(!s)s=S.srs[id]={i:0,e:2.5,n:0,d:t,a:t};
  var was=s.i,ni=next(id,g);
  if(g===0){s.n=0;s.i=0;s.e=Math.max(1.3,s.e-.2);s.lp=(s.lp||0)+1;s.d=t;}
  else{
    if(g===1)s.e=Math.max(1.3,s.e-.15);
    if(g===2)s.e=Math.min(3,s.e+.05);
    s.i=ni;s.n++;s.d=addD(t,ni);
  }
  d.w=(d.w||0)+1;
  if(fresh&&id.indexOf('p:')===0)d.np=(d.np||0)+1;
  if(was<21&&s.i>=21)d.sat=(d.sat||0)+1;   /* "oturdu" eşiği: 21 gün */
  save();
}
function counts(){
  var t=today(),due=0,lrn=0,sat=0;
  for(var id in S.srs){var s=S.srs[id];if(s.i>=21)sat++;else lrn++;if(s.d<=t&&card(id))due++;}
  return {due:due,lrn:lrn,sat:sat};
}
function newLeft(){var d=peek(today())||{};return Math.max(0,S.set.newPerDay+(d.npx||0)-(d.np||0));}
function newCands(){
  var mk={},st=[],r=[],i;
  for(i=0;i<S.mine.length;i++)mk[(S.mine[i].a?S.mine[i].a+' ':'')+S.mine[i].w]=1;
  for(i=0;i<POOL.length;i++){var e=POOL[i];
    if(S.srs[e.id]||mk[e.k])continue;
    if(e.t)st.push(e.id);else if(S.set.lv[e.l])r.push(e.id);}
  return {st:st,r:r};
}
/* yeni kartlar: önce başlangıç destesi, sonra seçili seviyelerden karışık */
function pickNew(n,skip){
  var c=newCands(),out=[],i;skip=skip||{};
  for(i=0;i<c.st.length&&out.length<n;i++)if(!skip[c.st[i]])out.push(c.st[i]);
  shuffle(c.r);
  for(i=0;i<c.r.length&&out.length<n;i++)if(!skip[c.r[i]])out.push(c.r[i]);
  return out;
}
/* günün kelime hedefi gün başında sabitlenir: vadesi gelen + yeni, en çok 25 */
function ensureTarget(){
  var d=day();
  if(d.wt==null){var c=counts(),nc=newCands();d.wt=Math.min(25,c.due+Math.min(newLeft(),nc.st.length+nc.r.length));save();}
}

/* ---------------- puan ---------------- */
function sentN(t){
  if(!t)return 0;
  return t.split(/[.!?…]+/).filter(function(x){return (x.match(/[A-Za-zÄÖÜäöüß]+/g)||[]).length>=3;}).length;
}
var MAX={wort:30,gram:15,hor:20,sch:20,spr:15};
function frac(d){
  d=d||{};
  return {
    wort:d.wt===0?1:d.wt?Math.min(1,(d.w||0)/d.wt):0,
    gram:Math.min(1,(d.g||0)/6),
    hor:Math.min(1,(d.h||0)/10),
    sch:Math.min(1,sentN(d.sch)/3),
    spr:d.spr?1:0
  };
}
function parts(d){var f=frac(d),p={};for(var k in MAX)p[k]=Math.round(MAX[k]*f[k]);return p;}
function total(d){var p=parts(d);return p.wort+p.gram+p.hor+p.sch+p.spr;}
function wordDone(d){return !!d&&(d.wt===0||(d.wt>0&&(d.w||0)>=d.wt));}
function isMin(d){var p=parts(d);return wordDone(d)&&p.gram+p.hor+p.sch+p.spr===0;}
function streak(){
  var t=today(),k=wordDone(peek(t))?t:addD(t,-1),n=0;
  while(wordDone(peek(k))){n++;k=addD(k,-1);}
  return n;
}
function verdict(s,d){
  if(s>=90)return 'Tam gün. Ausgezeichnet!';
  if(s>=70)return 'Güçlü bir gün, biri kaldı.';
  if(wordDone(d))return s>30?'Seri güvende, devam.':'Minimum gün tamam, seri güvende.';
  if(s>0)return 'İyi başlangıç. Kelime tekrarını bitir, seri onunla korunur.';
  return 'Kelime tekrarıyla başla, seri onunla korunur.';
}

 ['Ich versuche, früher aufzustehen.','Daha erken kalkmaya çalışıyorum.'],
 ['Hast du Zeit, mir zu helfen?','Bana yardım etmeye vaktin var mı?'],
 ['Sie hat angefangen, Deutsch zu lernen.','Almanca öğrenmeye başladı.']]],
['g18','A2.2','deshalb, deswegen, darum','Sonuç bildirir. İkinci ana cümlenin ilk yerinde durur, çekimli fiil hemen arkasından gelir: …, deshalb gehe ich …',[
 ['Ich bin müde, deshalb gehe ich früh ins Bett.','Yorgunum, bu yüzden erken yatıyorum.'],
 ['Es regnet, deswegen bleiben wir zu Hause.','Yağmur yağıyor, bu yüzden evde kalıyoruz.'],
 ['Er hatte Muskelkater, darum hat er nicht trainiert.','Kas ağrısı vardı, bu yüzden antrenman yapmadı.'],
 ['Der Zug hatte Verspätung, deshalb kam ich zu spät.','Tren rötar yaptı, bu yüzden geç kaldım.'],
 ['Ich möchte in Deutschland arbeiten, deshalb lerne ich Deutsch.','Almanya\'da çalışmak istiyorum, bu yüzden Almanca öğreniyorum.'],
 ['Das Restaurant war voll, deswegen haben wir zu Hause gegessen.','Restoran doluydu, bu yüzden evde yedik.']]],
['g19','A2.2','Präteritum','Yazılı anlatımın geçmiş zamanı: düzenli fiil -te alır (machte), düzensizde kök değişir (ging, kam, sah). sein/haben konuşmada da Präteritum: war, hatte.',[
 ['Gestern war ich sehr müde.','Dün çok yorgundum.'],
 ['Als Kind hatte ich einen Hund.','Çocukken bir köpeğim vardı.'],
 ['Er kam um acht Uhr nach Hause.','Saat sekizde eve geldi.'],
 ['Wir gingen nach dem Essen spazieren.','Yemekten sonra yürüyüşe çıktık.'],
 ['Die Besprechung dauerte zwei Stunden.','Toplantı iki saat sürdü.'],
 ['Sie sah sehr glücklich aus.','Çok mutlu görünüyordu.']]],
['g20','A2.2','Lokale Präpositionen: zu, nach, bei, aus, von','Nereye: zu (kişi/kurum), nach (şehir/ülke, nach Hause), in (içine). Nerede: bei (kişinin yanında), zu Hause. Nereden: aus (içinden), von (kişiden/yerden).',[
 ['Ich gehe heute zum Arzt.','Bugün doktora gidiyorum.'],
 ['Sie wohnt noch bei ihren Eltern.','Hâlâ annesiyle babasının yanında oturuyor.'],
 ['Er kommt gerade aus dem Supermarkt.','Şu an süpermarketten çıkıyor.'],
 ['Wir fahren am Freitag nach Berlin.','Cuma günü Berlin\'e gidiyoruz.'],
 ['Ich komme gerade vom Training.','Antrenmandan geliyorum.'],
 ['Die Apotheke ist gegenüber der Post.','Eczane postanenin karşısında.']]],
['g21','B1.1','obwohl / trotzdem','obwohl yan cümle kurar, fiil sona gider. trotzdem ana cümlede ilk yerde durur, fiil hemen arkasından gelir.',[
 ['Ich gehe heute ins Fitnessstudio, obwohl ich Muskelkater habe.','Kas ağrım olmasına rağmen bugün spora gidiyorum.'],
 ['Ich habe Muskelkater, trotzdem gehe ich ins Fitnessstudio.','Kas ağrım var, yine de spora gidiyorum.'],
 ['Obwohl es regnet, laufen wir im Park.','Yağmur yağmasına rağmen parkta koşuyoruz.'],
 ['Er ist krank, trotzdem arbeitet er.','Hasta, yine de çalışıyor.'],
 ['Obwohl ich wenig Zeit hatte, habe ich gekocht.','Az vaktim olmasına rağmen yemek yaptım.'],
 ['Das Wetter war schlecht, trotzdem war der Ausflug schön.','Hava kötüydü, yine de gezi güzeldi.']]],
['g22','B1.1','als / wenn','Geçmişte bir kez olan → als. Geçmişte tekrarlanan ya da şimdi/gelecek → wenn.',[
 ['Als ich ein Kind war, habe ich viel Fußball gespielt.','Çocukken çok futbol oynardım.'],
 ['Wenn ich nach Hause kam, war das Essen schon fertig.','Eve her geldiğimde yemek hazır olurdu.'],
 ['Als wir in Berlin waren, hat es geregnet.','Berlin\'deyken yağmur yağdı.'],
 ['Wenn ich Zeit habe, lese ich ein Buch.','Vaktim olduğunda kitap okurum.'],
 ['Als ich ankam, war die Besprechung schon vorbei.','Vardığımda toplantı çoktan bitmişti.'],
 ['Immer wenn es schneite, gingen wir Ski fahren.','Ne zaman kar yağsa kayağa giderdik.']]],
['g23','B1.1','Plusquamperfekt und nachdem','Geçmişte daha önce olan: hatte/war + Partizip II. Çoğu zaman nachdem ile: Nachdem ich gegessen hatte, …',[
 ['Nachdem ich trainiert hatte, habe ich geduscht.','Antrenman yaptıktan sonra duş aldım.'],
 ['Als ich ankam, war der Zug schon abgefahren.','Vardığımda tren çoktan kalkmıştı.'],
 ['Nachdem sie gegessen hatten, gingen sie spazieren.','Yemek yedikten sonra yürüyüşe çıktılar.'],
 ['Ich hatte den Schlüssel vergessen.','Anahtarı unutmuştum.'],
 ['Nachdem er die E-Mail gelesen hatte, rief er mich an.','E-postayı okuduktan sonra beni aradı.'],
 ['Wir hatten vorher noch nie Sushi gegessen.','Daha önce hiç suşi yememiştik.']]],
['g24','B1.1','bevor, während, seit, bis','bevor = -meden önce, während = -irken, seit(dem) = -den beri, bis = -e kadar. Hepsi yan cümle: fiil sona.',[
 ['Bevor ich zur Arbeit gehe, trinke ich Kaffee.','İşe gitmeden önce kahve içerim.'],
 ['Während ich koche, höre ich Podcasts.','Yemek yaparken podcast dinlerim.'],
 ['Seit ich Sport mache, schlafe ich besser.','Spor yapmaya başladığımdan beri daha iyi uyuyorum.'],
 ['Warte, bis ich fertig bin!','Ben bitirene kadar bekle!'],
 ['Während er telefonierte, wartete ich draußen.','O telefonla konuşurken ben dışarıda bekledim.'],
 ['Bevor wir essen, waschen wir die Hände.','Yemekten önce ellerimizi yıkarız.']]],
['g25','B1.1','Relativsätze im Dativ und mit Präposition','Dativ ilgi zamirleri: dem, der, dem, denen. Edatlı fiilde edat zamirin önüne gelir: der Freund, mit dem ich trainiere.',[
 ['Das ist der Freund, mit dem ich trainiere.','Bu birlikte antrenman yaptığım arkadaşım.'],
 ['Die Kollegin, der ich geholfen habe, hat sich bedankt.','Yardım ettiğim iş arkadaşı teşekkür etti.'],
 ['Das ist das Thema, über das wir gesprochen haben.','Bu hakkında konuştuğumuz konu.'],
 ['Die Leute, denen ich die Wohnung gezeigt habe, waren nett.','Daireyi gösterdiğim insanlar nazikti.'],
 ['Das ist die Firma, bei der ich arbeite.','Bu çalıştığım firma.'],
 ['Der Termin, auf den ich warte, ist nächste Woche.','Beklediğim randevu gelecek hafta.']]],
['g26','B1.1','Konjunktiv II der Vergangenheit','Geçmişte gerçekleşmemiş durum: hätte/wäre + Partizip II. Pişmanlık: Ich hätte … sollen.',[
 ['Wenn ich mehr geschlafen hätte, wäre ich nicht so müde.','Daha çok uyusaydım bu kadar yorgun olmazdım.'],
 ['Ich hätte gestern trainieren sollen.','Dün antrenman yapmalıydım.'],
 ['Wenn du angerufen hättest, wäre ich gekommen.','Arasaydın gelirdim.'],
 ['Das hätte ich nicht gedacht.','Bunu hiç tahmin etmezdim.'],
 ['Wir wären fast zu spät gekommen.','Neredeyse geç kalıyorduk.'],
 ['Hättest du das gewusst?','Bunu bilir miydin?']]],
['g27','B1.1','Genitiv · wegen, trotz, während','Sahiplik: des Mannes, der Frau, des Kindes. wegen, trotz, während + Genitiv (konuşmada Dativ de duyulur).',[
 ['Wegen des Regens bleiben wir zu Hause.','Yağmur yüzünden evde kalıyoruz.'],
 ['Trotz des Muskelkaters bin ich gelaufen.','Kas ağrısına rağmen koştum.'],
 ['Während der Besprechung war mein Handy aus.','Toplantı sırasında telefonum kapalıydı.'],
 ['Das ist das Auto meines Bruders.','Bu kardeşimin arabası.'],
 ['Am Ende des Tages bin ich müde.','Günün sonunda yorgun oluyorum.'],
 ['Die Farbe der Wände gefällt mir.','Duvarların rengi hoşuma gidiyor.']]],
['g28','B1.1','um … zu / damit','Amaç: özne aynıysa um … zu + mastar; özne farklıysa damit + yan cümle.',[
 ['Ich trainiere, um fit zu bleiben.','Formda kalmak için antrenman yapıyorum.'],
 ['Ich lerne Deutsch, um in Deutschland zu arbeiten.','Almanya\'da çalışmak için Almanca öğreniyorum.'],
 ['Ich erkläre es noch einmal, damit du es verstehst.','Anlayasın diye bir kez daha açıklıyorum.'],
 ['Sie spart Geld, um ein Auto zu kaufen.','Araba almak için para biriktiriyor.'],
 ['Wir sprechen leise, damit das Baby schläft.','Bebek uyusun diye sessiz konuşuyoruz.'],
 ['Er steht früh auf, um vor der Arbeit zu laufen.','İşten önce koşmak için erken kalkıyor.']]],
['g29','B1.1','Zweiteilige Konnektoren','sowohl … als auch (hem … hem), weder … noch (ne … ne), entweder … oder (ya … ya), nicht nur … sondern auch (sadece … değil … de).',[
 ['Ich trinke sowohl Kaffee als auch Tee.','Hem kahve hem çay içerim.'],
 ['Er hat weder Zeit noch Lust.','Ne vakti var ne hevesi.'],
 ['Entweder trainieren wir heute oder morgen.','Ya bugün ya yarın antrenman yapıyoruz.'],
 ['Sie spricht nicht nur Deutsch, sondern auch Englisch.','Sadece Almanca değil, İngilizce de konuşuyor.'],
 ['Das Essen war weder warm noch lecker.','Yemek ne sıcaktı ne lezzetli.'],
 ['Wir können entweder kochen oder bestellen.','Ya yemek yaparız ya sipariş veririz.']]],
['g30','B1.1','Futur I','werden + mastar sona: gelecek, tahmin ya da söz. Gündelik dilde Präsens + zaman ifadesi de yeter.',[
 ['Ich werde nächstes Jahr die B1-Prüfung machen.','Gelecek yıl B1 sınavına gireceğim.'],
 ['Morgen wird es regnen.','Yarın yağmur yağacak.'],
 ['Er wird wohl noch im Büro sein.','Herhalde hâlâ ofistedir.'],
 ['Wir werden das schon schaffen.','Bunu elbet başaracağız.'],
 ['Ich werde ab jetzt jeden Tag üben.','Bundan sonra her gün pratik yapacağım.'],
 ['Wirst du am Wochenende Zeit haben?','Hafta sonu vaktin olacak mı?']]],
['g31','B1.2','Passiv: Präteritum, Perfekt, mit Modalverb','Präteritum: wurde + Partizip II. Perfekt: ist + Partizip II + worden. Modal fiille: muss + Partizip II + werden.',[
 ['Das Haus wurde 1950 gebaut.','Ev 1950\'de yapıldı.'],
 ['Die Besprechung ist abgesagt worden.','Toplantı iptal edildi.'],
 ['Der Antrag muss bis Freitag abgegeben werden.','Başvuru cumaya kadar teslim edilmeli.'],
 ['Das Paket wurde gestern geliefert.','Paket dün teslim edildi.'],
 ['Hier darf nicht geraucht werden.','Burada sigara içilemez.'],
 ['Die Ergebnisse sind schon veröffentlicht worden.','Sonuçlar çoktan açıklandı.']]],
['g32','B1.2','n-Deklination','Bazı eril isimler (çoğu -e ile biten canlılar ve -ent, -ist, -ant) Nominativ dışında -(e)n alır: der Kollege → den/dem Kollegen.',[
 ['Ich frage den Kollegen.','İş arkadaşıma soruyorum.'],
 ['Kennst du den neuen Studenten?','Yeni öğrenciyi tanıyor musun?'],
 ['Wir sprechen mit dem Präsidenten.','Başkanla konuşuyoruz.'],
 ['Ich habe morgen einen Termin beim Kunden.','Yarın müşteride bir randevum var.'],
 ['Der Junge hilft dem Nachbarn.','Oğlan komşuya yardım ediyor.'],
 ['Hast du den Namen vergessen?','Adı unuttun mu?']]],
['g33','B1.2','je … desto','je + karşılaştırma + yan cümle (fiil sona), desto + karşılaştırma + ana cümle (fiil hemen sonra).',[
 ['Je mehr ich übe, desto besser spreche ich.','Ne kadar çok pratik yaparsam o kadar iyi konuşuyorum.'],
 ['Je früher wir anfangen, desto schneller sind wir fertig.','Ne kadar erken başlarsak o kadar çabuk biteriz.'],
 ['Je schwerer das Gewicht ist, desto weniger Wiederholungen schaffe ich.','Ağırlık arttıkça daha az tekrar yapabiliyorum.'],
 ['Je länger ich in Deutschland lebe, desto mehr verstehe ich.','Almanya\'da yaşadıkça daha çok anlıyorum.'],
 ['Je älter er wird, desto ruhiger wird er.','Yaşlandıkça sakinleşiyor.'],
 ['Je öfter ich die Wörter wiederhole, desto leichter merke ich sie.','Kelimeleri sık tekrar ettikçe daha kolay aklımda kalıyor.']]],
['g34','B1.2','Partizip I und II als Adjektiv','Partizip I (mastar + d) etken ve eşzamanlı: das schlafende Kind. Partizip II edilgen ya da bitmiş: das gekochte Ei. Sıfat gibi çekimlenir.',[
 ['Das schlafende Kind ist sehr süß.','Uyuyan çocuk çok tatlı.'],
 ['Ich esse gern gekochte Eier.','Haşlanmış yumurta yemeyi severim.'],
 ['Wir haben ein gebrauchtes Auto gekauft.','İkinci el bir araba aldık.'],
 ['Die steigenden Preise sind ein Problem.','Artan fiyatlar bir sorun.'],
 ['Der reparierte Computer funktioniert wieder.','Tamir edilen bilgisayar yine çalışıyor.'],
 ['Das ist ein gut bezahlter Job.','Bu iyi maaşlı bir iş.']]],
['g35','B1.2','ohne … zu / statt … zu','ohne … zu = -meden, statt … zu = -mek yerine. Özne farklıysa ohne dass / statt dass.',[
 ['Er ist gegangen, ohne sich zu verabschieden.','Vedalaşmadan gitti.'],
 ['Statt zu trainieren, bin ich zu Hause geblieben.','Antrenman yapmak yerine evde kaldım.'],
 ['Sie hat den Vertrag unterschrieben, ohne ihn zu lesen.','Sözleşmeyi okumadan imzaladı.'],
 ['Statt Auto zu fahren, nehme ich das Fahrrad.','Araba kullanmak yerine bisiklete biniyorum.'],
 ['Ich trainiere nie, ohne mich aufzuwärmen.','Isınmadan asla antrenman yapmam.'],
 ['Statt zu kochen, haben wir Pizza bestellt.','Yemek yapmak yerine pizza söyledik.']]],
['g36','B1.2','lassen','Bir işi başkasına yaptırmak: Ich lasse das Auto reparieren. İzin vermek: Lass mich gehen. Perfekt\'te genelde mastar: Ich habe es reparieren lassen.',[
 ['Ich lasse mir die Haare schneiden.','Saçımı kestiriyorum.'],
 ['Wir lassen das Auto reparieren.','Arabayı tamir ettiriyoruz.'],
 ['Lass mich bitte ausreden!','Lütfen sözümü bitirmeme izin ver!'],
 ['Sie hat ihr Fahrrad reparieren lassen.','Bisikletini tamir ettirdi.'],
 ['Ich lasse meine Tasche im Auto.','Çantamı arabada bırakıyorum.'],
 ['Lassen Sie uns morgen weitersprechen.','Yarın konuşmaya devam edelim.']]],
['g37','B1.2','indem / sodass','indem = -erek (yöntem), sodass = öyle ki / bu yüzden (sonuç). İkisi de yan cümle.',[
 ['Man lernt Wörter am besten, indem man sie jeden Tag wiederholt.','Kelimeler en iyi her gün tekrar edilerek öğrenilir.'],
 ['Ich bleibe fit, indem ich dreimal pro Woche trainiere.','Haftada üç gün antrenman yaparak formda kalıyorum.'],
 ['Es hat stark geregnet, sodass das Spiel ausgefallen ist.','Çok yağmur yağdı, öyle ki maç iptal oldu.'],
 ['Er hat verschlafen, sodass er den Zug verpasst hat.','Uyuyakaldı, bu yüzden treni kaçırdı.'],
 ['Sie verbessert ihr Deutsch, indem sie Podcasts hört.','Podcast dinleyerek Almancasını geliştiriyor.'],
 ['Der Kurs war sehr gut, sodass ich viel gelernt habe.','Kurs çok iyiydi, öyle ki çok şey öğrendim.']]],
['g38','B1.2','Relativpronomen was, wo, wo(r)+Präposition','alles, nichts, etwas, das ve en üstünlükten sonra → was. Yer için → wo. Edatlı fiilde ve bütün cümleye gönderme → wo(r)+edat.',[
 ['Das ist alles, was ich weiß.','Bütün bildiğim bu.'],
 ['Es gibt nichts, was er nicht isst.','Yemediği hiçbir şey yok.'],
 ['Das ist die Stadt, wo ich geboren bin.','Bu doğduğum şehir.'],
 ['Das Beste, was du machen kannst, ist schlafen.','Yapabileceğin en iyi şey uyumak.'],
 ['Er hat endlich angerufen, worüber ich mich sehr freue.','Sonunda aradı, buna çok sevindim.'],
 ['Das Fitnessstudio, wo ich trainiere, ist sehr groß.','Antrenman yaptığım spor salonu çok büyük.']]],
['g39','B1.2','Konjunktiv II: irreale Wünsche, als ob','Gerçekleşmemiş dilek: Wenn ich doch … hätte! Gerçek dışı karşılaştırma: Er tut so, als ob er … wäre.',[
 ['Wenn ich doch mehr Zeit hätte!','Keşke daha çok vaktim olsa!'],
 ['Er tut so, als ob er alles wüsste.','Her şeyi biliyormuş gibi davranıyor.'],
 ['Wenn ich nur früher angefangen hätte!','Keşke daha erken başlasaydım!'],
 ['Du siehst aus, als ob du nicht geschlafen hättest.','Hiç uyumamış gibi görünüyorsun.'],
 ['Ich wünschte, ich könnte fließend Deutsch sprechen.','Keşke akıcı Almanca konuşabilsem.'],
 ['Sie redet, als ob sie die Chefin wäre.','Patronmuş gibi konuşuyor.']]],
['g40','B1.2','Nomen-Verb-Verbindungen','Kalıplaşmış isim + fiil: eine Entscheidung treffen, eine Frage stellen, Rücksicht nehmen, in Frage kommen. Anlam isimden gelir.',[
 ['Ich muss eine Entscheidung treffen.','Bir karar vermem lazım.'],
 ['Darf ich eine Frage stellen?','Bir soru sorabilir miyim?'],
 ['Wir sollten auf die Nachbarn Rücksicht nehmen.','Komşuları gözetmeliyiz.'],
 ['Der Trainer hat mir einen guten Rat gegeben.','Antrenör bana iyi bir tavsiye verdi.'],
 ['Das kommt nicht in Frage.','Bu söz konusu bile olamaz.'],
 ['Ich habe mit ihm Kontakt aufgenommen.','Onunla iletişime geçtim.']]]
];
/* ---------------- konu özetleri (Türkçe) ----------------
   Biçim: [başlık, metin]. Metinde *…* Almanca örnektir (kalın), satır sonu \n. */
var GS={
g1:[['Ne işe yarar?','Konuşmada geçmişi anlatmanın ana yolu. "Dün ne yaptın?" sorusunun cevabı neredeyse her zaman Perfekt\'tir.'],
 ['Nasıl kurulur?','haben/sein çekimli hâliyle 2. sırada, Partizip II en sonda:\n*Ich habe gestern Pizza gegessen.*\nDüzenli fiil: ge + kök + t → *gemacht, gekauft, gelernt*\nDüzensiz fiil: ge + (değişen) kök + en → *gegangen, getrunken, geschrieben*\nAyrılabilen fiil: ön ek + ge + kök → *eingekauft, aufgestanden*\n-ieren ile biten ve be-, ver-, er-, ent- ile başlayanlar ge- almaz → *trainiert, besucht, verstanden*'],
 ['haben mi, sein mi?','Yer değiştirme (gehen, fahren, fliegen, laufen, kommen) ve durum değişimi (aufstehen, einschlafen, werden) → *sein*.\nAyrıca sein, bleiben, passieren → *sein*.\nGeri kalan çoğunluk → *haben*.'],
 ['Dikkat','Partizip cümlenin sonuna gider; araya ne girerse girsin: *Ich bin am Wochenende mit dem Zug nach Hamburg gefahren.*'],
 ['Türkçe ile','Türkçedeki "-dı/-di" geçmişi. Fark şu: Almanca fiili ikiye böler, baş (habe/bin) öne, son (gemacht) en arkaya gider.']],
g2:[['Ne işe yarar?','Geçmişte "yapabildim, zorundaydım, istedim, izin vardı" demek için. Modal fiillerde konuşmada da Perfekt yerine bu kullanılır.'],
 ['Nasıl kurulur?','Kök + te, Umlaut düşer:\nkönnen → *konnte* · müssen → *musste* · dürfen → *durfte*\nwollen → *wollte* · sollen → *sollte* · mögen → *mochte*\nÇekim: ich konnte, du konntest, er konnte, wir konnten, ihr konntet, sie konnten\nAsıl fiil mastar hâlinde en sonda: *Ich musste gestern lange arbeiten.*'],
 ['Dikkat','ich ve er/sie/es aynı, ek almaz: *er konnte*.\n"möchte"nin geçmişi yoktur; yerine *wollte* kullanılır: *Ich wollte einen Kaffee.*'],
 ['Türkçe ile','"yapmak zorundaydım" = *ich musste … machen*\n"yapamadım" = *ich konnte … nicht machen*']],
g3:[['Ne işe yarar?','weil = çünkü (sebep) · dass = -dığını (içerik) · wenn = -se / -dığında (koşul, zaman).'],
 ['Nasıl kurulur?','Yan cümlede çekimli fiil en sona gider: *…, weil ich müde bin.*\nYardımcı fiil varsa en sonda o durur: *…, weil ich lange gearbeitet habe.* / *…, dass ich morgen arbeiten muss.*\nYan cümle başa gelirse ana cümle fiille başlar: *Wenn es regnet, bleibe ich zu Hause.* (fiil, virgül, fiil)'],
 ['Dikkat','*denn* de "çünkü" demek ama ana cümle kurar, fiil yerinde kalır: *…, denn ich bin müde.*\nAyrılabilen fiil yan cümlede birleşir: *…, weil ich früh aufstehe.*'],
 ['Türkçe ile','Türkçede fiil hep sondadır; Almanca yan cümle bu yüzden sana tanıdık gelecek.']],
g4:[['Ne işe yarar?','Dokuz edat (in, an, auf, über, unter, vor, hinter, neben, zwischen) hem Dativ hem Akkusativ alabilir. Hangisini alacağını soru belirler.'],
 ['Nasıl kurulur?','Wo? (nerede, durum) → Dativ: *Das Buch liegt auf dem Tisch.*\nWohin? (nereye, hareket) → Akkusativ: *Ich lege das Buch auf den Tisch.*\nÇiftler: liegen (Dat.) ↔ legen (Akk.) · stehen ↔ stellen · sitzen ↔ setzen · hängen ↔ hängen\nKısaltmalar: in dem = *im*, in das = *ins*, an dem = *am*, an das = *ans*'],
 ['Artikel tablosu','Dativ: dem (der) · der (die) · dem (das) · den + n (çoğul)\nAkkusativ: den (der) · die (die) · das (das) · die (çoğul)'],
 ['Türkçe ile','Wo = "-de" (masada) → Dativ. Wohin = "-e" (masaya) → Akkusativ.']],
g5:[['Ne işe yarar?','Bazı fiillerin nesnesi Dativ olur. Çoğu Türkçede de "-e" ile kurulur: birine yardım etmek, birine teşekkür etmek.'],
 ['Sık kullanılanlar','helfen, danken, gefallen, gehören, schmecken, passen, gratulieren, antworten, glauben (birine), fehlen, wehtun, zuhören'],
 ['Zamirler','mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen'],
 ['Dikkat','*Das gefällt mir.* = Bu hoşuma gidiyor. Özne "das"tır, "ich" değil!\n*Mir ist kalt.* = Üşüyorum.\n"Ich helfe dich" değil, *Ich helfe dir*.']],
g6:[['Ne işe yarar?','Eylem öznenin kendisine döner. Bazı fiiller ise sırf kalıp olarak dönüşlüdür (sich freuen, sich beeilen).'],
 ['Zamirler','ich → mich · du → dich · er/sie/es → sich · wir → uns · ihr → euch · sie/Sie → sich\nVücut bölümüyle Dativ: *Ich wasche mir die Hände.*'],
 ['Sık kullanılanlar','sich freuen, sich treffen, sich beeilen, sich erholen, sich duschen, sich fühlen, sich ausruhen, sich interessieren für, sich erinnern an'],
 ['Dikkat','Perfekt\'te hep haben: *Ich habe mich gefreut.*\nYan cümlede zamir özneden hemen sonra: *…, weil ich mich auf den Urlaub freue.*'],
 ['Türkçe ile','Türkçedeki "-n" ve "-ş" ekleri (yıkanmak, buluşmak) çoğu zaman dönüşlü fiile denk gelir.']],
g7:[['Nasıl kurulur?','Karşılaştırma: sıfat + er + als → *schneller als*\nEn üstünlük: am + sıfat + sten → *am schnellsten*\nİsmin önünde: *der schnellste Läufer*'],
 ['Umlaut ve düzensizler','alt → älter → am ältesten · groß → größer · jung → jünger · kalt → kälter\ngut – besser – am besten\nviel – mehr – am meisten\ngern – lieber – am liebsten\nhoch – höher – am höchsten'],
 ['Dikkat','Karşılaştırmada *als*, eşitlikte *so … wie*: *Er ist so groß wie ich.*\n"mehr schnell" denmez, *schneller* denir.'],
 ['Türkçe ile','"daha" = -er, "en" = am …-sten.']],
g8:[['Ne işe yarar?','Rica ederken kibarlık katar. Mağazada, ofiste, telefonda her gün lazım olur.'],
 ['Kalıplar','*Könnten Sie …?* = …ebilir misiniz?\n*Würden Sie …?* = …r mısınız?\n*Ich hätte gern …* = … istiyorum (kibar)\n*Dürfte ich …?* = …ebilir miyim?'],
 ['Çekim','ich könnte, du könntest, er könnte, wir könnten\nich hätte, du hättest · ich würde, du würdest'],
 ['Dikkat','Asıl fiil mastar hâlinde en sonda: *Könnten Sie mir bitte helfen?*']],
g9:[['Kural','der/die/das (ve dieser, jeder, welcher) sonrası sıfat ya -e ya -en alır.\n-e: Nominativ tekil (*der neue Plan, die neue Idee, das neue Auto*) ve Akkusativ\'de die/das (*die neue Idee, das neue Auto*)\n-en: geri kalan her yer: *den neuen Plan*, tüm Dativ (*mit dem neuen Plan*), tüm çoğul (*die neuen Pläne*)'],
 ['İpucu','Artikel cinsiyeti zaten gösterdiği için sıfat sadece -e ya da -en alır. Emin değilsen -en de: çoğu durumda doğrudur.'],
 ['Türkçe ile','Türkçede sıfat değişmez. Almancada sıfat önündeki artikele göre ek alır.']],
g10:[['Liste','*vor* + Dat. = önce: vor dem Essen\n*nach* + Dat. = sonra: nach der Arbeit\n*seit* + Dat. = -den beri (hâlâ sürüyor): seit einem Jahr\n*in* + Dat. = sonra (gelecekte): in zwei Wochen\n*ab* = itibaren: ab Montag · *bis* = kadar: bis Freitag\n*für* + Akk. = süresince (plan): für zwei Wochen\n*um* = saat: um acht Uhr · *am* = gün: am Montag, am Abend · *im* = ay, mevsim: im Mai, im Sommer'],
 ['Dikkat','seit ile şimdiki zaman kullanılır: *Ich lerne seit einem Jahr Deutsch.*\nvor geçmişte "önce" demektir: *vor zwei Jahren* = iki yıl önce.']],
g11:[['Kural','ein/kein/mein sonrası sıfat, artikelin göstermediği cinsiyeti kendisi gösterir.\nNom.: *ein neuer Plan* (der) · *eine neue Idee* (die) · *ein neues Auto* (das)\nAkk.: *einen neuen Plan* · *eine neue Idee* · *ein neues Auto*\nDativ\'de hep -en: *mit einem neuen Plan*'],
 ['Artikelsiz','Sıfat artikelin sonunu alır: *frischer Kaffee* (der) · *frische Milch* (die) · *frisches Brot* (das) · *mit frischem Gemüse* (dem)'],
 ['Dikkat','Çoğulda kein/mein ile hep -en: *keine guten Ideen*. Artikelsiz çoğul -e: *gute Ideen*.']],
g12:[['Ne işe yarar?','Bazı fiiller sabit bir edatla gelir. Edatı fiille birlikte ezberle.'],
 ['Sık kullanılanlar','warten auf + Akk. · sich freuen auf (gelecek) / über (olan) · denken an + Akk. · sich interessieren für · sprechen über · Angst haben vor + Dat. · teilnehmen an + Dat. · sich kümmern um · träumen von'],
 ['Soru ve cevap','Şey sorulurken: wo(r) + edat → *Worauf wartest du?*\nŞey için cevap: da(r) + edat → *Ich warte darauf.*\n(Edat ünlüyle başlıyorsa araya r girer: worüber, darauf)\nKişi için: edat + zamir → *Auf wen wartest du? – Auf ihn.*'],
 ['Dikkat','*Ich freue mich auf den Urlaub* (gelecek) ↔ *Ich freue mich über das Geschenk* (oldu).']],
g13:[['Nasıl kurulur?','Girişler: *Weißt du, …* · *Können Sie mir sagen, …* · *Ich möchte wissen, …*\nW-sorusu: soru kelimesi kalır, fiil sona: *Weißt du, wann der Zug kommt?*\nEvet/hayır sorusu: ob + fiil sona: *Ich weiß nicht, ob er kommt.*'],
 ['Dikkat','ob ≠ wenn. Koşul "eğer" → wenn; "-ip -mediğini" → ob.'],
 ['Türkçe ile','"Trenin ne zaman geldiğini biliyor musun?" Türkçede de soru cümlenin içine gömülür.']],
g14:[['Kalıplar','Tavsiye: *Du solltest …* (yapmalısın) · *An deiner Stelle würde ich …*\nDilek: *Ich würde gern …* · *Ich hätte gern …* · *Ich wäre gern …*\nKoşul: *Wenn ich Zeit hätte, würde ich …*'],
 ['Biçim','Çoğu fiil: würde + mastar.\nsein, haben ve modallar kendi biçimiyle: wäre, hätte, könnte, müsste, sollte.'],
 ['Dikkat','"würde haben" yerine *hätte*, "würde sein" yerine *wäre* daha doğal.'],
 ['Türkçe ile','"-sa … -ırdı": Zamanım olsa giderdim = *Wenn ich Zeit hätte, würde ich gehen.*']],
g15:[['Ne işe yarar?','Kimin yaptığı önemli değil, ne yapıldığı önemli: tarifler, kurallar, haberler.'],
 ['Nasıl kurulur?','werden (çekimli) + Partizip II en sonda: *Das Essen wird gekocht.*\nwerden: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden\nYapan söylenecekse von + Dativ: *Das Haus wird von Profis renoviert.*\nÖznesiz de olur: *Hier wird gearbeitet.*'],
 ['Dikkat','werden + mastar = gelecek zaman. werden + Partizip II = edilgen.'],
 ['Türkçe ile','"-ıl/-ın" edilgen eki: yapılır, kesilir, açılır.']],
g16:[['Nasıl kurulur?','İlgi zamiri isme göre seçilir (der/die/das, çoğulda die); hâli ise yan cümledeki görevine göre:\nNominativ: der, die, das, die\nAkkusativ: den, die, das, die\nFiil yan cümlenin sonuna gider, virgülle ayrılır:\n*Der Mann, der dort steht, …* / *Der Mann, den ich kenne, …*'],
 ['Dikkat','Cinsiyet öndeki isimden, hâl yan cümleden gelir.'],
 ['Türkçe ile','Türkçede ek önden gelir: "okuduğum kitap". Almancada sonra: *das Buch, das ich lese*.']],
g17:[['Ne zaman?','Bazı fiil ve kalıplardan sonra ikinci eylem zu + mastarla gelir:\nLust haben, Zeit haben, versuchen, anfangen, aufhören, vergessen, vorhaben, Es ist wichtig/schwer/schön …'],
 ['Nasıl kurulur?','zu + mastar en sonda: *Ich habe keine Lust, heute zu kochen.*\nAyrılabilen fiilde zu araya girer: *aufzustehen, einzukaufen*'],
 ['Dikkat','Modal fiillerden sonra zu yok: *Ich muss kochen*. Aynı şekilde möchten, werden, lassen + mastar.']],
g18:[['Nasıl kurulur?','Ana cümle, virgül, deshalb, çekimli fiil, özne:\n*Ich bin müde, deshalb gehe ich ins Bett.*\nAynı anlamda: deswegen, darum, daher.'],
 ['weil ile karşılaştır','weil sebebi verir ve fiili sona yollar: *Ich gehe ins Bett, weil ich müde bin.*\ndeshalb sonucu verir, fiil hemen arkasından gelir.'],
 ['Dikkat','"deshalb ich gehe" yanlış; doğrusu *deshalb gehe ich*.']],
g19:[['Ne işe yarar?','Yazıda (hikâye, haber, rapor) geçmiş zaman. Konuşmada sadece sein, haben ve modal fiillerde.'],
 ['Nasıl kurulur?','Düzenli: kök + te → *machte, kaufte, arbeitete*\nDüzensiz: kök değişir → *ging, kam, sah, aß, trank, fuhr, schrieb, las*\nsein: war, warst, war, waren, wart, waren\nhaben: hatte, hattest, hatte, hatten, hattet, hatten'],
 ['Dikkat','ich ve er/sie/es aynı, ek yok: *ich ging, er ging*.\nDüzensiz fiilleri üç biçimiyle ezberle: *gehen – ging – gegangen*.']],
g20:[['Nereye?','*zu* + Dat. (kişi, kurum): zum Arzt, zur Arbeit\n*nach* (şehir, artikelsiz ülke, eve): nach Berlin, nach Hause\n*in* + Akk. (içine, artikelli ülke): ins Kino, in die Türkei'],
 ['Nerede?','*bei* + Dat. (kişide, iş yerinde): beim Arzt, bei Siemens\n*in* + Dat.: im Kino · *zu Hause*'],
 ['Nereden?','*aus* + Dat. (içinden, memleket): aus dem Haus, aus der Türkei\n*von* + Dat. (kişiden, yerden): vom Arzt, vom Training'],
 ['Dikkat','*zu Hause* = evde · *nach Hause* = eve']],
g21:[['Nasıl kurulur?','obwohl yan cümle kurar, fiil sona: *…, obwohl ich müde bin.*\ntrotzdem ana cümlede ilk yerde, fiil hemen arkasında: *Ich bin müde, trotzdem trainiere ich.*\nobwohl başta: *Obwohl ich müde bin, trainiere ich.*\nİsimle: trotz + Genitiv: *trotz des Regens*'],
 ['Hatırlatma','obwohl, weil gibi çalışır; trotzdem, deshalb gibi.'],
 ['Türkçe ile','obwohl = -mesine rağmen · trotzdem = yine de']],
g22:[['Kural','Geçmişte tek sefer ya da tek dönem → als: *Als ich ein Kind war, …* / *Als ich ankam, …*\nGeçmişte tekrarlanan → (immer) wenn: *Wenn ich nach Hause kam, …*\nŞimdi ve gelecek → wenn: *Wenn ich Zeit habe, …*\nİkisi de yan cümle, fiil sonda.'],
 ['Dikkat','Soru "ne zaman?" ise wann: *Ich weiß nicht, wann er kommt.*']],
g23:[['Nasıl kurulur?','hatte/war + Partizip II: *Ich hatte gegessen. Er war gegangen.*\nhaben/sein seçimi Perfekt\'teki gibi.'],
 ['nachdem ile','Önce olan Plusquamperfekt, sonra olan Präteritum ya da Perfekt:\n*Nachdem ich gegessen hatte, ging ich spazieren.*'],
 ['Türkçe ile','"-mıştı": Anahtarı unutmuştum = *Ich hatte den Schlüssel vergessen.*']],
g24:[['Bağlaçlar','*bevor* = -meden önce · *während* = -irken · *seit(dem)* = -den beri · *bis* = -e kadar\nHepsi yan cümle, fiil sona gider.'],
 ['Edat olarak','vor dem Essen · während des Essens (Genitiv) · seit dem Umzug · bis zum Abend'],
 ['Dikkat','seit ile çoğunlukla şimdiki zaman: *Seit ich hier wohne, schlafe ich besser.*']],
g25:[['Nasıl kurulur?','Dativ ilgi zamirleri: dem (der) · der (die) · dem (das) · denen (çoğul)\nDativ fiilleriyle: *die Frau, der ich helfe*\nEdatlı fiilde edat zamirin önüne gelir:\n*der Freund, mit dem ich trainiere*\n*die Firma, bei der ich arbeite*\n*das Thema, über das wir sprechen*'],
 ['Dikkat','Edat zamirin yanında kalır, cümle sonuna kaçmaz.']],
g26:[['Nasıl kurulur?','hätte/wäre + Partizip II: *Ich hätte das gemacht. Ich wäre gekommen.*\nKoşul: *Wenn ich mehr gelernt hätte, hätte ich bestanden.*\nModal fiille pişmanlık: *Ich hätte früher anfangen sollen.*'],
 ['Türkçe ile','"-saydı … -ırdı": Arasaydın gelirdim = *Wenn du angerufen hättest, wäre ich gekommen.*']],
g27:[['Nasıl kurulur?','Artikel: des (eril/nötr, isim -s/-es alır) · der (dişil ve çoğul)\n*des Mannes, des Kindes, der Frau, der Kinder*\nein → eines/einer · mein → meines/meiner'],
 ['Genitiv alan edatlar','wegen, trotz, während, statt, innerhalb, außerhalb'],
 ['Dikkat','Konuşmada sahiplik çoğu zaman von + Dativ ile söylenir: *das Auto von meinem Bruder*.\nEril ve nötr isim de ek alır: *des Regens, des Tages*.']],
g28:[['Kural','Özne aynıysa: um … zu + mastar sonda: *Ich trainiere, um fit zu bleiben.*\nÖzne farklıysa: damit + yan cümle: *Ich erkläre es, damit du es verstehst.*\nAyrılabilen: *um früh aufzustehen*'],
 ['Dikkat','um … zu ile modal fiil kullanılmaz.'],
 ['Türkçe ile','um … zu = -mek için · damit = -sin diye']],
g29:[['Bağlaçlar','*sowohl … als auch* = hem … hem\n*weder … noch* = ne … ne\n*entweder … oder* = ya … ya\n*nicht nur … sondern auch* = sadece … değil … de'],
 ['Dikkat','weder … noch zaten olumsuzdur, ayrıca nicht eklenmez: *Er hat weder Zeit noch Lust.*']],
g30:[['Nasıl kurulur?','werden (çekimli) + mastar en sonda: *Ich werde die Prüfung machen.*'],
 ['Ne zaman?','Gelecek plan ve söz: *Ich werde ab jetzt jeden Tag üben.*\nTahmin (wohl ile): *Er wird wohl im Büro sein.*'],
 ['Dikkat','Gündelik dilde Präsens + zaman ifadesi daha sık: *Morgen fahre ich nach Berlin.*']],
g31:[['Zamanlar','Präsens: *wird gebaut*\nPräteritum: *wurde gebaut*\nPerfekt: *ist gebaut worden* (geworden değil, worden!)\nModal fiille: *muss gebaut werden*, *kann repariert werden*'],
 ['Dikkat','Edilgen Perfekt\'te yardımcı fiil hep sein: *Das Paket ist geliefert worden.*']],
g32:[['Hangi isimler?','Çoğunlukla -e ile biten eril canlılar (der Kollege, der Junge, der Kunde, der Name) ve -ent, -ant, -ist ile bitenler (der Student, der Präsident, der Journalist). Ayrıca der Mensch, der Nachbar, der Herr.'],
 ['Kural','Nominativ dışında her yerde -(e)n alır: *der Kollege → den Kollegen → dem Kollegen → des Kollegen*'],
 ['Dikkat','Yazıda unutulması çok sık görülen bir hata: *Ich frage den Kollegen* ("den Kollege" değil).']],
g33:[['Nasıl kurulur?','je + karşılaştırma + yan cümle (fiil sona), desto + karşılaştırma + ana cümle (fiil hemen arkasında):\n*Je mehr ich übe, desto besser spreche ich.*'],
 ['Türkçe ile','"ne kadar … o kadar" ya da "-dıkça": Pratik yaptıkça daha iyi konuşuyorum.']],
g34:[['Partizip I','Mastar + d, etken ve eşzamanlı: *das schlafende Kind* (uyuyan çocuk), *steigende Preise* (artan fiyatlar)'],
 ['Partizip II','Edilgen ya da tamamlanmış: *das gekochte Ei* (haşlanmış yumurta), *ein gebrauchtes Auto* (ikinci el araba)'],
 ['Dikkat','İkisi de normal sıfat gibi ek alır: *die steigenden Preise, mit gekochtem Reis*.'],
 ['Türkçe ile','Partizip I ≈ "-en/-an", Partizip II ≈ "-miş/-ılmış".']],
g35:[['Kural','ohne … zu = -meden: *Er ist gegangen, ohne sich zu verabschieden.*\nstatt … zu = -mek yerine: *Statt zu kochen, bestellen wir Pizza.*\nÖzne farklıysa: ohne dass / statt dass + yan cümle.'],
 ['Dikkat','zu + mastar en sonda; ayrılabilen fiilde zu araya girer: *ohne mich aufzuwärmen*.']],
g36:[['Anlamlar','Bir işi başkasına yaptırmak: *Ich lasse das Auto reparieren.*\nİzin vermek: *Lass mich bitte ausreden!*\nBırakmak: *Ich lasse die Tasche im Auto.*\nÖneri: *Lass uns gehen!* = Hadi gidelim!'],
 ['Perfekt','Başka fiille: *Ich habe das Auto reparieren lassen.* (gelassen değil)'],
 ['Türkçe ile','"-tır/-dır" ettirgen eki: kestirmek = *schneiden lassen*.']],
g37:[['Bağlaçlar','*indem* = -erek (yöntem): *Ich bleibe fit, indem ich trainiere.*\n*sodass* = öyle ki / bu yüzden (sonuç): *Es regnete, sodass das Spiel ausfiel.*\nİkisi de yan cümle, fiil sonda.'],
 ['İpucu','"Nasıl?" sorusunun cevabıysa indem; "Sonuç ne oldu?" sorusununsa sodass.']],
g38:[['Ne zaman hangisi?','*was*: alles, nichts, etwas, das, vieles ve en üstünlükten sonra: *alles, was ich weiß*; *das Beste, was …*\n*wo*: yer bildirirken: *die Stadt, wo ich wohne*\n*wo(r) + edat*: bütün cümleye ya da edatlı fiile gönderme: *…, worüber ich mich freue.*'],
 ['Dikkat','Somut isimde normal ilgi zamiri de olur: *die Stadt, in der ich wohne* = *die Stadt, wo ich wohne*.']],
g39:[['Kalıplar','Gerçekleşmemiş dilek: *Wenn ich doch mehr Zeit hätte!* · *Ich wünschte, ich könnte …*\nGeçmiş dilek: *Wenn ich nur früher angefangen hätte!*\nGerçek dışı karşılaştırma: *Er tut so, als ob er alles wüsste.*'],
 ['Dikkat','als ob yan cümle kurar, fiil sona: *…, als ob er krank wäre.*'],
 ['Türkçe ile','"keşke …" = Wenn … doch …! · "-mış gibi" = als ob']],
g40:[['Ne işe yarar?','Anlamı isimden gelen kalıplar; özellikle yazılı Almanca ve B1 sınavında çok çıkar. Kalıp olarak ezberle.'],
 ['Sık kullanılanlar','eine Entscheidung treffen = karar vermek\neine Frage stellen = soru sormak\nRücksicht nehmen auf = gözetmek\nin Frage kommen = söz konusu olmak\nKontakt aufnehmen = iletişime geçmek\neinen Rat geben = tavsiye vermek\nBescheid sagen = haber vermek\nzur Verfügung stehen = hizmetinde olmak'],
 ['Dikkat','Fiil isme göre seçilir: "eine Frage fragen" değil, *eine Frage stellen*.']]
};
function rich(t){return esc(t).replace(/\*([^*]+)\*/g,'<b lang="de">$1</b>').replace(/\n/g,'<br>');}
var GBY={};G.forEach(function(g){GBY[g[0]]=g;});
var BANDS=['A2.1','A2.2','B1.1','B1.2'];
var STL={ok:'oturdu',wip:'çalışılıyor',next:'sırada'};
var STC={ok:'var(--das)',wip:'var(--wrn)',next:'var(--ink4)'};
function gst(id){return S.gram[id]||'next';}
function setG(id,v){
  if(v==='next')delete S.gram[id];else S.gram[id]=v;
  if(v==='ok'){if(!S.gdone[id])S.gdone[id]=today();}else delete S.gdone[id];
  save();
}
function curTopic(){
  if(S.gfocus&&GBY[S.gfocus])return GBY[S.gfocus];
  var i;for(i=0;i<G.length;i++)if(gst(G[i][0])==='wip')return G[i];
  for(i=0;i<G.length;i++)if(gst(G[i][0])!=='ok')return G[i];
  return G[hash(today())%G.length];
}
