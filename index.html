    ["Özne ve nesne.","Bevor ich zur Arbeit gehe, trinke ich Kaffee."]
  ]},
  tr:[
    ["Yemekten önce / Yemek yemeden önce","vor dem Essen / bevor ich esse","Türkçe yardım ediyor: o da isimle „-den önce“, fiille „-meden önce“ diyerek ikiye ayırıyor. Almancada vor ↔ bevor."],
    ["Yemek yaparken podcast dinlerim.","Während ich koche, höre ich Podcasts.","„-irken“ = während. Türkçede ek fiile yapışır; Almancada bağlaç başa gelir ama fiil yine sonda: koche."],
    ["Spor yapmaya başladığımdan beri daha iyi uyuyorum.","Seit ich Sport mache, schlafe ich besser.","Türkçe yardım ediyor: „-den beri“ ile şimdiki zaman (uyuyorum). Almancada da Präsens: schlafe. Geçmiş zaman kullanma."],
    ["Ben bitirene kadar bekle!","Warte, bis ich fertig bin!","„-e kadar“ = bis. Türkçede anlam fiilin içinde („bitirene“); Almancada bis başta, çekimli fiil (bin) sonda."]
  ],
  neden:[
    ["Neden „vor ich esse“ denmiyor da bevor gerekiyor?","Çünkü vor sadece bir edat; arkasına isim ister (vor dem Essen). Cümle bağlamak için ayrı bir kelime gerekir: be + vor. seit, bis ve während hem edat hem bağlaç olabildiği için aynı kalır. nach ↔ nachdem de aynı ikili."],
    ["seit ile neden geçmiş değil de şimdiki zaman?","Çünkü seit, geçmişte başlayıp hâlâ süren bir şeyi anlatır. Sürüyorsa şimdidir. Türkçede de öyle: „Burada oturduğumdan beri mutluyum“, „mutluydum“ değil."],
    ["während hem „-irken“ hem „sırasında“. Nasıl ayırırım?","Arkasına bak. Cümle varsa bağlaç, fiil sona: *während ich koche*. İsim varsa edat: *während des Trainings*. Anlam aynı, sadece yapı değişiyor; Türkçede de „yemek yaparken“ ↔ „yemek sırasında“."]
  ],
  karis:[
    ["bevor","vor","bevor + cümle, fiil sonda: *bevor ich esse*. vor + isim (Dativ): *vor dem Essen*. Ayrıca *vor zwei Jahren* = iki yıl önce."],
    ["bis","seit","bis ileriye bakar, bir noktaya kadar sürer: *bis ich fertig bin*. seit geriye bakar, bir noktadan beri sürer: *seit ich hier wohne*. Türkçede de „-e kadar“ ↔ „-den beri“."],
    ["während","als / wenn","während iki eylemin aynı anda aktığını söyler (-irken): *Während ich koche, höre ich Musik.* als/wenn bir an ya da bir koşul bildirir (-dığında)."]
  ],
  kanca:"İsim gelirse edat, cümle gelirse bağlaç: vor dem Essen → bevor ich esse, tıpkı „yemekten önce“ → „yemeden önce“ gibi.",
  ileri:[
    {to:"g:g27",t:"während edat olarak Genitiv alır: *während des Trainings*, *während der Besprechung*."},
    {to:"g:g35",t:"„-meden“ anlamı bir de *ohne … zu* ile gelecek: *ohne zu frühstücken* (kahvaltı etmeden). bevor = -meden önce, ohne zu = hiç yapmadan."}
  ]
};

GL.g25={
  hub:["hal","prap"],
  kopru:[
    {to:"g:g16",t:"Bunu zaten biliyorsun: *der Mann, der dort steht* (Nominativ), *der Mann, den ich kenne* (Akkusativ). İlgi zamiri cinsiyetini isimden, hâlini yan cümledeki görevinden alıyordu. Şimdi aynı kurala iki görev daha ekleniyor: Dativ ve edat."},
    {to:"ez:art",t:"Dativ artikellerini biliyorsun: *dem, der, dem, den*. İlgi zamirleri bunun neredeyse aynısı: *dem, der, dem* ve tek sürpriz çoğulda *denen*."},
    {to:"g:g12",t:"Edatlı fiiller: *warten auf*, *sprechen über*, *arbeiten bei*. İlgi cümlesinde bu edat fiilden kopmaz; zamirle birlikte yan cümlenin başına gelir: *der Termin, auf den ich warte*."}
  ],
  hatirla:["Dativ'de belirli artikel: der → ?, die → ?, das → ?, çoğul → ?","*dem, der, dem, den*"],
  mantik:"İlgi zamiri iki ayrı yerden bilgi toplar: cinsiyetini ve sayısını işaret ettiği isimden, hâlini yan cümledeki görevinden. g16'da görev özne ya da düz nesneydi. Şimdi görev „kime?“ olabilir (helfen, geben) ya da bir edatın arkasında durmak (mit, bei, auf). Hâl sistemi her yerde aynı olduğu için zamir de artikelin aynısı; tek istisna çoğul Dativ'deki *denen*. Edatlı fiillerde edat ile zamir bir paket gibidir: zamir yan cümlenin başına giderse edat da yanında gider (*mit dem*). Türkçe aynı bilgiyi isme bağlıyor ama eki fiile yapıştırıyor: „birlikte antrenman yaptığım arkadaş“; Almanca ise bilgiyi zamire yüklüyor.",
  adim:{tr:"Bu, birlikte antrenman yaptığım arkadaş.",s:[
    ["Ana cümle önce gelir, virgülle ilgi cümlesi açılır.","Das ist der Freund,"],
    ["Yan cümledeki görev: „biriyle antrenman yapmak“ = mit jemandem trainieren. Edat zamirle birlikte başa gelir.","Das ist der Freund, mit"],
    ["mit Dativ ister; der Freund eril → dem.","Das ist der Freund, mit dem"],
    ["Özne, sonra çekimli fiil en sona.","Das ist der Freund, mit dem ich trainiere."]
  ]},
  tr:[
    ["Yardım ettiğim iş arkadaşı (kadın)","die Kollegin, der ich geholfen habe","Türkçe yardım ediyor: „birine yardım etmek“ -e hâli, Almancada da helfen + Dativ. Türkçedeki -e çoğu zaman Dativ'e işaret eder."],
    ["Çalıştığım firma","die Firma, bei der ich arbeite","Türkçe yanıltıyor: „firmada“ der, ama Almancada edatı fiil seçer: bei einer Firma arbeiten. Önce fiilin edatını bul, sonra edatın istediği hâli."],
    ["Beklediğim randevu","der Termin, auf den ich warte","Türkçede „randevuyu beklemek“ -i hâli; Almancada warten auf + Akkusativ. Hâli Türkçe değil, fiil + edat belirler: warten auf hep Akkusativ → den."],
    ["Daireyi gösterdiğim insanlar","die Leute, denen ich die Wohnung gezeigt habe","„insanlara gösterdim“ -e → Dativ, çoğul → denen. Türkçede ek hep aynı („-dığım“); Almancada zamir sayıya ve hâle göre değişir."]
  ],
  neden:[
    ["Çoğul Dativ'de artikel *den* iken ilgi zamiri neden *denen*?","Çünkü *den* zaten eril Akkusativ'in ilgi zamiri: *der Mann, den ich kenne*. Aynı biçim iki işe yaramasın diye çoğul Dativ bir hece fazla alır. Uzun biçim = karışmayan biçim."],
    ["İngilizcede edat sona kaçabiliyor („the friend I train with“). Almancada neden kaçamıyor?","Almancada edat ile ait olduğu isim ya da zamir ayrılmaz: *mit dem* tek bir paket. Zamir yan cümlenin başına geçince edatı da yanında götürür. Bu yüzden ilgi cümlesi edatla başlayabilir: *…, mit dem …*, *…, auf den …*"],
    ["Hâli ana cümle mi belirler, yan cümle mi?","Yan cümle. *Ich kenne den Mann, mit dem du sprichst.* Ana cümlede *den Mann* (Akkusativ), ama yan cümlede mit Dativ istediği için *dem*. Cinsiyet isimden (eril), hâl yan cümledeki görevden gelir."]
  ],
  karis:[
    ["der Termin, den ich warte","der Termin, auf den ich warte","warten tek başına nesne almaz; edatı unutma. Önce fiili tam söyle: warten *auf* etwas. Sonra edatı zamirin önüne taşı."],
    ["den (eril Akkusativ)","denen (çoğul Dativ)","Önce isme bak: tekil mi çoğul mu? Çoğul + Dativ = denen: *die Freunde, denen ich helfe*. Eril tekil + Akkusativ = den: *der Freund, den ich besuche*."],
    ["mit dem ich trainiere","mit der ich trainiere","Edat aynı (mit + Dativ); değişen isim. der Freund → dem, die Freundin → der. Dişil Dativ der, Nominativ'e benzese de edat zaten Dativ'i garanti ediyor."]
  ],
  kanca:"İlgi zamiri = artikel (tek sürpriz denen), edat da onun gölgesi: zamir nereye giderse edat da onunla gider.",
  ileri:[
    {to:"g:g38",t:"Edatlı ilgi cümlesinin bir kardeşi daha var: şeye ya da bütün bir fikre gönderme yaparken *wo(r)+edat*: *Das ist etwas, worauf ich mich freue.*"},
    {to:"ez:relativ",t:"İlgi zamirlerinin dört hâli tek tabloda: Nominativ, Akkusativ, Dativ ve Genitiv (dessen, deren)."}
  ]
};

GL.g26={
  hub:["konj","klammer"],
  kopru:[
    {to:"g:g14",t:"Bunu zaten biliyorsun: *Wenn ich Zeit hätte, würde ich gehen.* (Zamanım olsa giderdim.) Bu şimdiki hayaldi. Geçmişteki hayal için aynı hätte/wäre'yi kullanıyorsun, sadece arkasına Partizip ekliyorsun."},
    {to:"g:g23",t:"Plusquamperfekt: *ich hatte gelernt* (öğrenmiştim), *ich war gekommen* (gelmiştim). Buna iki nokta koy: *ich hätte gelernt* (öğrenirdim), *ich wäre gekommen* (gelirdim). Yapı birebir aynı."},
    {to:"g:g1",t:"haben mi sein mi? Perfekt'te nasıl karar veriyorsan öyle: *ich bin gekommen* → *ich wäre gekommen*, *ich habe angerufen* → *ich hätte angerufen*."}
  ],
  hatirla:["„Zamanım olsa giderdim.“ (şimdi, hayal) Almancası?","*Wenn ich Zeit hätte, würde ich gehen.*"],
  mantik:"Konjunktiv II'nin büyük fikri: Umlaut gerçek dışılığın işaretidir (konnte → könnte, war → wäre). Geçmişi hayalde değiştirmek için yeni bir şey öğrenmiyorsun: Plusquamperfekt'i al, hatte/war'a iki nokta koy. *ich hatte gelernt* (öğrenmiştim, oldu) → *ich hätte gelernt* (öğrenirdim, olmadı). Geçmişte würde'ye gerek yok, çünkü zaten bir yardımcı fiil var; onu Konjunktiv yapmak yeterli. Mengene de aynı: hätte/wäre 2. yerde, Partizip en sonda. Pişmanlık için modal fiil eklenir: *Ich hätte früher anfangen sollen* (daha erken başlamalıydım). Türkçede bunun karşılığı „-saydı … -ırdı“ ve „-malıydım“.",
  adim:{tr:"Arasaydın gelirdim.",s:[
    ["„-saydın“ = geçmişte gerçekleşmemiş koşul → wenn + Konjunktiv II geçmiş. anrufen Perfekt'te haben alır → hättest, sonda.","Wenn du angerufen hättest,"],
    ["Yan cümle başta → ana cümle çekimli fiille başlar. kommen Perfekt'te sein alır → wäre.","Wenn du angerufen hättest, wäre"],
    ["Özne, sonra Partizip en sona: mengene kapanır.","Wenn du angerufen hättest, wäre ich gekommen."]
  ]},
  tr:[
    ["Arasaydın gelirdim.","Wenn du angerufen hättest, wäre ich gekommen.","Türkçe yardım ediyor: „-saydı“ ve „-ırdı“ iki yarıyı açıkça ayırıyor. Almancada iki yarıda da hätte/wäre + Partizip var."],
    ["Dün antrenman yapmalıydım.","Ich hätte gestern trainieren sollen.","„-malıydım“ tek bir ek; Almancada üç parça: hätte + mastar + sollen. Dikkat: gesollt değil, sollen (iki mastar yan yana)."],
    ["Daha çok uyusaydım şimdi bu kadar yorgun olmazdım.","Wenn ich mehr geschlafen hätte, wäre ich jetzt nicht so müde.","İnce nokta: sonuç şimdiye ait (şu an yorgunum), o yüzden ana cümle şimdiki Konjunktiv II: wäre … müde. İki yarı aynı zamanda olmak zorunda değil."],
    ["Neredeyse geç kalıyorduk.","Wir wären fast zu spät gekommen.","Türkçe yanıltıyor: „-ıyorduk“ hiç hayal gibi durmuyor. Almancada fast + Konjunktiv II geçmiş = „az kalsın oluyordu, ama olmadı“."]
  ],
  neden:[
    ["Geçmişte neden „würde gemacht haben“ değil de hätte gemacht?","würde, şimdiki hayalde çoğu fiili taşıyan bir yardımcıydı. Geçmişte zaten bir yardımcı var: haben/sein. Onu Konjunktiv'e çevirmek (hätte/wäre) yetiyor; ikinci bir yardımcıya gerek kalmıyor. Kısa olan kazanır."],
    ["„hätte trainieren sollen“da neden gesollt değil de sollen?","Modal fiil başka bir mastarla birlikteyse Partizip yerine mastar biçimini kullanır (çift mastar). Perfekt'te de aynısı: *Ich habe gestern arbeiten müssen.* Kural: iki mastar en sonda, modal en arkada."],
    ["hatte ile hätte arasında sadece iki nokta var. Anlam bu kadar mı değişiyor?","Evet, tamamen tersine dönüyor. *Ich hatte gelernt* = öğrenmiştim (oldu). *Ich hätte gelernt* = öğrenirdim (olmadı). Umlaut her yerde aynı işi görür: konnte → könnte, wurde → würde, war → wäre. Noktalar „gerçek değil“ demek."]
  ],
  karis:[
    ["Ich hatte das gemacht.","Ich hätte das gemacht.","Gerçek mi, hayal mi? Gerçekten olduysa hatte (yapmıştım). Olmadıysa ve „olsaydı yapardım“ diyorsan hätte."],
    ["Wenn ich Zeit hätte, …","Wenn ich Zeit gehabt hätte, …","Şu an zamanın yok → hätte (şimdi). Dün zamanın yoktu → gehabt hätte (geçmiş). Geçmişe taşımak = Partizip eklemek."],
    ["Ich hätte gekommen.","Ich wäre gekommen.","haben/sein seçimini Perfekt'ten kopyala: *ich bin gekommen* → *ich wäre gekommen*. Hareket ve durum değişimi wäre alır."]
  ],
  kanca:"Plusquamperfekt'e iki nokta koy, hayal olsun: hatte → hätte, war → wäre; „-mıştı“ gider, „-ırdı“ gelir.",
  ileri:[
    {to:"g:g39",t:"Gerçekleşmemiş dilek: *Wenn ich doch früher angefangen hätte!* Aynı yapı, bu kez sonuç cümlesi olmadan bir iç çekiş."},
    {to:"ez:konj2",t:"Konjunktiv II tablosu: şimdiki (hätte, wäre, würde + mastar) ve geçmiş (hätte/wäre + Partizip) biçimleri yan yana."}
  ]
};

GL.g27={
  hub:["hal"],
  kopru:[
    {to:"ez:art",t:"Bunu zaten biliyorsun: Nominativ der, Akkusativ den, Dativ dem. Genitiv bu tablonun dördüncü ve son satırı: eril/nötr *des*, dişil ve çoğul *der*. Hâl sistemi böylece tamamlanıyor."},
    {to:"g:g20",t:"Konuşmada sahipliği von + Dativ ile söylüyordun: *das Auto von meinem Bruder*. Genitiv aynı anlamın yazı dilindeki kısa biçimi: *das Auto meines Bruders*."},
    {to:"g:g21",t:"*trotzdem* = trotz + dem, „ona rağmen“. trotz tek başına bir edat olarak isimle gelir: *trotz des Regens*. Aynı şekilde weil → *wegen*, bağlaç während → edat *während*."}
  ],
  hatirla:["„Kardeşimin arabası“nı konuşma dilinde von ile söyle.","*das Auto von meinem Bruder*"],
  mantik:"Genitiv, Türkçedeki „-in“ hâli: „kimin?“ sorusunun cevabı. Almanca bunu artikelle söyler: eril ve nötrde *des* + isme -(e)s (des Mannes, des Kindes), dişil ve çoğulda *der* ve isim ek almaz (der Frau, der Kinder). En büyük fark sıra: Türkçede sahip önde („kardeşimin arabası“), Almancada arkada (das Auto meines Bruders); yani tamlamayı ayna gibi ters çevirirsin. Konuşmada Almanlar çoğu zaman von + Dativ kullanır, ama yazıda, haberlerde ve sınav mektubunda Genitiv karşına çıkar. wegen, trotz ve während da Genitiv ister. Bunlar zaten bildiğin bağlaçların isimle kullanılan hâlleri: arkada cümle varsa weil/obwohl/während, isim varsa wegen/trotz/während.",
  adim:{tr:"Yağmur yüzünden evde kalıyoruz.",s:[
    ["„yüzünden“ + isim (cümle değil) → wegen. wegen Genitiv ister.","Wegen"],
    ["der Regen eril → Genitiv'de des; eril isim de -s alır.","Wegen des Regens"],
    ["Edat grubu 1. yeri kapladı → çekimli fiil hemen 2. yere.","Wegen des Regens bleiben"],
    ["Özne ve gerisi.","Wegen des Regens bleiben wir zu Hause."]
  ]},
  tr:[
    ["Kardeşimin arabası","das Auto meines Bruders","Sıra yanıltıyor: Türkçede sahip önde, Almancada arkada. Ama işaret aynı yerde: Türkçe „-in“i sahibe ekler, Almanca da Genitiv'i sahibe yükler (meines Bruders)."],
    ["Günün sonunda","am Ende des Tages","Türkçedeki „-in … -ı“ tamlamaları neredeyse hep Genitiv'e döner: „günün sonu“ = das Ende des Tages. Sırayı ters çevirmen yeter."],
    ["Yağmur yüzünden / Yağmur yağdığı için","wegen des Regens / weil es regnet","Türkçe yardım ediyor: o da isimle „yüzünden“, cümleyle „-dığı için“ diyor. Almancada isim → wegen, cümle → weil."],
    ["Kas ağrısına rağmen koştum.","Trotz des Muskelkaters bin ich gelaufen.","Türkçe yanıltıyor: „-e rağmen“ -e hâli gibi görünür ama trotz Genitiv ister: des Muskelkaters. Konuşmada Dativ duyabilirsin, yazarken Genitiv kullan."]
  ],
  neden:[
    ["Almanlar konuşurken neden Genitiv'den kaçıyor?","Çünkü von + Dativ daha kolay: tek kelime ekliyorsun, isme ek takmıyorsun. Yazı dili ise eski ve kısa biçimi koruyor. Sen ikisini de tanı: konuşurken von, yazarken (B1 mektubu!) Genitiv şık durur."],
    ["wegen, trotz, während sana neden tanıdık gelmeli?","Her biri bildiğin bir bağlacın isim hâli: weil → wegen, obwohl → trotz (trotzdem'in içinde zaten var), während ise ikisi birden. Kural tek: arkasında cümle mi var, isim mi? Cümle → bağlaç, fiil sonda. İsim → edat, Genitiv."],
    ["Neden *des Tages* ama *der Frau*? İsimdeki -s nereden geliyor?","Eril ve nötrde Genitiv iki kez işaretlenir: artikelde (des) ve isimde (-s/-es). Kısa, tek heceli isimler çoğu zaman -es alır (des Mannes, des Kindes), uzunlar -s (des Vaters, des Autos). Dişil ve çoğul isimler hiç ek almaz; işaret sadece artikelde."]
  ],
  karis:[
    ["der Frau (Genitiv)","der Frau (Dativ)","İkisi aynı görünür. Soruya bak: „kimin?“ → Genitiv (*die Tasche der Frau*). „kime?“ → Dativ (*Ich helfe der Frau*). Ya da edata bak: wegen/trotz → Genitiv, mit/bei → Dativ."],
    ["trotz (+ isim)","trotzdem (+ fiil)","*Trotz des Regens laufe ich.* = edat, arkasında isim. *Es regnet, trotzdem laufe ich.* = zarf, arkasında fiil; dem önceki cümlenin yerini tutar."],
    ["Peter'in arabası → „Peter's Auto“","Peters Auto / das Auto von Peter","Özel isimlerde Genitiv kesme işaretsiz -s alır ve öne geçer: *Peters Auto*, *Annas Handy*. Türkçedeki gibi kesme işareti koyma."]
  ],
  kanca:"„Kardeşimin arabası“nı aynada çevir: das Auto meines Bruders; sahip arkaya geçer, „-in“ eki des/der olur.",
  ileri:[
    {to:"ez:gen",t:"Genitiv tablosu: des/der, eines/einer, meines/meiner ve Genitiv alan edatlar (wegen, trotz, während, statt, innerhalb, außerhalb) tek bakışta."},
    {to:"g:g32",t:"n-Deklination: bazı eril isimler Genitiv'de -s değil -en alır: *des Kollegen*, *des Kunden*."}
  ]
};

GL.g28={
  hub:["zu","sona"],
  kopru:[
    {to:"g:g17",t:"Bunu zaten biliyorsun: *Ich habe keine Lust, heute zu kochen.* zu + mastar en sonda, ayrılan fiilde araya girer: *aufzustehen*. um … zu da aynı ailenin üyesi; um sadece „için“ anlamını ekliyor."},
    {to:"g:g3",t:"*weil* ve *dass* gibi *damit* de yan cümle kurar ve fiili sona yollar: *…, damit du es verstehst.* Yeni bir kelime sırası yok."}
  ],
  hatirla:["„Bugün yemek yapmaya hevesim yok.“ Almancası?","*Ich habe heute keine Lust zu kochen.*"],
  mantik:"Amaç, „ne için? / Wozu?“ sorusunun cevabıdır. Almanca sana iki yol sunar ve seçim tek bir soruya bağlıdır: iki eylemi yapan aynı kişi mi? Aynıysa özneyi tekrar söylemene gerek yok; öznesiz bir mastar yeter: *um … zu* + mastar. Farklıysa yeni özneyi söylemek zorundasın; özne gelince çekimli fiil de gelir, bu da bir yan cümle demektir: *damit* + fiil sonda. Türkçe de aynı ayrımı yapıyor: „formda kalmak için“ (özne yok) ↔ „anlayasın diye“ (özne var: sen). Bir de weil ile karıştırma: weil geriye bakar (neden oldu?), um … zu ve damit ileriye bakar (ne olsun diye?).",
  adim:{tr:"Formda kalmak için antrenman yapıyorum.",s:[
    ["Ana cümle: kim ne yapıyor? Çekimli fiil 2. yerde. Virgül.","Ich trainiere,"],
    ["Antrenman yapan da formda kalan da ben → özne aynı → um … zu. um virgülden hemen sonra gelir.","Ich trainiere, um"],
    ["Mastarın tamamlayıcıları araya: fit.","Ich trainiere, um fit"],
    ["zu + mastar en sona: kapı kapanır.","Ich trainiere, um fit zu bleiben."]
  ]},
  tr:[
    ["Formda kalmak için antrenman yapıyorum.","Ich trainiere, um fit zu bleiben.","Türkçe yardım ediyor: „-mek için“ de um … zu da öznesiz, ve ikisinde de fiil sonda („kalmak için“ / „zu bleiben“)."],
    ["Anlayasın diye bir kez daha açıklıyorum.","Ich erkläre es noch einmal, damit du es verstehst.","„-sın diye“ yeni bir özne taşıyor (sen). Özne gelince çekimli fiil gelir: du verstehst → damit + fiil sonda."],
    ["Bebek uyusun diye sessiz konuşuyoruz.","Wir sprechen leise, damit das Baby schläft.","Türkçe yanıltabilir: „uyusun“ istek kipi gibi duyulur, ama Almancada damit'ten sonra düz Präsens yeter: schläft. Ayrıca soll eklemene gerek yok."],
    ["Öğrenmek için sessizliğe ihtiyacım var.","Ich brauche Ruhe zum Lernen.","Kısa yol: zum + büyük harfli mastar (isim gibi). Kısa ve genel amaçlarda Almanlar bunu çok kullanır."]
  ],
  neden:[
    ["Özne farklıyken neden um … zu olmuyor?","Çünkü mastarın kendi öznesi yok; kimin yaptığını dinleyici tahmin eder ve tahmin hep ana cümlenin öznesine gider. *Ich erkläre es, um es zu verstehen* = ben anlamak için açıklıyorum. Başka biri anlayacaksa onu açıkça söylemen gerek; bunun için de damit'li tam bir cümle lazım."],
    ["weil ile damit'in farkı ne? Türkçede ikisine de „için“ diyebiliyorum.","weil geriye bakar, sebebi söyler: *Ich trainiere, weil mein Rücken wehtut.* (Warum?) um … zu / damit ileriye bakar, hedefi söyler: *Ich trainiere, um stärker zu werden.* (Wozu?) Türkçe „için“ ikisini de karşılar; Almanca sebep ile amacı ayırır."],
    ["um başta, zu sonda. Neden böyle ayrılıyorlar?","Çünkü bu da küçük bir mengene: um kapıyı açar, zu + mastar kapatır, arasına her şey sığar: *um nach der Arbeit im Park zu laufen*. Satzklammer'da habe … gemacht nasıl ayrılıyorsa, um … zu da öyle."]
  ],
  karis:[
    ["um … zu","damit","İki eylemi yapan kim? Aynı kişi → um … zu (özne yok). Farklı kişi → damit + özne + fiil sonda."],
    ["für zu lernen","um zu lernen / für die Prüfung","„için“den sonra isim varsa für: *für die Prüfung*. Eylem varsa um … zu: *um die Prüfung zu bestehen*. für + zu + mastar diye bir yapı yok."],
    ["um zu aufstehen","um aufzustehen","Ayrılan fiilde zu araya girer (g17): auf-zu-stehen, ein-zu-kaufen: *um früh aufzustehen*."]
  ],
  kanca:"Özne aynıysa um … zu („-mek için“), özne değiştiyse damit („-sın diye“): yeni kişi = yeni cümle.",
  ileri:[
    {to:"g:g35",t:"zu ailesinin iki kardeşi daha: *ohne … zu* (-meden) ve *statt … zu* (-mek yerine). Kurulum aynı; özne farklıysa yine dass'lı bir yan cümle."},
    {to:"g:g37",t:"*indem* (-erek, yöntem) ve *sodass* (öyle ki, sonuç): amaçla karışan iki yan cümle daha. damit = hedef, sodass = ortaya çıkan sonuç."}
  ]
};

GL.g29={
  hub:["bag"],
  kopru:[
    {to:"ez:konn",t:"Bunu zaten biliyorsun: ADUSO'daki *oder*, *sondern*, *aber* kelime sırasını oynatmaz. İki parçalı bağlaçların ikinci parçası tam da bunlar: entweder … *oder*, nicht nur … *sondern* auch, zwar … *aber*."},
    {to:"g:g21",t:"*aber* ve *trotzdem* ile beklenti kırılmasını söyledin. *zwar … aber* (gerçi … ama) aynı şeyi önceden haber vererek yapar: *Das Hotel ist zwar teuer, aber sehr schön.*"}
  ],
  hatirla:["„Çay değil, kahve içiyorum.“ (sondern ile)","*Ich trinke keinen Tee, sondern Kaffee.*"],
  mantik:"Bu konunun en güzel yanı şu: Türkçe zaten böyle konuşuyor. „hem … hem“, „ne … ne“, „ya … ya“ Türkçede de iki parçalı. İlk parça bir uyarı ışığıdır: dinleyici daha ilk kelimede ikinci bir şeyin geleceğini ve aralarındaki ilişkiyi (ikisi de / hiçbiri / biri) anlar. Almancada tek fark, iki parçanın farklı kelimeler olması: sowohl … *als auch*, weder … *noch*, entweder … *oder*. Bu bağlaçlar çoğu zaman aynı türden iki şeyi bağlar: iki isim, iki sıfat, iki zaman ifadesi. Bu yüzden kelime sırası neredeyse hiç değişmez; ikinci parçalar ADUSO gibi davranır.",
  adim:{tr:"Sadece Almanca değil, İngilizce de konuşuyor.",s:[
    ["Normal ana cümle: özne, çekimli fiil 2. yerde.","Sie spricht"],
    ["„sadece … değil“ = nicht nur; bağladığın ilk şeyin hemen önüne.","Sie spricht nicht nur Deutsch,"],
    ["„… de“ = sondern auch; ikinci şeyin önüne. sondern ADUSO ailesinden, sırayı değiştirmez.","Sie spricht nicht nur Deutsch, sondern auch Englisch."]
  ]},
  tr:[
    ["Hem kahve hem çay içerim.","Ich trinke sowohl Kaffee als auch Tee.","Türkçe birebir yardım ediyor: o da iki parçalı. hem → sowohl, hem → als auch. Tek fark: Almancada iki parça farklı kelimeler."],
    ["Ne vakti var ne hevesi.","Er hat weder Zeit noch Lust.","Türkçede „ne … ne“ dersen fiil olumlu kalır („var“). Almancada da: weder … noch zaten olumsuz, ayrıca nicht ya da kein ekleme."],
    ["Ya bugün ya yarın antrenman yapıyoruz.","Entweder trainieren wir heute oder morgen.","Türkçede iki parça aynı (ya … ya); Almancada farklı (entweder … oder). İkincisi bildiğin oder."],
    ["Otel gerçi pahalı ama çok güzel.","Das Hotel ist zwar teuer, aber sehr schön.","„gerçi … ama“ = zwar … aber. Türkçede de önce kabul ediyorsun, sonra itiraz ediyorsun."]
  ],
  neden:[
    ["Tek parça yetmez mi? „Kaffee und Tee“ varken sowohl neden eklensin?","İlk parça bir uyarı ve vurgu. *Kaffee und Tee* düz bir liste. *sowohl Kaffee als auch Tee* ise „ikisini de, biri değil!“ diye altını çizer. Türkçede „kahve ve çay“ ile „hem kahve hem çay“ arasındaki fark da bu."],
    ["weder … noch cümlesinde neden nicht yok?","Çünkü olumsuzluk zaten bağlacın içinde: weder kendisi olumsuz bir kelime, noch da „ne de“ anlamında. Bir de nicht eklersen çift olumsuz olur. Türkçede de „ne vakti var ne hevesi“ dersin, „ne vakti yok“ demezsin."],
    ["„nicht nur … sondern auch“da neden aber değil de sondern?","Çünkü önce bir şeyi düzeltiyorsun: nicht nur = „sadece bu değil“. Bir olumsuzu düzelten bağlaç sondern'dir (*kein Tee, sondern Kaffee*). aber itiraz eder, düzeltmez."]
  ],
  karis:[
    ["weder … noch","entweder … oder","weder = hiçbiri (ne … ne). entweder = ikisinden biri (ya … ya). „ent-“ ile başlayan seçim yaptırır: biri mutlaka olacak."],
    ["sowohl … und auch","sowohl … als auch","İkinci parça hep als auch. Buradaki als karşılaştırma değil; kalıbı tek parça gibi ezberle."],
    ["nicht nur … aber auch","nicht nur … sondern auch","nicht nur'dan sonra sondern gelir, aber değil. „sadece … değil … de“ = sondern auch."]
  ],
  kanca:"Türkçe zaten iki parçalı konuşuyor: hem-hem = sowohl-als auch, ne-ne = weder-noch, ya-ya = entweder-oder; Almancada sadece çiftlerin kelimeleri farklı.",
  ileri:[
    {to:"g:g33",t:"*je … desto*: bir başka iki parçalı kalıp, ama bu kez kelime sırasını da oynatır: *Je mehr ich trainiere, desto stärker werde ich.*"}
  ]
};

GL.g30={
  hub:["klammer","zaman"],
  kopru:[
    {to:"ez:modal",t:"Bunu zaten biliyorsun: *Ich muss heute trainieren.* Modal fiil 2. yerde, mastar en sonda. Futur birebir aynı kalıp: *Ich werde morgen trainieren.* muss yerine werde koy, gerisi aynı."},
    {to:"g:g15",t:"Passiv'de werden + Partizip II kurdun: *Das Essen wird gekocht.* Aynı werden mastarla gelince gelecek olur: *Ich werde kochen.* Son kelime her şeyi belirliyor."},
    {to:"g:g14",t:"*würde* ile hayal kurdun: *Ich würde gern reisen.* würde aslında werden'in Konjunktiv hâli. Umlaut'u kaldır: *ich werde reisen* = gerçekten seyahat edeceğim."}
  ],
  hatirla:["werden'i çekimle: ich, du, er.","*ich werde, du wirst, er wird*"],
  mantik:"Futur yeni bir yapı değil, mengenenin bir örneği daha: werden çekimli hâliyle 2. yerde, asıl fiil mastar olarak en sonda; tıpkı modal fiillerde olduğu gibi. werden'in temel anlamı „olmak, bir duruma geçmek“tir (Ich werde müde = yoruluyorum); yani bir yöne doğru hareket. Geleceğe ve tahmine bu yüzden çok uygun. Ama dikkat: Almancada gelecek için çoğu zaman Präsens + zaman ifadesi yeter (*Morgen fahre ich nach Berlin*). Futur'u seçtiğinde bir şey eklersin: ya kararlılık ve söz (*Ich werde ab jetzt jeden Tag üben!*) ya da tahmin (*Er wird wohl im Büro sein*). Türkçede ilki „-eceğim“, ikincisi „-dır / herhalde“ ile söylenir.",
  adim:{tr:"Gelecek yıl B1 sınavına gireceğim.",s:[
    ["Gelecek + plan/söz → werden. Çekimli hâli 2. yerde: ich werde.","Ich werde"],
    ["Zaman ve nesne ortaya (önce zaman, sonra nesne).","Ich werde nächstes Jahr die B1-Prüfung"],
    ["Asıl fiil mastar hâlinde en sona: mengene kapanır.","Ich werde nächstes Jahr die B1-Prüfung machen."]
  ]},
  tr:[
    ["Gelecek yıl B1 sınavına gireceğim.","Ich werde nächstes Jahr die B1-Prüfung machen.","Türkçede „-eceğim“ tek bir ek; Almancada iki parça: werde (kişi ve zaman) 2. yerde, machen (anlam) en sonda."],
    ["Yarın Berlin'e gidiyorum.","Morgen fahre ich nach Berlin.","Türkçe yardım ediyor: o da zaman kelimesi varsa şimdiki zamanla geleceği anlatır. Almancada da Futur'a gerek yok."],
    ["Herhalde hâlâ ofistedir.","Er wird wohl noch im Büro sein.","Türkçe yanıltabilir: bu cümle gelecek değil, şimdiye dair bir tahmin. Türkçedeki „-dır“ = wird … sein; wohl = herhalde."],
    ["Yoruluyorum. / Yorgun olacağım.","Ich werde müde. / Ich werde müde sein.","werden tek başına „olmak, -leşmek“. Mastar (sein) eklenince Futur olur. Son kelimeye bak."]
  ],
  neden:[
    ["Gelecek için Präsens yetiyorsa Futur ne işe yarıyor?","Vurgu ve tahmin için. *Ich werde ab jetzt jeden Tag üben!* bir söz, kararlılık taşır. *Das wird schon klappen* bir tahmin ve teselli. Düz bir plan için Präsens daha doğal: *Am Samstag treffe ich Ali.*"],
    ["werden hem Futur'da hem Passiv'de var. Nasıl ayırırım?","Cümlenin son kelimesine bak. Mastar (machen) → Futur: *wird machen* = yapacak. Partizip II (gemacht) → Passiv: *wird gemacht* = yapılıyor. Umlaut'lu würde → hayal: *würde machen* = yapardı."],
    ["Futur neden şimdiye dair tahmin için de kullanılıyor?","Çünkü gelecek de, görmediğin bir şimdi de aynı şekilde bilinmez; ikisi için de tahmin edersin. *Er wird krank sein* = hasta olmalı. Türkçede de „hastadır“ derken aynı „emin değilim“ tonunu verirsin."]
  ],
  karis:[
    ["ich werde machen","ich würde machen","werde = yapacağım (gerçek gelecek). würde = yapardım (hayal, kibarlık). Umlaut = hayal."],
    ["Er wird Arzt.","Er wird Arzt sein.","Mastar yoksa werden = olmak: doktor oluyor (yolda). sein eklenirse Futur: doktor olacak ya da herhalde doktordur."],
    ["du wird","du wirst","werden kök değiştirir: du wirst, er wird (wird'e ayrıca -t eklenmez, d zaten orada). ihr werdet."]
  ],
  kanca:"werden'in üç yüzü son kelimeden anlaşılır: mastar → gelecek (wird machen), Partizip → edilgen (wird gemacht), Umlaut → hayal (würde machen).",
  ileri:[
    {to:"g:g31",t:"Passiv'in öteki zamanları: *wurde gebaut*, *ist gebaut worden*. werden'in Partizip'i burada worden'a kısalır."},
    {to:"g:g36",t:"lassen de werden ve modallar gibi mastarı zu olmadan alır: *Ich lasse das Auto reparieren.*"}
  ]
};
GL.g31={
  hub:["zaman","klammer"],
  kopru:[
    {to:"g:g15",t:"Bunu zaten biliyorsun: *Das Essen wird gekocht.* Passiv = werden + Partizip II. Bu konuda yaptığın tek şey werden'i başka bir zamana sokmak; Partizip II (*gekocht*) olduğu yerde, en sonda bekliyor."},
    {to:"ez:partizip",t:"werden'in Perfekt'ini biliyorsun: *Er ist Trainer geworden.* sein ile, çünkü durum değişimi. Passiv Perfekt de aynı fiilin Perfekt'i: *ist … worden*. Tek fark: ge- düşüyor."},
    {to:"ez:modal",t:"Modal + mastar kalıbını biliyorsun: *Ich muss den Antrag abgeben.* Passiv'in mastarı iki kelimeden oluşuyor: *abgegeben werden* (teslim edilmek). Kalıp aynı kalıyor: *Der Antrag muss abgegeben werden.*"}
  ],
  hatirla:["werden fiilinin Präteritum'u ve Perfekt'i ne? (er …)","*er wurde* · *er ist geworden*"],
  mantik:"Passiv'in motoru hep *werden*. Zamanı değiştirmek istediğinde sadece werden'i çekimlersin, Partizip II hiç kıpırdamaz: *wird gebaut → wurde gebaut → ist gebaut worden*. Yani yeni bir şey ezberlemiyorsun; werden'in zamanlarını zaten biliyorsun (wird, wurde, ist geworden). Tek sürpriz *worden*: werden kendi anlamında („olmak“) kullanılınca *geworden*, başka bir Partizip'in yanında yardımcı olarak çalışınca kısalıp *worden* olur. Modal fiille de mengene aynı: çekimli modal 2. yerde, sonda Passiv'in mastarı (*gebaut werden*). Haberde ve yazıda en sık *wurde* biçimini görürsün, çünkü kısa ve net.",
  adim:{tr:"Toplantı iptal edildi.",s:[
    ["Özne: iptal edilen şey. Geçmiş, konuşma dili → Perfekt. Passiv Perfekt'te yardımcı fiil sein, 2. yere","Die Besprechung ist"],
    ["Asıl fiilin Partizip II'si mengenenin sonuna: absagen → abgesagt (ayrılan ön ek, ge- araya)","Die Besprechung ist abgesagt"],
    ["En sona werden'in yardımcı Partizip'i: ge- olmadan *worden*","Die Besprechung ist abgesagt worden."]
  ]},
  tr:[
    ["Ev 1950'de yapıldı.","Das Haus wurde 1950 gebaut.","Türkçe edilgen eki -ıl fiile yapışır ve zamanı da fiil taşır (yap-ıl-dı). Almanca bu işi werden'e verir: *wurde* = „-ıldı“, *gebaut* sadece „yapma“ fikri."],
    ["Paket teslim edildi.","Das Paket ist geliefert worden. / Das Paket wurde geliefert.","Türkçede tek biçim var (-ildi), Almancada iki. Anlam neredeyse aynı; konuşmada ikisini de duyarsın."],
    ["Başvuru teslim edilmeli.","Der Antrag muss abgegeben werden.","Burada Türkçe yardım ediyor: teslim edil-meli → *abgegeben werden* + *muss*. Sıra Türkçedeki gibi; Almanca sadece *muss*'u 2. yere çekiyor."],
    ["Burada sigara içilemez.","Hier darf nicht geraucht werden.","Türkçe „içilemez“ öznesiz edilgen; Almanca da öznesiz olabilir. Ama 1. yeri boş bırakamaz: *hier* ya da *es* doldurur (*Es darf hier nicht geraucht werden.*)."]
  ],
  neden:[
    ["Neden Passiv Perfekt'te haben değil de sein?","Çünkü yardımcı fiil werden ve werden bir durum değişimi fiili („olmak“). Durum değişimi Perfekt'i hep sein ile kurar: *Er ist müde geworden.* Passiv Perfekt de aynı fiilin Perfekt'i: *ist … worden*."],
    ["Neden geworden değil de worden?","werden kendi anlamıyla kullanılınca *geworden*: *Er ist Trainer geworden.* Başka bir Partizip'in yanında yardımcı olarak çalışınca kısalır: *gebaut worden*. Kısa biçim = yardımcı görev."],
    ["Modal fiilli Passiv'de neden sonda iki fiil var?","Modal'dan sonra hep bir mastar gelir (*kann kommen*). Passiv'in mastarı tek kelime değil: *repariert werden* = tamir edilmek. Yani *muss + [repariert werden]*: kalıp aynı, sadece mastar iki parçalı."]
  ],
  karis:[
    ["Das Haus wurde gebaut. (yapıldı)","Das Haus wurde alt. (eskidi)","Sonda Partizip II varsa Passiv; sıfat ya da isim varsa werden = olmak."],
    ["Er wird operiert. (ameliyat ediliyor)","Er wird operieren. (ameliyat yapacak)","Sondaki kelimeye bak: Partizip II (*operiert*) → Passiv; mastar (*operieren*) → Futur."],
    ["Das Paket ist geliefert worden. ✔","Das Paket hat geliefert worden. ✘","Passiv Perfekt'te istisnasız sein: worden, werden'in Partizip'i ve werden sein alır."]
  ],
  kanca:"Zamanı werden giyer, Partizip yerinden kıpırdamaz: *wird gebaut – wurde gebaut – ist gebaut worden – muss gebaut werden*.",
  ileri:[
    {to:"g:g34",t:"Passiv'i tek kelimeye sıkıştırmak: *das Auto, das repariert wurde* → *das reparierte Auto*. Partizip II sıfat olur."},
    {to:"g:g36",t:"lassen de „işi başkası yapıyor“ der: *Das Auto wird repariert.* ↔ *Ich lasse das Auto reparieren.* Fark: lassen'da işi ısmarlayan kişi öznede."}
  ]
};
GL.g32={
  hub:["hal"],
  kopru:[
    {to:"ez:art",t:"Bunu zaten biliyorsun: Dativ çoğulda artikel yetmez, isim de -n alır: *mit den Kindern*. Yani isim bazen hâl ekini kendisi de taşır. n-Deklination'daki isimler bunu tekilde de yapar: *mit dem Kollegen*."},
    {to:"g:g27",t:"Genitiv'de eril isim kendisi ek alıyordu: *des Mannes*. Burada da aynı fikir, sadece ek -s değil -(e)n: *des Kollegen*."},
    {to:"g:g9",t:"der'den sonraki sıfat ritmini biliyorsun: *der neue → den neuen → dem neuen*. Bu isimler tam aynı ritimde çekimlenir: *der Kollege → den Kollegen → dem Kollegen*. Nominativ'de çıplak, gerisinde -en."}
  ],
  hatirla:["Dativ çoğulda isme ne eklenir? (mit den Kind…)","-n: *mit den Kindern*"],
  mantik:"Almancada hâl bilgisini genelde artikel taşır, isim çoğu zaman hiç değişmez: *der Tisch, den Tisch, dem Tisch*. Ama küçük bir eril isim grubu eski bir sistemin kalıntısı: Nominativ tekil dışında her yerde -(e)n alır. Bunların neredeyse hepsi canlı: *Kollege, Kunde, Junge, Nachbar, Mensch, Student, Präsident, Journalist*. Kural çok kısa: Nominativ'de ek yok, Akkusativ, Dativ, Genitiv ve çoğulda hep -(e)n. Neden önemli? Çünkü iş hayatında ve B1 mektubunda bu isimlerle sürekli konuşursun: *Ich habe Herrn Müller angerufen. Ich frage den Kunden.* Unutursan cümle hemen „yabancı“ duyulur.",
  adim:{tr:"Yarın müşteriyi arıyorum.",s:[
    ["anrufen ayrılan fiil: rufe 2. yerde, an en sonda (mengene)","Ich rufe morgen … an."],
    ["Kimi? → Akkusativ. der Kunde eril → der yerine den","Ich rufe morgen den Kunde… an."],
    ["Kunde -e ile biten eril bir canlı → n-Deklination: Nominativ dışında -n","Ich rufe morgen den Kunden an."]
  ]},
  tr:[
    ["İş arkadaşıma soruyorum.","Ich frage den Kollegen.","Türkçede hâl eki hep isme yapışır (arkadaş-ım-a). Almancada genelde artikel taşır; bu grupta ise isim de Türkçedeki gibi ek alır."],
    ["Komşuya yardım ediyorum.","Ich helfe dem Nachbarn.","Türkçe sadece ismi değiştirir (komşu-ya). Almanca burada çift işaret koyar: hem artikel (*dem*) hem isim (*Nachbarn*)."],
    ["Bay Müller'i aradım.","Ich habe Herrn Müller angerufen.","Türkçede „Bay“ hiç değişmez; Almancada *Herr* bile ek alır. Ama hitapta Nominativ kalır: *Lieber Herr Müller, …*"],
    ["Öğrenciyi / öğrencileri tanıyorum.","Ich kenne den Studenten. / Ich kenne die Studenten.","Yanıltıcı yer: -en hem tekilde hem çoğulda var. Tekil mi çoğul mu, isme değil artikele bak."]
  ],
  neden:[
    ["Neden *den Tisch* ama *den Kollegen*?","Tisch bir eşya, Kollege bir canlı. Bu grubun neredeyse tamamı insan ya da hayvan (*Kunde, Junge, Löwe, Bär*). Eril + canlı + -e sonu gördüğünde alarm çalsın."],
    ["Neden *Herr* bazen Herr, bazen Herrn?","Nominativ'de ve hitapta ek yok: *Herr Müller ist da. Lieber Herr Müller.* Kimi, kime, kimin olduğunda -n: *Ich frage Herrn Müller.* Zarf üstünde de: *An Herrn Müller*."],
    ["*der Name* canlı değil, neden bu listede?","*Name, Gedanke, Buchstabe* gibi birkaç eşya ismi de bu aileye girmiş. Genitiv'de bir de -s eklerler: *des Namens*. Az sayıda, kalıp olarak öğren: *Ich habe den Namen vergessen.*"]
  ],
  karis:[
    ["den Jungen (n-Dekl.)","den Käse (normal)","İkisi de -e ile bitiyor ama Käse canlı değil, -n almaz. Eril + canlı + -e = -n."],
    ["Ich frage den Kollegen. (tek kişi, Akk.)","Ich helfe den Kollegen. (birden çok, Dat. çoğul)","İsim aynı görünür; artikel ve fiil karar verir. Dativ tekil olsaydı *dem Kollegen* olurdu."]
  ],
  kanca:"Kollege sıfat gibi çekimlenir: Nominativ'de çıplak (*der Kollege*), geri kalan her yerde -en (*den, dem, des Kollegen*).",
  ileri:[
    {to:"ez:ndekl",t:"Kollege, Student, Mensch: dört hâl tek tabloda; sesli okuyarak ritmi otur."},
    {to:"ez:gen",t:"Genitiv'de eril isimler normalde -s alır (*des Mannes*); n-Deklination istisnadır: *des Kollegen* (Kollegens değil)."}
  ]
};
GL.g33={
  hub:["sona","bag"],
  kopru:[
    {to:"g:g7",t:"Bunu zaten biliyorsun: *schneller, mehr, besser, lieber*. Komparativ bu kalıbın yakıtı; je'nin de desto'nun da hemen arkasında bir Komparativ durur: *je mehr …, desto besser …*"},
    {to:"g:g3",t:"*Wenn es regnet, bleibe ich zu Hause.* Yan cümle başta, fiili sonda; sonra virgül ve hemen ana cümlenin fiili. je-yarısı tam bir wenn-yarısı gibi davranır."},
    {to:"g:g18",t:"*…, deshalb gehe ich früh ins Bett.* deshalb 1. yeri kaplar, fiil hemen arkasından gelir. desto + Komparativ da birlikte 1. yeri kaplar: *desto besser spreche ich*."}
  ],
  hatirla:["viel ve gut'un Komparativ'i ne?","*mehr*, *besser*"],
  mantik:"İki şey birlikte büyüyor ya da küçülüyor: biri artınca öbürü de artıyor. Almanca bunu iki yarıya böler ve her yarıya bildiğin bir kalıbı verir. je-yarısı bir koşul gibi, tek başına cümle olamaz, bu yüzden yan cümle: fiil sona (weil-ailesi). desto-yarısı sonuç, tek başına ayakta durur: desto + Komparativ birlikte 1. yeri doldurur, fiil hemen arkadan gelir (deshalb-ailesi). Yani yeni bir kural yok; iki eski kalıp yan yana. desto yerine *umso* da duyarsın, aynı şekilde çalışır.",
  adim:{tr:"Ne kadar çok uyursam o kadar iyi antrenman yaparım.",s:[
    ["je + Komparativ başa: viel → mehr","Je mehr"],
    ["je-yarısı yan cümle: özne, fiil en sonda","Je mehr ich schlafe,"],
    ["desto + Komparativ 1. yeri kaplar: gut → besser","Je mehr ich schlafe, desto besser"],
    ["deshalb'daki gibi fiil hemen arkadan, özne sonra","Je mehr ich schlafe, desto besser trainiere ich."]
  ]},
  tr:[
    ["Ne kadar erken başlarsak o kadar çabuk biteriz.","Je früher wir anfangen, desto schneller sind wir fertig.","„ne kadar … o kadar“ kalıbı birebir: *je* = ne kadar, *desto* = o kadar."],
    ["Pratik yaptıkça daha iyi konuşuyorum.","Je mehr ich übe, desto besser spreche ich.","Türkçe „-dıkça“ tek ekle halleder; Almanca iki kelimeyle iki yarı kurar. Çevirirken önce „ne kadar … o kadar“a çevir, sonra Almancaya geç."],
    ["Ağırlık ne kadar ağırsa…","Je schwerer das Gewicht ist, …","je-yarısında fiil Türkçedeki gibi sonda (ağır-*sa* / *ist*): burada Türkçe sana yardım ediyor."],
    ["… o kadar az tekrar yapabiliyorum.","…, desto weniger Wiederholungen schaffe ich.","desto-yarısında Türkçe yanıltır: fiil sona gitmez. desto + Komparativ + isim paketinden hemen sonra fiil gelir, özne arkaya geçer."]
  ],
  neden:[
    ["Neden je'den sonra fiil sonda, desto'dan sonra hemen arkada?","„Ne kadar çok çalışırsam…“ yarım kalan bir cümle, tek başına duramaz → yan cümle, fiil sona. „O kadar iyi olurum“ kendi başına duran bir ana cümle; desto + Komparativ 1. yer, fiil 2. yer."],
    ["Neden *je mehr ich übe* ama *je mehr Wörter ich kenne*?","Komparativ bir isme bağlıysa isim de onunla tek paket olarak öne gelir: *[je mehr Wörter] ich kenne*. Paket bölünmez. Türkçede de „ne kadar çok kelime bilirsem“ dersin."],
    ["Komparativ'siz olur mu?","Olmaz. Mantık „daha … → daha …“. İki yarıda da -er biçimi ya da *mehr, weniger, besser* şart: *Je älter er wird, desto ruhiger wird er.*"]
  ],
  karis:[
    ["desto stärker werde ich ✔","desto ich werde stärker ✘","desto, deshalb gibi 1. yeri kaplar: hemen arkasından fiil, sonra özne."],
    ["je mehr ich übe ✔","je mehr übe ich ✘","je, weil gibi yan cümle açar: fiil en sona."],
    ["Je mehr ich lerne, desto mehr weiß ich.","Es wird immer kälter.","*immer + Komparativ* = gittikçe (tek olay, tek cümle). *je … desto* iki olayı birbirine bağlar."]
  ],
  kanca:"je = „ne kadar“, fiil sona kaçar; desto = „o kadar“, fiil hemen yetişir: bir weil-cümlesi ile bir deshalb-cümlesi el ele.",
  ileri:[
    {to:"g:g37",t:"sodass da iki olay arasında bağ kurar (sebep → sonuç); yine yan cümle, fiil sonda."}
  ]
};
GL.g34={
  hub:["ek"],
  kopru:[
    {to:"g:g11",t:"Bunu zaten biliyorsun: *ein neuer Plan, ein neues Auto, kaltes Wasser*. Partizip sıfat olunca tam olarak bu ekleri alır: *ein gebrauchtes Auto, steigende Preise*."},
    {to:"g:g16",t:"*Das Kind, das schläft, …* İlgi cümlesini biliyorsun. Partizip I bunu tek kelimeye sıkıştırır: *das schlafende Kind*. Türkçedeki „uyuyan çocuk“ gibi."},
    {to:"g:g31",t:"*Das Ei wurde gekocht.* Passiv'deki Partizip II zaten „edilmiş“ anlamını taşıyor. İsmin önüne alınca: *das gekochte Ei* = haşlanmış yumurta."}
  ],
  hatirla:["kochen, schreiben ve reparieren'in Partizip II'si ne?","*gekocht*, *geschrieben*, *repariert*"],
  mantik:"Türkçede bunu her gün yapıyorsun: uyu-yan çocuk, haşla-nmış yumurta. Fiilden sıfat yapmak. Almancanın iki yolu var. Partizip I = mastar + d: *schlafend* = uyuyan; şu anda, kendisi yapıyor (etken, eşzamanlı). Partizip II = Perfekt'ten bildiğin biçim: *gekocht* = pişirilmiş; başkası yaptı ya da iş bitti (edilgen, tamamlanmış). İsmin önüne geçtiği an artık normal bir sıfattır ve ek giyer, tam g9/g11 kurallarıyla: *das schlafende Kind, ein gebrauchtes Auto*. Aslında bu, kısaltılmış bir ilgi cümlesi; gazetede ve B1 okuma metinlerinde sık çıkar.",
  adim:{tr:"Artan fiyatlar yüzünden ikinci el bir araba aldık.",s:[
    ["„Artan“ = şu anda artmakta, kendisi artıyor → Partizip I: steigen + d","steigend"],
    ["wegen + Genitiv; çoğulda artikel der, der'den sonra sıfat -en","Wegen der steigenden Preise"],
    ["„İkinci el“ = kullanılmış, edilgen → Partizip II: gebraucht. ein + nötr Akk. bilgi vermiyor → sıfat -es","Wegen der steigenden Preise … ein gebrauchtes Auto"],
    ["wegen-grubu 1. yeri kaplar, haben hemen arkadan, gekauft en sona","Wegen der steigenden Preise haben wir ein gebrauchtes Auto gekauft."]
  ]},
  tr:[
    ["uyuyan çocuk","das schlafende Kind","Türkçe „-en/-an“ = Partizip I: uyu-*yan* → schlafen-*d*. Sıfat-fiil iki dilde de ismin önünde: burada Türkçe çok yardımcı."],
    ["haşlanmış yumurta","das gekochte Ei","„-mış/-ılmış“ = Partizip II. Türkçe -miş hem „bitmiş“ hem „edilmiş“ olabilir; Partizip II de öyle."],
    ["dün gelen mektup","der gestern angekommene Brief / der Brief, der gestern angekommen ist","Yanıltıcı yer: Türkçe „-en“ geçmiş için de kullanılır, Partizip I kullanılmaz. *der gestern ankommende Brief* ✘. Olmuş bitmiş → Partizip II ya da ilgi cümlesi."],
    ["iyi maaşlı bir iş","ein gut bezahlter Job","Türkçe çeviride sıfat-fiil kaybolur („maaşlı“); Almancada düz Partizip II: *gut bezahlt* = iyi ödenen. ein + eril → sıfat -er."]
  ],
  neden:[
    ["Neden *schlafend* değil de *das schlafende Kind*?","Çünkü artık sıfat oldu ve ismin önündeki her sıfat ek alır: *das schlafende Kind, ein schlafendes Kind, mit einem schlafenden Kind*. g9/g11 tabloları burada da aynen geçerli."],
    ["Neden *die gekochten Eier* ama *Die Eier sind gekocht*?","Ek sadece isimden önce gelir. sein'dan sonra sıfat çıplak kalır: *die warme Suppe* / *Die Suppe ist warm.* Partizip de aynı."],
    ["Neden *spannend* „heyecan verici“, *gespannt* ise „merakta“?","Partizip I etkileyen tarafı, Partizip II etkilenen tarafı anlatır: *ein spannender Film* (heyecan veren) · *Ich bin gespannt.* (merakla bekleyen ben). Aynı çift: *aufregend / aufgeregt*, *überzeugend / überzeugt*."]
  ],
  karis:[
    ["steigende Preise (artmakta olan)","gestiegene Preise (artmış olan)","Süreç devam ediyorsa Partizip I; olmuş bitmiş sonuçsa Partizip II."],
    ["ein spannender Film","Ich bin gespannt.","Kim etkiliyor? (film) → -end. Kim etkileniyor? (ben) → ge-…-t."]
  ],
  kanca:"-end = „-en/-an“ (şu an kendisi yapıyor), ge-…-t = „-mış/-ılmış“ (olmuş bitmiş); ismin önüne geçtiyse ikisi de sıfat ekini giyer.",
  ileri:[
    {to:"ez:adjein",t:"Partizip'li sıfatlar da bu ekleri alır: *ein gebrauchtes Auto, einen gut bezahlten Job*."},
    {to:"ez:adjnull",t:"Artikelsiz: *steigende Preise, mit gekochtem Reis*. Bilgiyi sıfat taşır."}
  ]
};
GL.g35={
  hub:["zu"],
  kopru:[
    {to:"g:g28",t:"Bunu zaten biliyorsun: *Ich trainiere, um fit zu bleiben.* Başta um, sonda zu + mastar. ohne ve statt aynı kalıba oturur: *ohne mich aufzuwärmen*, *statt zu trainieren*. Özne değişince um → damit olduğu gibi, bunlar da *ohne dass / statt dass* olur."},
    {to:"g:g17",t:"*Ich versuche, früher aufzustehen.* Ayrılan fiilde zu araya giriyordu. Burada da aynı: *ohne mich aufzuwärmen*."},
    {to:"ez:pakk",t:"ohne'yi edat olarak tanıyorsun: *ohne meinen Schlüssel* (Akkusativ). Burada ismin yerine bütün bir eylem geliyor: *ohne zu fragen*."}
  ],
  hatirla:["„Formda kalmak için antrenman yapıyorum“ Almancası?","*Ich trainiere, um fit zu bleiben.*"],
  mantik:"um … zu'yu biliyorsun: başta bir kelime, sonda zu + mastar, arada nesneler. ohne ve statt aynı makineyi kullanır; sadece anlam değişir: *um* = -mek için, *ohne* = -meden, *statt* = -mek yerine. Mastarın öznesi yoktur, özneyi ana cümleden ödünç alır; bu yüzden üçü de sadece özne aynıysa çalışır. Özne farklıysa yan cümleye geçersin, fiil sona: *ohne dass, statt dass* (um'un karşılığı ise *damit*). Yani bir kalıbı öğrendin, üçünü bildin.",
  adim:{tr:"Isınmadan asla antrenman yapmam.",s:[
    ["Ana cümle: fiil 2. yerde","Ich trainiere nie,"],
    ["„-meden“ → ohne başa; özne aynı (ben) → ohne … zu","Ich trainiere nie, ohne"],
    ["sich aufwärmen dönüşlü: zamir özneye uyar → mich","Ich trainiere nie, ohne mich"],
    ["Ayrılan fiil: zu araya girer → aufzuwärmen, en sona","Ich trainiere nie, ohne mich aufzuwärmen."]
  ]},
  tr:[
    ["Vedalaşmadan gitti.","Er ist gegangen, ohne sich zu verabschieden.","Türkçe „-meden“ fiile yapışır; Almanca *ohne* başa, *zu + mastar* sona. Ön kapak, arka kapak."],
    ["Yemek yapmak yerine pizza söyledik.","Statt zu kochen, haben wir Pizza bestellt.","Türkçede „-mek yerine“ önde; Almancada da önde olabilir. O zaman virgülden sonra ana cümle fiille başlar, *Wenn …, + fiil* gibi."],
    ["Sen fark etmeden gittim.","Ich bin gegangen, ohne dass du es gemerkt hast.","Türkçe özne değişince de „-meden“ der; Almanca değiştirir: farklı özne → *ohne dass* + yan cümle, fiil sonda."],
    ["şekersiz kahve / şeker koymadan","Kaffee ohne Zucker / ohne Zucker zu nehmen","Türkçede „-sız“ ve „-meden“ iki ayrı ek; Almancada ikisi de ohne. İsimse *ohne* + Akk., eylemse *ohne … zu*."]
  ],
  neden:[
    ["Neden *ohne zu verabschieden* değil de *ohne sich zu verabschieden*?","Dönüşlü zamir fiilin parçası; mastar grubunda da kalır ve öznenin kişisine uyar: *ohne mich zu…, ohne dich zu…, ohne sich zu…*"],
    ["Neden *ohne dass* cümlesine nicht koymuyoruz?","ohne zaten olumsuzluk taşıyor („-meden“). *Er ist gegangen, ohne dass jemand es gemerkt hat.* = kimse fark etmeden. Bir de nicht koyarsan çift olumsuz olur, anlam ters döner."],
    ["Neden um, ohne, statt aynı kalıpta?","Almanca amaç (um), yokluk (ohne) ve alternatif (statt) için aynı makineyi kullanıyor: [kelime] … zu + mastar. Özne değişince hepsi dass-ailesine geçer: *damit, ohne dass, statt dass*."]
  ],
  karis:[
    ["ohne zu fragen (-meden)","ohne den Chef (-sız)","Arkadan eylem (zu + mastar) geliyorsa ohne … zu; isim geliyorsa edat ohne + Akkusativ."],
    ["statt … zu (yerine)","um … zu (için)","Statt: bir şey yapılmıyor, yerine başka şey yapılıyor. um: bir şey öbürünün amacı."],
    ["ohne dass du fragst ✔","ohne du zu fragen ✘","Özne farklıysa zu-yapısı olmaz; *ohne dass* + özne + fiil sonda."]
  ],
  kanca:"um, ohne, statt: üç kardeş, tek kalıp: başta kelime, sonda „zu + mastar“; özne değişince damit, ohne dass, statt dass.",
  ileri:[
    {to:"g:g37",t:"*indem* (-erek) tam tersi: ohne … zu „yapmadan“, indem „yaparak“. Ama indem'in zu-biçimi yok, hep yan cümle."},
    {to:"g:g36",t:"lassen modal ailesinden: arkasından zu gelmez (*Ich lasse das Auto reparieren*)."}
  ]
};
GL.g36={
  hub:["klammer","zu"],
  kopru:[
    {to:"ez:modal",t:"Bunu zaten biliyorsun: *Ich muss das Auto reparieren.* Modal 2. yerde, mastar en sonda, zu yok. lassen da tam böyle çalışır: *Ich lasse das Auto reparieren.*"},
    {to:"g:g26",t:"*Ich hätte gestern trainieren sollen.* Perfekt'te iki mastar yan yana geldi, sollen „gesollt“ olmadı. lassen de aynısını yapar: *Ich habe das Auto reparieren lassen.*"},
    {to:"g:g31",t:"Passiv'de işi yapan kaybolur: *Das Auto wird repariert.* lassen da „işi başkası yapıyor“ der, ama işi ısmarlayan kişi öznede kalır: *Ich lasse das Auto reparieren.*"}
  ],
  hatirla:["„Dün antrenman yapmalıydım“ Almancası? (sollen ile)","*Ich hätte gestern trainieren sollen.*"],
  mantik:"lassen'ın çekirdek anlamı „bırakmak“; bütün anlamları buradan çıkar. Eşyayı bir yerde bırakmak: *Ich lasse die Tasche im Auto.* Birine bir şeyi yapma alanı bırakmak, izin vermek: *Lass mich ausreden!* İşi bir başkasına bırakmak, yani yaptırmak: *Ich lasse das Auto reparieren.* Türkçe bunu fiile ek koyarak yapar (tamir et-*tir*-mek, kes-*tir*-mek); Almanca ayrı bir fiille. Gramerde lassen bir modal gibi davranır: çekimli lassen 2. yerde, asıl fiil mastar hâlinde sonda, zu yok. Perfekt'te de modal gibi: başka bir mastarın yanındaysa *gelassen* değil *lassen*.",
  adim:{tr:"Saçımı kestirdim.",s:[
    ["Geçmiş, konuşma dili → Perfekt: habe 2. yerde","Ich habe"],
    ["Kime? Kendime → Dativ dönüşlü mir; ne? die Haare (vücut bölümü + Dativ zamir)","Ich habe mir die Haare"],
    ["Kesme işini başkası yapıyor: asıl fiil mastar hâlinde → schneiden","Ich habe mir die Haare schneiden"],
    ["En sona lassen; başka mastarın yanında Partizip olmaz (gelassen değil)","Ich habe mir die Haare schneiden lassen."]
  ]},
  tr:[
    ["Arabayı tamir ettiriyoruz.","Wir lassen das Auto reparieren.","Türkçe ettirgen „-tir“ fiile yapışır; Almanca lassen'ı 2. yere koyar, asıl fiili mastar olarak sona yollar."],
    ["Saçımı kestirdim.","Ich habe mir die Haare schneiden lassen.","Türkçe „saç-ım-ı“ der; Almanca kendine yapılan işte Dativ zamir + artikel kullanır: *mir die Haare*."],
    ["Sözümü bitirmeme izin ver!","Lass mich ausreden!","Türkçe uzun bir kalıp („-meme izin ver“); Almancada tek kelime: *lass*. İzin verilen kişi Akkusativ: *mich*."],
    ["Hadi gidelim!","Lass uns gehen!","Türkçe „-elim“ eki; Almanca *lass uns* + mastar. Resmîde: *Lassen Sie uns morgen weitersprechen.*"]
  ],
  neden:[
    ["Neden *Ich habe das Auto reparieren gelassen* yanlış?","İki mastar yan yana gelince ikincisi de mastar kalır, tıpkı *hätte … trainieren sollen*'daki gibi. Tek başınaysa normal Partizip: *Ich habe die Tasche im Auto gelassen.*"],
    ["Neden *Ich lasse das Auto zu reparieren* yanlış?","lassen modal ailesinden: können, müssen, werden, lassen'dan sonra zu yok. *Ich muss / Ich lasse … reparieren.*"],
    ["Passiv varken neden lassen?","Passiv'de sorumlu kimse yok: *Das Auto wird repariert.* lassen'da sorumlu sensin, işi ustaya sen verdin: *Ich lasse das Auto reparieren.* Özne = ısmarlayan kişi."]
  ],
  karis:[
    ["Ich lasse das Auto reparieren. (tamir ettiriyorum)","Ich repariere das Auto. (kendim tamir ediyorum)","Türk öğrenciler çoğu zaman „tamir ettim“ der ama kastettiği „ettirdim“dir. Kuaförde, tamircide, terzide: lassen."],
    ["Ich habe es reparieren lassen.","Ich habe die Tasche im Auto gelassen.","Arkasında başka bir mastar var mı? Varsa lassen; yoksa gelassen."],
    ["du lässt, er lässt","ihr lasst","lassen, fahren gibi a → ä ailesinden: sadece du ve er/sie/es'te Umlaut. *ihr lasst* doğru."]
  ],
  kanca:"lassen = bırakmak: eşyayı bırak (*im Auto lassen*), birine izin bırak (*lass mich*), işi ustaya bırak (*reparieren lassen*); Türkçenin „-tir“i Almancada ayrı bir kelime.",
  ileri:[
    {to:"ez:passiv",t:"„İşi başkası yapıyor“ fikrinin öbür yolu. Karşılaştır: *Das Auto wurde repariert.* ↔ *Ich habe das Auto reparieren lassen.*"},
    {to:"g:g40",t:"lassen sabit kalıplarda da yaşar: *Lass mich in Ruhe!* (beni rahat bırak) bir isim + fiil bloğu."}
  ]
};
GL.g37={
  hub:["sona","bag"],
  kopru:[
    {to:"g:g18",t:"Bunu zaten biliyorsun: *Er hat verschlafen, deshalb hat er den Zug verpasst.* sodass aynı sonucu söyler, sadece fiili sona yollar: *…, sodass er den Zug verpasst hat.*"},
    {to:"g:g28",t:"*damit* amaç bildiriyordu: *…, damit du es verstehst* (anlaman için). sodass sonucu bildirir: *…, sodass du es verstanden hast* (sonuç olarak anladın). Biri istek, öbürü olmuş şey."},
    {to:"g:g35",t:"*ohne mich aufzuwärmen* = ısınmadan. indem bunun olumlusu: *indem ich mich aufwärme* = ısınarak. „Nasıl?“ sorusunun iki cevabı."}
  ],
  hatirla:["„Yorgunum, bu yüzden erken yatıyorum“ Almancası?","*Ich bin müde, deshalb gehe ich früh ins Bett.*"],
  mantik:"İki yeni yan cümle bağlacı; ikisi de weil-ailesinden, yani fiil sona gider. *indem* „Nasıl?“ sorusunu cevaplar: yöntem, araç (Türkçe -erek). İşi yapan da yöntemi uygulayan da genelde aynı kişidir. *sodass* „Sonuç ne oldu?“ sorusunu cevaplar: deshalb ile aynı anlam, ama farklı aile. deshalb'dan sonra fiil hemen gelir, sodass'tan sonra en sona gider. Sonuç sebepten sonra gelir; bu yüzden sodass-cümlesi hep ikinci sıradadır. *so … dass* diye ayrılınca anlam güçlenir: *Es war so heiß, dass …* = o kadar sıcaktı ki …",
  adim:{tr:"Podcast dinleyerek Almancamı geliştiriyorum.",s:[
    ["Ana cümle: ne yapıyorum? fiil 2. yerde","Ich verbessere mein Deutsch,"],
    ["„Nasıl?“ sorusunun cevabı (-erek) → indem","Ich verbessere mein Deutsch, indem"],
    ["Yan cümle: özne arkadan, fiil en sona; Türkçedeki „dinle-yerek“ gibi sonda","Ich verbessere mein Deutsch, indem ich Podcasts höre."]
  ]},
  tr:[
    ["Haftada üç gün antrenman yaparak formda kalıyorum.","Ich bleibe fit, indem ich dreimal pro Woche trainiere.","Türkçede „-erek“ kısmı önde, Almancada indem-cümlesi genelde arkada. Ama içinde fiil yine sonda: o kısım Türkçe sırası."],
    ["Uyuyakaldı, bu yüzden treni kaçırdı.","Er hat verschlafen, sodass er den Zug verpasst hat.","„bu yüzden“ iki türlü çevrilir: *deshalb hat er …* (fiil hemen) ya da *sodass er … hat* (fiil sonda). Anlam aynı, aile farklı."],
    ["O kadar yorgundum ki hemen uyudum.","Ich war so müde, dass ich sofort eingeschlafen bin.","Türkçe „o kadar … ki“ = *so … dass*. so sıfatın önüne, dass virgülden sonra."]
  ],
  neden:[
    ["Neden indem cümlesinde özne genelde aynı?","Çünkü yöntem, işi yapan kişinin yaptığı başka bir şey: ben formda kalıyorum ← ben antrenman yapıyorum. Türkçede de „-erek“ aynı özneyi ister: „Ben antrenman yaparak sen formda kalıyorsun“ tuhaf duyulur."],
    ["„-erek“i bazen *durch* ile de duyuyorum, neden?","Aynı fikrin isimli hâli: *durch* + Akk. *Ich bleibe fit durch regelmäßiges Training.* Eylemle söylemek istersen indem + yan cümle. İsimli hâl kısa ve resmî, indem konuşmaya daha yakın."],
    ["Neden sodass-cümlesi başa gelemez?","Sonuç, sebepten önce gelmez: önce yağmur yağdı, sonra maç iptal oldu. sodass hep ana cümleden sonra durur."]
  ],
  karis:[
    ["indem (-erek, nasıl?)","während (-irken, ne zaman?)","indem yöntemi verir: *Ich lerne, indem ich lese.* während eşzamanlılığı: *Ich höre Musik, während ich koche.* Biri „nasıl“, öbürü „aynı anda“."],
    ["sodass (sonuç, oldu)","damit (amaç, olsun diye)","*Ich spreche langsam, damit du mich verstehst* (anlaman için). *Ich spreche langsam, sodass du mich verstehst* (sonuç olarak anlıyorsun)."],
    ["indem ich lerne ✔","indem zu lernen ✘","indem'in zu-biçimi yok; hep tam yan cümle: indem + özne + fiil sonda."]
  ],
  kanca:"indem = „-erek“ (nasıl?), sodass = „… oldu, o yüzden de“ (sonuç); ikisi de weil gibi fiili en sona yollar.",
  ileri:[
    {to:"g:g39",t:"*als ob* da bu ailedendir: yan cümle, fiil sona; ama içinde Konjunktiv II: *als ob er krank wäre*."}
  ]
};

    ["Geç kaldı, bu beni kızdırdı.","Er kam zu spät, worüber ich mich geärgert habe.","Türkçe yeni bir cümleyle „bu“ der; Almanca tek cümlede bağlayabilir: sich ärgern über → *worüber*."]

  neden:[

    ["Neden *worüber*'de r var ama *womit*'te yok?","Edat ünlüyle başlıyorsa iki ünlü çarpışmasın diye araya r girer: *wo-r-über, wo-r-auf, wo-r-an*; ama *wo-mit, wo-für*. darauf / dafür'deki kuralın aynısı."],
    ["Neden *das Buch, worüber wir sprachen* pek duyulmaz?","Somut, cinsiyetli bir isim varsa Almanca normal yolu seçer: *das Buch, über das wir sprachen*. wo(r)+edat'ı özellikle bütün bir cümleye ya da alles/etwas/nichts'e bakarken kullanırsın."]

/* ---------------- konu ilerlemesi: 5 aşamalı ders ----------------
   Araştırmaya dayalı sıra (açık anlatım → fark etme → tanıma → üretme → aralıklı tekrar):
   1 Anla: özet + örnekler + "hangisi doğru?" (fark etme)
   2 Tanı: 12 şıklı boşluk doldurma
   3 Kur: şıksız, yazarak boşluk doldurma + cümle kurma
   4 Üret: kendi cümlelerini yaz (ertesi gün açılır: araya uyku girsin)
   5 Pekiştir: günlere yayılan karışık tekrar (1, 3, 7, 14, 30 gün). 2 başarılı tekrar = oturdu.
   Bir konu en az ~1 hafta sürer; aynı anda 2–3 konu yürür (karışık çalışma). */
var STG=[['anla','Anla','Özet, örnekler, "hangisi doğru?"',.1],['tani','Tanı','12 boşluk doldurma, şıklı',.2],['kur','Kur','Yazarak doldur + cümle kur',.25],['uret','Üret','Kendi cümlelerini yaz',.15]];
var RVI=[3,7,14,30,60];
function mcs(id){return (GX[id]||[]).concat(GX2[id]||[]);}
function gpeek(id){return S.gx[id]||{m:{}};}
function gxs(id){var x=S.gx[id]||(S.gx[id]={m:{}});if(!x.stg)x.stg={};if(!x.rv)x.rv=[];if(!x.m)x.m={};return x;}
function wid(id,i){return 't:'+id+':'+i;}
function wordsAdded(id){var w=GW[id]||[],n=0;for(var i=0;i<w.length;i++)if(S.srs[wid(id,i)])n++;return n;}
function stgDone(id,k){var x=gpeek(id);return !!(x.stg&&x.stg[k]);}
function stgAll(id){return STG.every(function(s){return stgDone(id,s[0]);});}
function nRv(id){return (gpeek(id).rv||[]).length;}
function tprog(id){
  var x=gpeek(id);if(x.known)return 1;
  var p=0;STG.forEach(function(s){if(x.stg&&x.stg[s[0]])p+=s[3];});
  p+=Math.min(nRv(id),2)*.15;
  return Math.min(1,Math.max(p,x.base||0));
}
function tstat(id){var x=gpeek(id);if(x.known||(stgAll(id)&&nRv(id)>=2))return 'ok';return (tprog(id)>0||x.last)?'wip':'next';}
function pct(p){return Math.round(p*100);}
function tdue(id){var x=gpeek(id);return !!(stgAll(id)&&!x.known&&x.due&&x.due<=today());}
/* konunun sıradaki adımı: {k: aşama ya da 'rv', wait: açılacağı gün} */
function nextAct(id){
  var x=gpeek(id),t=today();if(x.known)return {k:null};
  if(!stgDone(id,'anla'))return {k:'anla'};
  if(!stgDone(id,'tani'))return {k:'tani'};
  if(!stgDone(id,'kur'))return {k:'kur'};
  if(!stgDone(id,'uret'))return x.stg.kur<t?{k:'uret'}:{k:null,wait:addD(t,1),w:'uret'};
  if(x.due&&x.due>t)return {k:null,wait:x.due,w:'rv'};
  return {k:'rv'};
}
function actLabel(a){return a.k==='rv'?'Pekiştir · tekrar':a.k?('Aşama '+(STG.map(function(s){return s[0];}).indexOf(a.k)+1)+' · '+STG.filter(function(s){return s[0]===a.k;})[0][1]):'';}
function bandProg(b){var gs=G.filter(function(g){return g[1]===b;}),s=0;gs.forEach(function(g){s+=tprog(g[0]);});return gs.length?s/gs.length:0;}
function pickTopic(){
  var i,due=G.filter(function(g){return tdue(g[0]);});
  if(due.length){due.sort(function(a,b){return gpeek(a[0]).due<gpeek(b[0]).due?-1:1;});return due[0];}
  var open=G.filter(function(g){return tstat(g[0])==='wip'&&nextAct(g[0]).k;});
  var pri=open.filter(function(g){return gpeek(g[0]).pri;});if(pri.length)return pri[0];
  if(open.length)return open[0];
  var active=G.filter(function(g){return tstat(g[0])==='wip';}).length;
  if(active<3){
    for(i=0;i<G.length;i++)if(gpeek(G[i][0]).pri&&tstat(G[i][0])==='next')return G[i];
    for(i=0;i<G.length;i++)if(tstat(G[i][0])==='next')return G[i];
  }
  for(i=0;i<G.length;i++)if(tstat(G[i][0])==='wip')return G[i];
  return G[hash(today())%G.length];
}
/* günün konusu: "bugün bunu çalış" seçildiyse o; değilse gün içinde sabit, işi bitince sıradaki */
function todayTopic(){
  if(S.gfocus&&GBY[S.gfocus]&&nextAct(S.gfocus).k)return GBY[S.gfocus];
  var d=day();
  if(d.gt&&GBY[d.gt]&&(nextAct(d.gt).k||d.gtDone))return GBY[d.gt];
  var g=pickTopic();d.gt=g[0];save();return g;
}
function nextReview(id){
  var a=nextAct(id);if(gpeek(id).known)return 'biliyorum olarak işaretli';
  if(a.k)return 'sıradaki: '+actLabel(a);
  if(a.wait){var n=dd(today(),a.wait);return (a.w==='uret'?'Üret aşaması ':'tekrar ')+(n<=1?'yarın':n+' gün sonra')+' açılır';}
  return '';
}

/* --- ders: 5 aşama ---

   Önce bilinmeyen sorular gelir; her konu 12 boşluk sorusu ve 6 cümleden beslenir. Tekrarda 2 soru başka konulardan gelir (karışık çalışma). */
function mcItem(id,o,t){var f=o.s.split('|'),it={t:t,tid:id,k:o.k,q:f[0],c:f[1],ex:f[4]||'',acc:(f[5]||'').split('/').map(function(x){return x.trim();}).filter(Boolean),wl:[f[2],f[3]],nt:[f[6]||'',f[7]||'']};
  if(t==='mc')it.o=shuffle([f[1],f[2],f[3]]);
  if(t==='hc'){var ww=f[2+Math.floor(Math.random()*2)],r=f[0].replace('___',f[1]),w=f[0].replace('___',ww);it.c=r;it.o=shuffle([r,w]);it.cw=f[1];it.wmap={};it.wmap[r]=f[1];it.wmap[w]=ww;}
  return it;}
function szItem(id,o){return {t:'sz',tid:id,k:o.k,de:o.s[0],tr:o.s[1],alts:o.s[2]||[]};}
function tItems(id,k){
  var g=GBY[id],x=gxs(id);
  function pick(a,n){return shuffle(a.slice()).sort(function(p,q){return (x.m[p.k]===1)-(x.m[q.k]===1);}).slice(0,n);}
  var L=mcs(id).map(function(s,i){return {s:s,k:'x'+i};}),Z=g[4].map(function(s,i){return {s:s,k:'s'+i};}),out=[];
  if(k==='anla')return pick(L,3).map(function(o){return mcItem(id,o,'hc');});
  if(k==='tani')return pick(L,8).map(function(o){return mcItem(id,o,'mc');});
  if(k==='kur'){var ty=pick(L,4),sz=pick(Z,4);for(var i=0;i<4;i++){if(ty[i])out.push(mcItem(id,ty[i],'ty'));if(sz[i])out.push(szItem(id,sz[i]));}return out;}
  var a=pick(L,6),zz=pick(Z,k==='rv'?1:2);
  a.forEach(function(o,i){out.push(mcItem(id,o,k==='rv'?(i<3?'mc':i<5?'ty':'hc'):(i<3?'mc':'ty')));});
  zz.forEach(function(o){out.push(szItem(id,o));});
  if(k==='rv'){
    var oth=shuffle(G.filter(function(g2){return g2[0]!==id&&stgDone(g2[0],'tani');})).slice(0,1);
    oth.forEach(function(g2){var l2=mcs(g2[0]),j=Math.floor(Math.random()*l2.length);out.push(mcItem(g2[0],{s:l2[j],k:'x'+j},'mc'));});
    if(oth.length<1){var more=pick(L,12).filter(function(o){return !a.some(function(q){return q.k===o.k;});});more.slice(0,1-oth.length).forEach(function(o){out.push(mcItem(id,o,'ty'));});}
  }
  return shuffle(out);
}

function dkDiff(target,typed){

  for(i=0;i<=n;i++){L[i]=[];for(j=0;j<=m;j++)L[i][j]=i&&j?(a[i-1]===b[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1])):0;}
  var okA={};i=n;j=m;while(i&&j){if(a[i-1]===b[j-1]){okA[i-1]=1;i--;j--;}else if(L[i-1][j]>=L[i][j-1])i--;else j--;}

  if(R.ptest&&(!L.ptest||(R.ptest.date||'')>(L.ptest.date||''))){M.ptest=cp(R.ptest);M.vest=cp(R.vest);}
  M.seq=Math.max(L.seq||0,R.seq||0);
  M.best={blitz:Math.max((L.best||{}).blitz||0,(R.best||{}).blitz||0)};
  for(id in R.srs){var a=L.srs[id],b=R.srs[id];if(!a||srsNewer(b,a))M.srs[id]=cp(b);}
  for(k in R.days)M.days[k]=mergeDay(L.days[k],R.days[k]);
  for(id in R.gdone)if(!M.gdone[id]||R.gdone[id]<M.gdone[id])M.gdone[id]=R.gdone[id];
  for(id in R.gx)M.gx[id]=mergeGx(L.gx[id],R.gx[id],rN);
  for(id in M.gx)if(M.gx[id]&&M.gx[id].rs&&!(tstatOf(M.gx[id])))delete M.gdone[id];
  for(id in (R.gnote||{}))if(M.gnote[id]==null||rN)M.gnote[id]=R.gnote[id];
  M.ez=M.ez||{};for(id in (R.ez||{})){var x=M.ez[id],y=R.ez[id];if(!x||(y.n||0)>(x.n||0)||((y.n||0)===(x.n||0)&&(y.last||'')>(x.last||'')))M.ez[id]=cp(y);}
  M.err=M.err||{};for(k in (R.err||{})){var e1=M.err[k],e2=R.err[k];if(!e1){M.err[k]=cp(e2);continue;}
    var h=cp(e1.h||{});for(var dk in (e2.h||{}))h[dk]=Math.max(h[dk]||0,e2.h[dk]);
    M.err[k]={n:Math.max(e1.n||0,e2.n||0),d:later(e1.d,e2.d),h:h,ex:(e1.n||0)>=(e2.n||0)?e1.ex:cp(e2.ex)};}
  var tomb=cp(L.tomb||{});for(k in (R.tomb||{}))tomb[k]=1;M.tomb=tomb;
  M.notes=unionId(rN?R.notes:L.notes,rN?L.notes:R.notes,tomb);M.mine=unionId(rN?R.mine:L.mine,rN?L.mine:R.mine,tomb);
  M.mt=Math.max(L.mt||0,R.mt||0);M.rz=Math.max(L.rz||0,R.rz||0);
  return M;
}

function sync(silent){

      var f=g.files&&g.files[GISTF];if(!f)return '';

      remoteTxt=txt||'';var R=null;try{R=txt?JSON.parse(txt):null;}catch(e){}
