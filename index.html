    ["*Ich trinke gerner Tee.* ✗","*Ich trinke lieber Tee.* ✓","*gern* düzensiz: *gern – lieber – am liebsten*. „Tercih ederim“ demenin en doğal yolu *lieber*."],
    ["*mehr* (daha çok, miktar)","-er (daha + sıfat)","*mehr Zeit, mehr trainieren* ama *schneller, schwerer*. Sıfatın önüne *mehr* koyma."]
  ],
  kanca:"-er yükseltir, -sten zirveye çıkarır, *am* bayrağı diker: *schnell → schneller → am schnellsten*.",
  ileri:[
    {to:"g:g9",t:"*der schnellste Läufer, die beste Pizza*: isim önündeki en üstünlük normal sıfat eki alır."},
    {to:"g:g33",t:"*je … desto* ile iki karşılaştırma birbirine bağlanır: *Je mehr ich trainiere, desto stärker werde ich.*"}

};

GL.g8={

  adim:{tr:"Pencereyi kapatabilir misiniz lütfen?",s:[
    ["„-ebilir misiniz“ = *können*; kibar olsun: *konnte* + noktalar → *könnten* (Sie). Soru olduğu için fiil başa.","Könnten Sie"],
    ["*bitte* öznenin hemen arkasına, sonra nesne.","Könnten Sie bitte das Fenster"],

  tr:[
    ["Bana yardım edebilir misiniz?","Könnten Sie mir helfen?","Yardım eden yer: Türkçe „-ebilir misiniz“ ile *Könnten Sie* neredeyse birebir. Sezgin doğru."],
    ["Bir kahve alabilir miyim?","Ich hätte gern einen Kaffee.","Türkçede *hätte* için birebir kalıp yok; kelimesi kelimesine „bir kahvem olsa hoş olurdu“. Kafede *Ich will* kaba durur; *Ich hätte gern* ya da *Ich möchte* de."],
    ["Pencereyi kapatır mısınız?","Würden Sie das Fenster schließen?","Türkçe geniş zaman sorusu (-r mısınız) kibarlık katar; Almanca bunun için *würden* kullanır. *würde*'yi „-erdi“ ekinin Almancası gibi düşün."],
    ["Telefonunuzu kullanabilir miyim?","Dürfte ich Ihr Telefon benutzen?","Yanıltan yer: Türkçe izin için de „-ebilir miyim“ der; Almanca yeteneği (*könnte*) izinden (*dürfte*) ayırır. İzin istiyorsan *dürfen*."]
  ],
  neden:[
    ["Kibarlık için neden geçmiş zaman biçimi kullanılıyor?","Uzaklık = kibarlık. Zamanda bir adım geri çekilmek isteği yumuşatır; Türkçede de „bir şey soracaktım“ dersin, şu an soruyor olsan bile. Almanca bir adım daha atar ve Umlaut ile gerçek dışı yapar: *könnte* = olsa olsa yapabilir."],
    ["*würde* nereden çıktı?","*werden* fiilinden: *werden → wurde* (oldu) *→ würde* (olurdu). Yine aynı formül: geçmiş + noktalar. *Würden Sie …?* „…r mıydınız?“ gibi bir yumuşaklık taşır."],
    ["*Können Sie …?* de doğru. O zaman *Könnten Sie* neden gerekli?","*Können Sie …?* doğru ama daha doğrudan, neredeyse bir talimat. Ofiste, mağazada, yabancıya *Könnten Sie* daha sıcak durur. Tek bir ünlü değişikliği tonu değiştiriyor."]
  ],
  karis:[
    ["*Konnten Sie mir helfen?* (yardım edebildiniz mi?)","*Könnten Sie mir helfen?* (yardım edebilir misiniz?)","Noktasız = geçmişte gerçekten oldu mu. Noktalı = şimdi kibar rica. Telaffuzda o ↔ ö'yü abart."],
    ["*Wurden Sie …?* ✗","*Würden Sie …?* ✓","*wurde* = oldu (ya da Passiv'de „edildi“), *würde* = -erdi. Ricada hep noktalı."],
    ["*Ich hatte einen Kaffee.* (Bir kahve içmiştim)","*Ich hätte gern einen Kaffee.* (Bir kahve alabilir miyim?)","*hatte* geçmiş, *hätte* istek. Garsona *hatte* dersen kahve sipariş etmemiş, anı anlatmış olursun."]

  kanca:"İki nokta, kibarlığın iki gözü: *konnte* olanı anlatır, *könnte* rica eder.",
  ileri:[
    {to:"g:g14",t:"Aynı biçimlerle tavsiye ve dilek: *Du solltest mehr schlafen. Ich würde gern reisen.*"},
    {to:"ez:konj2",t:"Konjunktiv II tablosu: *wäre, hätte, würde, könnte*. Formül hep aynı: Präteritum + Umlaut."}
  ]
};

GL.g9={

    ["Artikel değişti → sıfat -en: *neuen*.","Wir sprechen mit dem neuen Trainer."]
  ]},
  tr:[

    ["Kırmızı kazağı alıyorum.","Ich kaufe den roten Pullover.","Türkçe -ı eki ismin sonunda; Almanca bilgiyi öne, *den*'e ve -en'e koyar. Bilgi aynı, yeri farklı."],
    ["Bu kazak kırmızı.","Der Pullover ist rot.","Yardım eden yer: sıfat *sein*'dan sonra yüklemdeyse Almancada da ek almaz, Türkçedeki gibi çıplak kalır. Ek sadece ismin önündeki sıfata gelir."],
    ["taze ekmekler","die frischen Brötchen","Yanıltan yer: Türkçe çoğulu sadece isme koyar (-ler). Almancada çoğul *die* sıfata hep -en yaptırır, tekil *die* ise -e: *die frische Milch*."]

  neden:[

    ["Neden *der neue Plan* ama *ein neuer Plan*?","*der* „eril, Nominativ“ bilgisini açıkça veriyor; sıfat -e ile yetinir. *ein* hem eril hem nötr olabilir, bilgiyi vermiyor; sıfat -er alarak açığı kapatır. „Bilgiyi biri taşımalı.“ g11'de göreceksin, mantığı şimdiden burada."],
    ["Neden bu kadar çok -en var?","-en Almancanın genel amaçlı zayıf ekidir. Artikel zor işi yaptığında (*den, dem, der, den*) sıfat en kolay eki seçer. Tabloda beş -e var, geri kalan her yer -en."]

  karis:[
    ["*den neue Pullover* ✗","*den neuen Pullover* ✓","Artikel değiştiyse (der → den) sıfat -en. *den* gördüğün an -en."],
    ["*die neue Idee* (tekil)","*die neuen Ideen* (çoğul)","Aynı *die*, farklı ek. İsme bak: çoğulsa -en, tekil dişilse -e."],
    ["*das alte Fahrrad* (Nom. / Akk.)","*dem alten Fahrrad* (Dativ)","*das* ve *die* Akkusativ'de değişmez, sıfat -e kalır. Dativ'de her zaman -en."]
  ],
  kanca:"Konuşkan artikel, sessiz sıfat: artikel sözlükteki hâlindeyse -e, değiştiyse ya da çoğulsa -en.",
  ileri:[

    {to:"ez:adjbest",t:"Beş -e ve geri kalan -en tablosu tek bakışta."}
  ]
};

  tr:[

    ["*seit* ile neden şimdiki zaman kullanılıyor?","Çünkü olay bitmedi, hâlâ sürüyor; sen bugünden bakıyorsun. Bitmiş bir şey için *seit* değil *vor* + Perfekt: *Ich bin vor einem Jahr umgezogen.* (Bir yıl önce taşındım.)"],
    ["Neden saat için *um*, gün için *am*, ay için *im*?","Büyüklüğe göre: saat bir noktadır, etrafında durursun (*um acht*); gün bir yüzeydir, üstündesin (*am Montag* = an dem); ay ve mevsim bir odadır, içindesin (*im Mai* = in dem). Küçükten büyüğe: um → am → im."]

  karis:[

  kanca:"Saat noktadır, gün yüzeydir, ay odadır: *um acht*, *am Montag*, *im Mai*.",

    {to:"g:g23",t:"*nach* → *nachdem*: „işten sonra“ yerine „çalıştıktan sonra“: *Nachdem ich gearbeitet hatte, …*"}

};

  karis:[
    ["Frischer Kaffee schmeckt gut.","Ich trinke frischen Kaffee.","Artikelsiz eril: özne ise *der* gibi -er, nesne ise *den* gibi -en. Sıfat, olmayan artikelin son harfini taşır."],
    ["ein neues Auto","das neue Auto","İkisi de nötr, ikisi de doğru. *das* -s'yi zaten gösterdiği için sıfat -e; *ein* göstermediği için sıfat -s'yi alır. Sor: artikel son harfi gösteriyor mu?"],
    ["Die Wohnung ist größer.","Wir suchen eine größere Wohnung.","Yüklemde (ist'ten sonra) sıfat ek almaz. İsmin önünde karşılaştırma -er'inin ÜSTÜNE hâl eki gelir: *größer-e*. -er „daha“ demek, -e hâl eki; ikisi ayrı işler."]
  ],
  kanca:"Artikel susarsa sıfat konuşur: *ein* sustuğu üç yerde sıfat de*r*'in r'sini, da*s*'ın s'sini yakalar.",
  ileri:[
    {to:"g:g34",t:"Partizipler sıfat olunca aynı ekleri alır: *ein gebrauchtes Auto*, *ein gut bezahlter Job*."},
    {to:"ez:adjnull",t:"B1'de artikelsiz sıfatın tam tablosu, Genitiv dahil."}
  ]
};

GL.g12={
  hub:["prap","hal"],
  kopru:[
    {to:"g:g6",t:"Bunu zaten biliyorsun: *sich freuen*, *sich interessieren* dönüşlü fiiller. Çoğunun arkasında hazır bir edat bekler: *sich freuen auf*, *sich interessieren für*. Fiil + sich + edat tek paket."},
    {to:"g:g4",t:"İki hâlli edatları biliyorsun: *auf dem Tisch* (Wo?), *auf den Tisch* (Wohin?). Edatlı fiilde bu edat mekân anlamını kaybeder ve hâli sabitlenir: *warten auf* her zaman Akkusativ, *auf den Bus*. Burada Wo/Wohin sormazsın."},
    {to:"ez:wfrage",t:"Soru kelimeleri w ile başlar: *wo, was, wohin*. *Worauf?* de bu ailenin üyesi: *wo + auf* = „neyi, neye?“ Cevaptaki *darauf* da *da + auf* = „onu, ona“."}
  ],
  hatirla:["*auf* hangi iki hâli alabilir, ne zaman?","Wo? (durum) → Dativ: auf dem Tisch. Wohin? (hareket) → Akkusativ: auf den Tisch."],
  mantik:"Türkçede de fiiller hâl seçer: birini *beklemek* (-i), bir şeye *sevinmek* (-e), bir şeyden *korkmak* (-den). Almanca aynı işi edatla yapar: *warten auf*, *sich freuen über*, *Angst haben vor*. Bu edat burada bir ek gibi çalışır, mekân anlamı solar; o yüzden Türkçe karşılıktan tahmin edemezsin, fiili edatıyla birlikte paket olarak öğrenirsin. Bir de kısa yol var: edat + şey yerine *da(r)+edat* (darauf = „onu/ona“), soru için *wo(r)+edat* (worauf = „neyi/neye“). *da* ve *wo* burada „o şey“ ve „hangi şey“ demek; bu yüzden insan için kullanılmaz: *auf ihn*, *auf wen?*.",
  adim:{tr:"Neyi dört gözle bekliyorsun?",s:[
    ["Paket: sich freuen auf + Akk. (gelecekteki bir şeye sevinmek)","sich freuen auf"],
    ["Bir şey soruluyor → wo + auf; auf ünlüyle başlıyor → araya r: worauf","Worauf"],
    ["Soru kelimesi 1. yerde, çekimli fiil 2. yerde","Worauf freust"],
    ["Özne, ardından dönüşlü zamir (du → dich)","Worauf freust du dich?"]
  ]},
  tr:[
    ["Otobüsü bekliyorum.","Ich warte auf den Bus.","Türkçe -i hâli (otobüsü) → Almanca edat + Akkusativ. Türkçede sadece ek var, Almancada araya *auf* girer. „Ich warte den Bus“ yanlış."],
    ["Tatile seviniyorum (tatili dört gözle bekliyorum).","Ich freue mich auf den Urlaub.","Türkçe -e hâli (tatile) seni Dativ'e çekebilir, ama edatlı fiilde *auf* ve *über* neredeyse hep Akkusativ: *auf den Urlaub*. Burada Türkçe yanıltır."],
    ["Köpeklerden korkuyorum.","Ich habe Angst vor Hunden.","Türkçe -den ↔ *vor* + Dativ (Hunden, çoğul Dativ -n). Korkulan şey insanın „önünde“ durur; imge Türkçeyle uyumlu."],
    ["Yarın bunun hakkında konuşuruz.","Wir sprechen morgen darüber.","Türkçe „bunun hakkında“ iki kelime; Almanca tek kelime: *darüber* = da (bu) + über (hakkında). Zamir edatla kaynaşıyor."]
  ],
  neden:[
    ["Neden *Worauf wartest du?* ama *Auf wen wartest du?*","*wo-* ve *da-* sadece şeylerin yerini tutar. İnsan bir „şey“ değil; onun için normal zamir kullanırsın: *Auf wen? – Auf ihn.* İnsan → zamir, şey → da-/wo-."],
    ["Neden *darauf*'ta r var ama *dafür*'da yok?","Edat ünlüyle başlıyorsa (auf, an, über, um) iki ünlü çarpışmasın diye r girer: *dar-auf, wor-an*. Ünsüzle başlıyorsa gerek yok: *dafür, womit, davon*."],
    ["Neden hem *sich freuen auf* hem *sich freuen über* var?","Edat zamanın yönünü gösterir. *auf* ileriye bakar: henüz gelmemiş tatile sevinirsin. *über* olmuş bir şeyin üstüne sevinirsin: *über das Geschenk*."]
  ],
  karis:[
    ["sich freuen auf","sich freuen über","Olay geldi mi? Henüz gelmediyse *auf* (Urlaub nächste Woche); geldiyse, aldıysan *über* (Geschenk, gute Nachricht)."],
    ["Worauf? – Darauf.","Auf wen? – Auf ihn.","Cevap bir şey mi, bir insan mı? Şey → wo-/da-; insan → edat + zamir."],
    ["Ich denke an den Termin.","Das Bild hängt an der Wand.","Edatlı fiilde *an* hâlini fiilden alır (denken an + Akk.), mekân sorusu sorulmaz. Mekânda ise Wo? → Dativ. Önce sor: bu bir yer mi, yoksa fiilin paketi mi?"]
  ],
  kanca:"*da* = „o şey“, *wo* = „hangi şey“: *darauf* onu, *worauf* neyi; ama insan şey değildir, ona kısaltma yok.",
  ileri:[
    {to:"g:g25",t:"İlgi cümlesinde edat zamirin önüne geçer: *der Termin, auf den ich warte*."},
    {to:"g:g38",t:"*wo(r)+edat* ilgi cümlesinde de çıkar: *Er hat angerufen, worüber ich mich sehr freue.*"}
  ]
};

GL.g13={
  hub:["sona"],
  kopru:[
    {to:"g:g3",t:"*dass* cümlesini biliyorsun: *Ich glaube, dass er kommt.* Dolaylı soru aynı kalıp: *dass*'ın yerine soru kelimesi ya da *ob* gelir, fiil yine sona: *Ich weiß nicht, ob er kommt.*"},
    {to:"ez:wfrage",t:"Soru kelimelerini zaten biliyorsun: *wann, wo, warum, wie viel*. Yeni kelime yok; aynı kelimeler bir yan cümlenin kapısı oluyor: *Weißt du, wann …?*"},
    {to:"g:g8",t:"*Könnten Sie mir sagen …?* kalıbını biliyorsun. Dolaylı soru kibarlığın ikinci katı: düz *Wo ist der Bahnhof?* yerine *Könnten Sie mir sagen, wo der Bahnhof ist?*"}
  ],
  hatirla:["*weil*'li yan cümlede çekimli fiil nereye gider? „Ich bleibe zu Hause, weil ich krank …“","En sona: *…, weil ich krank bin.*"],
  mantik:"Düz soruda fiil öne fırlar, çünkü cümlenin kendisi soru: *Wann beginnt das Training?* Dolaylı soruda ise asıl cümle başka (*Weißt du …?*); soru artık sadece bir bilgi paketi, „neyi biliyor musun?“ sorusunun cevabı, yani bir nesne. Nesne olan cümle Almancada yan cümle olur ve yan cümlenin tek kuralı var: çekimli fiil en sona. Soru kelimesi yoksa (evet/hayır sorusu) kapıyı tutacak birine ihtiyaç var: o da *ob*. Yani *ob*, soru kelimesi olmayan sorunun soru kelimesidir.",
  adim:{tr:"Antrenmanın ne zaman başladığını biliyor musun?",s:[
    ["Asıl soru „biliyor musun?“: fiil başta, virgül","Weißt du,"],
    ["Gömülen soru „ne zaman“ → wann, virgülden hemen sonra","Weißt du, wann"],
    ["Yan cümlenin öznesi","Weißt du, wann das Training"],
    ["Yan cümle: çekimli fiil en sona","Weißt du, wann das Training beginnt?"]
  ]},
  tr:[
    ["Antrenman ne zaman başlıyor? → Ne zaman başladığını biliyor musun?","Wann beginnt das Training? → Weißt du, wann das Training beginnt?","Türkçe de soruyu cümleye gömerken fiili değiştirir (başlıyor → başladığını), fiil yine sonda kalır. Almanca da gömünce fiili sona taşır. Burada Türkçe sezgin doğru çalışıyor."],
    ["Yarın vaktim olur mu, bilmiyorum.","Ich weiß nicht, ob ich morgen Zeit habe.","Türkçede „mu“ eki sorunun ortasında; Almancada onun yerini *ob* tutar ve yan cümlenin başına geçer. Sıra Türkçenin tersi: önce „bilmiyorum“, sonra soru."],
    ["Bizim de gelip gelmeyeceğimizi soruyor.","Er fragt, ob wir mitkommen.","Türkçe iki seçeneği açıkça sayar: „gelip gelmeyeceğimizi“. Almanca bunu tek kelimeyle söyler: *ob*. Ayrılan fiil de yan cümlede birleşir: *mitkommen*."]
  ],
  neden:[
    ["Fiil sonda ama cümlenin sonunda yine soru işareti var. Neden?","Çünkü bütün cümle hâlâ bir soru: *Weißt du …?* Soru işareti ana cümleye ait, fiilin sona gitmesi ise gömülü kısma. İkisi farklı katlarda çalışıyor."],
    ["Neden „Ich weiß nicht, wenn er kommt“ yanlış?","*wenn* koşul ya da zaman bildirir: „gelirse, geldiğinde“. Bilmediğin şey bir koşul değil, bir sorunun cevabı: „gelecek mi?“ Bu yüzden *ob*."],
    ["Neden kibar konuşmada dolaylı soru tercih edilir?","Düz soru karşıdakinden doğrudan cevap ister. *Können Sie mir sagen, wo …?* önce izin ister, soruyu bir ricaya sarar. g8'deki *Könnten Sie* ile birleşince en kibar hâline gelir."]
  ],
  karis:[
    ["ob","wenn","Türkçeye çevir: „mı / -ıp -mediğini“ → *ob*. „-se, -dığında“ → *wenn*. *Ich weiß nicht, ob es regnet* (yağıyor mu) ↔ *Wenn es regnet, bleibe ich zu Hause* (yağarsa)."],
    ["Weißt du, wo ist der Bahnhof?","Weißt du, wo der Bahnhof ist?","İlki çok sık yapılan hata: düz sorunun sırası korunmuş. Virgülden sonra yan cümle başladıysa fiil sona. Kontrol: soru kelimesinden hemen sonra özne mi geliyor? Öyleyse doğru yoldasın."],
    ["Er fragt, ob du kommst.","Er fragt, wann du kommst.","Cevap evet/hayır ise *ob*; bir bilgi ise (ne zaman, nerede, neden) soru kelimesi aynen kalır. Soru kelimesini asla *ob*'a çevirme."]
  ],
  kanca:"Yutulan soru fiili sona yollar; soru kelimesi yoksa kapıda *ob* bekler.",
  ileri:[
    {to:"g:g16",t:"İlgi cümlesi aynı kalıpta: kapıda *der/die/das*, fiil sona."},
    {to:"g:g24",t:"*bevor, während, bis*: yeni kapılar, aynı kural, fiil sona."}
  ]
};

GL.g14={
  hub:["konj","klammer"],
  kopru:[
    {to:"g:g8",t:"Bunu zaten biliyorsun: *Könnten Sie …? Würden Sie …? Ich hätte gern …* Kibarlık için kullandığın bu biçimler aslında gerçek dışı dünyanın kapısı. Şimdi aynı biçimlerle tavsiye verip hayal kuracaksın."},
    {to:"g:g2",t:"Präteritum'u biliyorsun: *konnte, hatte, war*. Konjunktiv II neredeyse aynı biçim, üstüne Umlaut: konnte → *könnte*, hatte → *hätte*, war → *wäre*. Geçmiş biçimi + iki nokta = hayal."},
    {to:"ez:modal",t:"*sollen* = „-meli (başkası istiyor)“: *Du sollst …* biraz emir gibi. Konjunktiv'deki *solltest* bunu yumuşatır, dostça bir tavsiye olur: *Du solltest mehr schlafen.*"}
  ],
  hatirla:["*können* ve *haben*'in Präteritum'u: ich …?","*ich konnte, ich hatte* (Umlaut yok)."],
  mantik:"Almanca gerçek olmayanı anlatmak için geçmiş biçimini ödünç alır ve üstüne Umlaut koyar: *hatte → hätte*, *war → wäre*, *wurde → würde*. Mantık şu: geçmiş zaten „şu anki gerçeklikten uzak“ demek; Umlaut da „üstelik bu sadece bir hayal“ damgası. Tavsiye de bir hayaldir: *An deiner Stelle würde ich …* = „senin yerinde olsam“ (ama değilim). Çoğu fiil için kısa yol *würde + mastar*; sein, haben ve modallar ise çok sık kullanıldıkları için kendi biçimlerini korur: *wäre, hätte, könnte, sollte*. *würde* + mastar da bir mengene kurar: *würde* 2. yerde, mastar en sonda.",
  adim:{tr:"Daha çok vaktim olsa her gün antrenman yapardım.",s:[
    ["„olsa“ = gerçek dışı koşul: wenn + fiil sona; haben → hätte","Wenn ich mehr Zeit hätte,"],
    ["Yan cümle başta → ana cümle fiille başlar; „yapardım“ = würde","Wenn ich mehr Zeit hätte, würde ich"],
    ["Zaman bilgisi ortaya","Wenn ich mehr Zeit hätte, würde ich jeden Tag"],
    ["Mastar en sona: mengene kapanır","Wenn ich mehr Zeit hätte, würde ich jeden Tag trainieren."]
  ]},
  tr:[
    ["Vaktim olsa giderdim.","Wenn ich Zeit hätte, würde ich gehen.","Türkçede iki ek iş görür: -sa (koşul) ve -ardı (sonuç). Almancada da iki parça var: *hätte* ve *würde … gehen*. Eşleme neredeyse birebir: -sa ↔ hätte/wäre, -ardı ↔ würde."],
    ["Daha çok su içmelisin.","Du solltest mehr Wasser trinken.","Türkçe „-meli“ hem zorunluluk hem tavsiye olabilir. Almanca ayırır: *Du musst* sert bir zorunluluk, *Du solltest* yumuşak bir tavsiye."],
    ["Senin yerinde olsam doktora giderdim.","An deiner Stelle würde ich zum Arzt gehen.","Kalıp Türkçeyle birebir: „senin yerinde“ = *an deiner Stelle*. Almancada bu ifade 1. yeri kaplar, *würde* hemen arkasından gelir."],
    ["Şu an deniz kenarında olmak isterdim.","Ich wäre jetzt gern am Meer.","Türkçe „olmak isterdim“ iki fiil; Almancada *wäre gern* yeter, istek anlamını *gern* taşır. „würde gern sein“ yerine *wäre gern*."]
  ],
  neden:[
    ["Neden *könnte* „yapabilirdi“ ama *konnte* „yapabildi“?","İki nokta „gerçek değil“ demek. *Ich konnte kommen* = gelebildim (oldu bitti). *Ich könnte kommen* = gelebilirim (henüz bir ihtimal). Umlaut gerçeği hayale çevirir."],
    ["Neden *sollte* hem Präteritum hem Konjunktiv II?","*sollen*'in kökünde Umlaut alacak bir ünlü yok (o → ö olmuyor), o yüzden iki biçim aynı kalmış. Bağlam belirler: *Du solltest mehr schlafen* geçmiş değil, tavsiye."],
    ["Neden „würde haben“ yerine *hätte*?","sein, haben ve modallar o kadar sık kullanılır ki kendi kısa biçimleri yerleşmiş: *hätte, wäre, könnte, müsste*. *würde* biçimi zor ya da eskimiş fiillerin imdadına yetişir: „ginge“ yerine *würde gehen*."]
  ],
  karis:[
    ["konnte / hatte / war / wurde","könnte / hätte / wäre / würde","Umlaut var mı? Yoksa geçmişte olmuş bir gerçek; varsa hayal, tavsiye ya da kibarlık. Yazarken iki noktayı unutursan anlam değişir."],
    ["Wenn ich Zeit habe, …","Wenn ich Zeit hätte, …","*habe* = gerçek bir ihtimal (vaktim olursa; olabilir). *hätte* = gerçek dışı (olsa; ama yok). Türkçe „-se“ ikisini de karşılar, Almanca ayırır."],
    ["Du musst …","Du solltest …","*musst* = başka seçenek yok (kural, zorunluluk). *solltest* = benim önerim, karar senin. Arkadaşa tavsiyede *solltest* daha doğal."]
  ],
  kanca:"İki nokta iki hayal balonu: *hatte* gerçek, *hätte* hayal; Umlaut'u gördüğün yerde „-sa, -ardı“ duy.",
  ileri:[
    {to:"g:g26",t:"Geçmişteki hayal ve pişmanlık: *Wenn ich mehr geschlafen hätte, …*, *Ich hätte trainieren sollen.*"},
    {to:"g:g39",t:"Gerçekleşmemiş dilek ve *als ob*: *Wenn ich doch mehr Zeit hätte!*"}
  ]
};

GL.g15={
  hub:["klammer"],
  kopru:[
    {to:"g:g1",t:"Partizip II'yi Perfekt'ten biliyorsun: *gemacht, geöffnet, gegessen*. Passiv'de aynı Partizip yine cümlenin sonuna gider; sadece öndeki yardımcı fiil değişir: *hat … gemacht* yerine *wird … gemacht*."},
    {to:"ez:unreg",t:"*werden*'i kök değiştiren fiiller tablosundan biliyorsun: *du wirst, er wird*. Passiv'in bütün motoru bu fiil; çekimini bildiğin için işin yarısı tamam."}
  ],
  hatirla:["*werden* nasıl çekimlenir: du …, er …, wir …?","*du wirst, er wird, wir werden*."],
  mantik:"Etken cümlede sahne yapana aittir: *Der Trainer öffnet das Studio.* Ama çoğu zaman kimin yaptığını bilmiyorsun ya da umursamıyorsun; önemli olan salonun açılması. Passiv yapanı sahneden çıkarır, işi ve nesneyi öne alır: *Das Studio wird geöffnet.* Etken cümlenin nesnesi (Akkusativ) burada özne olur (Nominativ). *werden* „bir hâle geçmek“ demek: salon „açılmış hâle geçiyor“. Yapı yine mengene: *wird* 2. yerde, Partizip en sonda, tıpkı Perfekt'teki gibi.",
  adim:{tr:"Spor salonu saat altıda açılıyor.",s:[
    ["Kimin açtığı önemli değil → Passiv; özne salon (Nominativ)","Das Fitnessstudio"],
    ["werden çekimli, 2. yerde (es → wird)","Das Fitnessstudio wird"],
    ["Zaman bilgisi ortaya","Das Fitnessstudio wird um sechs Uhr"],
    ["Partizip II en sona: öffnen → geöffnet","Das Fitnessstudio wird um sechs Uhr geöffnet."]
  ]},
  tr:[
    ["Salon açılıyor.","Das Studio wird geöffnet.","Türkçede edilgenlik bir ek: aç-ıl-ıyor. Almancada ayrı bir fiil: *wird … geöffnet*. Türkçe ek fiile yapışır; Almanca iki parçayı mengene gibi açar."],
    ["Burada Almanca konuşulur.","Hier wird Deutsch gesprochen.","Türkçe „konuşulur“ ile Präsens Passiv birebir örtüşür: kurallar, tabelalar, tarifler. Burada Türkçe sezgin doğru çalışıyor."],
    ["Pazar günü çalışılmaz.","Am Sonntag wird nicht gearbeitet.","Türkçe öznesiz edilgen kurabilir (çalışılmaz); Almanca da! Özne yoksa 1. yeri başka bir şey doldurur (Am Sonntag), *wird* yine 2. yerde."],
    ["Ev profesyoneller tarafından yenileniyor.","Das Haus wird von Profis renoviert.","„tarafından“ = *von* + Dativ. İki dilde de yapanı söylemek nadirdir; söylenecekse *von* yeter."]
  ],
  neden:[
    ["Etken cümledeki *den Salat* Passiv'de neden *der Salat* oluyor?","Çünkü artık cümlenin öznesi o. *Ich mache den Salat* → *Der Salat wird gemacht.* Türkçede de aynı: „salatayı yapıyorum“ → „salata yapılıyor“; -ı eki düşüyor."],
    ["Neden Passiv'de *werden* var da *sein* yok?","*werden* süreci anlatır: *Die Tür wird geschlossen* = kapı kapatılıyor (şu an biri kapatıyor). *Die Tür ist geschlossen* = kapı kapalı (sonuç, durum). Süreç werden, durum sein."],
    ["*werden* neden bu kadar çok iş yapıyor?","Aslında tek anlamı var: „bir hâle geçmek“. *Ich werde müde* = yoruluyorum. *Ich werde kochen* = pişireceğim (geleceğe geçiş). *Das Essen wird gekocht* = yemek pişiriliyor. İşi arkasındaki parça belirler: sıfat, mastar ya da Partizip."]
  ],
  karis:[
    ["Er wird kochen.","Das Essen wird gekocht.","Sona bak: mastar (*kochen*) ise gelecek, „pişirecek“. Partizip (*gekocht*) ise Passiv, „pişiriliyor“."],
    ["Das Studio wird geöffnet.","Das Studio ist geöffnet.","*wird* = süreç (açılıyor). *ist* = durum (açık). Kapıdaki tabelada „Geöffnet“ yazar: durum."],
    ["Man spricht hier Deutsch.","Hier wird Deutsch gesprochen.","Anlam aynı. *man* etken kalıp, konuşmada daha sık; Passiv daha resmî, yazıda daha sık. İkisini de tanı."]
  ],
  kanca:"*wird* öne, Partizip sona; ortada iş yapılıyor ama yapan görünmüyor: görünmez el.",
  ileri:[
    {to:"g:g31",t:"Passiv'in geçmişi ve modallı hâli: *wurde gebaut*, *ist abgesagt worden*, *muss abgegeben werden*."},
    {to:"g:g30",t:"Aynı *werden*, mastarla gelecek kurar: *Ich werde die Prüfung machen.*"}
  ]
};

GL.g16={
  hub:["sona","hal"],
  kopru:[
    {to:"ez:art",t:"Belirli artikel tablosunu biliyorsun: *der, die, das* / Akkusativ'de *den, die, das*. İlgi zamiri bu tablonun kopyası. Yeni bir şey ezberlemiyorsun, artikeli „ki“ gibi kullanıyorsun."},
    {to:"g:g13",t:"Dolaylı soruda kapıyı soru kelimesi tutuyordu, fiil sona gidiyordu. İlgi cümlesinde kapıyı *der/die/das* tutar, fiil yine sona: *der Trainer, der mir hilft*."}
  ],
  hatirla:["Eril belirli artikel Akkusativ'de ne olur? Diğerleri değişir mi?","*der → den*. Dişil, nötr ve çoğul değişmez."],
  mantik:"İlgi cümlesi bir ismi tarif eden küçük bir cümledir; Türkçedeki „-en, -dığı“ eklerinin işini görür. Almanca bunun için yeni kelime icat etmemiş, artikeli yeniden kullanmış: *der Trainer, der …*. Zamir iki soruya birden cevap verir: cins ve sayı öndeki isimden gelir (Trainer → d-), hâl ise yan cümledeki görevinden. Trainer yan cümlede işi yapan ise Nominativ *der*, işten etkilenen ise Akkusativ *den*. Ve bir yan cümle olduğu için fiil sona gider; burada Almanca Türkçeye yaklaşır.",
  adim:{tr:"Dün karşılaştığım iş arkadaşı nazik.",s:[
    ["Ana cümlenin öznesi: der Kollege","Der Kollege,"],
    ["Kollege eril → d-; yan cümlede „ben onunla karşılaştım“: nesne → Akkusativ: den","Der Kollege, den"],
    ["Yan cümle: özne, zaman, Partizip, çekimli fiil en sona; virgülle kapanır","Der Kollege, den ich gestern getroffen habe,"],
    ["Ana cümle sürer: isim + ilgi cümlesi tek blok, ist hemen arkasından","Der Kollege, den ich gestern getroffen habe, ist nett."]
  ]},
  tr:[
    ["okuduğum kitap","das Buch, das ich lese","Türkçede tarif isimden ÖNCE gelir (okuduğum → kitap), Almancada SONRA (Buch → das ich lese). Sıra ters; ama yan cümlenin sonunda fiil, tıpkı Türkçedeki gibi."],
    ["bana yardım eden antrenör","der Trainer, der mir hilft","Türkçe „-en“ = isim işi yapıyor, özne → Almanca Nominativ *der*."],
    ["dün gördüğüm antrenör","der Trainer, den ich gestern gesehen habe","Türkçe „-dığım“ = işi başkası yapıyor, isim çoğu zaman nesne → Akkusativ *den*. (Dativ fiillerinde başka; g25'te gelecek.)"],
    ["o kadar pahalı olmayan bir daire","eine Wohnung, die nicht so teuer ist","İsim *eine* ile gelse bile ilgi zamiri *die*: zamir hep der/die/das ailesinden gelir, ein ailesinden değil."]
  ],
  neden:[
    ["Neden sadece erilde *der → den* değişiyor?","Çünkü artikel tablosunda da Akkusativ'de sadece eril değişir. İlgi zamiri artikelin kopyası; tablo aynı, sürpriz yok."],
    ["Cinsiyet öndeki isimden, hâl yan cümleden geliyor. Neden iki ayrı yerden?","Zamir iki cümle arasında köprü: hangi isme işaret ettiğini ve o yan cümlede ne iş yaptığını aynı anda söylemek zorunda. *Der Mann, den ich kenne*: Mann eril → d-; ben onu tanıyorum → nesne → *den*."],
    ["Neden ana cümlede *ist* bu kadar geç geliyor: *Der Kollege, den ich gestern getroffen habe, ist nett*?","Çünkü ilgi cümlesi ismin parçası, bir sıfat gibi. „Dün karşılaştığım iş arkadaşı“ tek blok, 1. yeri birlikte kaplar. Fiil yine 2. yerde: o bloğun hemen arkasında."]
  ],
  karis:[
    ["der Trainer, der mich kennt","der Trainer, den ich kenne","Yan cümlede işi kim yapıyor? *der kennt* → antrenör tanıyor (beni tanıyan). *den ich kenne* → ben tanıyorum, antrenör nesne (tanıdığım). Zamirden hemen sonra başka bir özne (ich, du …) geliyorsa çoğu zaman *den*."],
    ["das Buch, das ich lese","Ich glaube, dass er kommt.","*das* (tek s) ilgi zamiri, öncesinde bir isim var. *dass* (çift s) bağlaç, bir fiilden sonra gelir (glauben, sagen, wissen). Virgülün önünde isim mi var, fiil mi?"]
  ],
  kanca:"İlgi zamiri artikelin gölgesidir: ismin ardından aynı kılıkta gelir, fiili de cümlenin sonuna iter.",
  ileri:[
    {to:"g:g25",t:"Dativ ve edatlı ilgi cümleleri: *die Kollegin, der ich geholfen habe*, *der Freund, mit dem ich trainiere*."},
    {to:"ez:relativ",t:"B1'de ilgi zamirinin tüm hâlleri tek tabloda (dessen, deren, denen dahil)."}
  ]
};

GL.g17={

    ["Kapıyı kilitlemeyi unutma!","Vergiss nicht, die Tür abzuschließen!","„-meyi“ de *zu*. Türkçede ek kelimenin sonunda; Almancada zu ayrılan fiilin içine girer: ab-zu-schließen."],
    ["Yemek yapmam lazım.","Ich muss kochen.","Türkçe yine „-mek“ kökünü kullanıyor ama Almancada modal fiil var → zu YOK. Türkçe sezgin burada yanıltır: her „-mek“ zu değildir."],
    ["Her gün pratik yapmak önemli.","Es ist wichtig, jeden Tag zu üben.","Türkçede „pratik yapmak“ özne ve başta; Almancada *Es* başı tutar, asıl özne (zu üben) sona kayar."]
  ],
  neden:[
    ["Neden „Ich muss zu kochen“ yanlış?","Modal ve mastar birlikte tek bir anlam taşır (müssen + kochen = pişirmek zorunda olmak), zaten bitişikler. zu iki AYRI fiili birbirine bağlayan köprüdür; modalda köprüye gerek yok. werden ve lassen için de aynısı."],
    ["Neden ayrılan fiilde zu ortaya giriyor?","Ayrılan ön ek fiilin çıkarılabilir parçası. Almanca her eki (ge-, zu) asıl köke yapıştırır, ön ek dışarıda kalır: auf + ge + standen, auf + zu + stehen. Aynı kural, aynı yer."],
    ["Ana cümlede özne var ama zu'lu kısımda yok. Neden?","Çünkü aynı kişi: *Ich versuche, (ich) früher aufzustehen*; ikinci ich gereksiz. Özne farklı olsaydı *dass* gerekirdi: *Ich hoffe, dass du kommst.*"]
  ],
  karis:[
    ["Ich muss mehr lernen.","Ich versuche, mehr zu lernen.","Önde modal (können, müssen, wollen, sollen, dürfen, möchten) var mı? Varsa zu yok. Başka fiil ya da kalıpsa (versuchen, anfangen, vergessen, Lust/Zeit haben, es ist wichtig) zu var."],
    ["aufzustehen","zu verstehen","Ön ek ayrılıyor mu? auf-, ein-, ab- ayrılır → zu araya, tek kelime. be-, ver-, er- ayrılmaz → zu önde, ayrı yazılır."]
  ],
  kanca:"Modaldan sonra zu yok, geri kalan herkes zu ile „-meye“ bağlar; ayrılan fiilde zu, ge'nin sandalyesine oturur.",
  ileri:[
    {to:"g:g28",t:"Amaç için *um … zu*: *Ich trainiere, um fit zu bleiben.*"},
    {to:"g:g35",t:"*ohne … zu* (-meden) ve *statt … zu* (-mek yerine): aynı zu ailesi."}
  ]
};

GL.g19={

    ["Saat sekizde eve geldi.","Er kam um acht Uhr nach Hause.","Türkçe „geldi“ konuşmada da yazıda da aynı. Almancada konuşurken *Er ist … gekommen*, yazarken *Er kam*. Türkçe tek biçim, Almanca iki."],
    ["Çocukken bir köpeğim vardı.","Als Kind hatte ich einen Hund.","Türkçe „vardı“ = *hatte*; Almancada „bir şeyim var“ haben ile kurulur. Bunu konuşmada da Präteritum'la söylersin."],
    ["Toplantı iki saat sürdü.","Die Besprechung dauerte zwei Stunden.","Düzenli fiil: kök + te: dauer-te. Türkçe -dı ↔ Almanca -te: iki dilde de geçmiş bir t/d sesiyle işaretleniyor."]

  neden:[

    ["Neden *arbeitete*'de iki tane te var?","Kök zaten *arbeit-* (t ile bitiyor). Doğrudan -te eklersen *arbeitte* olur, söylenmez. Araya e girer: *arbeit-e-te*. Präsens'teki *du arbeitest* ile aynı kural."],
    ["Konuşmada *ich ging* pek duyulmaz ama *ich war* hep duyulur. Neden?","Perfekt'te *ich bin gewesen, ich habe gehabt* uzun ve hantal; *war, hatte* kısa. Konuşma kısa olanı seçmiş. *gehen*'de ise *bin gegangen* yerleşmiş, *ging* yazıya kalmış."]

  karis:[
    ["Ich bin gestern ins Kino gegangen.","Gestern ging ich ins Kino.","Aynı anlam, farklı ortam: konuşuyorsan Perfekt, yazıyorsan (hikâye, e-posta, rapor) Präteritum. sein, haben ve modallarda ikisinde de Präteritum."],
    ["Ich machte …","Ich habe … gemacht.","-te tek başına yeter: *machte* tam bir geçmiş. ge-…-t (Partizip) ise tek başına durmaz, yardımcı fiil ister. „Ich gemacht“ diye bir şey yok."],
    ["wurde","würde","*wurde* = oldu (Präteritum). *würde* = olurdu (Konjunktiv II). Umlaut hayal işaretidir (g14)."]

GL.g20={
  hub:["hal"],
  kopru:[
    {to:"ez:wo",t:"Bunu zaten biliyorsun: *zu Hause · nach Hause · von zu Hause* ve *beim Arzt · zum Arzt · vom Arzt*. Bu konu o tabloyu bir sisteme çeviriyor: her yer türünün kendi nerede/nereye/nereden üçlüsü var."},

    {to:"g:g4",t:"İki hâlli edatlarda yönü hâl gösteriyordu: *ins Kino* (Akk.) / *im Kino* (Dat.). zu, bei, von'da ise yönü edatın kendisi gösterir, hâl hep Dativ: *zum Arzt* (nereye) / *beim Arzt* (nerede)."}
  ],
  hatirla:["*aus, bei, mit, nach, seit, von, zu* hangi hâli alır?","Hep Dativ."],
  mantik:"Türkçede yer için üç ek var: -e (nereye), -de (nerede), -den (nereden). Almanca bu üç yönü edatla söyler, ama hangi edatı seçeceğin yerin TÜRÜNE bağlı. İnsan ve kurum için üçlü: *zu → bei → von* (doktora, doktorda, doktordan). Şehir ve artikelsiz ülke için: *nach → in → aus*. Bina ve kapalı mekân için: *in + Akk. → in + Dat. → aus*. Önce sor: bir insan mı, bir şehir mi, bir bina mı? Sonra Türkçe ekine bak: -e, -de, -den. İki soru, doğru edat.",
  adim:{tr:"Bugün işten sonra annemin yanına gidiyorum.",s:[

    ["Hâlâ annesiyle babasının yanında oturuyor.","Sie wohnt noch bei ihren Eltern.","Türkçe „yanında“ iki kelime, Almanca tek kelime: *bei*. *neben* değil: neben fiziksel olarak yan yana demek; *bei* onların evinde, onlarla birlikte."],
    ["Berlin'e / Berlin'de / Berlin'den","nach Berlin / in Berlin / aus Berlin","Türkçe „-e“ hep aynı ek; Almanca insana *zu*, şehre *nach*, binaya *in* der. Türkçe ek burada sana edatı söylemez, yerin türü söyler."],
    ["eve / evde","nach Hause / zu Hause","Türkçe kafayı en çok burada karıştırır: *zu* normalde „-e“ iken *zu Hause* „evde“ demek. Ev bir istisna; üçlüyü kalıp olarak al: zu Hause · nach Hause · von zu Hause."]
  ],
  neden:[
    ["Neden Berlin'e *nach* ama doktora *zu*?","*nach* aslında *nah* (yakın) ile akraba: haritada bir noktaya doğru yönelmek (Berlin'e, Türkiye'ye … ve eve). *zu* ise bir kişiye ya da bir işleve gitmek: doktora, işe, antrenmana. Harita noktası → nach; insan ya da kurum → zu."],
    ["Neden *nach Deutschland* ama *in die Türkei*?","Ülkelerin çoğu artikelsizdir (Deutschland, Österreich) → nach. Artikelli ülkeler (die Türkei, die Schweiz, die USA) artikelini taşıdığı için iki hâlli *in* kullanır: *in die Türkei* (nereye, Akk.), *in der Türkei* (nerede, Dat.)."],
    ["Neden süpermarketten *aus* ama antrenmandan *von*?","*aus* „içinden dışarı“: binadan, odadan, ülkeden çıkarsın. *von* „bir kişiden, bir olaydan, bir noktadan“: antrenman bir bina değil, bir etkinlik. Binaysa *aus dem Fitnessstudio*, etkinlikse *vom Training*."]
  ],
  karis:[
    ["zu Hause","nach Hause","„evde“ mi „eve“ mi? Durum → *zu Hause*; hareket → *nach Hause*. Hafıza: *nach* = yola çıktın."],
    ["beim Arzt","neben dem Arzt","*beim Arzt* = doktorda, muayenehanede. *neben dem Arzt* = doktorun hemen yanı başında (fiziksel). Türkçe „yanında“ ikisini de karşılar, Almanca ayırır."],
    ["Ich komme aus der Türkei.","Ich komme vom Arzt.","İçinden mi çıkıyorsun (bina, ülke, memleket) → *aus*. Bir kişiden, bir olaydan ya da bir noktadan → *von*. Memleket hep *aus*."]
  ],
  kanca:"Üç üçlü: insan *zu – bei – von*, şehir *nach – in – aus*, bina *in – in – aus*; hepsinin sorusu Türkçedeki gibi -e, -de, -den.",
  ileri:[
    {to:"g:g25",t:"Bu edatlar ilgi cümlesinde zamirin önüne geçer: *die Firma, bei der ich arbeite*."},
    {to:"ez:vprep",t:"Aynı edatlar fiillere bağlanınca yer anlamını kaybeder: *träumen von*, *gehören zu*, *teilnehmen an*."}
  ]
};
GL.g21={
  hub:["bag","sona"],
  kopru:[
    {to:"g:g3",t:"Bunu zaten biliyorsun: *weil* bir yan cümle açar ve fiili sona yollar: *…, weil ich müde bin.* *obwohl* tam olarak aynı yere oturur ve aynı şeyi yapar: *…, obwohl ich müde bin.* Kelime sırası hiç değişmiyor, sadece anlam tersine dönüyor."},
    {to:"g:g18",t:"*deshalb* ikinci cümlenin 1. yerini kaplıyordu, fiil hemen arkasından geliyordu: *…, deshalb gehe ich ins Bett.* *trotzdem* de aynı koltuğa oturur: *…, trotzdem gehe ich ins Fitnessstudio.* deshalb'ın zıt anlamlı ikizi."},
    {to:"ez:konn",t:"Bağlaç tablosundaki üç aileyi hatırla: *aber* (ADUSO, hiçbir şeyi oynatmaz), *deshalb*-ailesi (fiil hemen arkada), *weil*-ailesi (fiil sona). trotzdem ikinci aileye, obwohl üçüncü aileye katılıyor."}
  ],
  hatirla:["*Ich bin müde.* ve *Ich gehe ins Bett.* cümlelerini deshalb ile birleştir.","*Ich bin müde, deshalb gehe ich ins Bett.*"],
  mantik:"Normalde bir sebep beklenen sonucu doğurur: yorgunum, o yüzden yatıyorum (weil / deshalb). obwohl ve trotzdem ise beklentinin kırıldığını söyler: yorgunum, ama yine de antrenmana gidiyorum. Güzel haber şu: sen burada yeni bir kelime sırası öğrenmiyorsun. obwohl, weil'in sandalyesine oturur ve fiili sona yollar; trotzdem, deshalb'ın sandalyesine oturur ve fiili hemen arkasına çeker. Yani aynı karşıtlığı üç farklı yapıyla söyleyebilirsin: *aber* (sıra değişmez), *trotzdem* (fiil hemen arkada), *obwohl* (fiil sonda). Hangi bağlacı seçersen seç, önce hangi aileden olduğunu düşün; kelime sırası kendiliğinden gelir.",
  adim:{tr:"Kas ağrım olmasına rağmen spora gidiyorum.",s:[
    ["„-mesine rağmen“ bir cümleyi bağlıyor → obwohl. Türkçedeki gibi bu kısmı başa al.","Obwohl"],
    ["Yan cümle: özne, nesne, çekimli fiil en sona. Türkçedeki „olmasına“ gibi fiil sonda.","Obwohl ich Muskelkater habe,"],
    ["Yan cümle ana cümlenin 1. yerini kapladı → ana cümle çekimli fiille başlar: fiil, virgül, fiil.","Obwohl ich Muskelkater habe, gehe"],
    ["Sonra özne ve yer bilgisi.","Obwohl ich Muskelkater habe, gehe ich ins Fitnessstudio."]
  ]},
  tr:[
    ["Yorgun olmama rağmen antrenman yapıyorum.","Obwohl ich müde bin, trainiere ich.","Türkçe yardım ediyor: „olmama rağmen“ da, obwohl'lu yan cümle de fiille biter. Yan cümlenin içi neredeyse Türkçe sırasıyla aynı."],
    ["Yorgunum, yine de antrenman yapıyorum.","Ich bin müde, trotzdem trainiere ich.","Türkçe yanıltıyor: „yine de ben…“ diye özneyle devam etmek doğal gelir. Almancada trotzdem 1. yeri doldurur, 2. yer fiilindir: trotzdem *trainiere* ich."],
    ["Yorgunum ama antrenman yapıyorum.","Ich bin müde, aber ich trainiere.","aber ADUSO ailesinden: hiçbir şeyi yerinden oynatmaz. Aynı anlamı en az riskle söylemenin yolu; konuşurken takılırsan buna sığın."]
  ],
  neden:[
    ["İkisi de „rağmen“ anlamında. Neden obwohl fiili sona yolluyor da trotzdem yollamıyor?","Çünkü görevleri farklı. obwohl bir cümleyi başka bir cümlenin parçası yapar; „olmasına rağmen“ gibi o cümle tek başına duramaz. trotzdem ise bir zarftır: önceki cümleye geri bakıp „ona rağmen“ der, kendi cümlesi bağımsız kalır. Bağımsız cümle = fiil 2. yerde."],
    ["trotzdem kelimesinin içinde ne saklı?","*trotz* + *dem* = „ona rağmen“. *dem* önceki cümlenin tamamını gösterir: Es regnet. Trotz *dem* (yani yağmura rağmen) laufe ich. deshalb'ın içinde de *des* saklı: „onun yüzünden“. İkisi de geriye işaret eden küçük bir zamir taşıyor."],
    ["obwohl'lu cümle başa gelince ana cümle neden fiille başlıyor?","Çünkü yan cümlenin tamamı ana cümlenin 1. yeri sayılıyor. Fiil 2. yerden vazgeçmez, o yüzden virgülden hemen sonra gelir: *Obwohl es regnet, | laufe | ich.* weil ve wenn'de gördüğün „fiil, virgül, fiil“ kuralının aynısı."]
  ],
  karis:[
    ["Ich bin müde, trotzdem ich trainiere.","Ich bin müde, trotzdem trainiere ich.","Türk kulağı trotzdem'den sonra özne bekler. Ama trotzdem 1. yer, 2. yer her zaman fiilin. deshalb'da yaptığın hatanın aynısı."],
    ["obwohl (+ cümle)","trotz (+ isim)","Arkasında fiili olan bir cümle varsa obwohl: *obwohl es regnet*. Sadece bir isim varsa trotz: *trotz des Regens*. „obwohl des Regens“ olmaz."],
    ["obwohl","weil","Sonuç beklenen mi? weil: *Ich bleibe zu Hause, weil es regnet.* Beklentiye ters mi? obwohl: *Ich laufe, obwohl es regnet.* Yapı aynı, anlam zıt."]
  ],
  kanca:"weil ↔ obwohl, deshalb ↔ trotzdem: aynı sandalyeler, zıt anlamlar.",
  ileri:[
    {to:"g:g27",t:"İsimle „rağmen“: *trotz des Regens*. trotzdem'in içindeki trotz orada tek başına edat olur ve Genitiv ister."},
    {to:"g:g29",t:"*zwar … aber* (gerçi … ama) aynı beklenti kırılmasını iki parçayla söyler: *Ich bin zwar müde, aber ich trainiere.*"}
  ]
};

GL.g22={
  hub:["sona","zaman"],
  kopru:[
    {to:"g:g3",t:"Bunu zaten biliyorsun: *Wenn es regnet, laufe ich auf dem Laufband.* wenn bir yan cümle açar, fiil sona gider, yan cümle başta ise ana cümle fiille başlar. *als* da birebir aynı yapıyla çalışır; sadece kullanıldığı zaman farklı."},
    {to:"g:g19",t:"Geçmişi yazıda ve hikâyede Präteritum ile anlatıyordun: *war, hatte, kam, ging*. als'lı cümleler tam olarak bu dünyaya aittir: *Als ich ein Kind war, …* / *Als ich in Berlin ankam, …*"},
    {to:"g:g13",t:"Dolaylı soruda *wann* kullandın: *Weißt du, wann der Zug kommt?* wann bir soru kelimesi („ne zaman?“), als ve wenn ise iki olayı birbirine bağlar. Bu ayrımı şimdiden aklında tut."}
  ],
  hatirla:["„Yağmur yağarsa koşu bandında koşarım.“ Almancası?","*Wenn es regnet, laufe ich auf dem Laufband.*"],
  mantik:"Türkçe tek bir ekle yetiniyor: „-dığında“. Almanca ise sana bir soru soruyor: bu olay geçmişte bir kez mi oldu? Bir kerelik bir an ya da tek bir dönemse *als* (Als ich ankam… / Als ich Kind war…). Diğer her şey *wenn*: şimdi, gelecek ve geçmişte defalarca tekrarlanan olaylar. Mantığı şu: wenn aslında bir kural söyler, „ne zaman X olursa Y olur“; kurallar tekrar eder, bu yüzden alışkanlıklar ve koşullar wenn alır. als ise kural değil, bir anıdır: albümdeki tek bir fotoğraf. İkisi de yan cümle kurar, fiil sona gider; bunu weil ve dass'tan zaten biliyorsun.",
  adim:{tr:"Berlin'e vardığımda yağmur yağıyordu.",s:[
    ["Geçmişte bir kerelik bir an → als. Türkçedeki gibi bu kısmı başa al.","Als"],
    ["Yan cümle: özne, yer, çekimli fiil sona. Ayrılan fiil yan cümlede birleşir: kam an → ankam.","Als ich in Berlin ankam,"],
    ["Yan cümle 1. yeri kapladı → ana cümle çekimli fiille başlar. Hikâye anlatıyorsun → Präteritum.","Als ich in Berlin ankam, regnete"],
    ["Özne en sona: es.","Als ich in Berlin ankam, regnete es."]
  ]},
  tr:[
    ["Çocukken çok futbol oynardım.","Als ich ein Kind war, habe ich viel Fußball gespielt.","Türkçe „-ken“ ya da „-dığında“ der, tekrar mı tek dönem mi ayırmaz. Almanca ayırır: çocukluk tek bir dönem → als."],
    ["Eve her geldiğimde yemek hazır olurdu.","Wenn ich nach Hause kam, war das Essen immer schon fertig.","Türkçe burada yardım ediyor: „her … -dığında“, „ne zaman … -sa“ duyduğun yerde wenn kullan. „her“ kelimesi wenn'in işaretidir."],
    ["Vaktim olduğunda / olursa kitap okurum.","Wenn ich Zeit habe, lese ich ein Buch.","Türkçede „-dığında“ ile „-se“ ayrı; Almancada ikisi de wenn. Şimdi ve gelecekte als hiç kullanılmaz."],
    ["Kursun ne zaman başladığını bilmiyorum.","Ich weiß nicht, wann der Kurs beginnt.","„ne zaman?“ sorusu → wann. Türkçede „ne zaman“ ile „-dığında“ zaten farklı; Almancada da wann ile als/wenn'i karıştırma."]
  ],
  neden:[
    ["Neden Almanca tek bir „-dığında“ yerine iki kelime kullanıyor?","Çünkü wenn aslında bir kural bildirir: „ne zaman X olursa, Y olur“. Kural tekrar eder; bu yüzden şimdi, gelecek ve geçmişteki alışkanlıklar wenn alır. als kural değil, geçmişte bir kez yaşanmış tek bir sahnedir."],
    ["Berlin'de bir hafta kaldım. Bir hafta uzun; yine de als mı?","Evet. Süre uzun olsa da tek bir dönemse als: *Als ich in Berlin war, …*, *Als ich Student war, …* Önemli olan süre değil sayı: bir kere mi, defalarca mı?"],
    ["„Yarın vardığımda seni arayacağım.“ Tek bir olay; neden als değil?","Çünkü als sadece geçmiş içindir. Gelecekte tek bir olay bile olsa wenn: *Wenn ich morgen ankomme, rufe ich dich an.* als'ın iki şartı var: geçmiş ve tek sefer. Biri eksikse wenn."]
  ],
  karis:[
    ["als","wenn","Kendine iki soru sor: geçmiş mi? Tek sefer mi? İkisine de evet → als. Birine bile hayır → wenn."],
    ["wenn","wann","wann bir soru kelimesidir, „ne zaman?“ diye sorar; cevabı bir zamandır. wenn bir olayı başka bir olaya bağlar. Türkçeye „ne zaman“ diye çevirebiliyorsan wann."],
    ["als (zaman)","als (karşılaştırma)","*Er ist größer als ich* (g7): karşılaştırma als'ı yan cümle açmaz, fiili sona yollamaz. Zaman als'ı hep bir cümle başlatır ve fiil sonda biter."]
  ],
  kanca:"*Als* ile „Anı“ aynı harfle başlar: geçmişte bir kez yaşanmış tek bir anı; geri kalan her şey wenn.",
  ileri:[
    {to:"g:g23",t:"als çok sık Plusquamperfekt ile gelir: *Als ich ankam, war der Zug schon abgefahren.* (Vardığımda tren çoktan kalkmıştı.)"},
    {to:"g:g26",t:"wenn gerçek dışı geçmişte de karşına çıkacak: *Wenn du angerufen hättest, wäre ich gekommen.* Bu wenn zaman değil, koşul bildirir."}
  ]
};

GL.g23={

  kopru:[
    {to:"g:g1",t:"Bunu zaten biliyorsun: Perfekt = haben/sein + Partizip II. *Ich habe gegessen. Ich bin gegangen.* Plusquamperfekt aynı kalıp; sadece yardımcı fiil bir adım geçmişe gider: *Ich hatte gegessen. Ich war gegangen.*"},
    {to:"ez:praet",t:"*hatte* ve *war* biçimlerini Präteritum tablosundan tanıyorsun. Plusquamperfekt'te yeni bir çekim yok: bu iki tanıdık kelime + Partizip II."},
    {to:"g:g22",t:"als ile geçmişte bir an kurdun: *Als ich ankam, …* O andan daha önce olan şeyi anlatmak için Plusquamperfekt lazım: *…, war der Zug schon abgefahren.*"}
  ],
  hatirla:["haben ve sein'ın Präteritum'u (ich)?","*ich hatte*, *ich war*"],
  mantik:"Zaman çizgisini gözünün önüne getir. Geçmişte bir an var: vardım, aradım, gittim. O andan da ÖNCE olan bir şeyi anlatmak istiyorsan bir basamak daha geriye inmen gerekir. Almanca bunu çok ekonomik yapar: Perfekt'i alır, yardımcı fiilini geçmişe çeker. *habe gegessen* (yedim) → *hatte gegessen* (yemiştim). Türkçe de aynısını yapıyor: „yemiş“ + „-ti“ = „yemişti“. Mengene yine aynı: hatte/war 2. yerde, Partizip en sonda; haben mi sein mi seçimi de Perfekt'teki gibi. *nachdem* iki olayı sıraya koyar ve hep önce olanı taşır; bu yüzden nachdem'li cümle bir basamak geride, Plusquamperfekt'tedir.",
  adim:{tr:"Antrenman yaptıktan sonra duş aldım.",s:[
    ["„-dıktan sonra“ + bir eylem → nachdem. Önce olan olay (antrenman) bu yan cümleye girer.","Nachdem ich trainiert"],
    ["Önce olan olay bir basamak daha geride: haben → hatte. Yan cümlede çekimli fiil en sona.","Nachdem ich trainiert hatte,"],
    ["Yan cümle 1. yeri kapladı → ana cümle çekimli fiille başlar. Sonraki olay normal geçmiş (Perfekt): habe.","Nachdem ich trainiert hatte, habe ich"],
    ["Partizip en sona: mengene kapanır.","Nachdem ich trainiert hatte, habe ich geduscht."]
  ]},
  tr:[
    ["Anahtarı unutmuştum.","Ich hatte den Schlüssel vergessen.","Türkçe birebir yardım ediyor: unut-muş-tu. „-mış“ Partizip'e (vergessen), „-tı“ hatte'ye denk geliyor."],
    ["Vardığımda tren çoktan kalkmıştı.","Als ich ankam, war der Zug schon abgefahren.","„çoktan“ = schon. Türkçede de iki geçmiş katmanı var: „vardım“ ve ondan önce „kalkmıştı“. abfahren hareket → sein → war."],
    ["Yemek yedikten sonra yürüyüşe çıktılar.","Nachdem sie gegessen hatten, gingen sie spazieren.","Türkçe yanıltıyor: „yedikten sonra“ hiçbir zaman eki taşımaz. Almancada nachdem'li cümle zamanı açıkça söylemek zorunda: gegessen *hatten*."],
    ["Daha önce hiç suşi yememiştik.","Wir hatten vorher noch nie Sushi gegessen.","„hiç … -memiştik“ = noch nie … hatten … gegessen. Olumsuzluk ortada durur, Partizip yine en sonda."]
  ],
  neden:[
    ["nachdem'li cümlede neden düz Perfekt yetmiyor?","Çünkü Almanca olayların sırasını zamanla da gösterir: nachdem'li cümle hep bir basamak geride durur. Ana cümle geçmişteyse (gingen) yan cümle geçmişin geçmişine iner (gegessen hatten). Ana cümle şimdiki zamandaysa yan cümle Perfekt'e iner: *Nachdem ich gegessen habe, gehe ich spazieren.* Kural: hep bir basamak geri."],
    ["hatte mi war mı? Bunun için yeni bir kural var mı?","Yok. Perfekt'te hangisini alıyorsa onu alır, sadece geçmiş biçimiyle: *ich bin gegangen* → *ich war gegangen*; *ich habe gegessen* → *ich hatte gegessen*. Hareket ve durum değişimi yine sein."],
    ["„-dikten sonra“ için bu kadar zahmet var da „-meden önce“ (bevor) için neden yok?","Çünkü bevor'lu olay zaten sonra oluyor: *Bevor ich dusche, trainiere ich.* Önce olan olay ana cümlede, normal zamanla söylenir. Geçmişin geçmişine sadece önce olan olayı ayrıca işaretlemen gerektiğinde inersin."]
  ],
  karis:[
    ["nachdem (+ cümle)","nach (+ isim) / danach (tek başına)","*nach dem Training* = edat, arkasında isim. *Danach habe ich geduscht.* = zarf, fiil hemen arkasında. *nachdem ich trainiert hatte* = bağlaç, fiil sonda."],
    ["ich hatte gemacht","ich habe gemacht","İki geçmiş olaydan önce olanı mı anlatıyorsun? hatte. Tek bir geçmiş olayı mı anlatıyorsun? habe. Tek başına anlatılan olayda Plusquamperfekt yabancı durur."],
    ["ich hatte gemacht","ich hätte gemacht","İki noktaya dikkat: hatte = yapmıştım (gerçekten oldu). hätte = yapardım (olmadı, hayal). Umlaut gerçek dışılığın işaretidir."]
  ],
  kanca:"Plusquamperfekt = Perfekt'in bir basamak geri itilmiş hâli: habe → hatte, bin → war; tıpkı Türkçede „yemiş“e „-ti“ eklemek gibi.",
  ileri:[
    {to:"g:g26",t:"Aynı iskelete iki nokta koyunca hayal olur: *ich hatte gemacht* (yapmıştım) → *ich hätte gemacht* (yapardım)."},
    {to:"g:g24",t:"bevor, nachdem'in aynası: *Bevor ich dusche, trainiere ich.* Önce/sonra sırası bu kez ters taraftan kurulur."}
  ]
};
