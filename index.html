g16:["Das ist der Mann, ___ neben mir wohnt.|der|den|die|*der Mann* eril; yan cümlede öznedir (kim oturuyor?) → Nominativ *der*.|welcher|*den* olmaz: *den* Akkusativ'dir; burada ilgi zamiri *wohnt* fiilinin öznesi → *der*.|*die* olmaz: *die* dişil ya da çoğul içindir; *der Mann* eril.","Das ist der Film, ___ ich gestern gesehen habe.|den|der|das|*der Film* eril; yan cümlede özne *ich*, film nesnedir (neyi gördüm?) → Akkusativ *den*.|welchen|*der* olmaz: özne *ich*; film görülen nesnedir → eril Akkusativ *den*.|*das* olmaz: *das* nötr içindir; *der Film* eril.","Die Frau, ___ dort steht, ist meine Chefin.|die|der|den|*die Frau* dişil; yan cümlede özne → *die* (dişilde Nominativ ve Akkusativ aynı).|welche|*der* olmaz: *der* eril Nominativ'dir; *die Frau* dişil → *die*.|*den* olmaz: *den* eril Akkusativ'dir; *die Frau* dişil ve özne → *die*.","Das Buch, ___ ich lese, ist spannend.|das|den|der|*das Buch* nötr; yan cümlede nesne (neyi okuyorum?) → *das* (nötrde Nominativ = Akkusativ).|welches|*den* olmaz: *den* sadece eril Akkusativ'dir; *das Buch* nötr → *das*.|*der* olmaz: *der* eril içindir; *das Buch* nötr → *das*.","Die Leute, ___ hier arbeiten, sind nett.|die|der|denen|*die Leute* çoğul; yan cümlede özne → çoğul *die*, fiil de çoğul: *arbeiten*.|welche|*der* olmaz: *der* eril tekil içindir; *die Leute* çoğul → *die*.|*denen* olmaz: *denen* çoğul Dativ'dir; burada özne (Nominativ) gerekir → *die*.","Ich suche eine Wohnung, die nicht so teuer ___.|ist|sein|ist sie|İlgi cümlesi bir yan cümledir: çekimli fiil en sona gider → *die nicht so teuer ist*.||*sein* olmaz: fiil özneye göre çekimlenmeli; *die* (= die Wohnung) tekil → *ist*.|*ist sie* olmaz: özne zaten *die*; *sie* fazladan özne olur.","Der Kollege, den ich gestern ___, ist neu. (treffen, Perfekt)|getroffen habe|habe getroffen|getroffen|Yan cümlede Perfekt: önce Partizip, çekimli yardımcı fiil en sonda → *den ich gestern getroffen habe*.||*habe getroffen* olmaz: bu ana cümle sırası; yan cümlede çekimli *habe* en sona gider.|*getroffen* olmaz: Perfekt yardımcı fiilsiz kurulmaz; *habe* eksik.","Kennst du das Café, ___ am Markt liegt?|das|der|den|*das Café* nötr; yan cümlede özne (ne bulunuyor?) → *das*.|welches|*der* olmaz: *der* eril içindir; *das Café* nötr → *das*.|*den* olmaz: *den* eril Akkusativ'dir; *das Café* nötr ve özne → *das*."],
g17:["Ich habe keine Lust, heute ___. (kochen)|zu kochen|kochen|gekocht|*Lust haben* kalıbından sonra ikinci eylem *zu* + mastarla gelir ve cümlenin sonuna gider: *heute zu kochen*.||*kochen* olmaz: *Lust haben*'dan sonra mastarın önüne *zu* gelmeli.|*gekocht* olmaz: bu Partizip II; burada *zu* + mastar gerekir.","Es ist wichtig, jeden Tag ___ üben.|zu|um|für|*Es ist wichtig, …* kalıbından sonra mastar *zu* ile gelir: *jeden Tag zu üben*.||*um* olmaz: *um … zu* amaç bildirir ve yine *zu* ister; burada yalnız *zu* gelir.|*für* olmaz: *für* bir edattır, mastarın önünde kullanılmaz.","Vergiss nicht, die Tür ___! (abschließen)|abzuschließen|zu abschließen|abschließen|*vergessen*'den sonra *zu* + mastar gelir; ayrılabilen fiilde *zu* ön ek ile kökün arasına girer: *ab-zu-schließen*.||*zu abschließen* olmaz: ayrılabilen fiilde *zu* başa değil, araya girer: *abzuschließen*.|*abschließen* olmaz: *vergessen*'den sonra mastar *zu* ile gelir.","Ich muss heute ___. (arbeiten)|arbeiten|zu arbeiten|gearbeitet|Modal fiillerden (*müssen, können, wollen* …) sonra yalın mastar gelir, *zu* kullanılmaz: *Ich muss arbeiten*.||*zu arbeiten* olmaz: *müssen* gibi modal fiillerden sonra *zu* gelmez.|*gearbeitet* olmaz: bu Partizip II; modal fiilden sonra yalın mastar gerekir.","Ich versuche, früher ___. (aufstehen)|aufzustehen|zu aufstehen|aufstehen|*versuchen*'den sonra *zu* + mastar gelir; ayrılabilen *aufstehen*'de *zu* araya girer: *auf-zu-stehen*.||*zu aufstehen* olmaz: *zu* başa değil, ön ek ile kökün arasına girer: *aufzustehen*.|*aufstehen* olmaz: *versuchen*'den sonra mastar *zu* ile gelir.","Hast du Zeit, mir ___ helfen?|zu|um|für|*Zeit haben* kalıbından sonra mastar *zu* ile gelir: *Zeit, mir zu helfen*.||*um* olmaz: *um … zu* amaç bildirir ve yine *zu* ister; burada yalnız *zu* gelir.|*für* olmaz: *für* bir edattır, mastarın önünde kullanılmaz.","Er hat angefangen, Deutsch ___. (lernen)|zu lernen|lernen|gelernt|*anfangen*'dan sonra ikinci eylem *zu* + mastarla gelir ve sona gider: *Deutsch zu lernen*.||*lernen* olmaz: *anfangen*'dan sonra mastarın önüne *zu* gelmeli.|*gelernt* olmaz: Perfekt'i *hat angefangen* kuruyor; ikinci eylem *zu* + mastar olur.","Ich möchte nächstes Jahr nach Berlin ___. (ziehen)|ziehen|zu ziehen|gezogen|*möchten* modal fiil gibi davranır: arkasından yalın mastar gelir, *zu* kullanılmaz: *möchte … ziehen*.|umziehen|*zu ziehen* olmaz: *möchten*'den sonra *zu* gelmez.|*gezogen* olmaz: bu Partizip II; *möchten*'den sonra yalın mastar gerekir."],
g18:["Ich bin müde, deshalb ___ ins Bett. (gehen)|gehe ich|ich gehe|ich gehen|*deshalb* ikinci cümlenin 1. yerinde durur; çekimli fiil hemen arkasından, özne fiilden sonra gelir: *deshalb gehe ich*.||*ich gehe* olmaz: *deshalb*'dan sonra önce fiil, sonra özne gelir.|*ich gehen* olmaz: sıra yanlış; üstelik *ich* ile fiil *gehe* olmalı.","Es regnet, ___ bleiben wir zu Hause.|deswegen|weil|obwohl|Sonuç bildiren *deswegen* 1. yerde durur, çekimli fiil hemen arkasından gelir: *deswegen bleiben wir*.|deshalb/darum/daher/also|*weil* olmaz: *weil* sebep bildirir ve fiili sona yollar; burada fiil hemen geliyor.|*obwohl* olmaz: 'rağmen' anlamındadır ve fiili sona yollar; burada sonuç gerekir.","Ich habe Hunger, darum ___ ich etwas. (kochen)|koche|kochen|gekocht|*darum*'dan sonra çekimli fiil hemen gelir; *ich* ile *kochen* → *koche*.||*kochen* olmaz: *ich* ile çekimli biçim *koche* olur.|*gekocht* olmaz: Partizip II tek başına yüklem olamaz; çekimli *koche* gerekir.","Gestern hatte der Bus Verspätung, deshalb ___ ich zu spät zur Arbeit. (kommen)|kam|kommte|kommen|Olay geçmişte: *kommen*'in Präteritum'u *kam*; *deshalb*'dan hemen sonra fiil, sonra özne gelir.||*kommte* olmaz: *kommen* düzensizdir, Präteritum'u *kam*.|*kommen* olmaz: *ich* ile çekimli fiil gerekir; üstelik olay geçmişte.","Ich gehe ins Bett, ___ ich müde bin. (çünkü)|weil|deshalb|darum|Sebep bildiren *weil* yan cümle kurar, çekimli fiil sona gider: *weil ich müde bin*.|da|*deshalb* olmaz: sonuç bildirir ve fiili hemen arkasına alır (*deshalb bin ich*); burada fiil sonda.|*darum* olmaz: *deshalb* gibi sonuç bildirir; fiil sona gitmez, anlam da ters olur.","Sie hat viel gelernt, ___ hat sie die Prüfung bestanden.|deshalb|weil|denn|Sonuç bildiren *deshalb* 1. yerde, çekimli fiil *hat* hemen arkasında: *deshalb hat sie …*.|deswegen/darum/daher/also|*weil* olmaz: *weil*'den sonra fiil sona gider; burada *hat* hemen geliyor.|*denn* olmaz: *denn* sebep bildirir ve sırayı değiştirmez (*denn sie hat*).","Er war krank, deswegen ___ er nicht gekommen.|ist|hat|sein|*kommen* Perfekt'te *sein* alır; *deswegen*'den sonra çekimli *ist* hemen gelir: *deswegen ist er … gekommen*.|war|*hat* olmaz: *kommen* yer değiştirme anlatır, Perfekt'te *sein* alır.|*sein* olmaz: bu mastar; *er* ile çekimli *ist* gerekir.","Ich will in Deutschland arbeiten, deshalb ___ ich Deutsch. (lernen)|lerne|lernen|gelernt|*deshalb*'dan sonra çekimli fiil hemen gelir; *ich* ile *lernen* → *lerne*.||*lernen* olmaz: *ich* ile çekimli biçim *lerne* olur.|*gelernt* olmaz: Partizip II tek başına yüklem olamaz; çekimli *lerne* gerekir."],
g19:["Gestern ___ ich sehr müde. (sein)|war|bin|waren|*gestern* geçmişi gösterir; *sein*'in Präteritum'u *ich* ile *war*.||*bin* olmaz: Präsens; *gestern* ile geçmiş zaman gerekir: *war*.|*waren* olmaz: *wir/sie/Sie* çekimidir; *ich* ile *war*.","Als Kind ___ ich einen Hund. (haben)|hatte|habe|hatten|*Als Kind* (çocukken) geçmişi anlatır; *haben*'in Präteritum'u *ich* ile *hatte*.||*habe* olmaz: Präsens; çocukluk geçmişte kaldı, *hatte* gerekir.|*hatten* olmaz: *wir/sie/Sie* çekimidir; *ich* ile *hatte*.","Gestern Abend ___ er um acht Uhr nach Hause. (kommen)|kam|kommte|kommt|*kommen* düzensiz fiil: Präteritum'da kök değişir → *kam*; *er* ile ek almaz.||*kommte* olmaz: düzensiz fiil *-te* almaz; doğrusu *kam*.|*kommt* olmaz: Präsens; *gestern Abend* geçmiş zaman ister.","Letzten Sonntag ___ wir nach dem Essen spazieren. (gehen)|gingen|gehten|gangen|*gehen* düzensiz: Präteritum kökü *ging*; *wir* ile *-en* eklenir → *gingen*.||*gehten* olmaz: düzensiz fiil *-te* almaz; doğrusu *gingen*.|*gangen* olmaz: böyle bir biçim yok; Präteritum *gingen*, Partizip II *gegangen*.","Letzte Woche ___ meine Oma einen langen Brief. (schreiben)|schrieb|schreibte|schrieben|*schreiben* düzensiz: Präteritum'da *ei* → *ie*: *schrieb*; *meine Oma* (sie) ile ek yok.||*schreibte* olmaz: düzensiz fiil *-te* almaz; doğrusu *schrieb*.|*schrieben* olmaz: çoğul (*wir/sie*) biçimi; *meine Oma* tekil → *schrieb*.","Gestern ___ ich den ganzen Abend. (lesen)|las|lese|liest|*lesen* düzensiz: Präteritum *las*; *ich* ve *er* biçimi aynıdır, ek almaz.||*lese* olmaz: Präsens; *gestern* geçmiş zaman ister: *las*.|*liest* olmaz: Präsens *er/sie/es* biçimi; burada *ich* ve geçmiş: *las*.","Letzten Freitag ___ die Besprechung zwei Stunden. (dauern)|dauerte|dauerten|dauert|*dauern* düzenli fiil: kök + *-te* → *dauerte*; *die Besprechung* tekil.||*dauerten* olmaz: çoğul biçim; *die Besprechung* tekil → *dauerte*.|*dauert* olmaz: Präsens; *letzten Freitag* geçmiş zaman ister.","Wir ___ einen Kaffee und gingen dann. (trinken)|tranken|trinkten|getrunken|*trinken* düzensiz: Präteritum'da *i* → *a*: *trank*; *wir* ile *tranken*. *gingen* de geçmişi gösteriyor.||*trinkten* olmaz: düzensiz fiil *-te* almaz; doğrusu *tranken*.|*getrunken* olmaz: Partizip II yardımcı fiilsiz kullanılmaz; burada Präteritum gerekir."],
g20:["Ich gehe heute ___ Arzt.|zum|nach|beim|Bir kişiye (doktor, kuaför …) gidince *zu* + Dativ: *zu dem* → *zum Arzt*.||*nach* olmaz: *nach* şehir, artikelsiz ülke ve *nach Hause* içindir; kişiye *zu*.|*beim* olmaz: *beim Arzt* 'doktorda' (nerede?) demek; *gehen* yön ister.","Wir fahren am Freitag ___ Berlin. (Berlin'e)|nach|zu|ins|Şehirlere ve artikelsiz ülkelere gidişte *nach* kullanılır: *nach Berlin*.||*zu* olmaz: *zu* kişi ve kurumlar içindir (*zum Arzt*); şehre *nach*.|*ins* olmaz: şehir adları artikelsizdir; *in das* → *ins* burada kullanılmaz.","Sie wohnt noch ___ ihren Eltern.|bei|zu|nach|Bir kişinin yanında/evinde (nerede?) *bei* + Dativ: *bei ihren Eltern*.||*zu* olmaz: *zu* yön bildirir (nereye?); *wohnen* yer ister: *bei*.|*nach* olmaz: *nach* şehir/ülke ve *nach Hause* içindir, kişiyle kullanılmaz.","Er kommt gerade ___ dem Supermarkt.|aus|bei|in|Bir binanın içinden gelmek (nereden?) *aus* + Dativ: *aus dem Supermarkt*.||*bei* olmaz: *bei* 'nerede?' sorusunun cevabıdır; *kommen* burada 'nereden?' ister.|*in* olmaz: *in* + Dativ 'içinde' demek; içinden gelmek *aus* ile anlatılır.","Ich komme gerade ___ Training. (antrenmandan)|vom|aus|beim|Bir etkinlikten ya da kişiden gelince *von* + Dativ: *von dem* → *vom Training*.||*aus* olmaz: *aus* bir yerin içinden çıkmayı anlatır; burada artikel de eksik.|*beim* olmaz: *beim Training* 'antrenmanda' (nerede?) demek, 'nereden' değil.","Heute bleibe ich ___. (evde)|zu Hause|nach Hause|bei Hause|'Evde' (nerede?) sabit kalıptır: *zu Hause*; *bleiben* yer bildirir.|zuhause/daheim|*nach Hause* olmaz: 'eve' (nereye?) demek; *bleiben* ile 'evde' gerekir.|*bei Hause* olmaz: böyle bir kalıp yok; 'evde' = *zu Hause*.","Ich gehe jetzt ___. (eve)|nach Hause|zu Hause|bei Hause|'Eve' (nereye?) sabit kalıptır: *nach Hause*; *gehen* yön ister.|nachhause/heim|*zu Hause* olmaz: 'evde' (nerede?) demek; *gehen* ile 'eve' = *nach Hause*.|*bei Hause* olmaz: böyle bir kalıp yok; 'eve' = *nach Hause*.","Wir fliegen im Sommer ___ Türkei. (Türkiye'ye)|in die|nach|zur|Artikelli ülkelere (*die Türkei, die Schweiz*) gidişte *in* + Akkusativ: *in die Türkei*.||*nach* olmaz: *nach* artikelsiz ülkelerle kullanılır; *Türkei* artikellidir.|*zur* olmaz: ülkeye gidişte *zu* kullanılmaz; artikelli ülkeye *in die*."],
g21:["Ich gehe laufen, ___ es regnet. (rağmen)|obwohl|trotzdem|trotz|Fiil *regnet* sonda, yani bu bir yan cümle: '-mesine rağmen' anlamında yan cümle kuran bağlaç *obwohl*.|obgleich|*trotzdem* olmaz: arkasından fiil hemen gelir (*trotzdem regnet es*); burada fiil sonda.|*trotz* olmaz: *trotz* edattır, arkasından cümle değil isim gelir (*trotz des Regens*).","Es regnet, ___ gehe ich laufen. (rağmen)|trotzdem|obwohl|trotz|*trotzdem* ana cümlenin 1. yerinde durur, çekimli fiil hemen arkasından gelir: *trotzdem gehe ich*.|dennoch|*obwohl* olmaz: *obwohl* fiili sona yollar; burada *gehe* hemen geliyor.|*trotz* olmaz: *trotz* edattır, arkasından isim gelir; burada fiil geliyor.","Obwohl ich müde bin, ___ heute. (trainieren)|trainiere ich|ich trainiere|trainieren ich|Başta duran *obwohl*-cümlesi 1. yeri doldurur; ana cümlede önce çekimli fiil, sonra özne gelir: *trainiere ich*.||*ich trainiere* olmaz: yan cümle 1. yeri doldurdu; fiil özneden önce gelmeli.|*trainieren ich* olmaz: sıra doğru ama *ich* ile çekim *trainiere* olur.","Er ist krank, trotzdem ___. (arbeiten)|arbeitet er|er arbeitet|arbeiten|*trotzdem* 1. yerde; çekimli fiil hemen arkasından, özne fiilden sonra gelir: *trotzdem arbeitet er*.||*er arbeitet* olmaz: *trotzdem*'dan sonra önce fiil, sonra özne gelir.|*arbeiten* olmaz: özne eksik ve fiil çekimsiz; *er* ile *arbeitet er* gerekir.","Obwohl Anna gestern wenig Zeit ___, hat sie gekocht. (haben)|hatte|hat gehabt|haben|*obwohl*-cümlesinde çekimli fiil sona gider; olay geçmişte: *haben* → *hatte*.|gehabt hat|*hat gehabt* olmaz: yan cümlede çekimli *hat* en sona gider: *gehabt hat*.|*haben* olmaz: özne *Anna* tekil; çekimli biçim gerekir, geçmişte *hatte*.","___ des Regens sind wir gelaufen. (rağmen)|Trotz|Obwohl|Trotzdem|Arkadan cümle değil isim geliyor; isimle *trotz* + Genitiv kullanılır: *trotz des Regens*.||*Obwohl* olmaz: *obwohl* yan cümle kurar, arkasından özne ve fiil gelir; isim almaz.|*Trotzdem* olmaz: *trotzdem* zarftır, arkasından isim değil çekimli fiil gelir.","Das Essen war teuer, ___ war es nicht gut. (rağmen)|trotzdem|obwohl|trotz|*trotzdem* 1. yerde durur, çekimli fiil *war* hemen arkasından gelir: *trotzdem war es nicht gut*.|dennoch|*obwohl* olmaz: *obwohl*'dan sonra fiil sona gider; burada *war* hemen geliyor.|*trotz* olmaz: *trotz* edattır, arkasından isim gelir; burada fiil geliyor.","Ich kaufe das Handy, obwohl es teuer ___. (sein)|ist|sein|ist es|*obwohl* yan cümle kurar; çekimli fiil en sona gider: *obwohl es teuer ist*.||*sein* olmaz: bu mastar; *es* ile çekimli *ist* gerekir.|*ist es* olmaz: özne *es* zaten başta; yan cümlede yalnız fiil sona gelir."],
g22:["___ ich ein Kind war, wohnten wir in Izmir. (als/wenn/wann)|Als|Wenn|Wann|Geçmişte tek bir dönem (çocukluk) → *als*. Yan cümlede fiil *war* sonda.||*Wenn* olmaz: geçmişte *wenn* yalnız tekrarlanan olaylar için; çocukluk tek bir dönem.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","___ ich Zeit habe, lese ich. (als/wenn/wann)|Wenn|Als|Wann|Şimdiki zaman ve genel durum → *wenn*: *Wenn ich Zeit habe, …*||*Als* olmaz: *als* yalnız geçmişte tek bir olay ya da dönem için kullanılır.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","Immer ___ es schneite, gingen wir Ski fahren. (als/wenn/wann)|wenn|als|wann|Geçmişte tekrarlanan olay (*immer* = her seferinde) → *wenn*: *Immer wenn es schneite, …*||*als* olmaz: *als* geçmişte tek olay içindir; burada olay her kar yağışında tekrarlanıyor.|*wann* olmaz: *wann* 'ne zaman?' sorusudur, zaman bağlacı değil.","___ ich in Berlin ankam, regnete es. (als/wenn/wann)|Als|Wenn|Wann|Geçmişte bir kez olan olay (Berlin'e varış) → *als*: *Als ich in Berlin ankam, …*||*Wenn* olmaz: geçmişte *wenn* tekrarlanan olaylar için; varış bir kez oldu.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","Ich weiß nicht, ___ der Kurs beginnt. (als/wenn/wann)|wann|als|wenn|Dolaylı soru: kursun ne zaman başladığını bilmiyorum → soru kelimesi *wann*; fiil yine sonda.||*als* olmaz: *als* '-dığında' demektir; burada 'ne zaman?' sorusu var.|*wenn* olmaz: *wenn* 'eğer/-dığında' demektir; zamanı soran kelime *wann*.","___ du morgen kommst, koche ich. (als/wenn/wann)|Wenn|Als|Wann|Gelecekteki olay (*morgen*) → *wenn*: *Wenn du morgen kommst, …*||*Als* olmaz: *als* yalnız geçmiş için; *morgen* gelecek.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","Als wir jung ___, haben wir viel gefeiert. (sein)|waren|sind|wären|*als* geçmişte bir dönemi anlatır; yan cümlede fiil sonda ve geçmişte: *sein* → *waren*.||*sind* olmaz: şimdiki zaman; *als* geçmişte bir dönemi anlatır.|*wären* olmaz: bu Konjunktiv II ('olsaydık'); burada gerçek bir geçmiş var.","Jedes Mal, ___ ich ihn sehe, lacht er. (als/wenn/wann)|wenn|als|wann|*Jedes Mal* = her seferinde: tekrar eden durum ve şimdiki zaman → *wenn*.||*als* olmaz: *als* geçmişte tek olay içindir; burada şimdiki zaman ve tekrar var.|*wann* olmaz: *wann* 'ne zaman?' sorusudur, zaman bağlacı değil."],
g23:["Nachdem ich gegessen ___, ging ich spazieren.|hatte|habe|war|Önce olan olay Plusquamperfekt: *essen* *haben* alır → *gegessen hatte*; sonra olan *ging* Präteritum.||*habe* olmaz: ana cümle geçmişte (*ging*); önceki olay için Perfekt değil Plusquamperfekt *hatte* gerekir.|*war* olmaz: *essen* yer değiştirme anlatmaz, *haben* ile kurulur.","Als ich ankam, ___ der Zug schon abgefahren.|war|hatte|hat|Tren benden önce kalkmıştı → Plusquamperfekt; *abfahren* yer değiştirme anlatır, *sein* alır: *war abgefahren*.||*hatte* olmaz: *abfahren* yer değiştirme anlatır, *sein* ile kurulur.|*hat* olmaz: yardımcı fiil *sein* olmalı; üstelik önceki olay için geçmiş biçim *war* gerekir.","Ich ___ den Schlüssel vergessen. (unutmuştum)|hatte|war|habe|'-mıştı' → Plusquamperfekt: *hatte/war* + Partizip II. *vergessen* *haben* alır: *hatte vergessen*.||*war* olmaz: *vergessen* *haben* ile kurulur, *sein* ile değil.|*habe* olmaz: *habe vergessen* Perfekt'tir ('unuttum'); '-mıştı' için *hatte* gerekir.","Nachdem er ___ hatte, rief er mich an. (duschen)|geduscht|duschte|duschen|Plusquamperfekt = *hatte* + Partizip II; *duschen* düzenli: *geduscht*.||*duschte* olmaz: bu Präteritum; *hatte* ile Partizip II gerekir.|*duschen* olmaz: bu mastar; *hatte* ile Partizip II gerekir.","Wir waren müde, weil wir lange ___ waren. (wandern)|gewandert|wanderten|gewandern|*wandern* yer değiştirme anlatır, *sein* alır: *gewandert waren*. Düzenli fiil, Partizip II *-t* ile biter.||*wanderten* olmaz: bu Präteritum; *waren* ile Partizip II gerekir.|*gewandern* olmaz: *wandern* düzenli fiildir, Partizip II *-t* ile biter: *gewandert*.","Nachdem Anna angekommen ___, haben wir gegessen.|war|hatte|waren|Önce olan olay Plusquamperfekt; *ankommen* yer değiştirme anlatır, *sein* alır: *angekommen war*.||*hatte* olmaz: *ankommen* yer değiştirme anlatır, *sein* ile kurulur.|*waren* olmaz: özne *Anna* tekil; *war* gerekir.","Er hatte noch nie Sushi ___. (essen)|gegessen|essen|aß|Plusquamperfekt = *hatte* + Partizip II; *essen* düzensiz: *gegessen*.||*essen* olmaz: bu mastar; *hatte* ile Partizip II gerekir.|*aß* olmaz: bu Präteritum; *hatte* ile Partizip II gerekir.","Nachdem ich die Prüfung bestanden hatte, ___ ich mit Freunden. (feiern)|feierte|feiere|hatte gefeiert|Önce olan Plusquamperfekt (*bestanden hatte*), sonra olan Präteritum: *feierte ich*.||*feiere* olmaz: şimdiki zaman; *nachdem*-cümlesi Plusquamperfekt ise ana cümle geçmişte olur.|*hatte gefeiert* olmaz: kutlama sonra oldu, Präteritum gerekir; üstelik *gefeiert* sona gitmeli."],
g24:["___ ich zur Arbeit gehe, trinke ich Kaffee. (-meden önce)|Bevor|Vor|Nachdem|'-meden önce' → *bevor*; yan cümle kurar, fiil sona gider: *Bevor ich zur Arbeit gehe*.|Ehe|*Vor* olmaz: *vor* edattır, isimle kullanılır (*vor der Arbeit*); cümle için *bevor* gerekir.|*Nachdem* olmaz: '-dikten sonra' demektir; anlam ters olur.","___ ich koche, höre ich Musik. (-irken)|Während|Bevor|Bis|'-irken' (aynı anda) → *während*; yan cümle, fiil sonda: *Während ich koche*.||*Bevor* olmaz: '-meden önce' demektir, aynı anda değil.|*Bis* olmaz: '-e kadar' demektir; bir bitiş noktası anlatır.","Warte hier, ___ ich zurückkomme. (-e kadar)|bis|bevor|seit|'-e kadar' → *bis*: *bis ich zurückkomme* (ben dönene kadar). Fiil sonda.||*bevor* olmaz: '-meden önce' demektir; 'ben dönmeden önce bekle' anlamsız.|*seit* olmaz: '-den beri' demektir; geçmişte başlayan bir durum anlatır.","___ ich Sport mache, schlafe ich besser. (-den beri)|Seit|Bis|Bevor|'-den beri' → *seit(dem)*; geçmişte başlayıp süren durum, bu yüzden şimdiki zaman: *Seit ich Sport mache*.|Seitdem|*Bis* olmaz: '-e kadar' demektir; burada başlangıç noktası anlatılıyor.|*Bevor* olmaz: '-meden önce' demektir; anlam uymuyor.","Bevor wir essen, ___ uns die Hände. (waschen)|waschen wir|wir waschen|wäscht wir|Başta duran yan cümle 1. yeri doldurur; ana cümlede önce çekimli fiil, sonra özne gelir: *waschen wir*.||*wir waschen* olmaz: yan cümle 1. yeri doldurdu; fiil özneden önce gelmeli.|*wäscht wir* olmaz: sıra doğru ama *wir* ile çekim *waschen* olur.","Während er ___, wartete ich draußen. (telefonieren)|telefonierte|telefonieren|telefoniert hat er|*während* yan cümle kurar, çekimli fiil sona gider; olay geçmişte: *telefonierte*.||*telefonieren* olmaz: *er* ile çekimli biçim gerekir: *telefonierte*.|*telefoniert hat er* olmaz: yan cümlede özne başta kalır; *er* zaten var, çekimli fiil en sona gider.","Ich wasche mir ___ dem Essen die Hände. (önce)|vor|bevor|vorher|İsimden (*dem Essen*) önce edat gelir: *vor* + Dativ → *vor dem Essen*. *bevor* ise cümle bağlar.||*bevor* olmaz: *bevor* bağlaçtır, arkasından özne ve fiil gelir; isimle *vor* kullanılır.|*vorher* olmaz: *vorher* zarftır ('önceden'), arkasına isim almaz.","Seit wir hier ___, sind wir glücklich. (wohnen)|wohnen|gewohnt|wohnten wir|*seit*: geçmişte başlayıp hâlâ süren durum → şimdiki zaman; fiil sonda: *Seit wir hier wohnen*.||*gewohnt* olmaz: Partizip II tek başına yüklem olamaz; şimdiki zaman *wohnen* gerekir.|*wohnten wir* olmaz: yan cümlede özne başta kalır, fiil sona gider; durum da hâlâ sürüyor."],
g25:["Das ist der Freund, mit ___ ich trainiere.|dem|den|der|*mit* her zaman Dativ ister; *der Freund* eril olduğu için Dativ ilgi zamiri *dem* olur.||*den* olmaz: bu eril Akkusativ; *mit*'ten sonra Dativ gerekir.|*der* olmaz: Dativ'de *der* dişil içindir; *Freund* eril.","Die Kollegin, ___ ich geholfen habe, ist nett.|der|die|den|*helfen* Dativ ister; *die Kollegin* dişil olduğu için Dativ ilgi zamiri *der* olur.||*die* olmaz: bu Nominativ/Akkusativ; *helfen* Dativ ister.|*den* olmaz: *den* eril Akkusativ; *Kollegin* dişil.","Das ist die Firma, bei ___ ich arbeite.|der|die|dem|*bei* her zaman Dativ ister; *die Firma* dişil → Dativ ilgi zamiri *der*.||*die* olmaz: *bei*'den sonra Akkusativ değil, Dativ gelir.|*dem* olmaz: *dem* eril/nötr Dativ; *Firma* dişil.","Die Leute, ___ ich die Wohnung zeige, sind nett.|denen|die|den|*zeigen*: gösterilen kişi Dativ'de (*wem?*). Çoğul Dativ ilgi zamiri *denen* olur, *den* değil.||*die* olmaz: bu çoğul Nominativ/Akkusativ; daireyi gösterdiğin kişiler Dativ olur.|*den* olmaz: çoğul Dativ artikeli *den*'dir ama ilgi zamiri *denen*.","Das ist das Thema, über ___ wir gesprochen haben.|das|dem|den|*sprechen über* Akkusativ ister; *das Thema* nötr → *über das*.||*dem* olmaz: *sprechen über* Dativ değil, Akkusativ ister.|*den* olmaz: *den* eril Akkusativ; *Thema* nötr.","Der Termin, auf ___ ich warte, ist morgen.|den|dem|der|*warten auf* Akkusativ ister; *der Termin* eril → *auf den*.||*dem* olmaz: *warten auf* Dativ değil, Akkusativ ister.|*der* olmaz: bu eril Nominativ; edattan sonra Akkusativ *den* gelir.","Das Kind, ___ ich das Buch gegeben habe, liest gern.|dem|das|den|*geben*: kitabı alan kişi Dativ'de (*wem?*), kitap Akkusativ'de. *das Kind* nötr → Dativ *dem*.||*das* olmaz: bu Nominativ/Akkusativ; kitabı alan kişi Dativ olur.|*den* olmaz: *den* eril Akkusativ; *Kind* nötr ve burada Dativ gerekir.","Die Stadt, in ___ ich wohne, ist klein.|der|die|dem|*wohnen* bir yerde olmayı anlatır (*Wo?*) → *in* + Dativ; *die Stadt* dişil → *in der*.||*die* olmaz: *in* + Akkusativ yön (*Wohin?*) içindir; *wohnen* Dativ ister.|*dem* olmaz: *dem* eril/nötr Dativ; *Stadt* dişil."],
g26:["Wenn ich mehr gelernt ___, hätte ich bestanden.|hätte|wäre|habe|*lernen* Perfekt'te *haben* alır; gerçekleşmemiş geçmiş koşulda *hätte* + Partizip II gelir.||*wäre* olmaz: *lernen* yer ya da durum değişimi anlatmaz, *haben* ile çekilir.|*habe* olmaz: bu gerçek geçmiş (Perfekt); gerçekleşmemiş koşulda Konjunktiv II *hätte* gerekir.","Wenn du angerufen hättest, ___ ich gekommen.|wäre|hätte|würde|*kommen* Perfekt'te *sein* alır (*ich bin gekommen*); bu yüzden Konjunktiv II'de *wäre … gekommen*.||*hätte* olmaz: *kommen* yer değiştirme anlatır, *sein* ile çekilir.|*würde* olmaz: *würde* mastarla kullanılır (*würde kommen*); Partizip II ile *wäre* gerekir.","Ich hätte gestern trainieren ___. (sollen)|sollen|gesollt|soll|Pişmanlık kalıbı *hätte … sollen*: başka bir mastarla birlikteyken modal fiil sonda mastar olarak kalır.||*gesollt* olmaz: başka bir mastarla birlikteyken modal fiil *ge-* almaz, mastar kalır.|*soll* olmaz: çekimli fiil zaten *hätte*; sonda çekimsiz mastar *sollen* gelir.","Das ___ ich nicht gedacht. (Konjunktiv II)|hätte|wäre|würde|*denken* Perfekt'te *haben* alır (*ich habe gedacht*); geçmişte Konjunktiv II: *hätte … gedacht*.||*wäre* olmaz: *denken* yer değiştirme anlatmaz, *haben* ile çekilir.|*würde* olmaz: *würde* mastarla gelir (*würde denken*); Partizip II ile *hätte* kullanılır.","Wir ___ fast zu spät gekommen. (Konjunktiv II)|wären|hätten|würden|*kommen* *sein* ile çekilir; neredeyse olan ama olmayan şey için *wären fast … gekommen*.||*hätten* olmaz: *kommen* yer değiştirme anlatır, *sein* alır.|*würden* olmaz: *würden* mastarla gelir; Partizip II ile *wären* gerekir.","Wenn ich das gewusst ___, wäre ich nicht gekommen.|hätte|wäre|habe|*wissen* Perfekt'te *haben* alır (*ich habe gewusst*); gerçekleşmemiş geçmiş koşulda *hätte … gewusst*.||*wäre* olmaz: *wissen* *haben* ile çekilir; *wäre* ana cümledeki *kommen* içindir.|*habe* olmaz: bu gerçek geçmiş; gerçekleşmemiş koşulda Konjunktiv II *hätte* gerekir.","Du hättest mich fragen ___. (können)|können|gekonnt|kannst|*hätte* + mastar + modal fiil: modal fiil sonda mastar olarak kalır: *hättest … fragen können*.||*gekonnt* olmaz: başka bir mastarla birlikteyken modal fiil Partizip değil, mastar olur.|*kannst* olmaz: çekimli fiil zaten *hättest*; sonda mastar *können* gelir.","Wenn es nicht geregnet hätte, ___ wir gewandert.|wären|hätten|würden|*wandern* Perfekt'te *sein* alır (*wir sind gewandert*); Konjunktiv II'de *wären … gewandert*.||*hätten* olmaz: *wandern* yer değiştirme anlatır, *sein* ile çekilir.|*würden* olmaz: *würden* mastarla gelir; Partizip II ile *wären* gerekir."],
g27:["Das ist das Auto ___ Bruders. (mein)|meines|meinem|meinen|Sahiplik Genitiv ile: *der Bruder* eril → *meines Bruders* (iyelik *-es*, isim *-s* alır).||*meinem* olmaz: bu Dativ; sahibi gösteren Genitiv *meines*'tir.|*meinen* olmaz: bu Akkusativ ya da çoğul Dativ; eril Genitiv *meines*'tir.","Wegen ___ Regens bleiben wir zu Hause. (der)|des|dem|den|*wegen* Genitiv ister; *der Regen* eril → *des Regens* (isim de *-s* alır).||*dem* olmaz: konuşmada *wegen dem Regen* duyulur ama *Regens*'teki *-s* Genitiv ister: *des*.|*den* olmaz: bu Akkusativ; *wegen* Genitiv ister.","Während ___ Besprechung war ich still. (die)|der|die|dem|*während* Genitiv ister; *die Besprechung* dişil → Genitiv *der Besprechung*.||*die* olmaz: bu Nominativ/Akkusativ; *während*'den sonra Genitiv gelir.|*dem* olmaz: *dem* eril/nötr Dativ; dişil Genitiv *der*'dir.","Die Farbe ___ Autos gefällt mir. (das)|des|dem|das|Sahiplik Genitiv ile: *das Auto* nötr → *des Autos* (isim *-s* alır).||*dem* olmaz: bu Dativ; *Autos*'taki *-s* Genitiv'i gösterir: *des*.|*das* olmaz: bu Nominativ/Akkusativ; nötr Genitiv *des*'tir.","Am Ende ___ Tages bin ich müde. (der)|des|dem|der|*am Ende* + Genitiv: *der Tag* eril → *des Tages*.||*dem* olmaz: bu Dativ; *Tages*'teki *-es* Genitiv'i gösterir.|*der* olmaz: Genitiv'de *der* dişil/çoğul içindir; *Tag* eril → *des*.","Trotz ___ Kälte sind wir gelaufen. (die)|der|die|dem|*trotz* Genitiv ister; *die Kälte* dişil → *der Kälte*.||*die* olmaz: bu Nominativ/Akkusativ; *trotz* Genitiv ister.|*dem* olmaz: *dem* eril/nötr; *Kälte* dişil → *der*.","Das ist die Tasche ___ Kollegin. (eine)|einer|einem|eine|Sahiplik Genitiv ile: *eine Kollegin* dişil → *einer Kollegin*.||*einem* olmaz: bu eril/nötr Dativ; *Kollegin* dişil.|*eine* olmaz: bu Nominativ/Akkusativ; dişil Genitiv *einer*'dir.","Innerhalb ___ Woche kommt die Antwort. (eine)|einer|eine|einem|*innerhalb* Genitiv ister; *eine Woche* dişil → *einer Woche*.||*eine* olmaz: bu Nominativ/Akkusativ; *innerhalb* Genitiv ister.|*einem* olmaz: bu eril/nötr Dativ; *Woche* dişil."],
g28:["Ich trainiere, ___ fit zu bleiben.|um|damit|für|Özne aynı (antrenman yapan da formda kalan da *ich*) ve sonda *zu* + mastar var → *um … zu*.||*damit* olmaz: *damit*'ten sonra özneli bir yan cümle gelir, *zu* + mastar değil.|*für* olmaz: 'için' diye *für* kullanılmaz; mastarla amaç *um … zu* ile kurulur.","Ich erkläre es, ___ du es verstehst.|damit|um|für|Özneler farklı (*ich* açıklıyor, *du* anlıyor) → *damit* + yan cümle, fiil sonda.||*um* olmaz: *um* özneli yan cümleyle değil, yalnız *zu* + mastarla kullanılır.|*für* olmaz: *für* bir edattır, yan cümle başlatamaz.","Sie spart Geld, um ein Auto zu ___. (kaufen)|kaufen|kauft|gekauft|*um … zu*'da fiil çekimsiz mastar olarak sona gelir: *zu kaufen*.||*kauft* olmaz: *zu*'dan sonra çekimli fiil değil, mastar gelir.|*gekauft* olmaz: bu Partizip II; *zu*'dan sonra mastar gerekir.","Er steht früh auf, um vor der Arbeit ___. (laufen)|zu laufen|laufen|läuft|*um* ile başlayan amaç cümlesinde mastarın önüne *zu* gelir: *um … zu laufen*.||*laufen* olmaz: *um*'dan sonra mastarın önüne *zu* gelmeli.|*läuft* olmaz: *um … zu* cümlesinde çekimli fiil olmaz, *zu* + mastar gelir.","Wir sprechen leise, damit das Baby ___. (schlafen)|schläft|schlafen|zu schlafen|*damit* yan cümle başlatır: kendi öznesi (*das Baby*) var, fiil çekimli olarak sona gelir: *schläft*.|schlafen kann|*schlafen* olmaz: *das Baby* tekil özne; fiil ona göre çekilmeli: *schläft*.|*zu schlafen* olmaz: *zu* + mastar *um … zu* ile gelir; *damit*'ten sonra çekimli fiil gerekir.","Ich lerne Deutsch, um in Berlin ___. (arbeiten)|zu arbeiten|arbeiten|arbeite|Özne aynı → *um … zu*; mastar *zu* ile sona gelir: *zu arbeiten*.||*arbeiten* olmaz: *um*'dan sonra mastarın önüne *zu* gelmeli.|*arbeite* olmaz: *um … zu* cümlesinde özne ve çekimli fiil olmaz.","Ich stelle den Wecker, um früh ___. (aufstehen)|aufzustehen|zu aufstehen|aufstehen|Ayrılabilen fiilde *zu* ön ek ile kökün arasına girer ve tek kelime yazılır: *auf-zu-stehen*.||*zu aufstehen* olmaz: ayrılabilen fiilde *zu* başa değil, araya girer: *aufzustehen*.|*aufstehen* olmaz: *um … zu* cümlesinde *zu* eksik olmaz.","Mach das Licht an, damit wir etwas ___. (sehen)|sehen|zu sehen|sieht|*damit* yan cümlesinde fiil özneye (*wir*) göre çekilir ve sona gelir: *wir … sehen*.|sehen können|*zu sehen* olmaz: *damit*'ten sonra *zu* + mastar değil, çekimli fiil gelir.|*sieht* olmaz: özne *wir*; fiil *sehen* diye çekilir."],
g29:["Ich trinke sowohl Kaffee ___ Tee.|als auch|oder|noch|*sowohl* her zaman *als auch* ile tamamlanır: *sowohl … als auch* = hem … hem. (*wie auch* de doğru ama daha seyrek.)|wie auch|*oder* olmaz: *oder* *entweder* ile eşleşir (*entweder … oder*), *sowohl* ile değil.|*noch* olmaz: *noch* *weder* ile eşleşir (*weder … noch*), *sowohl* ile değil.","Er hat weder Zeit ___ Lust.|noch|oder|als auch|*weder* ikinci parçada hep *noch* ister: *weder … noch* = ne … ne.||*oder* olmaz: *oder* *entweder* ile eşleşir; *weder*'in eşi *noch*'tur.|*als auch* olmaz: *als auch* *sowohl* ile eşleşir; *weder*'den sonra *noch* gelir.","Wir fahren entweder heute ___ morgen.|oder|noch|sondern|*entweder* ikinci parçada *oder* ister: *entweder … oder* = ya … ya.||*noch* olmaz: *noch* *weder* ile eşleşir (ne … ne); burada *entweder* var.|*sondern* olmaz: *sondern* *nicht nur* ile eşleşir; *entweder*'in eşi *oder*'dir.","Sie spricht nicht nur Deutsch, ___ Englisch.|sondern auch|als auch|oder|*nicht nur* ikinci parçada *sondern auch* ister: *nicht nur …, sondern auch …* = sadece … değil, … de.||*als auch* olmaz: *als auch* yalnız *sowohl* ile eşleşir, *nicht nur* ile değil.|*oder* olmaz: *oder* *entweder* ile eşleşir; *nicht nur*'dan sonra *sondern auch* gelir.","Das Essen war ___ warm noch lecker.|weder|sowohl|entweder|İkinci parçada *noch* var; onun eşi *weder*'dir: *weder warm noch lecker* = ne sıcak ne lezzetli.||*sowohl* olmaz: *sowohl*'un eşi *als auch*'tır, *noch* değil.|*entweder* olmaz: *entweder*'in eşi *oder*'dir, *noch* değil.","Das Hotel ist zwar teuer, ___ sehr schön.|aber|sondern|oder|*zwar … aber* = gerçi … ama: önce bir şeyi kabul eder, sonra karşıtını söylersin. *aber* yerine *doch/jedoch* da olur.|doch/jedoch|*sondern* olmaz: *sondern* yalnız olumsuzdan sonra gelir (*nicht …, sondern*); *zwar*'ın eşi *aber*'dir.|*oder* olmaz: *oder* seçenek bildirir; *zwar* ile karşıtlık için *aber* gerekir.","___ du kommst mit, oder ich gehe allein.|Entweder|Weder|Sowohl|İkinci parçada *oder* var; onun eşi *entweder*'dir: *Entweder …, oder …* = ya … ya da …||*Weder* olmaz: *weder*'in eşi *noch*'tur, *oder* değil.|*Sowohl* olmaz: *sowohl*'un eşi *als auch*'tır, *oder* değil.","Ich mag ___ Hunde als auch Katzen.|sowohl|weder|entweder|İkinci parçada *als auch* var; onun eşi *sowohl*'dur: hem köpekleri hem kedileri severim.||*weder* olmaz: *weder*'in eşi *noch*'tur, *als auch* değil.|*entweder* olmaz: *entweder*'in eşi *oder*'dir, *als auch* değil."],
g30:["Ich ___ nächstes Jahr die Prüfung machen.|werde|wird|wirst|Futur I: *werden* özneye göre çekimlenir, mastar sona gider. *ich* ile *werde*: *Ich werde … machen.*||*wird* olmaz: *wird* *er/sie/es* çekimidir; *ich* ile *werde* gerekir.|*wirst* olmaz: *wirst* *du* çekimidir; *ich* ile *werde* gerekir.","Morgen ___ es regnen.|wird|werden|wirst|*es* üçüncü tekil kişidir: *es wird* + mastar sonda (*regnen*).||*werden* olmaz: *werden* *wir/sie* çekimidir; *es* ile *wird* gerekir.|*wirst* olmaz: *wirst* *du* çekimidir; *es* ile *wird* gerekir.","___ du am Wochenende Zeit haben?|Wirst|Wird|Werdet|*du* ile *werden* → *wirst*; evet/hayır sorusunda başa gelir, mastar *haben* sonda kalır.||*Wird* olmaz: *wird* *er/sie/es* çekimidir; *du* ile *wirst* gerekir.|*Werdet* olmaz: *werdet* *ihr* çekimidir; *du* ile *wirst* gerekir.","Wir werden das schon ___.|schaffen|geschafft|schafft|Futur I'de yalnız *werden* çekimlenir; asıl fiil mastar hâlinde sona gider: *werden … schaffen*.||*geschafft* olmaz: Partizip II Perfekt içindir; *werden*'den sonra mastar gelir.|*schafft* olmaz: asıl fiil çekimlenmez; çekimli fiil zaten *werden*, sonda mastar kalır.","Er ___ wohl noch im Büro sein.|wird|wirst|werden|*werden* + *wohl* tahmin bildirir (herhalde). *er* ile *wird*: *Er wird wohl … sein.*||*wirst* olmaz: *wirst* *du* çekimidir; *er* ile *wird* gerekir.|*werden* olmaz: *werden* *wir/sie* çekimidir; *er* ile *wird* gerekir.","Ihr ___ sehen, das klappt!|werdet|wird|werden|*ihr* ile *werden* → *werdet*. *Ihr werdet sehen* = göreceksiniz.||*wird* olmaz: *wird* *er/sie/es* çekimidir; *ihr* ile *werdet* gerekir.|*werden* olmaz: *werden* *wir/sie* çekimidir; *ihr* ile *werdet* gerekir.","Ich werde ab jetzt jeden Tag ___.|üben|geübt|übe|*werde* çekimli fiildir; asıl fiil çekimsiz mastar olarak cümle sonuna gider: *werde … üben*.||*geübt* olmaz: Partizip II Perfekt ya da edilgen içindir; Futur I'de mastar gelir.|*übe* olmaz: çekimli fiil zaten *werde*; sonda çekimsiz mastar *üben* olmalı.","Die Preise ___ weiter steigen.|werden|wird|wurden|*die Preise* çoğuldur (*sie*): *sie werden* + mastar *steigen*.||*wird* olmaz: *wird* tekildir; çoğul özne *die Preise* ile *werden* gerekir.|*wurden* olmaz: *wurden* geçmiş zamandır (Präteritum); gelecek için *werden* + mastar gerekir."],
g31:["Das Haus ___ 1950 gebaut.|wurde|worden|hat|Edilgen Präteritum: *wurde* + Partizip II. Geçmişte bir kez yapılan iş: *wurde … gebaut*.||*worden* olmaz: *worden* tek başına çekimli fiil olamaz; yalnız Perfekt'te *ist … worden* içinde gelir.|*hat* olmaz: edilgende *haben* kullanılmaz; ev yapan değil, yapılan şeydir.","Die Besprechung ist abgesagt ___.|worden|geworden|werden|Edilgen Perfekt: *ist* + Partizip II + *worden*. Edilgende *werden*'in Partizip'i *ge-* almaz: *worden*.||*geworden* olmaz: *geworden* 'olmak' anlamındaki *werden* içindir; edilgende *worden* gelir.|*werden* olmaz: *ist … werden* diye bir yapı yok; Perfekt edilgende *worden* gelir.","Der Antrag muss bis Freitag abgegeben ___.|werden|worden|wird|Modal fiilli edilgen: modal çekimlenir, sonda Partizip II + *werden*: *muss abgegeben werden*. (*abgegeben sein* de doğru.)|sein|*worden* olmaz: *worden* yalnız Perfekt edilgende (*ist … worden*) gelir; modalden sonra *werden* gerekir.|*wird* olmaz: çekimli fiil zaten *muss*; sonda çekimsiz *werden* olmalı.","Die Pakete ___ gestern geliefert.|wurden|wurde|werden|*gestern* → edilgen Präteritum. Özne *die Pakete* çoğul olduğu için *wurden* + Partizip II.||*wurde* olmaz: *wurde* tekildir; çoğul *die Pakete* ile *wurden* gerekir.|*werden* olmaz: bu şimdiki zaman; *gestern* geçmişi gösterir, *wurden* gerekir.","Hier darf nicht geraucht ___.|werden|worden|wird|Modal fiilli edilgen: *darf* + Partizip II + *werden*. Kimin yaptığı önemli değil, genel bir yasak anlatır.||*worden* olmaz: *worden* yalnız Perfekt edilgende (*ist … worden*) gelir; modalden sonra *werden*.|*wird* olmaz: çekimli fiil zaten *darf*; sonda çekimsiz *werden* gerekir.","Die Ergebnisse ___ schon veröffentlicht worden.|sind|haben|werden|Edilgen Perfekt'te yardımcı fiil hep *sein*: çoğul *die Ergebnisse* → *sind … worden*. (*waren … worden* = Plusquamperfekt, o da doğru.)|waren|*haben* olmaz: edilgen Perfekt *haben* almaz; *sein* + Partizip II + *worden* gerekir.|*werden* olmaz: *worden* ile Perfekt kurulur, o da *sein* ister; *werden … worden* yanlış.","Das Auto kann morgen ___ werden.|repariert|reparieren|repariere|Edilgende asıl fiil Partizip II olur: *repariert werden* = tamir edilmek.||*reparieren* olmaz: mastar + *werden* edilgen değildir; araba tamir edilen şey, Partizip II *repariert* gerekir.|*repariere* olmaz: bu *ich* çekimi; burada Partizip II *repariert* gerekir.","Das Museum ___ vor zwei Jahren eröffnet.|wurde|wird|worden|*vor zwei Jahren* geçmişi gösterir: edilgen Präteritum *wurde* + Partizip II (*eröffnet*).||*wird* olmaz: *wird* şimdiki/gelecek zamandır; *vor zwei Jahren* ile *wurde* gerekir.|*worden* olmaz: *worden* çekimli fiil olamaz; yalnız *ist … worden* içinde kullanılır."],
g32:["Ich frage den ___.|Kollegen|Kollege|Kolleges|*Kollege* n-Deklination ismidir: Nominativ dışında *-n* alır. *fragen* Akkusativ ister → *den Kollegen*.||*Kollege* olmaz: bu Nominativ hâli; Akkusativ'de *-n* eklenir: *den Kollegen*.|*Kolleges* olmaz: n-Deklination isimleri *-s* almaz, hep *-n* alır.","Kennst du den neuen ___?|Studenten|Student|Studente|*-ent* ile biten eril canlılar n-Deklination'dır: Akkusativ'de *-en* alır → *den Studenten*.||*Student* olmaz: bu Nominativ; *den*'den sonra *-en* eklenir: *Studenten*.|*Studente* olmaz: böyle bir biçim yok; ek *-e* değil *-en*'dir.","Wir helfen dem ___.|Nachbarn|Nachbar|Nachbare|*helfen* Dativ ister; *Nachbar* n-Deklination ismidir, Dativ'de *-n* alır → *dem Nachbarn*.||*Nachbar* olmaz: bu Nominativ hâli; Dativ'de *-n* eklenir: *dem Nachbarn*.|*Nachbare* olmaz: böyle bir biçim yok; ek *-e* değil *-n*'dir.","Ich spreche mit dem ___.|Kunden|Kunde|Kundes|*mit* Dativ ister; *Kunde* n-Deklination ismidir → *dem Kunden*.||*Kunde* olmaz: bu Nominativ; Dativ'de *-n* eklenir: *dem Kunden*.|*Kundes* olmaz: n-Deklination isimleri *-s* almaz, *-n* alır.","Das ist das Auto des ___.|Journalisten|Journalist|Journalists|Genitiv'de n-Deklination isimleri *-s* değil *-(e)n* alır: *des Journalisten*.||*Journalist* olmaz: Genitiv'de ek gerekir; *-ist* ile bitenler *-en* alır.|*Journalists* olmaz: Genitiv *-s* normal eril isimler içindir; *Journalist* *-en* alır.","Der ___ spielt Fußball.|Junge|Jungen|Junges|Özne Nominativ'dedir; n-Deklination isimleri Nominativ tekilde ek almaz → *der Junge*.||*Jungen* olmaz: *-n* yalnız Nominativ dışında ya da çoğulda eklenir; tekil özne *der Junge*'dir.|*Junges* olmaz: n-Deklination isimleri *-s* almaz; Nominativ'de ek yok.","Hast du den ___ vergessen?|Namen|Name|Names|*Name* de n-Deklination'a girer: Akkusativ'de *-n* alır → *den Namen*.||*Name* olmaz: bu Nominativ; *vergessen* Akkusativ ister: *den Namen*.|*Names* olmaz: Akkusativ'de *-s* eklenmez; doğru biçim *den Namen*.","Ich habe einen ___ getroffen.|Touristen|Tourist|Touriste|*treffen* Akkusativ ister; *-ist* ile biten *Tourist* n-Deklination'dır → *einen Touristen*.||*Tourist* olmaz: bu Nominativ; Akkusativ'de *-en* eklenir.|*Touriste* olmaz: böyle bir biçim yok; ek *-e* değil *-en*'dir."],
g33:["Je mehr ich übe, ___ besser spreche ich.|desto|als|dann|*je* + yan cümleden sonra ana cümle *desto* + karşılaştırma ile başlar (= o kadar). *umso* da aynı anlamda doğrudur.|umso|*als* olmaz: *als* karşılaştırmada 'den/dan' demektir; *je*'nin eşi *desto*'dur.|*dann* olmaz: bu *wenn … dann* kalıbı değil; *je*'nin eşi *desto* (ya da *umso*).","Je früher wir anfangen, desto schneller ___ fertig.|sind wir|wir sind|sein wir|*desto schneller* ilk yeri tutar, çekimli fiil hemen ardından, özne sonra gelir: *sind wir*. *werden wir* da doğru.|werden wir|*wir sind* olmaz: *desto schneller*'den sonra önce fiil gelmeli: *sind wir*.|*sein wir* olmaz: fiil çekimsiz kalmış; *wir* ile *sind* olur.","Je länger ich ___, desto mehr verstehe ich. (hier, leben)|hier lebe|lebe hier|hier leben|*je* ile başlayan kısım yan cümledir: çekimli fiil en sona gider → *je länger ich hier lebe*.||*lebe hier* olmaz: *je* yan cümlesinde fiil sonda olmalı, *hier*'den sonra.|*hier leben* olmaz: fiil çekimsiz; *ich* ile *lebe* olur.","___ älter er wird, desto ruhiger wird er.|Je|Desto|Wenn|Fiili sonda olan ilk kısım *je* ile başlar, ikinci kısım *desto* ile: ne kadar … o kadar.||*Desto* olmaz: *desto* ikinci (ana) cümleyi başlatır; ilk kısım *je* ister.|*Wenn* olmaz: *wenn* + karşılaştırma olmaz; *desto*'nun eşi *je*'dir.","Je öfter ich die Wörter wiederhole, desto ___ merke ich sie mir. (leicht)|leichter|leicht|am leichtesten|*desto*'dan sonra karşılaştırma (Komparativ) gelir: *leicht* → *leichter*.||*leicht* olmaz: *desto*'dan sonra karşılaştırma eki *-er* gerekir.|*am leichtesten* olmaz: bu Superlativ; *desto*'dan sonra *-er* hâli gelir.","Je schwerer das Gewicht ist, ___ weniger Wiederholungen schaffe ich.|desto|wie|dann|İkinci kısım *desto* + karşılaştırma ile başlar: *desto weniger* = o kadar az. *umso* da doğru.|umso|*wie* olmaz: *wie* eşitlik karşılaştırmasıdır; *je*'nin eşi *desto*'dur.|*dann* olmaz: bu *wenn … dann* kalıbı değil; *je* ile *desto* (ya da *umso*) gelir.","Je mehr du schläfst, desto ___ bist du. (fit)|fitter|fit|am fittesten|*desto*'dan sonra karşılaştırma gelir: *fit* → *fitter* (kısa ünlüden sonra *t* ikilenir).||*fit* olmaz: *desto*'dan sonra karşılaştırma eki *-er* gerekir.|*am fittesten* olmaz: Superlativ; *desto* ile Komparativ *fitter* kullanılır.","Je teurer das Hotel ist, desto besser ___ der Service sein. (sollen)|sollte|sollen|sollst|*desto besser*'den hemen sonra çekimli fiil gelir; özne *der Service* (er) → *sollte* (ya da *soll*), *sein* sonda.|soll|*sollen* olmaz: fiil çekimsiz; özne *der Service* (er) → *sollte/soll*.|*sollst* olmaz: *du* çekimi; özne *der Service* (er) olduğu için *sollte/soll*."],
g34:["Das ___ Kind ist süß. (schlafen)|schlafende|geschlafene|schlafend|Çocuk şu an uyuyor → etken, eşzamanlı: Partizip I *schlafend*; *das* + tekil → *-e*: *schlafende*.||*geschlafene* olmaz: *schlafen* nesnesiz fiil, Partizip II sıfat olmaz; 'uyuyan' → Partizip I.|*schlafend* olmaz: isimden önce sıfat eki gerekir: *das schlafende Kind*.","Ich esse gern ___ Eier. (kochen)|gekochte|kochende|gekocht|Yumurtalar haşlanmış → edilgen/bitmiş: Partizip II *gekocht*; artikelsiz çoğul → *-e*: *gekochte*.||*kochende* olmaz: Partizip I 'kaynayan/pişiren' demek; yumurta haşlanmış → Partizip II.|*gekocht* olmaz: isimden önce sıfat eki gerekir: *gekochte Eier*.","Wir haben ein ___ Auto gekauft. (gebrauchen)|gebrauchtes|gebrauchendes|gebraucht|Araba kullanılmış → Partizip II *gebraucht*; *ein* + *das Auto* → *-es*: *ein gebrauchtes Auto* (ikinci el).||*gebrauchendes* olmaz: Partizip I 'kullanan' demek; araba kullanılmış → Partizip II.|*gebraucht* olmaz: isimden önce ek gerekir; *ein* + *das* → *gebrauchtes*.","Die ___ Preise sind ein Problem. (steigen)|steigenden|gestiegen|steigende|Şu an artan fiyatlar → Partizip I; *die* + çoğul → *-en*: *steigenden*. 'Artmış' anlamında *gestiegenen* da doğru.|gestiegenen|*gestiegen* olmaz: isimden önce ek gerekir; *die* + çoğul → *-en* (*gestiegenen*).|*steigende* olmaz: *die* + çoğul isimden önce sıfat eki *-en* olur: *steigenden*.","Der ___ Computer funktioniert wieder. (reparieren)|reparierte|reparierende|repariert|Bilgisayar tamir edilmiş → Partizip II *repariert*; *der* + tekil → *-e*: *der reparierte Computer*.||*reparierende* olmaz: Partizip I 'tamir eden' demek; bilgisayar tamir edilmiş → Partizip II.|*repariert* olmaz: isimden önce sıfat eki gerekir: *der reparierte Computer*.","Das ist ein gut ___ Job. (bezahlen)|bezahlter|gebezahlter|bezahlt|İş iyi ödeniyor → edilgen: Partizip II *bezahlt*; *ein* + *der Job* (Nominativ) → *-er*: *bezahlter*.||*gebezahlter* olmaz: *be-* ile başlayan fiiller Partizip II'de *ge-* almaz: *bezahlt*.|*bezahlt* olmaz: isimden önce ek gerekir; *ein* + *der* → *bezahlter*.","Vorsicht, ___ Wasser! (kochen)|kochendes|kochend|gekochte|Su şu an kaynıyor → Partizip I *kochend*; artikelsiz *das Wasser* → *-es*: *kochendes Wasser*.||*kochend* olmaz: isimden önce sıfat eki gerekir: *kochendes Wasser*.|*gekochte* olmaz: ek yanlış (artikelsiz *das* → *-es*); uyarı şu an kaynayan su için → Partizip I.","Die Polizei sucht das ___ Fahrrad. (stehlen)|gestohlene|stehlende|gestohlen|Bisiklet çalınmış → Partizip II *gestohlen*; *das* + tekil → *-e*: *das gestohlene Fahrrad*.||*stehlende* olmaz: Partizip I 'çalan' demek; bisiklet çalınmış → Partizip II.|*gestohlen* olmaz: isimden önce sıfat eki gerekir: *das gestohlene Fahrrad*."],
g35:["Er ist gegangen, ohne sich zu ___. (verabschieden)|verabschieden|verabschiedet|verabschiedete|*ohne … zu*'dan sonra yalın mastar gelir: *ohne sich zu verabschieden* = vedalaşmadan.||*verabschiedet* olmaz: *zu*'dan sonra Partizip değil, mastar gelir.|*verabschiedete* olmaz: *zu*'dan sonra geçmiş zaman çekimi değil, mastar gelir.","___ zu Hause zu bleiben, gehen wir heute ins Kino.|Statt|Ohne|Um|Evde kalmak yerine sinemaya gidiyoruz → *statt … zu* (= -mek yerine). *Anstatt* da doğru.|Anstatt|*Ohne* olmaz: 'evde kalmadan sinemaya gitmek' anlamsız; iki seçenekten biri seçiliyor → *statt*.|*Um* olmaz: *um … zu* amaç bildirir ('evde kalmak için'); anlam 'yerine' olmalı.","Sie geht nie aus dem Haus, ___ ihr Handy mitzunehmen.|ohne|statt|um|Telefonunu almadan asla evden çıkmaz → *ohne … zu* (= -meden).||*statt* olmaz: 'telefonu almak yerine evden çıkmaz' anlamsız; burada anlam '-meden' → *ohne*.|*um* olmaz: *um … zu* amaç bildirir ('almak için'); burada anlam '-meden'.","Ich trainiere nie, ohne mich ___. (aufwärmen)|aufzuwärmen|zu aufwärmen|aufwärmen|Ayrılabilen fiilde *zu* ön ek ile kökün arasına girer ve bitişik yazılır: *auf-zu-wärmen*.||*zu aufwärmen* olmaz: ayrılabilen fiilde *zu* araya girer: *aufzuwärmen*.|*aufwärmen* olmaz: *ohne … zu* yapısında *zu* eksik kalamaz.","Statt Auto ___, nehme ich das Rad.|zu fahren|fahren|fährt|*statt … zu* yapısında mastar *zu* ile en sonda: *statt Auto zu fahren* = araba kullanmak yerine.||*fahren* olmaz: *statt … zu* yapısında *zu* eksik kalamaz.|*fährt* olmaz: çekimli fiil değil, *zu* + mastar gerekir.","Er ging weg, ohne ___ ich es merkte.|dass|zu|wenn|Arkada ayrı bir özne (*ich*) ve çekimli fiil var → *ohne dass* + yan cümle (fiil sonda).||*zu* olmaz: *ohne … zu* mastarla kurulur; burada özne *ich* ve çekimli *merkte* var.|*wenn* olmaz: *ohne*'den sonra yan cümle yalnızca *dass* ile kurulur.","Statt zu ___, haben wir Pizza bestellt. (kochen)|kochen|gekocht|kocht|*statt zu*'dan sonra yalın mastar gelir: *statt zu kochen* = yemek yapmak yerine.||*gekocht* olmaz: *zu*'dan sonra Partizip II değil, mastar gelir.|*kocht* olmaz: *zu*'dan sonra çekimli fiil değil, mastar gelir.","Ohne viel zu ___, kann man nicht gewinnen. (üben)|üben|geübt|übt|*ohne … zu* yapısında *zu*'dan sonra yalın mastar gelir: *ohne viel zu üben* = çok çalışmadan.||*geübt* olmaz: *zu*'dan sonra Partizip II değil, mastar gelir.|*übt* olmaz: *zu*'dan sonra çekimli fiil değil, mastar gelir."],
g36:["Ich ___ mir die Haare schneiden. (lassen)|lasse|lässt|lassen|Saçı başkası kesiyor → *lassen* + mastar; *ich* ile *lasse*.|ließ|*lässt* olmaz: *lässt* *du/er/sie/es* çekimidir; *ich* ile *lasse*.|*lassen* olmaz: mastar/*wir* hâli; *ich* ile *lasse* gerekir.","Er ___ sein Auto reparieren. (lassen)|lässt|lasst|lasse|*er* ile *lassen*'in kök ünlüsü değişir: *er lässt*. Arabayı başkasına tamir ettiriyor.|ließ|*lasst* olmaz: *ihr* çekimi; *er* ile ünlü değişir: *lässt*.|*lasse* olmaz: *ich* çekimi; *er* ile *lässt* olur.","___ mich bitte ausreden!|Lass|Lässt|Lassen|*du*'ya emir: *Lass!* (ünlü değişmez). Birden çok kişiye *Lasst* da doğru.|Lasst|*Lässt* olmaz: *du lässt* düz cümle çekimidir; emirde *Lass!* olur.|*Lassen* olmaz: *Sie*'li emirde özne gerekir: *Lassen Sie mich …*; burada *Sie* yok.","Sie hat ihr Fahrrad reparieren ___. (lassen)|lassen|gelassen|lässt|Başka bir mastarla birlikte Perfekt'te *gelassen* değil, mastar *lassen* kullanılır: *reparieren lassen*.||*gelassen* olmaz: önünde mastar (*reparieren*) varken Perfekt'te *lassen* kullanılır.|*lässt* olmaz: Perfekt'te sonda çekimli fiil olmaz: *hat … reparieren lassen*.","___ uns morgen weitersprechen!|Lass|Lässt|Ließ|*Lass uns …!* = Hadi … (öneri). Birden çok kişiye *Lasst uns …!* da doğru.|Lasst|*Lässt* olmaz: düz cümle çekimidir; öneri/emirde *Lass uns …!* olur.|*Ließ* olmaz: Präteritum çekimi; öneri emir kipiyle yapılır: *Lass uns …!*","Ich habe meine Tasche im Auto ___. (lassen)|gelassen|lassen|lasse|Yanında başka fiil yokken 'bırakmak' anlamındaki *lassen* normal Partizip II alır: *gelassen*.||*lassen* olmaz: önünde başka mastar yok; tek başına *lassen* Perfekt'te *gelassen* olur.|*lasse* olmaz: Perfekt'te sonda Partizip II gerekir: *habe … gelassen*.","Wir lassen das Haus ___. (renovieren)|renovieren|renoviert|zu renovieren|*lassen* + yalın mastar (*zu* yok): *das Haus renovieren lassen* = evi yenilettirmek.||*renoviert* olmaz: *lassen*'den sonra Partizip değil, mastar gelir.|*zu renovieren* olmaz: *lassen* ile mastar *zu* almaz.","Lässt du dir die Haare ___? (färben)|färben|gefärbt|färbst|*lassen* + yalın mastar sonda: *die Haare färben lassen* = saçı boyatmak.||*gefärbt* olmaz: *lassen*'den sonra Partizip değil, mastar gelir.|*färbst* olmaz: çekimli fiil zaten *lässt*; ikinci fiil mastar kalır."],
g37:["Ich bleibe fit, ___ ich jeden Tag laufe. (-erek)|indem|sodass|dadurch|*indem* yöntemi anlatır (nasıl?): her gün koşarak. Yan cümle kurar, çekimli fiil (*laufe*) sonda.||*sodass* olmaz: *sodass* sonuç bildirir (bu yüzden); burada yöntem (-erek) var.|*dadurch* olmaz: *dadurch* zarftır, ardından fiil gelir; yan cümle kuramaz.","Es regnete stark, ___ das Spiel ausfiel. (bu yüzden)|sodass|indem|deshalb|*sodass* sonuç bildirir ve yan cümle kurar: fiil (*ausfiel*) sonda. *so dass* yazımı da doğru.|so dass/weshalb/weswegen|*indem* olmaz: *indem* yöntem (-erek) bildirir; burada yağmurun sonucu var.|*deshalb* olmaz: anlam uyar ama *deshalb* zarftır, ardından fiil gelir (*deshalb fiel das Spiel aus*).","Man lernt Wörter, indem man sie oft ___. (wiederholen)|wiederholt|wiederholen|wiederholst|*indem* yan cümlesinde fiil sonda durur ve özneye göre çekilir: *man* → *wiederholt*.||*wiederholen* olmaz: bu mastar/çoğul biçim; *man* ile *wiederholt*.|*wiederholst* olmaz: bu *du* çekimi; *man* ile *wiederholt*.","Er hat verschlafen, sodass er den Zug ___. (verpassen)|verpasst hat|hat verpasst|verpasst ist|*sodass* yan cümlesinde çekimli yardımcı fiil en sona gider: *verpasst hat*. (Präteritum *verpasste* de doğru.)|verpasste|*hat verpasst* olmaz: bu ana cümle sırası; yan cümlede *hat* en sona gider.|*verpasst ist* olmaz: *verpassen* nesne alır, Perfekt'te *haben* ile çekilir.","Sie verbessert ihr Deutsch, ___ sie Podcasts hört. (-erek)|indem|sodass|ob|Almancasını nasıl geliştiriyor? Podcast dinleyerek → yöntem: *indem*, fiil (*hört*) sonda.||*sodass* olmaz: *sodass* sonuç bildirir; podcast dinlemek gelişmenin sonucu değil, yolu.|*ob* olmaz: *ob* dolaylı soru kurar (-ip -mediğini); yöntem bildirmez.","Der Kurs war so gut, ___ ich viel gelernt habe.|dass|indem|ob|*so* + sıfat + *dass* = o kadar … ki. *so* ana cümlede olduğu için yan cümleye yalnız *dass* gelir.||*indem* olmaz: *indem* yöntem bildirir; *so gut* ile sonuç kalıbı *so … dass* gerekir.|*ob* olmaz: *ob* dolaylı soru kurar (-ip -mediğini); *so … dass* kalıbında yeri yok.","Wie spart man Geld? – ___ man weniger ausgibt.|Indem|Sodass|Damit|*Wie?* (nasıl?) sorusunun cevabı yöntemdir → *Indem …*: daha az harcayarak.||*Sodass* olmaz: *sodass* sonuç bildirir ve cümle başına gelmez; *Wie?* yöntem sorar.|*Damit* olmaz: *damit* amaç bildirir (*Wozu?* sorusunun cevabı); *Wie?* yöntem sorar.","Ich war krank, ___ ich nicht kommen konnte. (bu yüzden)|sodass|indem|weil|Hastalığın sonucu: gelemedim → *sodass*. Yan cümle, çekimli fiil (*konnte*) sonda.|so dass/weshalb/weswegen|*indem* olmaz: *indem* yöntem (-erek) bildirir; burada hastalığın sonucu var.|*weil* olmaz: *weil* sebep bildirir (çünkü); gelememek hastalığın sebebi değil, sonucu."],
g38:["Das ist alles, ___ ich weiß.|was|das|wo|*alles* belirsiz bir zamirdir; ondan sonra ilgi zamiri olarak *was* gelir: *alles, was ich weiß*.||*das* olmaz: *alles*'ten sonra ilgi zamiri *das* değil, *was* olur.|*wo* olmaz: *wo* yer bildirir; *alles* bir yer değil.","Es gibt nichts, ___ er nicht isst.|was|dass|wo|*nichts* belirsiz bir zamirdir; ondan sonra ilgi zamiri *was* gelir: *nichts, was …*||*dass* olmaz: *dass* bağlaçtır (-dığı), ilgi zamiri değil; *nichts*'ten sonra *was*.|*wo* olmaz: *wo* yer bildirir; burada yer değil, yenen şey var.","Das ist die Stadt, ___ ich geboren bin.|wo|was|wann|Yer bildiren isimden (*die Stadt*) sonra *wo* gelebilir. *in der* de doğru: *die Stadt, in der ich geboren bin*.|in der|*was* olmaz: *was* *alles, nichts* gibi zamirlerden sonra gelir; somut bir yer için *wo*.|*wann* olmaz: *wann* zaman bildirir; *die Stadt* bir yer, zaman değil.","Das Beste, ___ du machen kannst, ist schlafen.|was|dass|wo|İsimleşmiş en üstünlükten (*das Beste*) sonra ilgi zamiri *was* gelir.||*dass* olmaz: *dass* bağlaçtır, ilgi zamiri değil; *das Beste*'den sonra *was*.|*wo* olmaz: *wo* yer bildirir; *das Beste* bir yer değil.","Er hat angerufen, ___ ich mich sehr freue.|worüber|was|wofür|*sich freuen über* + bütün cümleye gönderme → *wo* + *über* = *worüber*. Edat ünlüyle başlarsa araya *r* girer.||*was* olmaz: *sich freuen* edat ister (*über*); edatlı fiilde *wo(r)* + edat kullanılır.|*wofür* olmaz: bir olaya sevinmek *sich freuen über* ile kurulur, *für* ile değil.","Gibt es etwas, ___ ich dir helfen kann?|wobei|was|worüber|*bei etwas helfen* = bir konuda yardım etmek → *wo* + *bei* = *wobei*. *helfen mit* ile *womit* de doğru.|womit|*was* olmaz: *helfen* yardım edilen işi edatla bağlar (*bei*); edatsız *was* olmaz.|*worüber* olmaz: *helfen über* diye bir kalıp yok; *helfen bei/mit* → *wobei/womit*.","Das ist das Café, ___ wir uns kennengelernt haben.|wo|was|wann|*das Café* bir yer → *wo*. *in dem* de doğru: *das Café, in dem wir uns kennengelernt haben*.|in dem|*was* olmaz: somut bir yerden sonra *was* değil, *wo* ya da *in dem* gelir.|*wann* olmaz: *wann* zaman bildirir; *das Café* bir yer.","Vieles, ___ er sagt, stimmt nicht.|was|dass|wo|*vieles* belirsiz bir zamirdir; ondan sonra ilgi zamiri *was* gelir: *Vieles, was …*||*dass* olmaz: *dass* bağlaçtır, ilgi zamiri değil; *vieles*'ten sonra *was*.|*wo* olmaz: *wo* yer bildirir; söylenen şeyler yer değil."],
g39:["Wenn ich doch mehr Zeit ___! (haben)|hätte|habe|hatte|Gerçekleşmemiş dilek (keşke): *Wenn … doch* + Konjunktiv II, fiil sonda: *haben* → *hätte*. Geçmiş için *gehabt hätte*.|gehabt hätte|*habe* olmaz: bu Präsens (gerçek durum); keşke anlamı için Konjunktiv II *hätte* gerekir.|*hatte* olmaz: noktasız *hatte* geçmiş zamandır (vaktim vardı); dilek için *hätte*.","Er tut so, als ob er alles ___. (wissen)|wüsste|wusste|würde|*als ob* gerçek dışı karşılaştırma (-mış gibi) kurar → Konjunktiv II, fiil sonda: *wissen* → *wüsste*.|wisse/wissen würde|*wusste* olmaz: noktasız *wusste* geçmiş zamandır (biliyordu); -mış gibi için *wüsste*.|*würde* olmaz: *würde* sonda bir mastar ister (*wissen würde*); tek başına anlam vermez.","Ich wünschte, ich ___ fließend Deutsch sprechen. (können)|könnte|kann|konnte|*Ich wünschte, …* gerçekleşmemiş dilek bildirir → Konjunktiv II: *können* → *könnte*, mastar (*sprechen*) sonda.||*kann* olmaz: bu Präsens (gerçek durum); *Ich wünschte* Konjunktiv II ister.|*konnte* olmaz: noktasız *konnte* geçmiş zamandır (yapabildim); dilek için *könnte*.","Du siehst aus, als ob du nicht geschlafen ___.|hättest|wärst|hattest|Geçmişte olmuş gibi: *als ob* + Partizip II + *hätte/wäre*. *schlafen* *haben* alır; *du* ile *hättest*.||*wärst* olmaz: *schlafen* yer değiştirme anlatmaz, Perfekt'te *haben* alır.|*hattest* olmaz: noktasız *hattest* geçmiş zamandır (Plusquamperfekt); -mış gibi için *hättest*.","Wenn ich nur früher angefangen ___!|hätte|habe|wäre|Geçmişe dönük dilek: Partizip II + *hätte/wäre*. *anfangen* Perfekt'te *haben* alır → *angefangen hätte*.||*habe* olmaz: bu gerçek geçmiş (Perfekt); keşke anlamı için Konjunktiv II *hätte* gerekir.|*wäre* olmaz: *anfangen* Perfekt'te *haben* alır (*ich habe angefangen*), *sein* değil.","Sie redet, als ob sie die Chefin ___. (sein)|wäre|war|würde|*als ob* + Konjunktiv II, fiil sonda: *sein* → *wäre* (patronmuş gibi). Resmî dilde Konjunktiv I *sei* de olur.|sei|*war* olmaz: noktasız *war* geçmiş zamandır (patrondu); -mış gibi için *wäre*.|*würde* olmaz: *würde* sonda bir mastar ister; *sein* için kısaca *wäre* kullanılır.","Wenn er doch endlich ___! (kommen)|käme|kommt|kam|Dilek kalıbı *Wenn … doch …!* Konjunktiv II ister: *kommen* → *käme* (*kommen würde* de olur).|kommen würde|*kommt* olmaz: bu Präsens (geliyor); dilek cümlesi Konjunktiv II ister.|*kam* olmaz: noktasız *kam* geçmiş zamandır (geldi); dilek için *käme*.","Ich wünschte, du ___ hier. (sein)|wärst|bist|warst|*Ich wünschte* + Konjunktiv II: *sein* → *du wärst* (keşke burada olsan).|wärest|*bist* olmaz: bu Präsens (buradasın); *Ich wünschte* Konjunktiv II ister.|*warst* olmaz: noktasız *warst* geçmiş zamandır (buradaydın); dilek için *wärst*."],
g40:["Ich muss eine Entscheidung ___.|treffen|machen|geben|Kalıp: *eine Entscheidung treffen* = karar vermek. (Resmî dilde *fällen* de olur.)|fällen|*machen* olmaz: İngilizcedeki 'make a decision' gibi düşünme; Almancada *treffen*.|*geben* olmaz: Türkçedeki 'karar vermek' gibi düşünme; *Entscheidung* ile *treffen* kullanılır.","Darf ich eine Frage ___?|stellen|fragen|machen|Kalıp: *eine Frage stellen* = soru sormak. Fiil isme göre seçilir.||*fragen* olmaz: *eine Frage fragen* tekrar olur; isimle birlikte *stellen* kullanılır.|*machen* olmaz: *Frage* ile *machen* kullanılmaz; doğrusu *eine Frage stellen*.","Bitte nehmen Sie ___ auf die Nachbarn.|Rücksicht|Vorsicht|Abschied|Kalıp: *Rücksicht nehmen auf* + Akkusativ = birini düşünmek, ona saygı göstermek.||*Vorsicht* olmaz: *Vorsicht* dikkat/tedbir demek; *Vorsicht nehmen* diye bir kalıp yok.|*Abschied* olmaz: *Abschied nehmen* vedalaşmak demek ve *von* ile kurulur, *auf* ile değil.","Das kommt nicht in ___.|Frage|Rolle|Bescheid|Kalıp: *in Frage kommen* = söz konusu olmak; *nicht in Frage* = asla olmaz. (*in Betracht kommen* de aynı anlam.)|Betracht|*Rolle* olmaz: *Rolle* *eine Rolle spielen* kalıbında kullanılır, *in … kommen* ile değil.|*Bescheid* olmaz: *Bescheid* *Bescheid sagen/geben* kalıbında kullanılır.","Kannst du mir ___ sagen, wenn du ankommst? (haber vermek)|Bescheid|Rat|Frage|Kalıp: *jemandem Bescheid sagen* = birine haber vermek.||*Rat* olmaz: *Rat* tavsiye demek ve *einen Rat geben* ile kullanılır.|*Frage* olmaz: *Frage* *stellen* ile kullanılır; haber vermek *Bescheid sagen*.","Geld spielt keine ___.|Rolle|Frage|Hilfe|Kalıp: *eine/keine Rolle spielen* = önemli olmak/olmamak.||*Frage* olmaz: *Frage* *spielen* ile kullanılmaz (*eine Frage stellen*); önem için *Rolle*.|*Hilfe* olmaz: *Hilfe spielen* diye bir kalıp yok; önem için *eine Rolle spielen*.","Darf ich einen Vorschlag ___?|machen|stellen|treffen|Kalıp: *einen Vorschlag machen* = öneride bulunmak. (Resmî dilde *unterbreiten* de olur.)|unterbreiten|*stellen* olmaz: *stellen* *Frage* ile gider (*eine Frage stellen*); öneri için *machen*.|*treffen* olmaz: *treffen* *Entscheidung* ile gider; öneri için *machen*.","Ich habe mit der Firma Kontakt ___. (iletişime geçmek)|aufgenommen|gemacht|gegeben|Kalıp: *Kontakt aufnehmen (mit)* = iletişime geçmek; Partizip II *aufgenommen*. (*Kontakt herstellen* de olur.)|hergestellt|*gemacht* olmaz: *Kontakt machen* doğal bir kalıp değil; iletişime geçmek *Kontakt aufnehmen*.|*gegeben* olmaz: *Kontakt geben* diye bir kalıp yok; doğrusu *aufgenommen*."]
};

/* ---------------- konu dersleri: ek boşluk doldurma (GX2) ve yazma görevleri (PR) ---------------- */
var GX2={
g1:["Wir ___ gestern ins Kino gegangen.|sind|haben|ist|*gehen* yer değiştirme anlatır → Perfekt'te *sein*; *wir* ile *sind*.||*haben* olmaz: *gehen* hareket fiili, Perfekt'te *sein* alır.|*ist* olmaz: *ist* *er/sie/es* çekimidir; *wir* ile *sind*.","Er hat lange ___. (schlafen)|geschlafen|geschlaft|schläft|*schlafen* düzensiz fiil: Partizip II *-en* ile biter → *geschlafen*.||*geschlaft* olmaz: düzensiz fiil *-t* değil *-en* alır.|*schläft* olmaz: bu Präsens çekimi; *hat* ile sonda Partizip II gerekir.","Habt ihr den Film ___? (sehen)|gesehen|gesieht|sahen|*sehen* düzensiz fiil: Partizip II *gesehen* (kök değişmez, *-en* ile biter).||*gesieht* olmaz: *sieht* Präsens kökü; Partizip *gesehen* olur.|*sahen* olmaz: bu Präteritum; Perfekt'te *habt* ile Partizip II gerekir.","Ich ___ meinen Schlüssel vergessen.|habe|bin|hat|*vergessen* nesne alır, hareket bildirmez → *haben*; *ich* ile *habe*. (*ver-* yüzünden Partizip'te *ge-* yok.)||*bin* olmaz: *vergessen* yer ya da durum değişimi anlatmaz, *haben* alır.|*hat* olmaz: *hat* *er/sie/es* çekimidir; *ich* ile *habe*."],
g2:["Ihr ___ gestern nicht kommen. (können)|konntet|könnt|konnten|*können* → *konnte*; *ihr* ile *-t* eklenir: *konntet*.||*könnt* olmaz: bu Präsens; *gestern* geçmiş ister.|*konnten* olmaz: *wir/sie/Sie* çekimi; *ihr* ile *konntet*.","Damals ___ ich Lehrer werden. (wollen)|wollte|will|wollten|*wollen* → *wollte*; *ich* ile ek almaz. *Damals* (o zamanlar) geçmişi gösterir.||*will* olmaz: bu Präsens; *Damals* geçmiş ister.|*wollten* olmaz: *wir/sie/Sie* çekimi; *ich* ile *wollte*.","Wir ___ letzten Montag arbeiten. (müssen)|mussten|müssen|musste|*müssen* → *musste*; *wir* ile *-n* eklenir: *mussten*. *letzten Montag* = geçen pazartesi.||*müssen* olmaz: bu Präsens; *letzten Montag* geçmiş ister.|*musste* olmaz: *ich/er* çekimi; *wir* ile *mussten*.","Durftest du als Jugendlicher abends lange ___? (ausgehen)|ausgehen|ausgegangen|gehst aus|Modal fiilden sonra ayrılabilen fiil de mastar olarak sonda ve bitişik durur: *ausgehen*.||*ausgegangen* olmaz: bu Partizip II; modal fiilden sonra mastar gelir.|*gehst aus* olmaz: çekimli fiil zaten *durftest*; ikinci fiil bitişik mastar kalır."],
g3:["Ich weiß, dass er heute ___. (kommen)|kommt|kommen|kommt er|*dass* yan cümlesinde çekimli fiil sona gider; *er* ile *kommt*.||*kommen* olmaz: bu mastar; *er* ile *kommt*.|*kommt er* olmaz: özne (*er*) zaten başta; yan cümlede fiil tek başına en sonda durur.","Wenn ich Zeit habe, ___ ich dich an. (anrufen)|rufe|rufen|ruft|Yan cümle başta → ana cümle çekimli fiille başlar: *rufe ich dich an* (*anrufen* ayrılır, *an* sona gider).||*rufen* olmaz: *wir/sie/Sie* çekimi; *ich* ile *rufe*.|*ruft* olmaz: *er/sie/es* ya da *ihr* çekimi; *ich* ile *rufe*.","Er bleibt zu Hause, weil er Fieber ___.|hat|haben|hatte er|*weil* yan cümlesinde çekimli fiil en sona gider: *weil er Fieber hat*.||*haben* olmaz: bu mastar; *er* ile *hat*.|*hatte er* olmaz: özne yan cümlede fiilden önce zaten var; fiil tek başına sonda durur.","Ich hoffe, ___ das Wetter morgen gut ist.|dass|wenn|weil|*hoffen*'in içeriği (-masını umuyorum) *dass* ile gelir; fiil sonda: *gut ist*.||*wenn* olmaz: koşul bildirir; neyin umulduğunu *dass* söyler.|*weil* olmaz: sebep bildirir; burada umudun içeriği var, sebep yok."],
g4:["Ich hänge die Jacke an ___ Haken.|den|dem|der|Nesneli *hängen* = asmak (Wohin?) → Akkusativ; *der Haken* → *den Haken*.|einen|*dem* olmaz: Dativ; ceketi bir yere asıyorsun (Wohin?).|*der* olmaz: *Haken* eril; Akkusativ'de *den* olur.","Die Jacke hängt an ___ Haken.|dem|den|der|Nesnesiz *hängen* = asılı durmak (Wo?) → Dativ; *der Haken* → *dem Haken*.|einem|*den* olmaz: Akkusativ; ceket orada asılı duruyor (Wo?).|*der* olmaz: *Haken* eril; Dativ'de *dem* olur.","Setz dich neben ___! (ich)|mich|mir|ich|*sich setzen* oturmaya geçmektir (Wohin?) → Akkusativ: *ich* → *mich*.||*mir* olmaz: Dativ; *sich setzen* hareket bildirir (Wohin?) → Akkusativ.|*ich* olmaz: yalın hâl; edattan sonra Akkusativ gerekir.","Die Katze sitzt unter ___ Tisch.|dem|den|der|*sitzen* durum bildirir (Wo?) → Dativ; *der Tisch* → *dem Tisch*.|einem|*den* olmaz: Akkusativ; *sitzen* durum bildirir (Wo?).|*der* olmaz: *Tisch* eril; Dativ'de *dem* olur."],
g5:["Ich antworte ___ morgen. (sie = onlar)|ihnen|sie|ihren|*antworten* (birine cevap vermek) Dativ ister: *sie* (onlar) → *ihnen*.||*sie* olmaz: bu Nominativ/Akkusativ; *antworten* Dativ ister.|*ihren* olmaz: bu iyelik sözcüğü (onların …); zamir olarak *ihnen* gerekir.","Das Buch gehört ___. (wir)|uns|unser|wir|*gehören* Dativ ister: *wir* → *uns*. *Das Buch gehört uns.* = Kitap bizim.||*unser* olmaz: bu iyelik sözcüğü (bizim …); *gehören* ile zamir *uns* gelir.|*wir* olmaz: bu yalın hâl (özne); nesne yerinde *uns* gerekir.","Hilfst du ___? (er)|ihm|ihn|er|*helfen* Dativ ister: *er* → *ihm*.||*ihn* olmaz: bu Akkusativ; *helfen* Dativ ister.|*er* olmaz: bu yalın hâl (özne); nesne yerinde *ihm* gerekir.","Die Schuhe passen ___ nicht. (ich)|mir|mich|ich|*passen* (beden olarak uymak) Dativ ister: *ich* → *mir*. Özne *die Schuhe*'dir.||*mich* olmaz: bu Akkusativ; *passen* Dativ ister.|*ich* olmaz: bu yalın hâl (özne); nesne yerinde *mir* gerekir."],
g6:["Wir freuen ___ auf den Urlaub.|uns|euch|sich|*sich freuen auf* (dört gözle beklemek): *wir* → *uns*.||*euch* olmaz: *euch* *ihr* öznesine aittir.|*sich* olmaz: *wir* ile dönüşlü zamir *uns* olur.","Ich bedanke ___ herzlich für die Einladung.|mich|mir|sich|*sich bedanken für* dönüşlüdür ve Akkusativ alır: *ich* → *mich*. (*danken* ise Dativ: *Ich danke dir.*)||*mir* olmaz: *danken* ile karıştırma; *sich bedanken* Akkusativ *mich* ister.|*sich* olmaz: *ich* öznesiyle *mich* kullanılır.","Hast du ___ erkältet?|dich|dir|sich|*sich erkälten* (üşütmek) dönüşlüdür, Perfekt'te *haben* alır: *du* → *dich*.||*dir* olmaz: başka nesne yok; zamir Akkusativ *dich*.|*sich* olmaz: *du* öznesiyle *dich* kullanılır.","Ich putze ___ zweimal am Tag die Zähne. (kendi dişlerimi)|mir|mich|sich|Vücut bölümü Akkusativ nesne olunca (*die Zähne*) dönüşlü zamir Dativ olur: *ich* → *mir*.||*mich* olmaz: Akkusativ nesne zaten *die Zähne*; zamir Dativ *mir* olmalı.|*sich* olmaz: *ich* öznesiyle *mir* kullanılır."],
g7:["Das Wetter ist heute ___ als gestern. (gut)|besser|guter|mehr gut|*gut* düzensizdir: *gut – besser – am besten*.||*guter* olmaz: *gut* düzensizdir, karşılaştırması *besser*.|*mehr gut* olmaz: \"daha\" için *mehr* kullanılmaz; *gut*in karşılaştırması *besser*.","Welcher Berg in Deutschland ist am ___? (hoch)|höchsten|hochsten|höher|*hoch* düzensizdir: *hoch – höher – am höchsten*; en üstünlükte Umlaut alır.||*hochsten* olmaz: Umlaut gerekir: *am höchsten*.|*höher* olmaz: bu karşılaştırma (daha yüksek); *am* ile *-sten* gelir.","Mein Auto ist so schnell ___ deins.|wie|als|dann|*so* + sıfat + *wie* eşitlik bildirir: *so schnell wie* = … kadar hızlı.||*als* olmaz: *als* yalnız *-er* ile (karşılaştırma) kullanılır; *so … wie* kalıbında *wie* gelir.|*dann* olmaz: *dann* \"sonra\" demektir, karşılaştırma bildirmez.","Wer hat diese Woche am ___ trainiert? (viel)|meisten|vielsten|mehr|*viel* düzensizdir: *viel – mehr – am meisten*.||*vielsten* olmaz: böyle bir biçim yok; *viel*in en üstünlüğü *am meisten*.|*mehr* olmaz: bu karşılaştırma (daha çok); *am* ile *meisten* gelir."],
g8:["___ Sie morgen kurz Zeit? (haben, Konjunktiv II)|Hätten|Hättest|Würden|Kibar soru: *Hätten Sie …?* (*haben* → *hätten*). *Sie* ile *-en* eki.||*Hättest* olmaz: *du* çekimidir; *Sie* ile *Hätten*.|*Würden* olmaz: *würden* sonda bir mastar ister; burada mastar yok.","Ich ___ gern wissen, wann der Kurs beginnt. (werden, Konjunktiv II)|würde|werde|wurde|*Ich würde gern* + mastar sonda = … isterdim. Kibar soru kalıbı: *Ich würde gern wissen, …*||*werde* olmaz: bu gelecek zaman yardımcı fiili; kibar istek için *würde*.|*wurde* olmaz: Umlaut'suz hâli geçmiş zamandır.","___ du bitte leiser sprechen? (können, Konjunktiv II)|Könntest|Konntest|Könnten|*du* ile *können* → *könntest*: *Könntest du …?* Mastar *sprechen* sonda.||*Konntest* olmaz: Umlaut'suz hâli geçmiş zamandır, rica bildirmez.|*Könnten* olmaz: *wir/sie/Sie* çekimidir; *du* ile *Könntest*.","Würden Sie mir bitte ___? (helfen)|helfen|geholfen|hilft|*würden* + mastar: asıl fiil mastar hâlinde sonda: *helfen*.||*geholfen* olmaz: bu Partizip II; *würden* mastar ister.|*hilft* olmaz: çekimli fiil; sonda mastar *helfen* gelir."],
g9:["Ich mag den ___ Kaffee hier. (stark)|starken|starke|starker|*den* = Akkusativ eril → sıfat *-en* alır: *den starken Kaffee*.||*starke* olmaz: Akkusativ'de *-e* sadece *die/das* ile gelir; *den* sonrası *-en*.|*starker* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Die ___ Lehrerin ist sehr freundlich. (neu)|neue|neuen|neuer|Fiil *ist* tekil → *die Lehrerin* dişil tekil Nominativ; sıfat *-e*: *die neue Lehrerin*.||*neuen* olmaz: *die* + *-en* sadece çoğulda olur (*die neuen Lehrerinnen*); burada tekil.|*neuer* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Wir fahren mit dem ___ Auto. (alt)|alten|alte|altes|*mit* + Dativ → *dem Auto*; Dativ'de sıfat hep *-en*: *mit dem alten Auto*.||*alte* olmaz: *-e* Nominativ ve Akk. *die/das* içindir; Dativ'de *-en*.|*altes* olmaz: *-es* *ein* sonrası gelir; *dem* sonrası sıfat *-en* alır.","Die ___ Kinder spielen im Garten. (klein)|kleinen|kleine|kleiner|*Kinder* çoğul; *die* + çoğul → sıfat *-en*: *die kleinen Kinder*.||*kleine* olmaz: *die* + *-e* tekil içindir; çoğulda *-en* gelir.|*kleiner* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır."],
g10:["Ich warte schon ___ einer Stunde auf dich. (bir saattir)|seit|vor|in|Bir saat önce başladı, hâlâ sürüyor → *seit* + Dativ: *seit einer Stunde*.||*vor* olmaz: *vor einer Stunde* = bir saat önce; hâlâ süren beklemeyi anlatmaz.|*in* olmaz: *in einer Stunde* = bir saat sonra (gelecek).","___ morgen habe ich Urlaub. (yarından itibaren)|Ab|Seit|Vor|Gelecekte başlayan durum → *ab* (= -den itibaren): *ab morgen*.||*Seit* olmaz: *seit* sadece geçmişte başlamış durumlar içindir; *morgen* gelecek.|*Vor* olmaz: *vor* 'önce' demektir, 'itibaren' değil.","___ dem Training dusche ich. (antrenmandan sonra)|Nach|Vor|Seit|'-den sonra' → *nach* + Dativ: *nach dem Training*.||*Vor* olmaz: *vor dem Training* = antrenmandan önce.|*Seit* olmaz: *seit* = -den beri (hâlâ süren durum); 'sonra' anlamı vermez.","Er kommt ___ zehn Minuten. (on dakika sonra)|in|vor|seit|Şu andan itibaren gelecekte 'sonra' → *in*: *in zehn Minuten*.||*vor* olmaz: *vor zehn Minuten* = on dakika önce; *kommt* (şimdi/gelecek) ile çelişir.|*seit* olmaz: *seit* hâlâ süren durum içindir, gelecekteki olayı anlatmaz."],
g11:["Er fährt mit einem ___ Fahrrad zur Arbeit. (neu)|neuen|neues|neuem|*mit* + Dativ: *einem* hâli ve cinsiyeti zaten gösteriyor → sıfat *-en*: *mit einem neuen Fahrrad*.||*neues* olmaz: *-es* Nominativ/Akkusativ nötr; *mit* Dativ ister.|*neuem* olmaz: *-em* sadece artikel yokken gelir (*mit neuem Fahrrad*); *einem* sonrası *-en*.","Ich suche einen ___ Job. (gut)|guten|guter|gute|*einen* = Akkusativ eril → sıfat *-en*: *einen guten Job*.||*guter* olmaz: *-er* Nominativ eril eki (*ein guter Job*); burada Akkusativ.|*gute* olmaz: *-e* dişil (*eine gute*) içindir; *Job* eril.","Das ist eine ___ Frage. (gut)|gute|guten|guter|*eine* + dişil Nominativ → sıfat *-e*: *eine gute Frage*.||*guten* olmaz: *-en* Akk. eril, Dativ ya da çoğul içindir; burada dişil Nominativ.|*guter* olmaz: *-er* eril (*ein guter*) içindir; *Frage* dişil.","Wir brauchen ___ Ideen für das Projekt. (neu)|neue|neuen|neuer|Artikelsiz çoğul → sıfat *die*'nin sonunu alır, *-e*: *neue Ideen*.||*neuen* olmaz: çoğulda *-en* artikel varken gelir (*die/keine neuen Ideen*).|*neuer* olmaz: *-er* eril tekil Nominativ eki; *Ideen* çoğul."],
g12:["___ wartest du? – Auf meinen Bruder.|Auf wen|Worauf|Auf wem|Kişi sorulurken *wo(r)-* kullanılmaz: edat + *wen* (Akk.) → *Auf wen wartest du?*||*Worauf* olmaz: *wo(r)-* sadece şeyler içindir; cevap bir kişi (*meinen Bruder*).|*Auf wem* olmaz: *warten auf* Akkusativ ister → *wen*; *wem* Dativ.","Wir nehmen ___ dem Kurs teil.|an|in|bei|*teilnehmen* sabit olarak *an* + Dativ alır: *an dem (am) Kurs teilnehmen*.||*in* olmaz: 'kursun içinde' diye düşünme; *teilnehmen* *an* ister.|*bei* olmaz: *teilnehmen* her zaman *an* ile gelir.","___ denkst du? – An meinen Urlaub.|Woran|Wofür|Worauf|Cevap *an* + şey → soru *wo(r)* + *an*: *Woran?* (*an* ünlüyle başladığı için araya *r* girer).||*Wofür* olmaz: *für* ile kurulan soru; *denken* *an* alır.|*Worauf* olmaz: *auf* ile kurulan soru (*warten auf*); cevapta *an* var.","Er kümmert sich ___ die Kinder.|um|für|an|*sich kümmern* (ilgilenmek, bakmak) sabit olarak *um* + Akkusativ alır: *sich um die Kinder kümmern*.||*für* olmaz: 'çocuklar için' diye düşünme; *sich kümmern* *um* alır.|*an* olmaz: *sich kümmern* *an* ile gelmez; doğrusu *um*."],
g13:["Weißt du, wo er jetzt ___? (wohnen)|wohnt|wohnt er|wohnen|W-kelimeli dolaylı soruda çekimli fiil sona gider: *wo er jetzt wohnt*.||*wohnt er* olmaz: özne *er* zaten önde; yan cümlede fiil özneden sonra, en sonda gelir.|*wohnen* olmaz: özne *er* → çekimli biçim *wohnt*.","Ich frage mich, wann der Kurs morgen ___. (anfangen)|anfängt|fängt an|anfangen|Yan cümlede ayrılabilen fiil ayrılmaz, sonda birleşir: *anfangen* → *wann der Kurs anfängt*.||*fängt an* olmaz: bu ana cümle sırası; yan cümlede ön ek fiile yapışır: *anfängt*.|*anfangen* olmaz: özne *der Kurs* tekil → çekimli biçim *anfängt*.","Können Sie mir sagen, ob ich hier parken ___? (dürfen)|darf|darf ich|dürfen|*ob* yan cümlesinde modal fiil en sona, mastarın arkasına gider: *ob ich hier parken darf*. Kibar *dürfte* de doğru.|dürfte|*darf ich* olmaz: yan cümlede devrik sıra yok; özne *ich* önde, *darf* en sonda.|*dürfen* olmaz: özne *ich* → çekimli biçim *darf*.","Er fragt, ob ich morgen ___. (mitkommen)|mitkomme|komme mit|mitkommen|*ob* yan cümlesinde ayrılabilen fiil sonda birleşir: *ob ich morgen mitkomme*.||*komme mit* olmaz: bu ana cümle sırası; yan cümlede ön ek ayrılmaz: *mitkomme*.|*mitkommen* olmaz: özne *ich* → çekimli biçim *mitkomme*."],
g14:["Du ___ mal mit deinem Chef sprechen. (können, Konjunktiv II)|könntest|konntest|könnte|Yumuşak tavsiye: *können* → Konjunktiv II *könntest*: şefinle bir konuşabilirsin.||*konntest* olmaz: noktasız biçim geçmiş zamandır (konuşabildin); tavsiye için *könntest*.|*könnte* olmaz: *ich/er* biçimidir; *du* ile *-st* eki gelir: *könntest*.","Wenn ich du ___, würde ich das nicht machen.|wäre|bin|war|*Wenn ich du wäre* = ben sen olsam; gerçek dışı koşul olduğu için *sein* → *wäre*.||*bin* olmaz: Präsens gerçek durum anlatır; ben sen olamam, gerçek dışı koşul *wäre* ister.|*war* olmaz: *war* geçmiş zamandır; olsam anlamı için *wäre*.","Ich ___ gern mehr Zeit. (haben, Konjunktiv II)|hätte|wäre|würde|*haben*'in Konjunktiv II'si *hätte*: *Ich hätte gern mehr Zeit* = daha çok vaktim olsun isterdim.||*wäre* olmaz: *Zeit* sahip olunan bir şeydir, *haben* ister: *hätte*.|*würde* olmaz: *würde* mastar ister; burada mastar yok, *hätte* tek başına yeter.","An Ihrer Stelle ___ ich keine Angst. (haben, Konjunktiv II)|hätte|würde|wäre|*Angst haben* → Konjunktiv II *hätte*: *An Ihrer Stelle hätte ich keine Angst* (yerinizde olsam korkmazdım).||*würde* olmaz: mastar yok; *würde … haben* yerine kısaca *hätte* kullanılır.|*wäre* olmaz: *Angst* ile *haben* kullanılır (*Angst haben*), *sein* değil."],
g15:["Der Müll ___ jeden Montag abgeholt.|wird|werden|hat|*der Müll* tekil → *wird* + Partizip II: çöp her pazartesi alınır.||*werden* olmaz: çoğul biçimdir; *der Müll* tekil → *wird*.|*hat* olmaz: *hat abgeholt* etken Perfekt olur (çöp aldı?); edilgen *werden* ile kurulur.","Hier werden frische Brötchen ___. (verkaufen)|verkauft|verkaufen|verkaufte|*werden* + Partizip II = edilgen: *verkaufen* → *verkauft* (*ver-* ile *ge-* yok). Burada taze ekmek satılır.||*verkaufen* olmaz: *werden* + mastar gelecek zaman olur (ekmekler satacak?); edilgen için Partizip II.|*verkaufte* olmaz: bu Präteritum biçimidir; *werden* ile Partizip II gelir: *verkauft*.","Um 19 Uhr wird das Abendessen ___. (servieren)|serviert|servieren|geserviert|*-ieren* ile biten fiiller Partizip'te *ge-* almaz: *servieren* → *serviert*.||*servieren* olmaz: *werden* + mastar gelecek zaman olur (yemek servis yapacak?); edilgen için *serviert*.|*geserviert* olmaz: *-ieren* ile biten fiiller *ge-* almaz: *serviert*.","Ich ___ morgen am Knie operiert.|werde|wird|habe|*werden* özneye göre çekimlenir: *ich werde, du wirst, er wird* → *Ich werde operiert* (ameliyat edileceğim).||*wird* olmaz: *er/sie/es* biçimidir; *ich* ile *werde*.|*habe* olmaz: *habe operiert* etken olur (ben ameliyat ettim?); edilgen *werden* ile kurulur."],
g16:["Die Jacke, ___ du heute trägst, ist sehr schön.|die|den|der|*die Jacke* dişil; yan cümlede nesne (Akkusativ) ama dişil Akkusativ de *die* → *die du trägst*.|welche|*den* olmaz: *den* sadece eril Akkusativ'dir; dişil Akkusativ *die* kalır.|*der* olmaz: *der* eril Nominativ ya da dişil Dativ'dir; *tragen* Akkusativ ister → *die*.","Der Kuchen, ___ du gebacken hast, ist lecker.|den|der|das|Ana cümlede *der Kuchen* özne ama yan cümlede nesne (neyi pişirdin?); hâl yan cümleden gelir → *den*.|welchen|*der* olmaz: yan cümlede özne *du*; kek nesnedir → eril Akkusativ *den*.|*das* olmaz: *das* nötr içindir; *der Kuchen* eril.","Ich kenne einen Mann, ___ fünf Sprachen spricht.|der|den|die|Ana cümlede *einen Mann* Akkusativ ama yan cümlede özne (kim konuşuyor?) → *der*. Hâl yan cümleden gelir.|welcher|*den* olmaz: ana cümledeki *einen*'e bakılmaz; yan cümlede özne olduğu için Nominativ *der*.|*die* olmaz: *die* dişil ya da çoğul içindir; *Mann* eril.","Die Schuhe, ___ ich gekauft habe, sind bequem.|die|den|das|*die Schuhe* çoğul; yan cümlede nesne → çoğulda Akkusativ de *die*.|welche|*den* olmaz: *den* eril tekil Akkusativ'dir; çoğulda Akkusativ *die*.|*das* olmaz: *das* nötr tekil içindir; *die Schuhe* çoğul."],
