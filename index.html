["g6","A2.1","Reflexive Verben","sich freuen, sich duschen, sich treffen … Dönüşlü zamir özneye uyar: mich, dich, sich, uns, euch, sich.",[["Ich dusche mich nach dem Training.","Antrenmandan sonra duş alırım.",["345102"]],["Wir treffen uns um acht Uhr.","Saat sekizde buluşuyoruz.",["345102"]],["Freust du dich auf den Urlaub?","Tatili dört gözle bekliyor musun?"],["Er erholt sich am Wochenende.","Hafta sonu dinleniyor.",["34102"]],["Ich muss mich beeilen.","Acele etmem lazım."],["Sie interessiert sich für Fotografie.","Fotoğrafçılığa ilgi duyuyor.",["34102"]]]],
["g7","A2.1","Komparativ und Superlativ","-er ile karşılaştırma (schneller als), am …-sten ile en üstünlük. Tek heceliler çoğu zaman Umlaut alır (alt → älter). Düzensiz: gut–besser–am besten, viel–mehr–am meisten, gern–lieber–am liebsten.",[["Heute bin ich schneller gelaufen als gestern.","Bugün dünden daha hızlı koştum.",["2103456","0123564","2103564"]],["Mein Bruder ist älter als ich.","Kardeşim benden büyük."],["Am liebsten trinke ich Tee.","En çok çay içmeyi severim.",["32014","42301"]],["Das ist die beste Pizza der Stadt.","Bu, şehrin en iyi pizzası."],["Kniebeugen sind schwerer als Liegestütze.","Squat şınavdan daha zor."],["Im Winter trainiere ich mehr als im Sommer.","Kışın yazdan daha çok antrenman yaparım.",["32614507"]]]],
["g8","A2.1","Konjunktiv II: höfliche Bitten","Kibar rica: Könnten Sie …? Würden Sie …? Ich hätte gern … Dürfte ich …?",[["Könnten Sie mir bitte helfen?","Bana yardım edebilir misiniz?"],["Ich hätte gern einen Kaffee.","Bir kahve rica ediyorum.",["34102"]],["Würden Sie bitte das Fenster schließen?","Pencereyi kapatır mısınız lütfen?",["013425"]],["Könntest du mich morgen anrufen?","Yarın beni arayabilir misin?"],["Wir hätten gern einen Tisch für zwei Personen.","İki kişilik bir masa rica ediyoruz.",["34567102"]],["Dürfte ich kurz Ihr Telefon benutzen?","Telefonunuzu kısa bir süre kullanabilir miyim?",["013425"]]]],
["g9","A2.1","Adjektivdeklination nach bestimmtem Artikel","der/die/das sonrası sıfat: Nominativ tekilde ve die/das Akkusativ'de -e, geri kalan her yerde -en.",[["Der neue Kollege kommt aus Spanien.","Yeni iş arkadaşı İspanya'dan geliyor.",["453012"]],["Ich nehme die kleine Hantel.","Küçük dambılı alıyorum.",["23410"]],["Das alte Fahrrad ist kaputt.","Eski bisiklet bozuk."],["Wir sprechen mit dem neuen Trainer.","Yeni antrenörle konuşuyoruz.",["234510"]],["Ich kaufe den roten Pullover.","Kırmızı kazağı alıyorum.",["23410"]],["Die frischen Brötchen schmecken gut.","Taze ekmekler lezzetli."]]],
["g10","A2.1","Temporale Präpositionen","vor, nach, seit, in + Dativ; bis, ab, für. seit = -den beri, vor = önce, in = sonra (gelecekte).",[["Ich lerne seit einem Jahr Deutsch.","Bir yıldır Almanca öğreniyorum.",["234105","510234"]],["Vor dem Frühstück gehe ich joggen.","Kahvaltıdan önce koşuya çıkarım.",["430125","534012"]],["Nach der Arbeit treffe ich meine Freunde.","İşten sonra arkadaşlarımla buluşurum.",["4301256","4356012","5634012"]],["In zwei Wochen fahren wir in den Urlaub.","İki hafta sonra tatile gidiyoruz.",["43512067","06734512"]],["Ab Montag habe ich mehr Zeit.","Pazartesiden itibaren daha çok vaktim olacak.",["320145","452301"]],["Das Fitnessstudio ist bis zehn Uhr geöffnet.","Spor salonu saat ona kadar açık.",["3452016"]]]],
["g11","A2.2","Adjektivdeklination mit ein/kein und ohne Artikel","ein/kein/mein sonrası sıfat, artikelin vermediği ipucunu taşır: ein neuer Plan, ein neues Auto. Artikelsiz sıfat artikelin ekini alır: frischer Kaffee, kaltes Wasser.",[["Ich habe einen neuen Trainingsplan.","Yeni bir antrenman planım var.",["23410"]],["Das ist ein schönes Restaurant.","Bu güzel bir restoran.",["23410"]],["Er trinkt nur kaltes Wasser.","Sadece soğuk su içiyor.",["23410"]],["Wir suchen eine größere Wohnung.","Daha büyük bir daire arıyoruz.",["23410"]],["Mit frischem Gemüse schmeckt die Suppe besser.","Taze sebzeyle çorba daha lezzetli olur.",["4530126"]],["Ich habe keine gute Idee.","İyi bir fikrim yok."]]],
["g12","A2.2","Verben mit Präpositionen · worauf / darauf","warten auf, sich freuen auf, denken an, sich interessieren für … Şey için soru: wo(r)+edat (Worauf?), cevap: da(r)+edat (darauf). İnsan için: Auf wen?",[["Ich warte auf den Bus.","Otobüsü bekliyorum.",["23410"]],["Worauf freust du dich?","Neyi dört gözle bekliyorsun?"],["Ich freue mich schon darauf.","Şimdiden onu dört gözle bekliyorum.",["41023"]],["Denkst du an den Termin morgen?","Yarınki randevuyu unutmadın, değil mi?"],["Wofür interessierst du dich?","Neyle ilgileniyorsun?"],["Wir sprechen morgen darüber.","Yarın bunun hakkında konuşuruz.",["2103","3102"]]]],
["g13","A2.2","Indirekte Fragen: ob, W-Fragen","Dolaylı soru bir yan cümledir, fiil sona gider: Weißt du, wann …? Evet/hayır sorusunda ob kullanılır.",[["Weißt du, wann das Training beginnt?","Antrenmanın ne zaman başladığını biliyor musun?"],["Ich weiß nicht, ob ich morgen Zeit habe.","Yarın vaktim olur mu bilmiyorum.",["34567,102"]],["Können Sie mir sagen, wo der Bahnhof ist?","Garın nerede olduğunu söyleyebilir misiniz?"],["Er fragt, ob wir mitkommen.","Bizim de gelip gelmeyeceğimizi soruyor."],["Ich möchte wissen, wie viel das kostet.","Bunun ne kadar tuttuğunu öğrenmek istiyorum.",["3456,102"]],["Weißt du, warum sie nicht gekommen ist?","Neden gelmediğini biliyor musun?"]]],
["g14","A2.2","Konjunktiv II: Ratschläge und Wünsche","Tavsiye: Du solltest … / An deiner Stelle würde ich … Dilek: Ich würde gern … / Ich wäre gern … / Wenn ich … hätte, würde ich …",[["Du solltest mehr Wasser trinken.","Daha çok su içmelisin.",["23104"]],["An deiner Stelle würde ich zum Arzt gehen.","Senin yerinde olsam doktora giderdim.",["43012567"]],["Ich würde gern besser Deutsch sprechen.","Daha iyi Almanca konuşmak isterdim.",["014235","410235","012435","210345"]],["Wenn ich mehr Zeit hätte, würde ich jeden Tag trainieren.","Daha çok vaktim olsa her gün antrenman yapardım.",["15789,06234"]],["Sie sollten nicht so viel arbeiten.","Bu kadar çok çalışmamalısınız.",["341025"]],["Ich wäre jetzt gern am Meer.","Şu an deniz kenarında olmak isterdim.",["210345","451023","310245"]]]],
["g15","A2.2","Passiv Präsens","werden + Partizip II: kimin yaptığı değil, ne yapıldığı önemli. Das Essen wird gekocht.",[["Das Fitnessstudio wird um sechs Uhr geöffnet.","Spor salonu saat altıda açılıyor.",["3452016"]],["Hier wird Deutsch gesprochen.","Burada Almanca konuşulur.",["2103"]],["Die Pakete werden morgen geliefert.","Paketler yarın teslim ediliyor.",["32014"]],["Der Salat wird mit Öl und Essig gemacht.","Salata yağ ve sirkeyle yapılır.",["34562017","01236547","36542017"]],["Die Besprechung wird verschoben.","Toplantı erteleniyor."],["In Deutschland wird viel Brot gegessen.","Almanya'da çok ekmek yenir.",["342015"]]]],
["g16","A2.2","Relativsätze (Nominativ, Akkusativ)","İlgi zamiri ismin artikeline benzer: der, die, das; eril Akkusativ'de den. Fiil sona gider.",[["Das ist der Trainer, der mir hilft.","Bu bana yardım eden antrenör."],["Ich suche eine Wohnung, die nicht so teuer ist.","O kadar pahalı olmayan bir daire arıyorum."],["Das Buch, das ich lese, ist sehr spannend.","Okuduğum kitap çok heyecanlı."],["Der Kollege, den ich gestern getroffen habe, ist nett.","Dün karşılaştığım iş arkadaşı nazik biri."],["Wo ist die Flasche, die ich gekauft habe?","Aldığım şişe nerede?"],["Das ist ein Gericht, das man schnell kochen kann.","Bu çabuk pişirilebilen bir yemek."]]],
["g17","A2.2","Infinitiv mit zu","Bazı fiil ve kalıplardan sonra zu + mastar sona gider: Ich habe keine Lust, … zu …; Es ist wichtig, … zu … Ayrılabilen fiilde zu araya girer: aufzustehen.",[["Ich habe keine Lust, heute zu kochen.","Bugün yemek yapmaya hiç hevesim yok.",["01423,56","41023,56"]],["Es ist wichtig, jeden Tag zu üben.","Her gün pratik yapmak önemli.",["210,3456"]],["Vergiss nicht, die Tür abzuschließen!","Kapıyı kilitlemeyi unutma!"],["Ich versuche, früher aufzustehen.","Daha erken kalkmaya çalışıyorum."],["Hast du Zeit, mir zu helfen?","Bana yardım etmeye vaktin var mı?"],["Sie hat angefangen, Deutsch zu lernen.","Almanca öğrenmeye başladı."]]],
["g18","A2.2","deshalb, deswegen, darum","Sonuç bildirir. İkinci ana cümlenin ilk yerinde durur, çekimli fiil hemen arkasından gelir: …, deshalb gehe ich …",[["Ich bin müde, deshalb gehe ich früh ins Bett.","Yorgunum, bu yüzden erken yatıyorum.",["012,543678"]],["Es regnet, deswegen bleiben wir zu Hause.","Yağmur yağıyor, bu yüzden evde kalıyoruz.",["01,43256"]],["Er hatte Muskelkater, darum hat er nicht trainiert.","Kas ağrısı vardı, bu yüzden antrenman yapmadı.",["012,54367"]],["Der Zug hatte Verspätung, deshalb kam ich zu spät.","Tren rötar yaptı, bu yüzden geç kaldım.",["0123,65478"]],["Ich möchte in Deutschland arbeiten, deshalb lerne ich Deutsch.","Almanya'da çalışmak istiyorum, bu yüzden Almanca öğreniyorum.",["01234,7658","23174,5608","23174,0658"]],["Das Restaurant war voll, deswegen haben wir zu Hause gegessen.","Restoran doluydu, bu yüzden evde yedik.",["0123,654789"]]]],
["g19","A2.2","Präteritum","Yazılı anlatımın geçmiş zamanı: düzenli fiil -te alır (machte), düzensizde kök değişir (ging, kam, sah). sein/haben konuşmada da Präteritum: war, hatte.",[["Gestern war ich sehr müde.","Dün çok yorgundum.",["21034","34120"]],["Als Kind hatte ich einen Hund.","Çocukken bir köpeğim vardı.",["320145","452301"]],["Er kam um acht Uhr nach Hause.","Saat sekizde eve geldi.",["2341056","5610234"]],["Wir gingen nach dem Essen spazieren.","Yemekten sonra yürüyüşe çıktık.",["234105","510234"]],["Die Besprechung dauerte zwei Stunden.","Toplantı iki saat sürdü.",["34201"]],["Sie sah sehr glücklich aus.","Çok mutlu görünüyordu.",["23104"]]]],
["g20","A2.2","Lokale Präpositionen: zu, nach, bei, aus, von","Nereye: zu (kişi/kurum), nach (şehir/ülke, nach Hause), in (içine). Nerede: bei (kişinin yanında), zu Hause. Nereden: aus (içinden), von (kişiden/yerden).",[["Ich gehe heute zum Arzt.","Bugün doktora gidiyorum.",["21034","34102"]],["Sie wohnt noch bei ihren Eltern.","Hâlâ annesiyle babasının yanında oturuyor.",["345102"]],["Er kommt gerade aus dem Supermarkt.","Şu an süpermarketten geliyor.",["210345","345102"]],["Wir fahren am Freitag nach Berlin.","Cuma günü Berlin'e gidiyoruz.",["231045","451023"]],["Ich komme gerade vom Training.","Antrenmandan geliyorum.",["21034","34102"]],["Heute Abend bleibe ich zu Hause.","Bu akşam evde kalıyorum.",["320145","452301"]]]],
["g21","B1.1","obwohl / trotzdem","obwohl yan cümle kurar, fiil sona gider. trotzdem ana cümlede ilk yerde durur, fiil hemen arkasından gelir.",[["Ich gehe heute ins Fitnessstudio, obwohl ich Muskelkater habe.","Kas ağrım olmasına rağmen bugün spora gidiyorum.",["21634,5078","5678,10234"]],["Ich habe Muskelkater, trotzdem gehe ich ins Fitnessstudio.","Kas ağrım var, yine de spora gidiyorum.",["012,54367"]],["Obwohl es regnet, laufen wir im Park.","Yağmur yağmasına rağmen parkta koşuyoruz.",["4356,012","5634,012"]],["Er ist krank, trotzdem arbeitet er.","Hasta, yine de çalışıyor.",["012,543"]],["Obwohl ich wenig Zeit hatte, habe ich gekocht.","Az vaktim olmasına rağmen yemek yaptım.",["157,06234"]],["Das Wetter war schlecht, trotzdem war der Ausflug schön.","Hava kötüydü, yine de gezi güzeldi.",["0123,67548"]]]],
["g22","B1.1","als / wenn","Geçmişte bir kez olan → als. Geçmişte tekrarlanan ya da şimdi/gelecek → wenn.",[["Als ich ein Kind war, habe ich viel Fußball gespielt.","Çocukken çok futbol oynardım.",["15789,06234"]],["Wenn ich nach Hause kam, war das Essen schon fertig.","Eve her geldiğimde yemek hazır olurdu.",["67589,01234"]],["Als wir in Berlin waren, hat es geregnet.","Berlin'deyken yağmur yağdı.",["657,01234"]],["Wenn ich Zeit habe, lese ich ein Buch.","Vaktim olduğunda kitap okurum.",["1467,0523"]],["Als ich ankam, war die Besprechung schon vorbei.","Vardığımda toplantı çoktan bitmişti.",["45367,012"]],["Immer wenn es schneite, gingen wir Ski fahren.","Ne zaman kar yağsa kayağa giderdik.",["54067,123"]]]],
["g23","B1.1","Plusquamperfekt und nachdem","Geçmişte daha önce olan: hatte/war + Partizip II. Çoğu zaman nachdem ile: Nachdem ich gegessen hatte, …",[["Nachdem ich trainiert hatte, habe ich geduscht.","Antrenman yaptıktan sonra duş aldım.",["146,0523"]],["Als ich ankam, war der Zug schon abgefahren.","Vardığımda tren çoktan kalkmıştı.",["45367,012"]],["Nachdem sie gegessen hatten, gingen sie spazieren.","Yemek yedikten sonra yürüyüşe çıktılar.",["146,0523"]],["Ich hatte den Schlüssel vergessen.","Anahtarı unutmuştum.",["23104"]],["Nachdem er die E-Mail gelesen hatte, rief er mich an.","E-postayı okuduktan sonra beni aradı.",["1689,072345"]],["Wir hatten vorher noch nie Sushi gegessen.","Daha önce hiç suşi yememiştik.",["2103456","5102346"]]]],
["g24","B1.1","bevor, während, seit, bis","bevor = -meden önce, während = -irken, seit(dem) = -den beri, bis = -e kadar. Hepsi yan cümle: fiil sona.",[["Bevor ich zur Arbeit gehe, trinke ich Kaffee.","İşe gitmeden önce kahve içerim.",["157,06234"]],["Während ich koche, höre ich Podcasts.","Yemek yaparken podcast dinlerim.",["135,042"]],["Seit ich Sport mache, schlafe ich besser.","Spor yapmaya başladığımdan beri daha iyi uyuyorum.",["146,0523"]],["Warte, bis ich fertig bin!","Ben bitirene kadar bekle!"],["Während er telefonierte, wartete ich draußen.","O telefonla konuşurken ben dışarıda bekledim.",["435,012"]],["Bevor wir essen, waschen wir uns die Hände.","Yemek yemeden önce ellerimizi yıkarız.",["13567,042"]]]],
["g25","B1.1","Relativsätze im Dativ und mit Präposition","Dativ ilgi zamirleri: dem, der, dem, denen. Edatlı fiilde edat zamirin önüne gelir: der Freund, mit dem ich trainiere.",[["Das ist der Freund, mit dem ich trainiere.","Bu birlikte antrenman yaptığım arkadaşım."],["Die Kollegin, der ich geholfen habe, hat sich bedankt.","Yardım ettiğim iş arkadaşı teşekkür etti.",["01678,2345"]],["Das ist das Thema, über das wir gesprochen haben.","Bu hakkında konuştuğumuz konu."],["Die Leute, denen ich die Wohnung gezeigt habe, waren nett.","Daireyi gösterdiğim insanlar nazikti.",["0189,234567"]],["Das ist die Firma, bei der ich arbeite.","Bu çalıştığım firma."],["Der Termin, auf den ich warte, ist nächste Woche.","Beklediğim randevu gelecek hafta."]]],
["g26","B1.1","Konjunktiv II der Vergangenheit","Geçmişte gerçekleşmemiş durum: hätte/wäre + Partizip II. Pişmanlık: Ich hätte … sollen.",[["Wenn ich mehr geschlafen hätte, wäre ich nicht so müde.","Daha çok uyusaydım bu kadar yorgun olmazdım.",["15789,06234"]],["Ich hätte gestern trainieren sollen.","Dün antrenman yapmalıydım.",["21034"]],["Wenn du angerufen hättest, wäre ich gekommen.","Arasaydın gelirdim.",["546,0123"]],["Das hätte ich nicht gedacht.","Bunu hiç tahmin etmezdim.",["21034"]],["Wir wären fast zu spät gekommen.","Neredeyse geç kalıyorduk.",["210345"]],["Hättest du das gewusst?","Bunu bilir miydin?"]]],
["g27","B1.1","Genitiv · wegen, trotz, während","Sahiplik: des Mannes, der Frau, des Kindes. wegen, trotz, während + Genitiv (konuşmada Dativ de duyulur).",[["Wegen des Regens bleiben wir zu Hause.","Yağmur yüzünden evde kalıyoruz.",["4301256"]],["Trotz des Muskelkaters bin ich gelaufen.","Kas ağrısına rağmen koştum.",["430125"]],["Während der Besprechung war mein Handy aus.","Toplantı sırasında telefonum kapalıydı.",["4530126"]],["Das ist das Auto meines Bruders.","Bu kardeşimin arabası."],["Am Ende des Tages bin ich müde.","Günün sonunda yorgun oluyorum.",["5401236"]],["Die Farbe der Wände gefällt mir.","Duvarların rengi hoşuma gidiyor.",["540123"]]]],
["g28","B1.1","um … zu / damit","Amaç: özne aynıysa um … zu + mastar; özne farklıysa damit + yan cümle.",[["Ich trainiere, um fit zu bleiben.","Formda kalmak için antrenman yapıyorum.",["2345,10"]],["Ich lerne Deutsch, um in Deutschland zu arbeiten.","Almanya'da çalışmak için Almanca öğreniyorum.",["34567,102"]],["Ich erkläre es noch einmal, damit du es verstehst.","Anlayasın diye bir kez daha açıklıyorum.",["5628,10734"]],["Sie spart Geld, um ein Auto zu kaufen.","Araba almak için para biriktiriyor.",["34567,102"]],["Wir sprechen leise, damit das Baby schläft.","Bebek uyusun diye sessiz konuşuyoruz.",["3456,102"]],["Er steht früh auf, um vor der Arbeit zu laufen.","İşten önce koşmak için erken kalkıyor.",["456789,1023"]]]],
["g29","B1.1","Zweiteilige Konnektoren","sowohl … als auch (hem … hem), weder … noch (ne … ne), entweder … oder (ya … ya), nicht nur … sondern auch (sadece … değil … de).",[["Ich trinke sowohl Kaffee als auch Tee.","Hem kahve hem çay içerim.",["2345610"]],["Er hat weder Zeit noch Lust.","Ne vakti var ne hevesi.",["234510"]],["Entweder trainieren wir heute oder morgen.","Ya bugün ya yarın antrenman yapıyoruz.",["210345","034512"]],["Sie spricht nicht nur Deutsch, sondern auch Englisch.","Sadece Almanca değil, İngilizce de konuşuyor.",["234,56710"]],["Das Essen war weder warm noch lecker.","Yemek ne sıcaktı ne lezzetli.",["3456201"]],["Wir können entweder kochen oder bestellen.","Ya yemek yaparız ya sipariş veririz.",["210345"]]]],
["g30","B1.1","Futur I","werden + mastar sona: gelecek, tahmin ya da söz. Gündelik dilde Präsens + zaman ifadesi de yeter.",[["Ich werde nächstes Jahr die B1-Prüfung machen.","Gelecek yıl B1 sınavına gireceğim.",["2310456","4510236","0145236"]],["Morgen wird es regnen.","Yarın yağmur yağacak.",["2103"]],["Er wird wohl noch im Büro sein.","Herhalde hâlâ ofistedir.",["4510236"]],["Wir werden das schon schaffen.","Bunu elbet başaracağız.",["21034"]],["Ich werde ab jetzt jeden Tag üben.","Bundan sonra her gün pratik yapacağım.",["2310456"]],["Wirst du am Wochenende Zeit haben?","Hafta sonu vaktin olacak mı?"]]],
["g31","B1.2","Passiv: Präteritum, Perfekt, mit Modalverb","Präteritum: wurde + Partizip II. Perfekt: ist + Partizip II + worden. Modal fiille: muss + Partizip II + werden.",[["Das Haus wurde 1950 gebaut.","Ev 1950'de yapıldı.",["32014"]],["Die Besprechung ist abgesagt worden.","Toplantı iptal edildi."],["Der Antrag muss bis Freitag abgegeben werden.","Başvuru cumaya kadar teslim edilmeli.",["3420156"]],["Das Paket wurde gestern geliefert.","Paket dün teslim edildi.",["32014"]],["Hier darf nicht geraucht werden.","Burada sigara içilemez."],["Die Ergebnisse sind schon veröffentlicht worden.","Sonuçlar çoktan açıklandı."]]],
["g32","B1.2","n-Deklination","Bazı eril isimler (çoğu -e ile biten canlılar ve -ent, -ist, -ant) Nominativ dışında -(e)n alır: der Kollege → den/dem Kollegen.",[["Ich frage den Kollegen.","İş arkadaşıma soruyorum.",["2310"]],["Kennst du den neuen Studenten?","Yeni öğrenciyi tanıyor musun?"],["Wir sprechen mit dem Präsidenten.","Başkanla konuşuyoruz.",["23410"]],["Ich habe morgen einen Termin beim Kunden.","Yarın müşteride bir randevum var.",["2103456","0125634","2105634","5610234"]],["Der Junge hilft dem Nachbarn.","Oğlan komşuya yardım ediyor.",["34201"]],["Hast du den Namen vergessen?","Adı unuttun mu?"]]],
["g33","B1.2","je … desto","je + karşılaştırma + yan cümle (fiil sona), desto + karşılaştırma + ana cümle (fiil hemen sonra).",[["Je mehr ich übe, desto besser spreche ich.","Ne kadar çok pratik yaparsam o kadar iyi konuşuyorum.",["2645,0173"]],["Je früher wir anfangen, desto schneller sind wir fertig.","Ne kadar erken başlarsak o kadar çabuk biteriz.",["26458,0173"]],["Je schwerer das Gewicht ist, desto weniger Wiederholungen schaffe ich.","Ağırlık ne kadar ağırsa o kadar az tekrar yapabiliyorum.",["98567,01234"]],["Je länger ich in Deutschland lebe, desto mehr verstehe ich.","Almanya'da ne kadar uzun yaşarsam o kadar çok şey anlıyorum.",["2867,019345"]],["Je älter er wird, desto ruhiger wird er.","Yaşlandıkça sakinleşiyor.",["2345,0176"]],["Je öfter ich die Wörter wiederhole, desto leichter merke ich sie mir.","Kelimeleri ne kadar sık tekrar edersem o kadar kolay aklımda tutuyorum."]]],
["g34","B1.2","Partizip I und II als Adjektiv","Partizip I (mastar + d) etken ve eşzamanlı: das schlafende Kind. Partizip II edilgen ya da bitmiş: das gekochte Ei. Sıfat gibi çekimlenir.",[["Das schlafende Kind ist sehr süß.","Uyuyan çocuk çok tatlı.",["453012"]],["Ich esse gern gekochte Eier.","Haşlanmış yumurta yemeyi severim.",["34102","21034"]],["Wir haben ein gebrauchtes Auto gekauft.","İkinci el bir araba aldık.",["234105"]],["Die steigenden Preise sind ein Problem.","Artan fiyatlar bir sorun.",["453012"]],["Der reparierte Computer funktioniert wieder.","Tamir edilen bilgisayar yeniden çalışıyor."],["Das ist ein gut bezahlter Job.","Bu iyi maaşlı bir iş.",["234510"]]]],
["g35","B1.2","ohne … zu / statt … zu","ohne … zu = -meden, statt … zu = -mek yerine. Özne farklıysa ohne dass / statt dass.",[["Er ist gegangen, ohne sich zu verabschieden.","Vedalaşmadan gitti.",["3456,102"]],["Statt zu trainieren, bin ich zu Hause geblieben.","Antrenman yapmak yerine evde kaldım.",["43167,052"]],["Sie hat den Vertrag unterschrieben, ohne ihn zu lesen.","Sözleşmeyi okumadan imzaladı.",["5678,10234"]],["Statt Auto zu fahren, nehme ich das Fahrrad.","Araba kullanmak yerine bisiklete biniyorum.",["5467,0123"]],["Ich trainiere nie, ohne mich aufzuwärmen.","Isınmadan asla antrenman yapmam.",["345,102"]],["Statt zu kochen, haben wir Pizza bestellt.","Yemek yapmak yerine pizza söyledik.",["4356,012","5346,012"]]]],
["g36","B1.2","lassen","Bir işi başkasına yaptırmak: Ich lasse das Auto reparieren. İzin vermek: Lass mich gehen. Perfekt'te genelde mastar: Ich habe es reparieren lassen.",[["Ich lasse mir die Haare schneiden.","Saçımı kestiriyorum.",["341025"]],["Wir lassen das Auto reparieren.","Arabayı tamir ettiriyoruz.",["23104"]],["Lass mich bitte ausreden!","Lütfen sözümü bitirmeme izin ver!",["2013"]],["Sie hat ihr Fahrrad reparieren lassen.","Bisikletini tamir ettirdi.",["231045"]],["Ich lasse meine Tasche im Auto.","Çantamı arabada bırakıyorum.",["231045","451023"]],["Lassen Sie uns morgen weitersprechen.","Yarın konuşmaya devam edelim."]]],
["g37","B1.2","indem / sodass","indem = -erek (yöntem), sodass = öyle ki / bu yüzden (sonuç). İkisi de yan cümle.",[["Man lernt Wörter am besten, indem man sie jeden Tag wiederholt.","Kelimeler en iyi her gün tekrar edilerek öğrenilir.",["34162,50789a","21634,50789a"]],["Ich bleibe fit, indem ich dreimal pro Woche trainiere.","Haftada üç gün antrenman yaparak formda kalıyorum.",["345678,102"]],["Es hat stark geregnet, sodass das Spiel ausgefallen ist.","Çok yağmur yağdı, öyle ki maç iptal oldu."],["Er hat verschlafen, sodass er den Zug verpasst hat.","Uyuyakaldı, bu yüzden treni kaçırdı."],["Sie verbessert ihr Deutsch, indem sie Podcasts hört.","Podcast dinleyerek Almancasını geliştiriyor.",["4567,1023","2315,4067"]],["Der Kurs war sehr gut, sodass ich viel gelernt habe.","Kurs çok iyiydi, öyle ki çok şey öğrendim."]]],
["g38","B1.2","Relativpronomen was, wo, wo(r)+Präposition","alles, nichts, etwas, das ve en üstünlükten sonra → was. Yer için → wo. Edatlı fiilde ve bütün cümleye gönderme → wo(r)+edat.",[["Das ist alles, was ich weiß.","Bütün bildiğim bu."],["Es gibt nichts, was er nicht isst.","Yemediği hiçbir şey yok."],["Das ist die Stadt, wo ich geboren bin.","Bu doğduğum şehir."],["Das Beste, was du machen kannst, ist schlafen.","Yapabileceğin en iyi şey uyumak.",["7601,2345"]],["Er hat endlich angerufen, worüber ich mich sehr freue.","Sonunda aradı, buna çok sevindim.",["2103,45678"]],["Das Fitnessstudio, wo ich trainiere, ist sehr groß.","Antrenman yaptığım spor salonu çok büyük."]]],
["g39","B1.2","Konjunktiv II: irreale Wünsche, als ob","Gerçekleşmemiş dilek: Wenn ich doch … hätte! Gerçek dışı karşılaştırma: Er tut so, als ob er … wäre.",[["Wenn ich doch mehr Zeit hätte!","Keşke daha çok vaktim olsa!"],["Er tut so, als ob er alles wüsste.","Her şeyi biliyormuş gibi davranıyor."],["Wenn ich nur früher angefangen hätte!","Keşke daha erken başlasaydım!"],["Du siehst aus, als ob du nicht geschlafen hättest.","Hiç uyumamış gibi görünüyorsun."],["Ich wünschte, ich könnte fließend Deutsch sprechen.","Keşke akıcı Almanca konuşabilsem.",["01,23546"]],["Sie redet, als ob sie die Chefin wäre.","Patronmuş gibi konuşuyor."]]],
["g40","B1.2","Nomen-Verb-Verbindungen","Kalıplaşmış isim + fiil: eine Entscheidung treffen, eine Frage stellen, Rücksicht nehmen, in Frage kommen. Anlam isimden gelir.",[["Ich muss eine Entscheidung treffen.","Bir karar vermem lazım."],["Darf ich eine Frage stellen?","Bir soru sorabilir miyim?"],["Wir sollten auf die Nachbarn Rücksicht nehmen.","Komşuları düşünmeliyiz.",["0152346","2341056"]],["Der Trainer hat mir einen guten Rat gegeben.","Antrenör bana iyi bir tavsiye verdi.",["32014567","45623017"]],["Das kommt nicht in Frage.","Bu söz konusu bile olamaz."],["Ich habe mit ihm Kontakt aufgenommen.","Onunla iletişime geçtim.",["231045","014235"]]]]
];
/* ---------------- konu özetleri (Türkçe) ----------------
   Biçim: [başlık, metin]. Metinde *…* Almanca örnektir (kalın), satır sonu \n. */
var GS={
g1:[['Ne işe yarar?','Konuşmada geçmişi anlatmanın ana yolu. "Dün ne yaptın?" sorusunun cevabı neredeyse her zaman Perfekt\'tir.'],
 ['Nasıl kurulur?','haben/sein çekimli hâliyle 2. sırada, Partizip II en sonda:\n*Ich habe gestern Pizza gegessen.*\nDüzenli fiil: ge + kök + t → *gemacht, gekauft, gelernt*\nDüzensiz fiil: ge + (değişen) kök + en → *gegangen, getrunken, geschrieben*\nAyrılabilen fiil: ön ek + ge + kök → *eingekauft, aufgestanden*\n-ieren ile biten ve be-, ver-, er-, ent- ile başlayanlar ge- almaz → *trainiert, besucht, verstanden*'],
 ['haben mi, sein mi?','Yer değiştirme (gehen, fahren, fliegen, laufen, kommen) ve durum değişimi (aufstehen, einschlafen, werden) → *sein*.\nAyrıca sein, bleiben, passieren → *sein*.\nGeri kalan çoğunluk → *haben*.'],
 ['Dikkat','Partizip cümlenin sonuna gider; araya ne girerse girsin: *Ich bin am Wochenende mit dem Zug nach Hamburg gefahren.*'],
 ['Türkçe ile','Türkçedeki "-dı/-di" geçmişi. Fark şu: Almanca fiili ikiye böler, baş (habe/bin) öne, son (gemacht) en arkaya gider.']],
g2:[['Ne işe yarar?','Geçmişte "yapabildim, zorundaydım, istedim, izin vardı" demek için. Modal fiillerde konuşmada da Perfekt yerine bu kullanılır.'],
 ['Nasıl kurulur?','Kök + te, Umlaut düşer:\nkönnen → *konnte* · müssen → *musste* · dürfen → *durfte*\nwollen → *wollte* · sollen → *sollte* · mögen → *mochte*\nÇekim: ich konnte, du konntest, er konnte, wir konnten, ihr konntet, sie konnten\nAsıl fiil mastar hâlinde en sonda: *Ich musste gestern lange arbeiten.*'],
 ['Dikkat','ich ve er/sie/es aynı, ek almaz: *er konnte*.\n"möchte"nin geçmişi yoktur; yerine *wollte* kullanılır: *Ich wollte einen Kaffee.*'],
 ['Türkçe ile','"yapmak zorundaydım" = *ich musste … machen*\n"yapamadım" = *ich konnte … nicht machen*']],
g3:[['Ne işe yarar?','weil = çünkü (sebep) · dass = -dığını (içerik) · wenn = -se / -dığında (koşul, zaman).'],
 ['Nasıl kurulur?','Yan cümlede çekimli fiil en sona gider: *…, weil ich müde bin.*\nYardımcı fiil varsa en sonda o durur: *…, weil ich lange gearbeitet habe.* / *…, dass ich morgen arbeiten muss.*\nYan cümle başa gelirse ana cümle fiille başlar: *Wenn es regnet, bleibe ich zu Hause.* (fiil, virgül, fiil)'],
 ['Dikkat','*denn* de "çünkü" demek ama ana cümle kurar, fiil yerinde kalır: *…, denn ich bin müde.*\nAyrılabilen fiil yan cümlede birleşir: *…, weil ich früh aufstehe.*'],
 ['Türkçe ile','Türkçede fiil hep sondadır; Almanca yan cümle bu yüzden sana tanıdık gelecek.']],
g4:[['Ne işe yarar?','Dokuz edat (in, an, auf, über, unter, vor, hinter, neben, zwischen) hem Dativ hem Akkusativ alabilir. Hangisini alacağını soru belirler.'],
 ['Nasıl kurulur?','Wo? (nerede, durum) → Dativ: *Das Buch liegt auf dem Tisch.*\nWohin? (nereye, hareket) → Akkusativ: *Ich lege das Buch auf den Tisch.*\nÇiftler: liegen (Dat.) ↔ legen (Akk.) · stehen ↔ stellen · sitzen ↔ setzen · hängen ↔ hängen\nKısaltmalar: in dem = *im*, in das = *ins*, an dem = *am*, an das = *ans*'],
 ['Artikel tablosu','Dativ: dem (der) · der (die) · dem (das) · den + n (çoğul)\nAkkusativ: den (der) · die (die) · das (das) · die (çoğul)'],
 ['Türkçe ile','Wo = "-de" (masada) → Dativ. Wohin = "-e" (masaya) → Akkusativ.']],
g5:[['Ne işe yarar?','Bazı fiillerin nesnesi Dativ olur. Çoğu Türkçede de "-e" ile kurulur: birine yardım etmek, birine teşekkür etmek.'],
 ['Sık kullanılanlar','helfen, danken, gefallen, gehören, schmecken, passen, gratulieren, antworten, glauben (birine), fehlen, wehtun, zuhören'],
 ['Zamirler','mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen'],
 ['Dikkat','*Das gefällt mir.* = Bu hoşuma gidiyor. Özne "das"tır, "ich" değil!\n*Mir ist kalt.* = Üşüyorum.\n"Ich helfe dich" değil, *Ich helfe dir*.']],
g6:[['Ne işe yarar?','Eylem öznenin kendisine döner. Bazı fiiller ise sırf kalıp olarak dönüşlüdür (sich freuen, sich beeilen).'],
 ['Zamirler','ich → mich · du → dich · er/sie/es → sich · wir → uns · ihr → euch · sie/Sie → sich\nVücut bölümüyle Dativ: *Ich wasche mir die Hände.*'],
 ['Sık kullanılanlar','sich freuen, sich treffen, sich beeilen, sich erholen, sich duschen, sich fühlen, sich ausruhen, sich interessieren für, sich erinnern an'],
 ['Dikkat','Perfekt\'te hep haben: *Ich habe mich gefreut.*\nYan cümlede zamir özneden hemen sonra: *…, weil ich mich auf den Urlaub freue.*'],
 ['Türkçe ile','Türkçedeki "-n" ve "-ş" ekleri (yıkanmak, buluşmak) çoğu zaman dönüşlü fiile denk gelir.']],
g7:[['Nasıl kurulur?','Karşılaştırma: sıfat + er + als → *schneller als*\nEn üstünlük: am + sıfat + sten → *am schnellsten*\nİsmin önünde: *der schnellste Läufer*'],
 ['Umlaut ve düzensizler','alt → älter → am ältesten · groß → größer · jung → jünger · kalt → kälter\ngut – besser – am besten\nviel – mehr – am meisten\ngern – lieber – am liebsten\nhoch – höher – am höchsten'],
 ['Dikkat','Karşılaştırmada *als*, eşitlikte *so … wie*: *Er ist so groß wie ich.*\n"mehr schnell" denmez, *schneller* denir.'],
 ['Türkçe ile','"daha" = -er, "en" = am …-sten.']],
g8:[['Ne işe yarar?','Rica ederken kibarlık katar. Mağazada, ofiste, telefonda her gün lazım olur.'],
 ['Kalıplar','*Könnten Sie …?* = …ebilir misiniz?\n*Würden Sie …?* = …r mısınız?\n*Ich hätte gern …* = … istiyorum (kibar)\n*Dürfte ich …?* = …ebilir miyim?'],
 ['Çekim','ich könnte, du könntest, er könnte, wir könnten\nich hätte, du hättest · ich würde, du würdest'],
 ['Dikkat','Asıl fiil mastar hâlinde en sonda: *Könnten Sie mir bitte helfen?*']],
g9:[['Kural','der/die/das (ve dieser, jeder, welcher) sonrası sıfat ya -e ya -en alır.\n-e: Nominativ tekil (*der neue Plan, die neue Idee, das neue Auto*) ve Akkusativ\'de die/das (*die neue Idee, das neue Auto*)\n-en: geri kalan her yer: *den neuen Plan*, tüm Dativ (*mit dem neuen Plan*), tüm çoğul (*die neuen Pläne*)'],
 ['İpucu','Artikel cinsiyeti zaten gösterdiği için sıfat sadece -e ya da -en alır. Emin değilsen -en de: çoğu durumda doğrudur.'],
 ['Türkçe ile','Türkçede sıfat değişmez. Almancada sıfat önündeki artikele göre ek alır.']],
g10:[['Liste','*vor* + Dat. = önce: vor dem Essen\n*nach* + Dat. = sonra: nach der Arbeit\n*seit* + Dat. = -den beri (hâlâ sürüyor): seit einem Jahr\n*in* + Dat. = sonra (gelecekte): in zwei Wochen\n*ab* = itibaren: ab Montag · *bis* = kadar: bis Freitag\n*für* + Akk. = süresince (plan): für zwei Wochen\n*um* = saat: um acht Uhr · *am* = gün: am Montag, am Abend · *im* = ay, mevsim: im Mai, im Sommer'],
 ['Dikkat','seit ile şimdiki zaman kullanılır: *Ich lerne seit einem Jahr Deutsch.*\nvor geçmişte "önce" demektir: *vor zwei Jahren* = iki yıl önce.']],
g11:[['Kural','ein/kein/mein sonrası sıfat, artikelin göstermediği cinsiyeti kendisi gösterir.\nNom.: *ein neuer Plan* (der) · *eine neue Idee* (die) · *ein neues Auto* (das)\nAkk.: *einen neuen Plan* · *eine neue Idee* · *ein neues Auto*\nDativ\'de hep -en: *mit einem neuen Plan*'],
 ['Artikelsiz','Sıfat artikelin sonunu alır: *frischer Kaffee* (der) · *frische Milch* (die) · *frisches Brot* (das) · *mit frischem Gemüse* (dem)'],
 ['Dikkat','Çoğulda kein/mein ile hep -en: *keine guten Ideen*. Artikelsiz çoğul -e: *gute Ideen*.']],
g12:[['Ne işe yarar?','Bazı fiiller sabit bir edatla gelir. Edatı fiille birlikte ezberle.'],
 ['Sık kullanılanlar','warten auf + Akk. · sich freuen auf (gelecek) / über (olan) · denken an + Akk. · sich interessieren für · sprechen über · Angst haben vor + Dat. · teilnehmen an + Dat. · sich kümmern um · träumen von'],
 ['Soru ve cevap','Şey sorulurken: wo(r) + edat → *Worauf wartest du?*\nŞey için cevap: da(r) + edat → *Ich warte darauf.*\n(Edat ünlüyle başlıyorsa araya r girer: worüber, darauf)\nKişi için: edat + zamir → *Auf wen wartest du? – Auf ihn.*'],
 ['Dikkat','*Ich freue mich auf den Urlaub* (gelecek) ↔ *Ich freue mich über das Geschenk* (oldu).']],
g13:[['Nasıl kurulur?','Girişler: *Weißt du, …* · *Können Sie mir sagen, …* · *Ich möchte wissen, …*\nW-sorusu: soru kelimesi kalır, fiil sona: *Weißt du, wann der Zug kommt?*\nEvet/hayır sorusu: ob + fiil sona: *Ich weiß nicht, ob er kommt.*'],
 ['Dikkat','ob ≠ wenn. Koşul "eğer" → wenn; "-ip -mediğini" → ob.'],
 ['Türkçe ile','"Trenin ne zaman geldiğini biliyor musun?" Türkçede de soru cümlenin içine gömülür.']],
g14:[['Kalıplar','Tavsiye: *Du solltest …* (yapmalısın) · *An deiner Stelle würde ich …*\nDilek: *Ich würde gern …* · *Ich hätte gern …* · *Ich wäre gern …*\nKoşul: *Wenn ich Zeit hätte, würde ich …*'],
 ['Biçim','Çoğu fiil: würde + mastar.\nsein, haben ve modallar kendi biçimiyle: wäre, hätte, könnte, müsste, sollte.'],
 ['Dikkat','"würde haben" yerine *hätte*, "würde sein" yerine *wäre* daha doğal.'],
 ['Türkçe ile','"-sa … -ırdı": Zamanım olsa giderdim = *Wenn ich Zeit hätte, würde ich gehen.*']],
g15:[['Ne işe yarar?','Kimin yaptığı önemli değil, ne yapıldığı önemli: tarifler, kurallar, haberler.'],
 ['Nasıl kurulur?','werden (çekimli) + Partizip II en sonda: *Das Essen wird gekocht.*\nwerden: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden\nYapan söylenecekse von + Dativ: *Das Haus wird von Profis renoviert.*\nÖznesiz de olur: *Hier wird gearbeitet.*'],
 ['Dikkat','werden + mastar = gelecek zaman. werden + Partizip II = edilgen.'],
 ['Türkçe ile','"-ıl/-ın" edilgen eki: yapılır, kesilir, açılır.']],
g16:[['Nasıl kurulur?','İlgi zamiri isme göre seçilir (der/die/das, çoğulda die); hâli ise yan cümledeki görevine göre:\nNominativ: der, die, das, die\nAkkusativ: den, die, das, die\nFiil yan cümlenin sonuna gider, virgülle ayrılır:\n*Der Mann, der dort steht, …* / *Der Mann, den ich kenne, …*'],
 ['Dikkat','Cinsiyet öndeki isimden, hâl yan cümleden gelir.'],
 ['Türkçe ile','Türkçede ek önden gelir: "okuduğum kitap". Almancada sonra: *das Buch, das ich lese*.']],
g17:[['Ne zaman?','Bazı fiil ve kalıplardan sonra ikinci eylem zu + mastarla gelir:\nLust haben, Zeit haben, versuchen, anfangen, aufhören, vergessen, vorhaben, Es ist wichtig/schwer/schön …'],
 ['Nasıl kurulur?','zu + mastar en sonda: *Ich habe keine Lust, heute zu kochen.*\nAyrılabilen fiilde zu araya girer: *aufzustehen, einzukaufen*'],
 ['Dikkat','Modal fiillerden sonra zu yok: *Ich muss kochen*. Aynı şekilde möchten, werden, lassen + mastar.']],
g18:[['Nasıl kurulur?','Ana cümle, virgül, deshalb, çekimli fiil, özne:\n*Ich bin müde, deshalb gehe ich ins Bett.*\nAynı anlamda: deswegen, darum, daher.'],
 ['weil ile karşılaştır','weil sebebi verir ve fiili sona yollar: *Ich gehe ins Bett, weil ich müde bin.*\ndeshalb sonucu verir, fiil hemen arkasından gelir.'],
 ['Dikkat','"deshalb ich gehe" yanlış; doğrusu *deshalb gehe ich*.']],
g19:[['Ne işe yarar?','Yazıda (hikâye, haber, rapor) geçmiş zaman. Konuşmada sadece sein, haben ve modal fiillerde.'],
 ['Nasıl kurulur?','Düzenli: kök + te → *machte, kaufte, arbeitete*\nDüzensiz: kök değişir → *ging, kam, sah, aß, trank, fuhr, schrieb, las*\nsein: war, warst, war, waren, wart, waren\nhaben: hatte, hattest, hatte, hatten, hattet, hatten'],
 ['Dikkat','ich ve er/sie/es aynı, ek yok: *ich ging, er ging*.\nDüzensiz fiilleri üç biçimiyle ezberle: *gehen – ging – gegangen*.']],
g20:[['Nereye?','*zu* + Dat. (kişi, kurum): zum Arzt, zur Arbeit\n*nach* (şehir, artikelsiz ülke, eve): nach Berlin, nach Hause\n*in* + Akk. (içine, artikelli ülke): ins Kino, in die Türkei'],
 ['Nerede?','*bei* + Dat. (kişide, iş yerinde): beim Arzt, bei Siemens\n*in* + Dat.: im Kino · *zu Hause*'],
 ['Nereden?','*aus* + Dat. (içinden, memleket): aus dem Haus, aus der Türkei\n*von* + Dat. (kişiden, yerden): vom Arzt, vom Training'],
 ['Dikkat','*zu Hause* = evde · *nach Hause* = eve']],
g21:[['Nasıl kurulur?','obwohl yan cümle kurar, fiil sona: *…, obwohl ich müde bin.*\ntrotzdem ana cümlede ilk yerde, fiil hemen arkasında: *Ich bin müde, trotzdem trainiere ich.*\nobwohl başta: *Obwohl ich müde bin, trainiere ich.*\nİsimle: trotz + Genitiv: *trotz des Regens*'],
 ['Hatırlatma','obwohl, weil gibi çalışır; trotzdem, deshalb gibi.'],
 ['Türkçe ile','obwohl = -mesine rağmen · trotzdem = yine de']],
g22:[['Kural','Geçmişte tek sefer ya da tek dönem → als: *Als ich ein Kind war, …* / *Als ich ankam, …*\nGeçmişte tekrarlanan → (immer) wenn: *Wenn ich nach Hause kam, …*\nŞimdi ve gelecek → wenn: *Wenn ich Zeit habe, …*\nİkisi de yan cümle, fiil sonda.'],
 ['Dikkat','Soru "ne zaman?" ise wann: *Ich weiß nicht, wann er kommt.*']],
g23:[['Nasıl kurulur?','hatte/war + Partizip II: *Ich hatte gegessen. Er war gegangen.*\nhaben/sein seçimi Perfekt\'teki gibi.'],
 ['nachdem ile','Önce olan Plusquamperfekt, sonra olan Präteritum ya da Perfekt:\n*Nachdem ich gegessen hatte, ging ich spazieren.*'],
 ['Türkçe ile','"-mıştı": Anahtarı unutmuştum = *Ich hatte den Schlüssel vergessen.*']],
g24:[['Bağlaçlar','*bevor* = -meden önce · *während* = -irken · *seit(dem)* = -den beri · *bis* = -e kadar\nHepsi yan cümle, fiil sona gider.'],
 ['Edat olarak','vor dem Essen · während des Essens (Genitiv) · seit dem Umzug · bis zum Abend'],
 ['Dikkat','seit ile çoğunlukla şimdiki zaman: *Seit ich hier wohne, schlafe ich besser.*']],
g25:[['Nasıl kurulur?','Dativ ilgi zamirleri: dem (der) · der (die) · dem (das) · denen (çoğul)\nDativ fiilleriyle: *die Frau, der ich helfe*\nEdatlı fiilde edat zamirin önüne gelir:\n*der Freund, mit dem ich trainiere*\n*die Firma, bei der ich arbeite*\n*das Thema, über das wir sprechen*'],
 ['Dikkat','Edat zamirin yanında kalır, cümle sonuna kaçmaz.']],
g26:[['Nasıl kurulur?','hätte/wäre + Partizip II: *Ich hätte das gemacht. Ich wäre gekommen.*\nKoşul: *Wenn ich mehr gelernt hätte, hätte ich bestanden.*\nModal fiille pişmanlık: *Ich hätte früher anfangen sollen.*'],
 ['Türkçe ile','"-saydı … -ırdı": Arasaydın gelirdim = *Wenn du angerufen hättest, wäre ich gekommen.*']],
g27:[['Nasıl kurulur?','Artikel: des (eril/nötr, isim -s/-es alır) · der (dişil ve çoğul)\n*des Mannes, des Kindes, der Frau, der Kinder*\nein → eines/einer · mein → meines/meiner'],
 ['Genitiv alan edatlar','wegen, trotz, während, statt, innerhalb, außerhalb'],
 ['Dikkat','Konuşmada sahiplik çoğu zaman von + Dativ ile söylenir: *das Auto von meinem Bruder*.\nEril ve nötr isim de ek alır: *des Regens, des Tages*.']],
g28:[['Kural','Özne aynıysa: um … zu + mastar sonda: *Ich trainiere, um fit zu bleiben.*\nÖzne farklıysa: damit + yan cümle: *Ich erkläre es, damit du es verstehst.*\nAyrılabilen: *um früh aufzustehen*'],
 ['Dikkat','damit cümlesinde *wollen / sollen* gerekmez (amaç zaten damit\'te). *können* ise ikisinde de olabilir: *um reisen zu können*, *damit ich reisen kann*.'],
 ['Türkçe ile','um … zu = -mek için · damit = -sin diye']],
g29:[['Bağlaçlar','*sowohl … als auch* = hem … hem\n*weder … noch* = ne … ne\n*entweder … oder* = ya … ya\n*nicht nur … sondern auch* = sadece … değil … de'],
 ['Dikkat','weder … noch zaten olumsuzdur, ayrıca nicht eklenmez: *Er hat weder Zeit noch Lust.*']],
g30:[['Nasıl kurulur?','werden (çekimli) + mastar en sonda: *Ich werde die Prüfung machen.*'],
 ['Ne zaman?','Gelecek plan ve söz: *Ich werde ab jetzt jeden Tag üben.*\nTahmin (wohl ile): *Er wird wohl im Büro sein.*'],
 ['Dikkat','Gündelik dilde Präsens + zaman ifadesi daha sık: *Morgen fahre ich nach Berlin.*']],
g31:[['Zamanlar','Präsens: *wird gebaut*\nPräteritum: *wurde gebaut*\nPerfekt: *ist gebaut worden* (geworden değil, worden!)\nModal fiille: *muss gebaut werden*, *kann repariert werden*'],
 ['Dikkat','Edilgen Perfekt\'te yardımcı fiil hep sein: *Das Paket ist geliefert worden.*']],
g32:[['Hangi isimler?','Çoğunlukla -e ile biten eril canlılar (der Kollege, der Junge, der Kunde, der Name) ve -ent, -ant, -ist ile bitenler (der Student, der Präsident, der Journalist). Ayrıca der Mensch, der Nachbar, der Herr.'],
 ['Kural','Nominativ dışında her yerde -(e)n alır: *der Kollege → den Kollegen → dem Kollegen → des Kollegen*'],
 ['Dikkat','Yazıda unutulması çok sık görülen bir hata: *Ich frage den Kollegen* ("den Kollege" değil).']],
g33:[['Nasıl kurulur?','je + karşılaştırma + yan cümle (fiil sona), desto + karşılaştırma + ana cümle (fiil hemen arkasında):\n*Je mehr ich übe, desto besser spreche ich.*'],
 ['Türkçe ile','"ne kadar … o kadar" ya da "-dıkça": Pratik yaptıkça daha iyi konuşuyorum.']],
g34:[['Partizip I','Mastar + d, etken ve eşzamanlı: *das schlafende Kind* (uyuyan çocuk), *steigende Preise* (artan fiyatlar)'],
 ['Partizip II','Edilgen ya da tamamlanmış: *das gekochte Ei* (haşlanmış yumurta), *ein gebrauchtes Auto* (ikinci el araba)'],
 ['Dikkat','İkisi de normal sıfat gibi ek alır: *die steigenden Preise, mit gekochtem Reis*.'],
 ['Türkçe ile','Partizip I ≈ "-en/-an", Partizip II ≈ "-miş/-ılmış".']],
g35:[['Kural','ohne … zu = -meden: *Er ist gegangen, ohne sich zu verabschieden.*\nstatt … zu = -mek yerine: *Statt zu kochen, bestellen wir Pizza.*\nÖzne farklıysa: ohne dass / statt dass + yan cümle.'],
 ['Dikkat','zu + mastar en sonda; ayrılabilen fiilde zu araya girer: *ohne mich aufzuwärmen*.']],
g36:[['Anlamlar','Bir işi başkasına yaptırmak: *Ich lasse das Auto reparieren.*\nİzin vermek: *Lass mich bitte ausreden!*\nBırakmak: *Ich lasse die Tasche im Auto.*\nÖneri: *Lass uns gehen!* = Hadi gidelim!'],
 ['Perfekt','Başka fiille: *Ich habe das Auto reparieren lassen.* (gelassen değil)'],
 ['Türkçe ile','"-tır/-dır" ettirgen eki: kestirmek = *schneiden lassen*.']],
g37:[['Bağlaçlar','*indem* = -erek (yöntem): *Ich bleibe fit, indem ich trainiere.*\n*sodass* = öyle ki / bu yüzden (sonuç): *Es regnete, sodass das Spiel ausfiel.*\nİkisi de yan cümle, fiil sonda.'],
 ['İpucu','"Nasıl?" sorusunun cevabıysa indem; "Sonuç ne oldu?" sorusununsa sodass.']],
g38:[['Ne zaman hangisi?','*was*: alles, nichts, etwas, das, vieles ve en üstünlükten sonra: *alles, was ich weiß*; *das Beste, was …*\n*wo*: yer bildirirken: *die Stadt, wo ich wohne*\n*wo(r) + edat*: bütün cümleye ya da edatlı fiile gönderme: *…, worüber ich mich freue.*'],
 ['Dikkat','Somut isimde normal ilgi zamiri de olur: *die Stadt, in der ich wohne* = *die Stadt, wo ich wohne*.']],
g39:[['Kalıplar','Gerçekleşmemiş dilek: *Wenn ich doch mehr Zeit hätte!* · *Ich wünschte, ich könnte …*\nGeçmiş dilek: *Wenn ich nur früher angefangen hätte!*\nGerçek dışı karşılaştırma: *Er tut so, als ob er alles wüsste.*'],
 ['Dikkat','als ob yan cümle kurar, fiil sona: *…, als ob er krank wäre.*'],
 ['Türkçe ile','"keşke …" = Wenn … doch …! · "-mış gibi" = als ob']],
g40:[['Ne işe yarar?','Anlamı isimden gelen kalıplar; özellikle yazılı Almanca ve B1 sınavında çok çıkar. Kalıp olarak ezberle.'],
 ['Sık kullanılanlar','eine Entscheidung treffen = karar vermek\neine Frage stellen = soru sormak\nRücksicht nehmen auf = gözetmek\nin Frage kommen = söz konusu olmak\nKontakt aufnehmen = iletişime geçmek\neinen Rat geben = tavsiye vermek\nBescheid sagen = haber vermek\nzur Verfügung stehen = hizmetinde olmak'],
 ['Dikkat','Fiil isme göre seçilir: "eine Frage fragen" değil, *eine Frage stellen*.']]
};

var GX={
g1:["Ich ___ gestern mit dem Zug nach Köln gefahren.|bin|habe|hat|*fahren* burada yer değiştirme (Köln'e gitmek) anlatır → Perfekt'te *sein*; *ich* ile *bin*.||*habe* olmaz: *fahren* yer değiştirme anlatır, Perfekt'te *sein* alır.|*hat* olmaz: yardımcı fiil *sein* olmalı; üstelik *hat* *er/sie/es* çekimidir.","Wir ___ zusammen Pizza gegessen.|haben|sind|hat|*essen* yer ya da durum değişimi anlatmaz → Perfekt'te *haben*; *wir* ile *haben*.||*sind* olmaz: *essen* hareket bildirmez, Perfekt'te *haben* alır.|*hat* olmaz: *hat* *er/sie/es* çekimidir; *wir* ile *haben* gerekir.","Hast du die E-Mail schon ___? (schreiben)|geschrieben|geschreibt|schreibt|*schreiben* düzensiz fiil: Partizip II'de kök değişir ve *-en* ile biter → *geschrieben*.||*geschreibt* olmaz: düzensiz fiil *-t* almaz; doğrusu *geschrieben*.|*schreibt* olmaz: bu Präsens çekimi; Perfekt'te sonda Partizip II gerekir.","Ich habe heute zwei Stunden ___. (trainieren)|trainiert|getrainiert|trainiere|*-ieren* ile biten fiiller Partizip II'de *ge-* almaz: *trainieren* → *trainiert*.||*getrainiert* olmaz: *-ieren* ile biten fiiller *ge-* almaz.|*trainiere* olmaz: bu Präsens *ich* çekimi; *habe* ile sonda Partizip II gelir.","Sie ist um sechs Uhr ___. (aufstehen)|aufgestanden|aufgesteht|geaufstanden|Ayrılabilen fiilde *ge-* ön ek ile kökün arasına girer: *auf-ge-standen*. *stehen* düzensiz olduğu için *-en* ile biter.||*aufgesteht* olmaz: *stehen* düzensizdir, Partizip'i *gestanden* olur.|*geaufstanden* olmaz: *ge-* başa değil, ön ek ile kökün arasına girer.","Er ___ den ganzen Tag zu Hause geblieben.|ist|hat|habe|*bleiben* yer değiştirmese de *sein* alan istisnalardandır (*sein, bleiben, passieren*); *er* ile *ist*.||*hat* olmaz: *bleiben* Perfekt'te *sein* alır: *ist geblieben*.|*habe* olmaz: yardımcı fiil *sein* olmalı; üstelik *habe* *ich* çekimidir.","Ich habe meine Mutter ___. (besuchen)|besucht|gebesucht|besuchen|*be-* ile başlayan fiiller Partizip II'de *ge-* almaz: *besuchen* → *besucht*.||*gebesucht* olmaz: *be-* ön ekli fiiller *ge-* almaz.|*besuchen* olmaz: bu mastar; *habe* ile sonda Partizip II gerekir.","Wir haben am Samstag ___. (einkaufen)|eingekauft|geeinkauft|einkaufen|Ayrılabilen fiil: ön ek + *ge* + kök + *t* → *ein-ge-kauft*.||*geeinkauft* olmaz: *ge-* başa değil, *ein* ile *kauft* arasına girer.|*einkaufen* olmaz: bu mastar; *haben* ile sonda Partizip II gerekir."],
g2:["Gestern ___ ich lange arbeiten. (müssen)|musste|muss|müsste|Präteritum'da Umlaut düşer, *-te* eklenir: *müssen* → *musste*. *ich* ile ek yok.||*muss* olmaz: bu Präsens; *gestern* geçmiş ister.|*müsste* olmaz: Umlaut'lu biçim Konjunktiv II'dir (gerekirdi); Präteritum'da Umlaut düşer.","Als Kind ___ ich nicht gut schwimmen. (können)|konnte|kann|könnte|*können* → *konnte*: Umlaut düşer, *-te* eklenir. *Als Kind* (çocukken) geçmişi gösterir.||*kann* olmaz: bu Präsens; *Als Kind* geçmiş ister.|*könnte* olmaz: Konjunktiv II (yapabilirdim); Präteritum'da Umlaut yok: *konnte*.","Wir ___ den Film sehen, aber das Kino war voll. (wollen)|wollten|wollen|wolltet|*wollen* → *wollte*; *wir* ile *-n* eklenir: *wollten*. Devamındaki *war* geçmişi gösterir.||*wollen* olmaz: bu Präsens; cümlenin devamı (*war*) geçmişte.|*wolltet* olmaz: bu *ihr* çekimi; *wir* ile *wollten*.","Früher ___ man im Zug rauchen. (dürfen)|durfte|darf|dürfte|*dürfen* → *durfte*: Umlaut düşer, *-te* eklenir. *man* *er/sie/es* gibi çekilir, ek almaz.||*darf* olmaz: bu Präsens; *Früher* geçmiş ister.|*dürfte* olmaz: Umlaut'lu biçim Konjunktiv II'dir; Präteritum *durfte*.","Du ___ doch gestern Brot kaufen! (sollen)|solltest|sollst|sollte|*sollen* → *sollte*; *du* ile *-st* eklenir: *solltest*. *gestern* geçmişi gösterir.||*sollst* olmaz: bu Präsens; *gestern* geçmiş ister.|*sollte* olmaz: *ich/er* çekimi; *du* ile *solltest*.","Früher ___ er keinen Fisch, heute isst er ihn gern. (mögen)|mochte|mögte|möchte|*mögen* Präteritum'da Umlaut'u düşürür ve *g* → *ch* olur: *mochte*.||*mögte* olmaz: böyle bir biçim yok; Präteritum *mochte*.|*möchte* olmaz: bu şimdiki zamanda 'istiyor' demek; *Früher* geçmiş ister.","Ich musste gestern früh ___. (aufstehen)|aufstehen|aufgestanden|stehe auf|Modal fiilden sonra asıl fiil mastar olarak en sona gider; ayrılabilen fiil bitişik kalır: *musste … aufstehen*.||*aufgestanden* olmaz: bu Partizip II; modal fiilden sonra mastar gelir.|*stehe auf* olmaz: çekimli fiil zaten *musste*; ikinci fiil mastar kalır.","Konntest du gestern ___? (kommen)|kommen|gekommen|kamst|Modal fiil (*konntest*) çekimlenir; asıl fiil mastar olarak sonda kalır: *kommen*.||*gekommen* olmaz: bu Partizip II; modal fiilden sonra mastar gelir.|*kamst* olmaz: çekimli fiil zaten *konntest*; ikinci fiil mastar olmalı."],
g3:["Ich bleibe zu Hause, weil ich krank ___.|bin|sein|ist|*weil* yan cümle kurar: çekimli fiil en sona gider; *ich* ile *bin*.|werde|*sein* olmaz: bu mastar; yan cümlede de fiil özneye göre çekilir: *ich bin*.|*ist* olmaz: *er/sie/es* çekimi; *ich* ile *bin*.","Ich glaube, ___ er heute nicht kommt.|dass|wenn|denn|*glauben*'in içeriği (-dığını) *dass* ile gelir; fiil sona gider: *nicht kommt*.||*wenn* olmaz: koşul/zaman bildirir; *glauben*'in içeriğini *dass* verir.|*denn* olmaz: *denn*'den sonra fiil 2. sırada kalır; burada fiil sonda.","___ es regnet, nehme ich den Bus.|Wenn|Dass|Denn|Koşul (-se) → *wenn*; yan cümle başta olduğu için ana cümle fiille başlar: *nehme ich*.|Weil/Falls/Da/Sobald/Solange|*Dass* olmaz: *dass* içerik bildirir (-dığını); koşul ya da sebep anlatmaz.|*Denn* olmaz: *denn* iki ana cümleyi bağlar; cümle başında yan cümle kuramaz.","Ich bin müde, ___ ich habe schlecht geschlafen.|denn|weil|dass|Fiil (*habe*) 2. sırada kaldığı için sebep bağlacı *denn* olmalı; *denn* ana cümle kurar.||*weil* olmaz: *weil*'den sonra fiil sona gider (*weil ich schlecht geschlafen habe*).|*dass* olmaz: anlam yanlış (-dığını) ve *dass*'tan sonra da fiil sona gider.","Wenn du Zeit hast, ___ ins Kino. (wir / gehen)|gehen wir|wir gehen|dann wir gehen|Yan cümle 1. yeri doldurur; ana cümle çekimli fiille başlar, özne arkasından gelir: *gehen wir*.|dann gehen wir|*wir gehen* olmaz: yan cümleden sonra önce fiil, sonra özne gelir.|*dann wir gehen* olmaz: *dann* de 1. yerdedir; hemen ardından fiil gelmeli: *dann gehen wir*.","Er sagt, dass er morgen keine Zeit ___.|hat|haben|hast|*dass* yan cümlesinde çekimli fiil sona gider; *er* ile *hat*. (Resmî dolaylı anlatımda *habe* de olur.)|habe|*haben* olmaz: mastar/çoğul biçim; *er* ile *hat*.|*hast* olmaz: *du* çekimi; *er* ile *hat*.","Ich lerne Deutsch, weil ich in Deutschland arbeiten ___. (möchten)|möchte|möchten|will zu|*weil* yan cümlesinde modal fiil çekimli hâliyle en sona gider: *arbeiten möchte*.||*möchten* olmaz: *wir/sie/Sie* çekimi; *ich* ile *möchte*.|*will zu* olmaz: modal fiille *zu* kullanılmaz (İngilizcedeki *to* gibi değil).","Ich weiß, dass du jeden Tag früh ___. (aufstehen)|aufstehst|stehst auf|aufstehen|Ayrılabilen fiil yan cümlede sonda birleşir ve çekimlenir: *dass du … aufstehst*.||*stehst auf* olmaz: yan cümlede ön ek ayrılmaz; fiil sonda bitişik durur.|*aufstehen* olmaz: bu mastar; *du* ile *aufstehst*."],
g4:["Das Buch liegt auf ___ Tisch.|dem|den|der|*liegen* durum bildirir (Wo?) → Dativ; *der Tisch* → *dem Tisch*.|einem|*den* olmaz: Akkusativ; *liegen* hareket değil durum bildirir (Wo?).|*der* olmaz: *Tisch* eril; Dativ'de *dem* olur.","Ich lege das Buch auf ___ Tisch.|den|dem|das|*legen* hareket bildirir (Wohin?) → Akkusativ; *der Tisch* → *den Tisch*.|einen|*dem* olmaz: Dativ; *legen* bir yere koymaktır (Wohin?) → Akkusativ.|*das* olmaz: *Tisch* eril (*der*), nötr değil.","Ich ___ die Milch in den Kühlschrank.|stelle|stehe|liege|Dik duran bir şeyi bir yere koymak (Wohin? + Akk.) → *stellen*: *ich stelle*.|packe|*stehe* olmaz: *stehen* durum fiilidir, nesne almaz; koymak *stellen*.|*liege* olmaz: *liegen* durum fiilidir, nesne almaz; yatırarak koymak *legen*.","Das Bild hängt an ___ Wand.|der|die|den|Nesnesiz *hängen* = asılı durmak (Wo?) → Dativ; *die Wand* → *der Wand*.|einer|*die* olmaz: Akkusativ; resim duvarda asılı duruyor (Wo?) → Dativ.|*den* olmaz: *Wand* dişil; *den* eril Akkusativ biçimidir.","Wir gehen heute ___ Kino.|ins|im|in der|*gehen* yön bildirir (Wohin?) → Akkusativ: *in das Kino* = *ins Kino*.||*im* olmaz: *in dem* = Dativ (Wo?); *gehen* yön bildirir.|*in der* olmaz: *Kino* nötr (*das*); ayrıca yön için Akkusativ gerekir.","Er sitzt auf ___ Sofa.|dem|das|den|*sitzen* durum bildirir (Wo?) → Dativ; *das Sofa* → *dem Sofa*.|einem|*das* olmaz: Akkusativ; *sitzen* hareket değil durum bildirir.|*den* olmaz: *Sofa* nötr; *den* eril Akkusativ biçimidir.","Die Katze legt sich unter ___ Bett.|das|dem|der|*sich legen* bir yere geçmektir (Wohin?) → Akkusativ; nötr *das Bett* Akkusativ'de de *das*.|ein|*dem* olmaz: Dativ; *sich legen* hareket bildirir (Wohin?).|*der* olmaz: *Bett* nötr (*das*); Akkusativ'de de *das* kalır.","Der Schlüssel liegt zwischen ___ Büchern.|den|die|der|*liegen* durum bildirir (Wo?) → Dativ; çoğul Dativ: *den Büchern* (isim de *-n* alır).||*die* olmaz: çoğul Akkusativ; *liegen* durum bildirir → Dativ.|*der* olmaz: çoğul Dativ'de artikel *den* olur."],
g5:["Kannst du ___ helfen? (ich)|mir|mich|ich|*helfen* nesnesini Dativ'de ister: *ich* → *mir*. Türkçedeki gibi: bana yardım et.||*mich* olmaz: bu Akkusativ; *helfen* Dativ ister.|*ich* olmaz: bu yalın hâl (özne); nesne yerinde Dativ *mir* gerekir.","Das Kleid gefällt ___ sehr. (sie = o)|ihr|sie|ihre|*gefallen* Dativ ister; tekil *sie* (o) → Dativ'de *ihr*. Cümlenin öznesi *das Kleid*'dir.||*sie* olmaz: bu Nominativ/Akkusativ; *gefallen* Dativ ister.|*ihre* olmaz: bu iyelik sözcüğü (onun …); burada zamir *ihr* gerekir.","Gehört das Auto ___? (du)|dir|dich|du|*gehören* Dativ ister: *du* → *dir*. *Gehört das Auto dir?* = Araba senin mi?||*dich* olmaz: bu Akkusativ; *gehören* Dativ ister.|*du* olmaz: bu yalın hâl (özne); nesne yerinde *dir* gerekir.","Ich danke ___ für die Hilfe. (Sie)|Ihnen|Sie|Ihren|*danken* Dativ ister; kibar hitap *Sie* → Dativ'de *Ihnen*.||*Sie* olmaz: bu Nominativ/Akkusativ; *danken* Dativ ister.|*Ihren* olmaz: bu iyelik sözcüğü (sizin …); zamir olarak *Ihnen* gerekir.","Die Suppe schmeckt ___ nicht. (wir)|uns|wir|unser|*schmecken* Dativ ister: *wir* → *uns*. Özne *die Suppe*'dir.||*wir* olmaz: bu yalın hâl (özne); *schmecken* Dativ ister.|*unser* olmaz: bu iyelik sözcüğü (bizim …); Dativ zamiri *uns*.","Ich gratuliere ___ zum Geburtstag. (du)|dir|dich|du|*gratulieren* Dativ ister: *du* → *dir*. Türkçede \"seni tebrik ederim\" dense de Almancada Dativ gelir.||*dich* olmaz: Türkçedeki \"seni\" yanıltmasın; *gratulieren* Dativ ister.|*du* olmaz: bu yalın hâl (özne); nesne yerinde *dir* gerekir.","Der Termin passt ___ nicht. (er)|ihm|ihn|er|*passen* (uymak) Dativ ister: *er* → *ihm*. Özne *der Termin*'dir.||*ihn* olmaz: bu Akkusativ; *passen* Dativ ister.|*er* olmaz: bu yalın hâl (özne); nesne yerinde *ihm* gerekir.","Hör ___ bitte zu! (ich)|mir|mich|ich|*zuhören* Dativ ister: *ich* → *mir*. *Hör mir zu!* = Beni dinle!||*mich* olmaz: Türkçedeki \"beni\" yanıltmasın; *zuhören* Dativ ister.|*ich* olmaz: bu yalın hâl (özne); nesne yerinde *mir* gerekir."],
g6:["Ich freue ___ auf das Wochenende.|mich|mir|sich|*sich freuen auf* dönüşlüdür; zamir özneye uyar: *ich* → *mich* (Akkusativ).||*mir* olmaz: Dativ; başka nesne olmadığı için dönüşlü zamir Akkusativ *mich* olur.|*sich* olmaz: *sich* yalnız *er/sie/es*, *sie* (onlar) ve *Sie* içindir.","Wir ruhen ___ nach dem Training aus.|uns|euch|sich|*sich ausruhen* (dinlenmek) dönüşlüdür: *wir* → *uns*.||*euch* olmaz: *euch* *ihr* öznesine aittir.|*sich* olmaz: *wir* ile dönüşlü zamir *uns* olur.","Beeil ___! Der Bus kommt.|dich|dir|sich|*sich beeilen*, *du* ile emir kipi: *Beeil dich!* Zamir Akkusativ *dich*.||*dir* olmaz: Dativ; başka nesne olmadığı için *dich* gerekir.|*sich* olmaz: o kibar biçimdir (*Beeilen Sie sich!*); *du* ile *dich*.","Er kümmert ___ um seine kleine Schwester.|sich|ihn|ihm|*sich kümmern um* (ile ilgilenmek) hep dönüşlüdür: *er* → *sich*.||*ihn* olmaz: başka birini gösterir; *kümmern um* her zaman dönüşlü zamirle kullanılır.|*ihm* olmaz: Dativ kişi zamiri; *er* öznesiyle dönüşlü *sich* gerekir.","Ich kann ___ die neuen Wörter nicht merken.|mir|mich|sich|*sich etwas merken* (aklında tutmak): cümlede Akkusativ nesne (*die Wörter*) olduğu için dönüşlü zamir Dativ olur: *mir*.||*mich* olmaz: Akkusativ nesne zaten *die Wörter*; zamir Dativ *mir* olmalı.|*sich* olmaz: *ich* öznesiyle *mir/mich* kullanılır, *sich* değil.","Habt ihr ___ gut erholt?|euch|uns|sich|*sich erholen* (dinlenip toparlanmak) dönüşlüdür: *ihr* → *euch*. Perfekt'te *haben* alır.||*uns* olmaz: *uns* *wir* öznesine aittir.|*sich* olmaz: *ihr* öznesiyle dönüşlü zamir *euch* olur.","Ich habe ___ sehr über das Geschenk gefreut.|mich|mir|ich|Dönüşlü fiil Perfekt'te *haben* alır: *Ich habe mich … gefreut.* *ich* → *mich*.||*mir* olmaz: başka nesne yok; dönüşlü zamir Akkusativ *mich*.|*ich* olmaz: özne zaten *ich*; buraya dönüşlü zamir *mich* gelir.","Sie fühlt ___ heute nicht wohl.|sich|ihr|sie|*sich wohlfühlen* (kendini iyi hissetmek) dönüşlüdür: *sie* (o) → *sich*. Fiil *fühlt* olduğu için özne tekil *sie*.||*ihr* olmaz: Dativ kişi zamiri; *sie* öznesiyle dönüşlü *sich* gerekir.|*sie* olmaz: *sich wohlfühlen* hep dönüşlüdür; *sie* öznesiyle zamir *sich* olur."],
g7:["Heute ist es ___ als gestern. (warm)|wärmer|mehr warm|warmer|Tek heceli *warm* karşılaştırmada Umlaut alır: *warm → wärmer*, ardından *als* gelir.||*mehr warm* olmaz: \"daha\" için *mehr* değil, *-er* eki kullanılır.|*warmer* olmaz: *warm* karşılaştırmada Umlaut alır: *wärmer*.","Mein Bruder ist ___ als ich. (alt)|älter|alter|mehr alt|*alt* tek heceli, Umlaut alır: *alt → älter → am ältesten*.||*alter* olmaz: *alt* karşılaştırmada Umlaut alır: *älter*.|*mehr alt* olmaz: \"daha\" için *-er* eki kullanılır, *mehr* değil.","Ich trinke ___ Tee als Kaffee. (gern)|lieber|gerner|mehr gern|*gern* düzensizdir: *gern – lieber – am liebsten*. *lieber* = daha çok severek.||*gerner* olmaz: böyle bir biçim yok; *gern* düzensizdir: *lieber*.|*mehr gern* olmaz: *gern*in karşılaştırması *lieber* olur.","Das ist das ___ Restaurant in der ganzen Stadt. (gut)|beste|besser|am besten|*gut* düzensizdir: *gut – besser – am besten*. İsmin önünde artikel + *beste*: *das beste Restaurant*.||*besser* olmaz: bu \"daha iyi\" demektir; \"en iyi\" anlamı ve ismin önünde *beste* gerekir.|*am besten* olmaz: *am …-sten* ismin önünde kullanılmaz; *das beste Restaurant* denir.","In unserer Gruppe läuft Tom am ___. (schnell)|schnellsten|schnellste|schneller|En üstünlük: *am* + sıfat + *-sten* → *am schnellsten*.||*schnellste* olmaz: *am* ile her zaman *-sten* biter: *am schnellsten*.|*schneller* olmaz: bu karşılaştırma (daha hızlı); *am* ile *-sten* gelir.","Berlin ist größer ___ Hamburg.|als|wie|dann|Karşılaştırmada (*-er*) \"-den daha\" için *als* kullanılır: *größer als*.||*wie* olmaz: *wie* eşitlikte kullanılır (*so groß wie*); *-er*'den sonra standart Almancada *als* gelir.|*dann* olmaz: *dann* \"sonra\" demektir; İngilizcedeki *than* ile karıştırma.","Sie ist so groß ___ ihr Vater.|wie|als|so|Eşitlik: *so* + sıfat + *wie* → *so groß wie* = … kadar uzun.||*als* olmaz: *als* karşılaştırmada (*größer als*) kullanılır; *so … wie* kalıbında *wie* gelir.|*so* olmaz: *so* zaten sıfatın önünde; ikinci kısım *wie* olmalı.","Im Winter esse ich ___ als im Sommer. (viel)|mehr|viel|vieler|*viel* düzensizdir: *viel – mehr – am meisten*. *als* olduğu için karşılaştırma biçimi *mehr*.||*viel* olmaz: *als* ile karşılaştırma biçimi gerekir: *mehr*.|*vieler* olmaz: böyle bir karşılaştırma yok; *viel* düzensizdir: *mehr*."],
g8:["___ Sie mir bitte helfen? (können, Konjunktiv II)|Könnten|Konnten|Kannst|Kibar rica: *können*in Konjunktiv II'si *könnten* (Umlaut'lu). Asıl fiil *helfen* mastar olarak sonda.||*Konnten* olmaz: Umlaut'suz hâli geçmiş zamandır (Präteritum), rica bildirmez.|*Kannst* olmaz: *du* çekimidir ve Konjunktiv II değildir; *Sie* ile *Könnten*.","Ich ___ gern einen Kaffee. (haben, Konjunktiv II)|hätte|hatte|würde|Kibar sipariş kalıbı: *Ich hätte gern …* (*haben* → *hätte*) = … rica ediyorum.||*hatte* olmaz: Umlaut'suz hâli geçmiş zamandır; kibar istek *hätte gern*.|*würde* olmaz: *würde* sonda bir mastar ister; burada mastar yok, *hätte gern* kullanılır.","___ Sie bitte das Fenster schließen? (werden, Konjunktiv II)|Würden|Wurden|Würdest|*Würden Sie …?* + mastar sonda (*schließen*) = … r mısınız? *Sie* ile *würden*.||*Wurden* olmaz: Umlaut'suz hâli geçmiş zamandır; rica için *Würden*.|*Würdest* olmaz: *du* çekimidir; *Sie* ile *Würden*.","___ ich bitte kurz Ihr Telefon benutzen? (dürfen, Konjunktiv II)|Dürfte|Durfte|Darfst|Kibarca izin istemek: *Dürfte ich …?* (*dürfen* → *dürfte*). Mastar *benutzen* sonda.||*Durfte* olmaz: Umlaut'suz hâli geçmiş zamandır (izin verilmişti).|*Darfst* olmaz: *du* çekimidir, *ich* ile uymaz.","Könntest du mich morgen ___? (anrufen)|anrufen|angerufen|rufst an|*könntest* gibi kip fiilinden sonra asıl fiil mastar hâlinde sonda gelir: *anrufen* (ayrılmadan).||*angerufen* olmaz: bu Partizip II; *könntest* mastar ister.|*rufst an* olmaz: çekimli fiil; ikinci fiil mastar olarak sonda tek parça kalır.","Wir ___ gern einen Tisch für zwei Personen. (haben, Konjunktiv II)|hätten|hatten|hätte|*wir* ile *haben* → *hätten*: *Wir hätten gern …* = … rica ediyoruz.||*hatten* olmaz: Umlaut'suz hâli geçmiş zamandır; kibar istek *hätten gern*.|*hätte* olmaz: *ich/er* çekimidir; *wir* ile *hätten*.","___ es möglich, den Termin zu verschieben? (sein, Konjunktiv II)|Wäre|Hätte|Würde|*sein*in Konjunktiv II'si *wäre*: *Wäre es möglich, …?* = … mümkün olur mu?||*Hätte* olmaz: *möglich* ile *sein* kullanılır (*es ist möglich*), *haben* değil.|*Würde* olmaz: *würde* sonda bir mastar ister (*würde … sein*); burada mastar yok.","Würdest du mir das Salz ___? (geben)|geben|gibst|gegeben|*würde* + mastar: asıl fiil mastar hâlinde sonda: *geben*.||*gibst* olmaz: çekimli fiil; *würdest* zaten çekimli, sonda mastar gelir.|*gegeben* olmaz: bu Partizip II; *würdest* mastar ister."],
g9:["Der ___ Kollege ist sehr nett. (neu)|neue|neuen|neuer|*der* + Nominativ tekil → sıfat *-e* alır: *der neue Kollege*.||*neuen* olmaz: *-en* Dativ, çoğul ve *den* (Akk. eril) içindir; burada Nominativ tekil.|*neuer* olmaz: *-er* *ein* sonrası gelir; *der* cinsiyeti zaten gösteriyor.","Ich kaufe den ___ Pullover. (rot)|roten|rote|roter|*den* = Akkusativ eril → sıfat *-en* alır: *den roten Pullover*.||*rote* olmaz: Akkusativ'de *-e* sadece *die/das* ile gelir; *den* sonrası *-en*.|*roter* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Das ___ Fahrrad ist kaputt. (alt)|alte|alten|altes|*das* + Nominativ tekil → sıfat *-e* alır: *das alte Fahrrad*.||*alten* olmaz: *-en* Dativ ve çoğul içindir; burada Nominativ tekil.|*altes* olmaz: *-es* *ein* sonrası gelir; *das* cinsiyeti zaten gösteriyor.","Wir sprechen mit dem ___ Trainer. (neu)|neuen|neue|neuer|*mit* Dativ ister; Dativ'de sıfat her zaman *-en* alır: *mit dem neuen Trainer*.||*neue* olmaz: *-e* sadece Nominativ tekil ve Akk. *die/das* içindir; burada Dativ.|*neuer* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Ich nehme die ___ Hantel. (klein)|kleine|kleinen|kleiner|*die* + Akkusativ dişil tekil → sıfat *-e* (Nominativ ile aynı): *die kleine Hantel*.||*kleinen* olmaz: tekil *die* ile *-e* gelir; *-en* çoğulda olur (*die kleinen Hanteln*).|*kleiner* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Die ___ Brötchen schmecken gut. (frisch)|frischen|frische|frischer|Fiil *schmecken* çoğul → *die* burada çoğul artikeli; çoğulda sıfat *-en*: *die frischen Brötchen*.||*frische* olmaz: *die* + *-e* tekil içindir; fiil çoğul olduğu için *-en* gerekir.|*frischer* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır.","Siehst du das ___ Haus dort? (groß)|große|großen|großes|*das* + Akkusativ tekil → sıfat *-e* (Nominativ ile aynı): *das große Haus*.||*großen* olmaz: Akkusativ'de *-en* sadece eril *den* ile gelir; *das* ile *-e*.|*großes* olmaz: *-es* *ein* sonrası gelir; *das* cinsiyeti zaten gösteriyor.","Er wohnt in der ___ Wohnung. (schön)|schönen|schöne|schöner|*wohnen in* + Dativ (Wo?) → *in der Wohnung*; Dativ'de sıfat hep *-en*: *in der schönen Wohnung*.||*schöne* olmaz: *der* burada dişil Dativ; Dativ'de sıfat hep *-en* alır.|*schöner* olmaz: belirli artikel sonrası sıfat sadece *-e* ya da *-en* alır."],
g10:["Ich lerne ___ einem Jahr Deutsch. (bir yıldır)|seit|vor|für|Geçmişte başlayıp hâlâ süren durum → *seit* + Dativ, fiil Präsens: *seit einem Jahr*.||*vor* olmaz: *vor einem Jahr* = bir yıl önce; bitmiş bir an, Präsens ile gitmez.|*für* olmaz: *für* planlanan süre içindir ve Akkusativ ister (*für ein Jahr*).","___ zwei Jahren war ich in Berlin. (iki yıl önce)|Vor|Seit|In|Geçmişte bir an → *vor* + Dativ: *vor zwei Jahren* = iki yıl önce.||*Seit* olmaz: *seit zwei Jahren* = iki yıldır (hâlâ süren durum); 'iki yıl önce' anlamı vermez.|*In* olmaz: *in zwei Jahren* = iki yıl sonra (gelecek); *war* ise geçmiş.","___ zwei Wochen fahren wir in den Urlaub. (iki hafta sonra)|In|Vor|Seit|Şu andan itibaren gelecekte 'sonra' → *in* + Dativ: *in zwei Wochen*. Burada *nach* kullanılmaz.||*Vor* olmaz: *vor zwei Wochen* = iki hafta önce (geçmiş).|*Seit* olmaz: *seit* geçmişte başlayıp süren durum içindir, geleceği anlatmaz.","Der Kurs beginnt ___ acht Uhr. (saat sekizde)|um|am|im|Saat söylerken *um* kullanılır: *um acht Uhr*.||*am* olmaz: *am* günler ve gün bölümleri içindir (*am Montag, am Abend*).|*im* olmaz: *im* aylar ve mevsimler içindir (*im Mai, im Sommer*).","Wir treffen uns ___ Montag. (pazartesi günü)|am|im|um|Günlerle *am* (= *an dem*) kullanılır: *am Montag*.||*im* olmaz: *im* aylar ve mevsimler içindir (*im Mai*).|*um* olmaz: *um* saat içindir (*um acht Uhr*).","___ Sommer fahren wir ans Meer. (yazın)|Im|Am|Um|Mevsim ve aylarla *im* (= *in dem*) kullanılır: *im Sommer*.||*Am* olmaz: *am* günler ve gün bölümleri içindir (*am Montag*).|*Um* olmaz: *um* saat içindir (*um acht Uhr*).","Nach ___ Arbeit gehe ich ins Fitnessstudio.|der|die|dem|*nach* her zaman Dativ ister; *die Arbeit* Dativ'de *der Arbeit* olur.||*die* olmaz: bu Nominativ/Akkusativ biçimi; *nach* sonrası Dativ gelir.|*dem* olmaz: *dem* eril/nötr Dativ; *Arbeit* dişil olduğu için *der*.","Das Geschäft ist von 9 ___ 20 Uhr geöffnet.|bis|seit|um|Bitiş noktası → *bis* (= -e kadar). Kalıp: *von … bis …* (… -den … -e kadar).||*seit* olmaz: *seit* geçmişte başlayıp süren durum içindir; *von … seit* diye kalıp yok.|*um* olmaz: *um* tek bir saati söyler; *von … bis …* kalıbında yeri yok."],
g11:["Ich habe einen ___ Trainingsplan. (neu)|neuen|neuer|neue|*einen* = Akkusativ eril → sıfat *-en* alır: *einen neuen Trainingsplan*.||*neuer* olmaz: *-er* Nominativ eril eki (*ein neuer Plan*); burada Akkusativ.|*neue* olmaz: *-e* dişil (*eine neue*) içindir; *einen* sonrası *-en*.","Das ist ein ___ Auto. (neu)|neues|neue|neuen|*ein* nötrü göstermez, cinsiyeti sıfat gösterir: *das* gibi *-es* → *ein neues Auto*.||*neue* olmaz: *-e* *eine* (dişil) sonrası gelir; *Auto* nötr.|*neuen* olmaz: *-en* Akk. eril (*einen*) ya da Dativ içindir.","Er ist ein ___ Kollege. (nett)|netter|nette|netten|*ein* + eril Nominativ → sıfat *der*'in sonunu alır, *-er*: *ein netter Kollege*.||*nette* olmaz: *-e* *der* ya da *eine* sonrası gelir; *ein* sonrası cinsiyeti sıfat göstermeli.|*netten* olmaz: *-en* Akk. eril (*einen*) ya da Dativ içindir; *sein* sonrası Nominativ gelir.","Ich trinke ___ Wasser. (kalt)|kaltes|kalte|kalten|Artikel yok → sıfat artikelin sonunu alır: *das* → *-es*: *kaltes Wasser*.||*kalte* olmaz: *-e* dişil (*die*) ya da çoğul içindir; *Wasser* nötr.|*kalten* olmaz: *-en* eril Akkusativ (*den*) içindir; *Wasser* nötr.","Mit ___ Gemüse schmeckt die Suppe besser. (frisch)|frischem|frischen|frisches|*mit* + Dativ, artikel yok → sıfat *dem*'in sonunu alır, *-em*: *mit frischem Gemüse*.||*frischen* olmaz: *-en* artikel varken gelir (*mit dem frischen*); artikelsiz nötr Dativ *-em*.|*frisches* olmaz: *-es* Nominativ/Akkusativ nötr; *mit* Dativ ister.","Wir suchen eine ___ Wohnung. (größer)|größere|größeren|größerer|*eine* + dişil Akkusativ → *-e*. Karşılaştırma biçimi *größer* da aynı eki alır: *eine größere Wohnung*.||*größeren* olmaz: *-en* Akk. eril (*einen*), Dativ ya da çoğul içindir; *Wohnung* dişil.|*größerer* olmaz: *-er* eril Nominativ (*ein größerer*) içindir.","Das sind keine ___ Ideen. (gut)|guten|gute|guter|*keine* + çoğul → sıfat hep *-en*: *keine guten Ideen* (*meine, deine* … sonrası da aynı).||*gute* olmaz: çoğulda *-e* sadece artikelsizken gelir (*gute Ideen*); *keine* sonrası *-en*.|*guter* olmaz: *-er* eril tekil Nominativ eki (*ein guter*); *Ideen* çoğul.","Ich mag ___ Kaffee. (schwarz)|schwarzen|schwarzer|schwarze|Artikel yok, Akkusativ eril → sıfat *den*'in sonunu alır: *schwarzen Kaffee*.||*schwarzer* olmaz: *-er* Nominativ'dir (*Schwarzer Kaffee ist gut.*); *mögen* Akkusativ ister.|*schwarze* olmaz: *-e* dişil ya da çoğul içindir; *Kaffee* eril (*der*)."],
g12:["Ich warte ___ den Bus.|auf|für|an|*warten* sabit olarak *auf* + Akkusativ ile gelir: *auf den Bus warten*.||*für* olmaz: 'için' diye düşünme; *warten* her zaman *auf* alır.|*an* olmaz: *an* *denken* ile gelir; *warten* *auf* ister.","Ich denke oft ___ dich.|an|auf|von|Birini/bir şeyi düşünmek, aklına getirmek: *denken an* + Akkusativ → *an dich*.||*auf* olmaz: *auf* *warten* ve *sich freuen* ile gelir; *denken* *an* alır.|*von* olmaz: İngilizce 'think of' gibi düşünme; üstelik *von* Dativ ister (*von dir*).","Sie interessiert sich ___ Musik.|für|an|über|*sich interessieren* sabit olarak *für* + Akkusativ alır: *sich für Musik interessieren*.||*an* olmaz: *an* sadece *interessiert sein an* kalıbında gelir; *sich interessieren* *für* alır.|*über* olmaz: *über* *sprechen über* ya da *sich freuen über* ile gelir.","___ freust du dich? – Auf den Urlaub.|Worauf|Wofür|Woran|Cevap *auf* + şey → soru *wo(r)* + *auf*: *Worauf?* (*auf* ünlüyle başladığı için araya *r* girer).||*Wofür* olmaz: *für* ile kurulan soru; *sich freuen* *auf* ya da *über* alır.|*Woran* olmaz: *an* ile kurulan soru (*denken an*); cevapta *auf* var.","Nächste Woche fahren wir ans Meer. Ich freue mich schon ___.|darauf|dafür|daran|Gelecekteki şeyi dört gözle beklemek: *sich freuen auf*; şey için cevapta *da(r)* + *auf* → *darauf*.||*dafür* olmaz: *sich freuen* *für* ile şey almaz; gelecekteki şey için *auf* gelir.|*daran* olmaz: *an* *denken an* gibi fiillerle gelir; *sich freuen* *auf* alır.","Er hat Angst ___ Hunden.|vor|von|für|*Angst haben* sabit olarak *vor* + Dativ alır: *Angst vor Hunden*.||*von* olmaz: Türkçedeki '-den korkmak' *von*'u düşündürür ama doğrusu *vor*.|*für* olmaz: *für* 'için' demektir; *Angst haben* *vor* alır.","Wir sprechen morgen ___ das Projekt.|über|von|an|Bir konu hakkında konuşmak: *sprechen über* + Akkusativ → *über das Projekt*.||*von* olmaz: *von* Dativ ister (*vom Projekt*); *das Projekt* ise Akkusativ.|*an* olmaz: *sprechen* *an* ile gelmez; konu için *über* kullanılır.","Ich habe dein Paket gerade aufgemacht. Ich freue mich sehr ___ das Geschenk.|über|auf|für|Paket açıldı, hediye artık elinde; olmuş/gelmiş şeye sevinmek → *sich freuen über* + Akkusativ.||*auf* olmaz: *sich freuen auf* henüz gelmemiş şey içindir; hediye zaten elinde.|*für* olmaz: *sich für jemanden freuen* = biri adına sevinmek; şey için kullanılmaz."],
g13:["Weißt du, wann der nächste Zug ___? (kommen)|kommt|kommt er|kommen|Dolaylı soru bir yan cümledir: çekimli fiil sona gider. Özne *der Zug* tekil → *kommt*.||*kommt er* olmaz: özne zaten *der Zug*; yan cümlede ikinci özne ya da soru sırası olmaz.|*kommen* olmaz: özne *der Zug* tekil, fiil çekimli olmalı: *kommt*.","Ich weiß nicht, ___ er heute kommt oder nicht.|ob|wenn|dass|Evet/hayır sorusu dolaylı olunca *ob* ile kurulur (gelip gelmediğini): *ob er kommt oder nicht*.||*wenn* olmaz: *wenn* koşul ya da zaman bildirir (eğer, -ince); gelip gelmediğini anlamı *ob* ile kurulur.|*dass* olmaz: *dass* kesin bir bilgiyi aktarır; *oder nicht* belirsizlik gösteriyor, bu yüzden *ob*.","Können Sie mir sagen, wo der Bahnhof ___? (sein)|ist|sein|ist er|*Können Sie mir sagen, …* sonrası W-sorusu yan cümle olur: *wo* + özne + fiil sonda → *wo der Bahnhof ist*.||*sein* olmaz: fiil özneye göre çekimlenmeli; *der Bahnhof* → *ist*.|*ist er* olmaz: özne *der Bahnhof*; *er* fazladan özne olur, yan cümlede devrik sıra yok.","Er fragt, ob wir morgen Zeit ___. (haben)|haben|hat|haben wir|*ob* yan cümlesinde çekimli fiil sona gider; özne *wir* → *haben*. Dolaylı anlatımda *hätten* de doğru.|hätten|*hat* olmaz: *hat* *er/sie/es* içindir; özne *wir* → *haben*.|*haben wir* olmaz: *wir* zaten *ob*'dan sonra geldi; yan cümlede fiil özneden sonra, en sonda durur.","Ich möchte wissen, ___ das kostet.|wie viel|wie viele|wie|Fiyat *wie viel* (ne kadar) ile sorulur: *wie viel das kostet*. *was das kostet* da doğru ve yaygın.|was|*wie viele* olmaz: *wie viele* sayılabilen çoğul isimle gelir (*wie viele Bücher*); fiyat için *wie viel*.|*wie* olmaz: *wie* nasıl demektir; fiyat *wie viel* ile sorulur.","Weißt du, warum Anna nicht gekommen ___?|ist|hat|sein|Yan cümlede Perfekt'in yardımcı fiili en sona gider; *kommen* yer değiştirme anlatır, *sein* alır → *gekommen ist*.||*hat* olmaz: *kommen* yer değiştirme anlatır, Perfekt'te *sein* alır: *ist gekommen*.|*sein* olmaz: yardımcı fiil özneye göre çekimlenmeli; *Anna* → *ist*.","Sag mir bitte, ___ du heute Abend machst.|was|ob|dass|Ne yaptığını soruyorsun: soru kelimesi *was* kalır, fiil sona gider → *was du heute Abend machst*.||*ob* olmaz: *machen* bir nesne ister (ne?); *ob* ile bu nesne eksik kalır.|*dass* olmaz: *dass* bilgi aktarır, nesne vermez; *machst* fiilinin nesnesi *was* olmalı.","Ich frage mich, ___ meine Antwort richtig oder falsch ist.|ob|wenn|dass|*sich fragen* + evet/hayır sorusu → *ob*: cevabımın doğru mu yanlış mı olduğunu merak ediyorum.||*wenn* olmaz: *wenn* eğer/-ince demektir; *Ich frage mich* bir soru içeriği ister, o da *ob* ile gelir.|*dass* olmaz: *sich fragen* ile *dass* kullanılmaz; soru içeriği *ob* ya da W-kelimesiyle gelir."],
g14:["Du ___ mehr schlafen. (sollen, Konjunktiv II)|solltest|sollst|solltet|Tavsiye için *sollen*'in Konjunktiv II'si: *du solltest* → *Du solltest mehr schlafen.* (daha çok uyumalısın)||*sollst* olmaz: Präsens'tir, görev/emir anlatır; tavsiye için Konjunktiv II *solltest* gerekir.|*solltet* olmaz: *ihr* biçimidir; *du* ile *solltest*.","An deiner Stelle ___ ich zum Arzt gehen. (werden, Konjunktiv II)|würde|würdest|wurde|*An deiner Stelle würde ich …* = senin yerinde olsam …; özne *ich* → *würde* + mastar (*gehen*).||*würdest* olmaz: *deiner* seni gösterir ama özne *ich*; *ich* ile *würde*.|*wurde* olmaz: noktasız *wurde* geçmiş zamandır; tavsiye/dilek için *würde*.","Wenn ich mehr Zeit ___, würde ich reisen.|hätte|habe|hatte|Gerçek dışı koşul (vaktim yok): iki taraf da Konjunktiv II olur; *haben* → *hätte*.||*habe* olmaz: Präsens gerçek koşul anlatır; *würde* ile kurulan gerçek dışı koşul *hätte* ister.|*hatte* olmaz: noktasız *hatte* geçmiş zamandır (vaktim vardı); olsa anlamı için *hätte*.","Ich ___ jetzt gern am Strand. (sein, Konjunktiv II)|wäre|würde|war|*sein*'in Konjunktiv II'si *wäre*: *Ich wäre gern …* = … olmak isterdim.||*würde* olmaz: *würde* bir mastar ister; burada mastar yok, *wäre* tek başına yeter.|*war* olmaz: *war* geçmiş zamandır (oradaydım); dilek için *wäre*.","Ihr ___ nicht so viel arbeiten. (sollen, Konjunktiv II)|solltet|solltest|sollten|*ihr* ile Konjunktiv II eki *-et*: *ihr solltet* → bu kadar çok çalışmamalısınız.||*solltest* olmaz: *du* biçimidir; *ihr* ile *solltet*.|*sollten* olmaz: *wir/sie/Sie* biçimidir; *ihr* ile *solltet*.","Wenn ich reich wäre, ___ ich ein Haus kaufen. (werden, Konjunktiv II)|würde|wäre|hätte|Sonuç kısmında *würde* + mastar: *würde ich ein Haus kaufen* (bir ev alırdım).||*wäre* olmaz: *wäre* bir mastarla (*kaufen*) kullanılmaz; çoğu fiil *würde* + mastar ile kurulur.|*hätte* olmaz: *hätte* + mastar olmaz; doğrusu *würde … kaufen*.","Ich würde gern besser Deutsch ___. (sprechen)|sprechen|gesprochen|spreche|*würde* her zaman bir mastarla kullanılır, mastar en sona gider: *würde … sprechen*.||*gesprochen* olmaz: Partizip II *haben/sein* ile gelir; *würde* mastar ister.|*spreche* olmaz: çekimli fiil zaten *würde*; ikinci fiil mastar kalır: *sprechen*.","Es ___ besser, wenn du früher kommst. (sein, Konjunktiv II)|wäre|hätte|wären|*Es wäre besser, wenn …* = … olsa daha iyi olurdu; *sein* → *wäre*, özne *es* tekil.||*hätte* olmaz: *besser* bir durum anlatır, *sein* ister: *Es wäre besser*.|*wären* olmaz: çoğul biçimdir; özne *es* tekil → *wäre*."],
g15:["Das Essen ___ gerade gekocht. Es dauert noch zehn Minuten.|wird|werden|ist|Süreç sürüyor (yemek pişiriliyor): *werden* + Partizip II. *das Essen* tekil → *wird*.||*werden* olmaz: çoğul biçimdir; *das Essen* tekil → *wird*.|*ist* olmaz: *ist gekocht* bitmiş durumu anlatır (pişmiş); yemek hâlâ pişiyor, süreç için *wird*.","Die Pakete ___ morgen geliefert.|werden|wird|wurden|Edilgen: *werden* + Partizip II. *die Pakete* çoğul → *werden*: paketler yarın teslim ediliyor.||*wird* olmaz: tekil biçimdir; *die Pakete* çoğul → *werden*.|*wurden* olmaz: *wurden* geçmiş zamandır, *morgen* ile uymaz.","Hier wird Deutsch ___. (sprechen)|gesprochen|sprechen|gesprecht|Edilgen = *werden* + Partizip II: *sprechen* → *gesprochen*. Burada Almanca konuşulur.||*sprechen* olmaz: *werden* + mastar gelecek zaman olur (Almanca konuşacak?); edilgen için Partizip II.|*gesprecht* olmaz: *sprechen* düzensiz fiildir; Partizip II'si *gesprochen*.","Das Fitnessstudio wird um sechs Uhr ___. (öffnen)|geöffnet|öffnet|geöffnen|*werden* + Partizip II en sonda: *öffnen* → *geöffnet* (düzenli fiil: *ge-* … *-et*).||*öffnet* olmaz: çekimli fiil zaten *wird*; sonda Partizip II gerekir: *geöffnet*.|*geöffnen* olmaz: *öffnen* düzenli fiildir, Partizip'i *-et* ile biter: *geöffnet*.","Das Auto wird ___ einem Mechaniker repariert. (tarafından)|von|durch|für|Edilgende işi yapan kişi *von* + Dativ ile söylenir: *von einem Mechaniker* = bir tamirci tarafından.||*durch* olmaz: *durch* Akkusativ ister (*einen*); işi yapan kişi *von* + Dativ ile söylenir.|*für* olmaz: *für* için demektir ve Akkusativ ister; tarafından = *von*.","Am Sonntag ___ in Deutschland meistens nicht gearbeitet.|wird|werden|ist|Öznesiz edilgen: kimin çalıştığı söylenmez, fiil hep tekil *wird* olur: *Am Sonntag wird nicht gearbeitet.*||*werden* olmaz: cümlede çoğul özne yok; öznesiz edilgende hep *wird*.|*ist* olmaz: edilgen *werden* ile kurulur; *arbeiten* ile *ist gearbeitet* olmaz.","Die Besprechung wird auf Freitag ___. (verschieben)|verschoben|verschiebt|geverschoben|*ver-* ön ekli fiiller Partizip'te *ge-* almaz: *verschieben* → *verschoben*.||*verschiebt* olmaz: çekimli fiil zaten *wird*; sonda Partizip II gerekir: *verschoben*.|*geverschoben* olmaz: *ver-* ile başlayan fiiller Partizip'te *ge-* almaz.","Die Fenster ___ jede Woche geputzt.|werden|wird|haben|*die Fenster* çoğul → *werden* + Partizip II: pencereler her hafta temizlenir.||*wird* olmaz: tekil biçimdir; *die Fenster* çoğul → *werden*.|*haben* olmaz: *haben geputzt* etken Perfekt olur (pencereler temizledi?); edilgen *werden* ile kurulur."],
