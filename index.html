var TAB='heute', OPEN=null, W={q:null,day:'',step:'q',pick:null}, X=null, lastScore=null;

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}

function render(){
  var st=streak(),el=$('streak');
  el.querySelector('span').textContent=st+' gün seri';
  el.classList.toggle('off',st===0);
  [].forEach.call($('tabs').children,function(b){var on=b.dataset.v===TAB;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
  var h=TAB==='heute'?vHeute():TAB==='woerter'?vWoerter():TAB==='weg'?vWeg():vWoche();
  $('main').innerHTML='<div class="scr">'+h+'</div>';
  if(TAB==='heute')animRing();
}
var RL=2*Math.PI*45;
function animRing(){
  var s=total(peek(today())),fg=document.querySelector('.ring .fg');if(!fg)return;
  var from=lastScore==null?0:lastScore;
  fg.style.strokeDashoffset=RL*(1-from/100);
  fg.getBoundingClientRect();
  requestAnimationFrame(function(){fg.style.strokeDashoffset=RL*(1-s/100);});
  if(lastScore!=null&&s!==lastScore){var b=document.querySelector('.ring .v b');if(b)b.classList.add('pulse');}
  lastScore=s;
}

/* ================= HEUTE ================= */
function taskDefs(d){
  var tp=curTopic(),f=frac(d),p=parts(d);
  var rem=Math.max(0,(d.wt||0)-(d.w||0));
  var ws=d.wt===0?'Bugün vadesi gelen kart yok · tam puan':
    rem===0?'Tamam · '+(d.w||0)+' kart tekrar edildi':rem+' kart kaldı · ~'+Math.max(1,Math.round(rem/3))+' dk';
  var sp=todays(SPR),sc=todays(SCH);
  return [
    {id:'wort',c:'var(--der)',t:'Kelime tekrarı',s:ws},
    {id:'gram',c:'var(--les)',t:'Gramer: '+tp[2],s:Math.min(d.g||0,6)+'/6 alıştırma · kısa anlatım + cümle kurma'},
    {id:'hor',c:'var(--hor)',t:'Hören',s:(d.h||0)+' / 10 dk dinleme'+(d.hs?' · '+d.hs:'')},
    {id:'sch',c:'var(--sch)',t:'Schreiben: '+sc[0],s:sentN(d.sch)+' / 3 cümle · biri bugünkü gramerle'},
    {id:'spr',c:'var(--spr)',t:'Sprechen: '+sp[0],s:d.spr?'Yaptım'+(d.sm?' · '+d.sm+' dk':''):'1–2 dakika sesli anlat'}
  ].map(function(t){t.f=f[t.id];t.p=p[t.id];t.max=MAX[t.id];return t;});
}
function vHeute(){
  ensureTarget();
  var t=today(),d=day(),s=total(d),tasks=taskDefs(d),tp=curTopic();
  var h='<div class="card hero"><div class="ring"><svg viewBox="0 0 108 108"><circle class="bg" cx="54" cy="54" r="45"/><circle class="fg" cx="54" cy="54" r="45" style="stroke-dasharray:'+RL+';stroke-dashoffset:'+RL+'"/></svg>'+
    '<div class="v"><b class="num" id="scoreN">'+s+'</b><small>Puan</small></div></div>'+
    '<div class="meta"><div class="eyebrow">Heute</div><div class="date" lang="de">'+deDate(t)+'</div>'+
    '<div class="verdict" id="verdict">'+verdict(s,d)+'</div><div class="segs" id="segs">'+segs(tasks)+'</div></div></div>';
  h+='<div class="tasks">'+tasks.map(taskHtml).join('')+'</div>';
  if(!wordDone(d)||isMin(d))h+='<div class="minday"><b>Minimum gün:</b> sadece kelime tekrarını bitirsen bile seri kırılmaz; takvimde sarı görünür. Kötü günde 8 dakika yeter.</div>';
  h+='<div class="card"><div class="eyebrow">Ekstra · puansız</div><div class="row" style="margin-top:6px"><div style="min-width:0"><div style="font-weight:700">Lesen</div><div class="small muted">Kitap, haber, okuma metni</div></div><div class="sp"></div>'+
    stepper('l',d.l||0,'dk')+'</div><div class="note" style="margin-top:8px">Puana girmez; Weg\'deki Lesen çubuğunu doldurur.</div></div>';
  var si=hash(t)%tp[4].length,sn=tp[4][si];
  h+='<div class="card sotd"><div class="eyebrow">Satz des Tages · '+esc(tp[1])+'</div><div class="de" lang="de">'+esc(sn[0])+'</div><div class="tr">'+esc(sn[1])+'</div><div class="why"><b>'+esc(tp[2])+':</b> '+esc(tp[3])+'</div></div>';
  return h;
}
function segs(tasks){
  return tasks.map(function(t){var pc=Math.round(t.f*100);return '<span style="flex:'+t.max+';background:linear-gradient(90deg,'+t.c+' '+pc+'%,var(--line) '+pc+'%)"></span>';}).join('');
}
function taskHtml(t){
  var cls='task'+(t.f>=1?' done':t.f>0?' part':'')+(OPEN===t.id?' open':'');
  var h='<div class="'+cls+'" style="--c:'+t.c+'" data-task="'+t.id+'"><button class="trow" data-act="task" data-id="'+t.id+'" aria-expanded="'+(OPEN===t.id)+'">'+
    '<span class="ck" style="--f:'+Math.round(t.f*100)+'%"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span>'+
    '<span class="tx"><span class="t1">'+esc(t.t)+'</span><span class="t2">'+esc(t.s)+'</span></span>'+
    '<span class="pt num">'+(t.p>0&&t.p<t.max?t.p+'/'+t.max:'+'+t.max)+'</span></button>';
  if(OPEN===t.id)h+='<div class="tbody">'+taskBody(t.id)+'</div>';
  return h+'</div>';
}
function stepper(k,v,unit){
  return '<div class="step"><button data-act="inc" data-k="'+k+'" data-n="-1" aria-label="azalt">−</button><div class="v num">'+v+'<small>'+unit+'</small></div>'+
    '<button data-act="inc" data-k="'+k+'" data-n="1" aria-label="artır">+1</button><button data-act="inc" data-k="'+k+'" data-n="5">+5</button></div>';
}
function taskBody(id){
  var d=day();
  if(id==='hor'){
    return '<div class="row">'+stepper('h',d.h||0,'dk')+'</div>'+
      '<div class="row" style="flex-wrap:wrap;gap:6px">'+HSRC.map(function(s){return '<button class="chip'+(d.hs===s?' on':'')+'" data-act="hsrc" data-v="'+esc(s)+'">'+esc(s)+'</button>';}).join('')+'</div>'+
      '<div class="note">Dinlediğin süreyi gir; 10 dakika tam puan. Kaynağı seçmek isteğe bağlı.</div>';
  }
  if(id==='sch'){
    var p=todays(SCH),tp=curTopic();
    return '<div class="prompt"><div class="de" lang="de">'+esc(p[0])+'</div><div class="tr">'+esc(p[1])+' · Bir cümlede <b>'+esc(tp[2])+'</b> kullanmayı dene.</div></div>'+
      '<textarea class="inp" lang="de" data-in="sch" spellcheck="false" autocapitalize="sentences" placeholder="Schreib hier … (3 Sätze)">'+esc(d.sch||'')+'</textarea>'+
      '<div class="row"><span class="small muted num" id="schN">'+sentN(d.sch)+' / 3 cümle</span><div class="sp"></div><button class="btn sm" disabled title="v2">Claude ile düzelt · v2</button></div>'+
      '<div class="note">En az üç kelimelik her cümle sayılır. Yazdıkların saklanıyor; v2\'de Claude düzeltip hatayı gramer haritasına bağlayacak.</div>';
  }
  if(id==='spr'){
    var q=todays(SPR);
    return '<div class="prompt"><div class="de" lang="de">'+esc(q[0])+'</div><div class="tr">'+esc(q[1])+'</div></div>'+
      '<div class="row"><button class="btn'+(d.spr?' dark':'')+'" data-act="spr">'+(d.spr?'✓ Yaptım':'Yaptım')+'</button><div class="sp"></div>'+stepper('sm',d.sm||0,'dk')+'</div>'+
      '<div class="note">Sesli anlat; istersen telefonun ses kaydedicisiyle kaydet. Konuşma doğrulanamadığı için "yaptım" tam puan sayılır. Ses arşivi ve değerlendirme v2\'de.</div>';
  }
  return '';
}
function refreshScore(){
  var d=day(),s=total(d),tasks=taskDefs(d);
  $('scoreN').textContent=s;$('verdict').textContent=verdict(s,d);$('segs').innerHTML=segs(tasks);
  var fg=document.querySelector('.ring .fg');if(fg)fg.style.strokeDashoffset=RL*(1-s/100);lastScore=s;
  tasks.forEach(function(t){
    var el=document.querySelector('[data-task="'+t.id+'"]');if(!el)return;
    el.classList.toggle('done',t.f>=1);el.classList.toggle('part',t.f>0&&t.f<1);
    el.querySelector('.ck').style.setProperty('--f',Math.round(t.f*100)+'%');
    el.querySelector('.t2').textContent=t.s;
    el.querySelector('.pt').textContent=t.p>0&&t.p<t.max?t.p+'/'+t.max:'+'+t.max;
  });
  var st=streak();$('streak').querySelector('span').textContent=st+' gün seri';$('streak').classList.toggle('off',st===0);
}

/* ================= WÖRTER ================= */
function buildQueue(){
  ensureTarget();
  var t=today(),due=[],id;
  for(id in S.srs)if(S.srs[id].d<=t&&card(id))due.push(id);
  due.sort(function(a,b){var x=S.srs[a].d,y=S.srs[b].d;return x<y?-1:x>y?1:Math.random()-.5;});
  var nw=pickNew(newLeft()),q=[];
  /* iki tekrar, bir yeni: yeni kartlar sona yığılmasın */
  while(due.length||nw.length){if(due.length)q.push(due.shift());if(due.length)q.push(due.shift());if(nw.length)q.push(nw.shift());}
  W={q:q,day:t,step:'q',pick:null,n0:q.length};
}
function vWoerter(){
  if(!W.q||W.day!==today())buildQueue();
  var c=counts(),nl=newLeft();
  var h='<div class="srs num"><div><b>'+c.due+'</b><span>vadesi gelen</span></div><div><b>'+c.lrn+'</b><span>öğreniliyor</span></div><div><b>'+c.sat+'</b><span>oturdu</span></div></div>';
  h+='<div class="card flash" id="flash">'+flashHtml()+'</div>';
  h+='<div class="legend"><span><i style="background:var(--der)"></i>der</span><span><i style="background:var(--die)"></i>die</span><span><i style="background:var(--das)"></i>das</span></div>';
  h+='<div class="card"><div class="eyebrow">Übungen · cümle kurma ve oyunlar</div><div class="ex3">'+
    '<button data-act="blitz" style="--c:var(--die)"><i></i><b>Artikel-Blitz</b><span>60 saniyede der/die/das'+(S.best.blitz?' · rekor '+S.best.blitz:'')+'</span></button>'+
    '<button data-act="luecke" style="--c:var(--sch)"><i></i><b>Lücke</b><span>Boşluğa doğru kelime, 10 soru</span></button>'+
    '<button data-act="satzw" style="--c:var(--les)"><i></i><b>Satzbau</b><span>Karışık kelimelerden cümle diz</span></button></div></div>';
  h+='<div class="card"><div class="row"><div><div class="eyebrow">Kelime havuzu</div><div class="small muted" style="margin-top:2px">'+POOL.length+' kelime · günde '+S.set.newPerDay+' yeni, karışık'+(nl?' · bugün '+nl+' yeni kaldı':'')+'</div></div><div class="sp"></div><button class="btn sm dark" data-act="addw">+ Kelime ekle</button></div>'+
    '<div class="lvls">'+[1,2,3].map(function(l){var tot=0,seen=0;POOL.forEach(function(e){if(e.l===l){tot++;if(S.srs[e.id])seen++;}});var pc=tot?Math.round(seen/tot*100):0;
      return '<div><div class="h"><span style="color:var(--ink)">'+LV[l]+(S.set.lv[l]?'':' · kapalı')+'</span><span class="num">'+seen+' / '+tot+'</span></div><div class="bar" style="--c:'+['','var(--das)','var(--der)','var(--les)'][l]+'"><i style="width:'+pc+'%"></i></div></div>';}).join('')+'</div>'+
    '<input class="inp" style="margin-top:14px" data-in="q" type="search" placeholder="Havuzda ara: Almanca ya da Türkçe" autocomplete="off" spellcheck="false">'+
    '<div class="qres" id="qres"></div>'+
    (S.mine.length?'<div class="small muted" style="margin-top:8px">Kendi eklediğin: '+S.mine.length+' kelime</div>':'')+'</div>';
  return h;
}
function flashHtml(){
  var q=W.q;
  if(!q.length){
    var d=peek(today())||{};
    return '<div class="eyebrow">Wörter</div><div class="word" style="font-size:30px">Bugünlük tamam.</div>'+
      '<p class="muted small">'+(d.w||0)+' kart tekrar edildi. Yarın vadesi gelenler burada olacak.</p>'+
      '<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn dark" data-act="more">Havuzdan 5 yeni kart</button><button class="btn" data-act="blitz">Artikel-Blitz</button></div>';
  }
  var id=q[0],c=card(id),fresh=!S.srs[id],prog='<span class="prog num">'+(W.n0-q.length+1)+' / '+W.n0+(fresh?' · yeni':'')+'</span>';
  if(!c){q.shift();return flashHtml();}
  if(W.step==='q'){
    if(c.p==='n'&&c.a){
      return prog+'<div class="src">'+esc(srcLabel(c))+'</div><div class="word" lang="de">'+esc(c.w)+'</div><p class="small muted">Artikeli seç</p>'+
        '<div class="arts">'+['der','die','das'].map(function(a){return '<button data-act="art" data-v="'+a+'" style="--a:var(--'+a+');--at:var(--'+a+'-t)">'+a+'</button>';}).join('')+'</div>';
    }
    return prog+'<div class="src">'+esc(srcLabel(c))+' · '+POS[c.p]+'</div><div class="word" lang="de">'+esc(c.w)+'</div><p class="small muted">Anlamı ne? Önce kendin hatırla.</p>'+
      '<button class="btn dark wide" data-act="show">Göster</button>';
  }
  var a=ART(c.a),ok=W.pick===a,pl=plural(c);
  var hh=prog+'<div class="src">'+esc(srcLabel(c))+'</div>'+
    '<div class="word" lang="de" style="--ac:var(--'+(a||'ink')+')">'+(a?'<span class="art">'+a+'</span> ':'')+esc(c.w)+'</div>'+
    (pl?'<div class="pl" lang="de">Pl. die '+esc(pl)+'</div>':c.p==='n'&&a?'<div class="pl">çoğulu yok / az kullanılır</div>':c.f?'<div class="pl" lang="de">'+esc(c.f)+'</div>':'')+
    '<div class="ans">'+(W.pick?'<div class="res" style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'Richtig!':'Fast. Sen "'+W.pick+'" dedin.')+'</div>':'')+
    '<div class="tr">'+esc(c.tr)+'</div>'+(c.ex?'<div class="ex" lang="de">'+hl(c.ex)+'</div>':'')+
    (a?'<div class="rule">'+esc(rule(c))+'</div>':'')+'</div>'+
    '<div class="grade"><button data-act="grade" data-g="0">Tekrar<small>'+ivl(next(id,0))+'</small></button><button data-act="grade" data-g="1">Zor<small>'+ivl(next(id,1))+'</small></button><button data-act="grade" data-g="2">Kolay<small>'+ivl(next(id,2))+'</small></button></div>'+
    (fresh?'<button class="link" data-act="grade" data-g="3">Bunu zaten biliyorum · 30 gün sonra sor</button>':'');
  return hh;
}
function flashBg(){
  var el=$('flash');if(!el)return;
  var c=W.q.length&&card(W.q[0]);
  el.style.background=W.step==='a'&&c&&ART(c.a)?'var(--'+ART(c.a)+'-t)':'';
}
function redrawFlash(){var el=$('flash');if(!el){render();return;}el.innerHTML=flashHtml();flashBg();}
function searchHtml(q){
  q=q.trim().toLowerCase();if(q.length<2)return '';
  var out=[],all=S.mine.concat(POOL);
  for(var i=0;i<all.length&&out.length<30;i++){var c=all[i];
    if(c.w.toLowerCase().indexOf(q)>=0||c.tr.toLowerCase().indexOf(q)>=0||(c.a&&(c.a+' '+c.w).toLowerCase().indexOf(q)===0))out.push(c);}
  if(!out.length)return '<div class="small muted" style="padding:8px 0">Bulunamadı. "+ Kelime ekle" ile kendin ekleyebilirsin.</div>';
  return out.map(function(c){var s=S.srs[c.id],a=ART(c.a);
    return '<div class="r"><span class="w" lang="de" style="color:var(--'+(a||'ink')+')">'+(a?a+' ':'')+esc(c.w)+'</span><span class="m">'+esc(c.tr)+'</span>'+
      (s?'<span class="tag">'+(s.i>=21?'oturdu':'destede')+'</span>':'<button class="btn sm tag" data-act="addcard" data-id="'+esc(c.id)+'">+ ekle</button>')+'</div>';}).join('');
}

/* ================= WEG ================= */
function skillMins(){
  var m={les:0,hor:0,sch:0,spr:0};
  for(var k in S.days){var d=S.days[k];m.hor+=d.h||0;m.les+=d.l||0;m.sch+=sentN(d.sch)*2;m.spr+=d.sm||(d.spr?2:0);}
  return m;
}
var SKT=1800; /* beceri başına 30 saat = çubuk dolu (basit v1 ölçüsü) */
function vWeg(){
  var c=counts(),ok=0,wip=0;G.forEach(function(g){var s=gst(g[0]);if(s==='ok')ok++;else if(s==='wip')wip++;});
  var VT=POOL.length,vp=Math.min(1,c.sat/VT),gp=(ok+wip*.5)/G.length,p=Math.round(100*(vp*.5+gp*.5));
  var lb=p<25?'A2.1':p<50?'A2.2':p<75?'B1.1':p<100?'B1.2':'B1';
  var h='<div class="card lvl"><div class="row"><div class="eyebrow">A2 → B1</div><div class="sp"></div><span class="eyebrow num">'+p+' / 100</span></div>'+
    '<div class="row" style="margin-top:4px;align-items:baseline"><span class="big">'+lb+'</span><div class="sp"></div><span class="small muted">B1\'e '+(100-p)+' adım</span></div>'+
    '<div class="track"><i style="width:'+p+'%"></i></div><div class="ticks"><span>A2.1</span><span>A2.2</span><span>B1.1</span><span>B1.2</span><span>B1</span></div>'+
    '<div class="small muted" style="margin-top:8px">Yarısı oturan kelimelerden ('+c.sat+' / '+VT+'), yarısı gramer haritasından ('+ok+' oturdu, '+wip+' çalışılıyor).</div></div>';
  var sm=skillMins(),SK=[['Lesen','les','Kısa e-posta, ilan ve haberleri anlarım.'],['Hören','hor','Günlük konuşmanın ana fikrini yakalarım.'],['Schreiben','sch','Kişisel mektup ve kısa metin yazarım.'],['Sprechen','spr','Planlarımı anlatır, gerekçe veririm.']];
  h+='<div class="card"><div class="eyebrow" style="margin-bottom:12px">Dört beceri · '+esc(S.set.examName)+' modülleri</div><div class="skills">'+
    SK.map(function(s){var m=sm[s[1]],pc=Math.min(100,Math.round(m/SKT*100));
      return '<div class="sk"><div class="h">'+s[0]+'<span class="num">'+pc+'</span></div><div class="bar" style="--c:var(--'+s[1]+')"><i style="width:'+pc+'%"></i></div><div class="k">'+mins(m)+(s[1]==='sch'?' (cümle başı ~2 dk)':'')+' · '+s[2]+'</div></div>';}).join('')+
    '</div><div class="note" style="margin-top:12px">Şimdilik basit ölçü: her beceride 30 saat = dolu çubuk.</div></div>';
  if(S.set.exam){var n=dd(today(),S.set.exam);
    h+='<div class="card exam"><div class="n num">'+Math.max(0,n)+'</div><div><b>'+(n>=0?'gün kaldı':'gün geçti')+' · '+esc(S.set.examName)+'</b><small>'+trDate(S.set.exam)+'</small></div></div>';
  }else h+='<div class="card exam"><div><b>'+esc(S.set.examName)+'</b><small>Sınav tarihi yok. Somut bir gün daha çok çalıştırır.</small></div><button class="btn sm" data-act="settings">Tarih seç</button></div>';
  h+='<div class="card"><div class="row"><div class="eyebrow">Gramer haritası · Menschen A2.1 → B1</div><div class="sp"></div><span class="eyebrow num">'+ok+' / '+G.length+'</span></div>'+
    '<div class="small muted" style="margin-top:4px">Konunun adına dokun: Türkçe özet, örnekler, kurs notun ve alıştırma. Sağdaki etiket durumu değiştirir.</div>';
  BANDS.forEach(function(b){
    var gs=G.filter(function(g){return g[1]===b;}),bo=gs.filter(function(g){return gst(g[0])==='ok';}).length;
    h+='<div class="band"><div class="bh"><b>'+b+'</b><span class="small muted num">'+bo+' / '+gs.length+' oturdu</span></div><ul class="gl">'+
      gs.map(function(g){var s=gst(g[0]);return '<li><button class="nm" data-act="topic" data-id="'+g[0]+'"><span class="dot" style="background:'+STC[s]+'"></span><span lang="de">'+esc(g[2])+'</span>'+(S.gfocus===g[0]?'<span class="chip on" style="padding:1px 8px;font-size:10px">bugün</span>':'')+'</button><button class="st '+s+'" data-act="gcycle" data-id="'+g[0]+'">'+STL[s]+'</button></li>';}).join('')+'</ul></div>';
  });
  return h+'</div>';
}

/* ================= WOCHE ================= */
function cellColor(v){
  var p=v<50?18:v<70?45:v<85?75:100;
  return p===100?'var(--das)':'color-mix(in srgb,var(--das) '+p+'%,var(--card2))';
}
function weekStats(m){
  var t=today(),r={n:0,sum:0,w:0,sat:0,h:0,g:0,min:0,full:0};
  for(var i=0;i<7;i++){var k=addD(m,i);if(k>t)break;var d=peek(k);if(k<S.start&&!d)continue;
    r.n++;var s=total(d);r.sum+=s;if(d){r.w+=d.w||0;r.sat+=d.sat||0;r.h+=d.h||0;}if(isMin(d))r.min++;if(s>=90)r.full++;}
  for(var id in S.gdone){var x=S.gdone[id];if(x>=m&&x<=addD(m,6))r.g++;}
  r.avg=r.n?Math.round(r.sum/r.n):null;
  return r;
}
function vWoche(){
  var t=today(),m0=addD(monday(t),-35);
  var h='<div class="card"><div class="eyebrow">Puan takvimi · son 6 hafta</div><div class="heat num">'+
    ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(function(x){return '<div class="dn">'+x+'</div>';}).join('');
  for(var i=0;i<42;i++){
    var k=addD(m0,i),d=peek(k),cls='c',st='',txt='';
    if(k>t)cls+=' fut';
    else if(k<S.start&&!d){cls+=' pre';txt='·';}
    else{var v=total(d);txt=v||'–';
      if(isMin(d))cls+=' min';
      else if(v>0)st='background:'+cellColor(v)+';color:'+(v>=70?'var(--card)':'var(--ink)');

  }
  h+='</div><div class="hkey"><span>az</span><i style="background:'+cellColor(40)+'"></i><i style="background:'+cellColor(60)+'"></i><i style="background:'+cellColor(80)+'"></i><i style="background:var(--das)"></i><span>çok</span><i style="background:var(--wrn-t);border:1px solid var(--wrn);margin-left:8px"></i><span>minimum gün</span></div></div>';
  var m=monday(t),a=weekStats(m),b=weekStats(addD(m,-7));
  var diff=a.avg!=null&&b.avg!=null?a.avg-b.avg:null;
  h+='<div class="card"><div class="eyebrow">Wochenrückblick · '+trShort(m)+' – '+trShort(addD(m,6))+'</div>'+
    '<div class="stats num">'+
    '<div><b>'+(a.avg==null?'–':a.avg)+'</b><span>ortalama puan · '+(diff==null?'geçen hafta veri yok':'geçen haftaya göre '+(diff>0?'+':'')+diff)+'</span></div>'+
    '<div><b>'+a.w+'</b><span>tekrar edilen kart</span></div>'+
    '<div><b>+'+a.sat+'</b><span>yeni oturan kelime</span></div>'+
    '<div><b>'+a.h+' dk</b><span>dinleme</span></div>'+
    '<div><b>'+a.g+'</b><span>gramer konusu bitti</span></div>'+

    '</div></div>';

  return h;
}

/* ================= SHEET ================= */
function openSheet(x){X=x;$('sheet').hidden=false;document.body.style.overflow='hidden';drawSheet();}
function closeSheet(){
  if(X&&X.timer)clearInterval(X.timer);
  X=null;$('sheet').hidden=true;document.body.style.overflow='';render();
}
function drawSheet(){
  if(!X)return;
  var h='<div class="grab"></div>';
  var k=X.kind;
  h+=k==='satz'?shSatz():k==='luck'?shLuck():k==='blitz'?shBlitz():k==='topic'?shTopic():k==='add'?shAdd():k==='set'?shSet():'';
  $('sheetBody').innerHTML=h;
}
function head(eb,t){return '<div class="shd"><div><div class="eyebrow">'+eb+'</div><h2>'+t+'</h2></div><button class="x" data-act="close" aria-label="Kapat">×</button></div>';}
function dots(n,i,res){var h='<div class="dots">';for(var j=0;j<n;j++)h+='<i class="'+(res[j]||(j===i?'cur':''))+'"></i>';return h+'</div>';}

/* --- cümle kurma --- */
function startSatz(items,mode,title,eb,intro){
  X={kind:'satz',mode:mode,title:title,eb:eb,items:items,i:0,ok:0,res:[],intro:intro||null};
  prepSatz();openSheet(X);
}
function prepSatz(){
  var it=X.items[X.i],m=it.de.match(/^(.*?)([.!?…]*)$/);
  X.end=m[2];X.sol=m[1].trim().split(/\s+/);
  var idx=X.sol.map(function(_,i){return i;}),tries=0;
  do{shuffle(idx);tries++;}while(idx.length>1&&tries<9&&idx.every(function(v,i){return v===i;}));
  X.bank=idx;X.placed=[];X.state=null;
}
function shSatz(){
  var h=head(X.eb,esc(X.title));
  if(X.intro){
    var g=X.intro;
    return h+'<div class="expl">'+esc(g[3])+'</div><div style="margin:12px 0">'+g[4].slice(0,2).map(function(s){return '<div class="gsent"><b lang="de">'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>';}).join('')+'</div>'+
      '<button class="btn dark wide" data-act="szgo">Başla · '+X.items.length+' cümle kur</button>'+
      '<div class="row" style="justify-content:center;gap:18px;margin-top:14px"><button class="link" data-act="topic" data-id="'+g[0]+'">Konunun Türkçe özeti</button><button class="link" data-act="pickother">Başka konu seç</button></div>';
  }
  if(X.i>=X.items.length){
    return h+'<div style="text-align:center;padding:20px 0"><div class="big">'+X.ok+' / '+X.items.length+'</div><p class="muted" style="margin-top:6px">'+(X.ok===X.items.length?'Hepsi doğru. Sehr gut!':'Yanlışlar da öğretir; yarın yine gel.')+'</p></div>'+
      (X.mode==='gram'&&gst(X.gid)!=='ok'?'<div class="sec"><div class="lb">Bu konu nasıl gidiyor?</div><div class="seg">'+['next','wip','ok'].map(function(v){return '<button class="'+(gst(X.gid)===v?'on':'')+'" data-act="gset" data-id="'+X.gid+'" data-v="'+v+'">'+STL[v]+'</button>';}).join('')+'</div></div>':'')+
      '<div class="row"><button class="btn wide" data-act="szagain">Yeniden</button><button class="btn dark wide" data-act="close">Bitti</button></div>';
  }
  var it=X.items[X.i];
  h+=dots(X.items.length,X.i,X.res);
  h+='<p class="sz-tr" style="margin:14px 0 10px">'+esc(it.tr)+'</p>';
  h+='<div class="sz-ans'+(X.state?' '+X.state:'')+'">'+X.placed.map(function(i,j){return '<button class="tok" lang="de" data-act="szrem" data-j="'+j+'">'+esc(X.sol[i])+'</button>';}).join('')+
    (X.placed.length?'':'<span class="small muted" style="padding:8px 4px">Kelimelere sırayla dokun</span>')+'</div>';
  if(!X.state){
    h+='<div class="sz-bank" style="margin-top:14px">'+X.bank.map(function(i,j){return '<button class="tok" lang="de" data-act="szadd" data-j="'+j+'">'+esc(X.sol[i])+'</button>';}).join('')+'</div>';
    if(X.placed.length)h+='<div style="text-align:center;margin-top:12px"><button class="link" data-act="szclear">Temizle</button></div>';
  }else if(X.state==='ok'){
    h+='<p class="res" style="color:var(--ok);text-align:center;margin:14px 0">Richtig!'+(X.end?' <span class="muted" lang="de">'+esc(X.sol.join(' ')+X.end)+'</span>':'')+'</p><button class="btn dark wide" data-act="sznext">Weiter</button>';
  }else{
    h+='<p class="res" style="color:var(--bad);margin:14px 0 6px">Doğrusu:</p><div class="sz-sol" lang="de">'+esc(X.items[X.i].de)+'</div>'+
      '<div class="row" style="margin-top:12px"><button class="btn wide" data-act="szaccept">Benimki de doğru</button><button class="btn dark wide" data-act="sznext">Weiter</button></div>';
  }
  if(it.hint)h+='<div class="note" style="margin-top:12px;text-align:center">'+it.hint+'</div>';
  return h;
}
function szCheck(){
  var ans=X.placed.map(function(i){return X.sol[i];}).join(' ');
  var ok=ans===X.sol.join(' ');
  X.state=ok?'ok':'no';X.res[X.i]=ok?'ok':'no';if(ok)X.ok++;
  if(X.mode==='gram'){var d=day();d.g=(d.g||0)+1;if(!d.gt)d.gt=X.gid;save();}
}
function gramItems(g){return shuffle(g[4].map(function(s){return {de:s[0],tr:s[1]};}));}
function startGram(g){
  var x=startSatz(gramItems(g),'gram',g[2],'Gramer · '+g[1],g);
  X.gid=g[0];
  if(gst(g[0])==='next'){setG(g[0],'wip');}
}
function wordSatzItems(n){
  var ids=Object.keys(S.srs).map(card).filter(Boolean),c=[];
  function ok(e){if(!e.ex)return false;var k=plain(e.ex).split(/\s+/).length;return k>=4&&k<=10;}
  shuffle(ids).forEach(function(e){if(ok(e))c.push(e);});
  if(c.length<n)shuffle(POOL.slice()).forEach(function(e){if(c.length<n*3&&ok(e)&&S.set.lv[e.l]&&c.indexOf(e)<0)c.push(e);});
  return c.slice(0,n).map(function(e){var a=ART(e.a);return {de:plain(e.ex),tr:'İpucu: '+(a?a+' ':'')+e.w+' = '+e.tr};});
}

/* --- Lücke --- */
function startLuck(){
  var ids=Object.keys(S.srs).map(card).filter(function(e){return e&&/\*[^*]+\*/.test(e.ex);});
  var c=shuffle(ids).slice(0,10);
  if(c.length<10)shuffle(POOL.filter(function(e){return S.set.lv[e.l]&&/\*[^*]+\*/.test(e.ex);})).forEach(function(e){if(c.length<10&&c.indexOf(e)<0)c.push(e);});
  var items=c.map(function(e){
    var m=e.ex.match(/^(.*?)\*([^*]+)\*(.*)$/),ans=m[2],opts=[ans],guard=0;
    var same=POOL.filter(function(o){return o.p===e.p&&o!==e;});
    while(opts.length<4&&guard++<60){var o=same[Math.floor(Math.random()*same.length)];if(!o)break;var mm=o.ex.match(/\*([^*]+)\*/);if(mm&&opts.indexOf(mm[1])<0)opts.push(mm[1]);}
    return {e:e,pre:m[1].replace(/\*/g,''),ans:ans,post:m[3].replace(/\*/g,''),opts:shuffle(opts)};
  });
  openSheet({kind:'luck',items:items,i:0,ok:0,res:[],pick:null});
}
function shLuck(){
  var h=head('Übung','Lücke');
  if(X.i>=X.items.length)return h+'<div style="text-align:center;padding:20px 0"><div class="big">'+X.ok+' / '+X.items.length+'</div><p class="muted" style="margin-top:6px">Boşluk doldurma bitti.</p></div><div class="row"><button class="btn wide" data-act="luecke">Yeniden</button><button class="btn dark wide" data-act="close">Bitti</button></div>';
  var it=X.items[X.i],e=it.e,a=ART(e.a);
  h+=dots(X.items.length,X.i,X.res);
  h+='<div class="lsent" lang="de">'+esc(it.pre)+(X.pick?'<b>'+esc(it.ans)+'</b>':'<u>&nbsp;</u>')+esc(it.post)+'</div>';
  h+='<p class="small muted" style="text-align:center;margin-bottom:12px">İpucu: '+esc(e.tr)+'</p>';
  h+='<div class="opts">'+it.opts.map(function(o){var c=X.pick?(o===it.ans?'ok':o===X.pick?'no':''):'';return '<button lang="de" class="'+c+'" data-act="lpick" data-v="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';
  if(X.pick)h+='<p class="small" style="margin-top:12px;text-align:center"><b lang="de" style="color:var(--'+(a||'ink')+')">'+(a?a+' ':'')+esc(e.w)+'</b> · '+esc(e.tr)+'</p><button class="btn dark wide" style="margin-top:10px" data-act="lnext">Weiter</button>';
  return h;
}

function blitzTick(){
  if(!X||X.kind!=='blitz'||!X.run)return;
  var left=60-(Date.now()-X.t0)/1000;
  if(left<=0){clearInterval(X.timer);X.timer=null;X.run=false;X.end=true;
    X.rec=X.ok>(S.best.blitz||0);if(X.rec){S.best.blitz=X.ok;}var d=day();d.bz=Math.max(d.bz||0,X.ok);save();drawSheet();return;}

}

function importJSON(txt){
  var o;try{o=JSON.parse(txt);}catch(e){toast('Geçersiz JSON');return;}
  if(!o||typeof o!=='object'||!o.v||!o.days||!o.srs){toast('Bu bir WORT yedeği değil');return;}
  if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam?'))return;
  S=migrate(o);save();W.q=null;lastScore=null;closeSheet();toast('Yedek yüklendi');
}

/* ================= OLAYLAR ================= */
var ACT={
  tab:function(b){TAB=b.dataset.v;OPEN=null;render();window.scrollTo(0,0);},
  task:function(b){
    var id=b.dataset.id;
    if(id==='wort'){TAB='woerter';render();window.scrollTo(0,0);return;}
    if(id==='gram'){startGram(curTopic());return;}
    OPEN=OPEN===id?null:id;render();
    if(OPEN==='sch'){var ta=document.querySelector('[data-in="sch"]');if(ta)ta.focus();}
  },
  inc:function(b){var d=day(),k=b.dataset.k;d[k]=clamp((d[k]||0)+(+b.dataset.n),0,600);if(k==='sm'&&d[k]>0)d.spr=true;save();render();},
  hsrc:function(b){var d=day();d.hs=d.hs===b.dataset.v?'':b.dataset.v;save();render();},
  spr:function(){var d=day();d.spr=!d.spr;save();render();},
  art:function(b){W.pick=b.dataset.v;W.step='a';redrawFlash();},
  show:function(){W.pick=null;W.step='a';redrawFlash();},
  grade:function(b){
    var g=+b.dataset.g,id=W.q.shift();grade(id,g);
    if(g===0)W.q.splice(Math.min(3,W.q.length),0,id);
    W.step='q';W.pick=null;
    var c=counts(),el=document.querySelectorAll('.srs b');
    if(el.length===3){el[0].textContent=c.due;el[1].textContent=c.lrn;el[2].textContent=c.sat;}
    redrawFlash();
    var st=streak();$('streak').querySelector('span').textContent=st+' gün seri';$('streak').classList.toggle('off',st===0);
    if(!W.q.length&&wordDone(peek(today())))toast('Kelime görevi tamam · +30');
  },
  more:function(){var d=day();d.npx=(d.npx||0)+5;save();var skip={};W.q.forEach(function(i){skip[i]=1;});var n=pickNew(5,skip);if(!n.length){toast('Havuzda yeni kelime kalmadı');return;}W.q=W.q.concat(n);W.n0=(W.n0||0)+n.length;redrawFlash();},
  addcard:function(b){var id=b.dataset.id,t=today();if(!S.srs[id]){S.srs[id]={i:0,e:2.5,n:0,d:t,a:t};save();if(W.q&&W.q.indexOf(id)<0){W.q.push(id);W.n0=(W.n0||0)+1;}}
    b.outerHTML='<span class="tag">destede</span>';toast('Desteye eklendi · bugün sorulacak');},
  blitz:function(){startBlitz();},
  bgo:function(){X.pool=blitzPool();if(!X.pool.length){toast('İsim yok');return;}X.run=true;X.end=false;X.ok=0;X.n=0;X.miss=[];X.fb='';X.last='';X.t0=Date.now();blitzNext();drawSheet();if(X.timer)clearInterval(X.timer);X.timer=setInterval(blitzTick,100);},
  bpick:function(b){
    if(!X.run)return;var c=X.cur,ok=b.dataset.v===c.a;X.n++;
    if(ok){X.ok++;X.fb='ok';X.last=c.a+' '+c.w+' ✓';}else{X.fb='no';X.last=c.a+' '+c.w+' · '+c.tr;if(X.miss.indexOf(c)<0)X.miss.push(c);}
    blitzNext();drawSheet();
  },
  luecke:function(){startLuck();},
  lpick:function(b){if(X.pick)return;X.pick=b.dataset.v;var ok=X.pick===X.items[X.i].ans;X.res[X.i]=ok?'ok':'no';if(ok)X.ok++;drawSheet();},
  lnext:function(){X.i++;X.pick=null;drawSheet();},
  satzw:function(){var it=wordSatzItems(8);if(!it.length){toast('Önce birkaç kelime çalış');return;}startSatz(it,'word','Satzbau','Übung · kelime cümleleri');},
  szgo:function(){X.intro=null;drawSheet();},
  szadd:function(b){var j=+b.dataset.j;X.placed.push(X.bank.splice(j,1)[0]);if(!X.bank.length)szCheck();drawSheet();},
  szrem:function(b){if(X.state)return;var j=+b.dataset.j;X.bank.push(X.placed.splice(j,1)[0]);drawSheet();},
  szclear:function(){X.bank=X.bank.concat(X.placed);X.placed=[];drawSheet();},
  sznext:function(){X.i++;if(X.i<X.items.length)prepSatz();drawSheet();},
  szaccept:function(){if(X.res[X.i]==='no'){X.res[X.i]='ok';X.ok++;}X.i++;if(X.i<X.items.length)prepSatz();drawSheet();},
  szagain:function(){X.i=0;X.ok=0;X.res=[];X.items=shuffle(X.items);prepSatz();drawSheet();},
  topic:function(b){openSheet({kind:'topic',id:b.dataset.id});},
  gcycle:function(b){var id=b.dataset.id,s=gst(id);setG(id,s==='next'?'wip':s==='wip'?'ok':'next');render();},
  gset:function(b){setG(b.dataset.id,b.dataset.v);drawSheet();},
  gpractice:function(b){startGram(GBY[b.dataset.id]);},
  gfocus:function(b){var id=b.dataset.id;S.gfocus=S.gfocus===id?'':id;if(S.gfocus&&gst(id)==='next')setG(id,'wip');save();drawSheet();toast(S.gfocus?'Bugünkü gramer görevi bu konu':'Sıradaki konuya dönüldü');},
  pickother:function(){closeSheet();TAB='weg';render();var c=document.querySelector('.band');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});toast('Bir konuya dokun, "Bugün bunu çalış" de');},
  addw:function(){openSheet({kind:'add',art:'die',src:'form'});},
  awart:function(b){keepAdd();X.art=b.dataset.v;drawSheet();},
  awsrc:function(b){keepAdd();X.src=b.dataset.v;drawSheet();},
  awsave:function(){
    keepAdd();var w=(X.w||'').trim(),tr=(X.tr||'').trim(),a=X.art;
    w=w.replace(/^(der|die|das)\s+/i,'');
    if(!w||!tr){toast('Kelime ve Türkçe anlamı gerekli');return;}
    if(a)w=w.charAt(0).toUpperCase()+w.slice(1);
    var k=(a?a+' ':'')+w;
    for(var i=0;i<S.mine.length;i++)if((S.mine[i].a?S.mine[i].a+' ':'')+S.mine[i].w===k){toast('Bu kelime zaten destende');return;}
    if(PK[k]&&S.srs[PK[k].id]){toast('Bu kelime havuzdan zaten destende');return;}
    var ex=(X.ex||'').trim();
    if(ex&&ex.indexOf('*')<0){var re=new RegExp('(^|[^A-Za-zÄÖÜäöüß])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[A-Za-zÄÖÜäöüß]*)','i');ex=ex.replace(re,'$1*$2*');}
    var id='m:'+(++S.seq),t=today();
    S.mine.push({id:id,a:a,w:w,f:(X.f||'').trim(),tr:tr,ex:ex,src:X.src,p:a?'n':'x',l:0});
    S.srs[id]={i:0,e:2.5,n:0,d:t,a:t};save();
    if(W.q&&W.day===t){W.q.push(id);W.n0=(W.n0||0)+1;}
    closeSheet();toast((a?a+' ':'')+w+' destede · bugün sorulacak');
  },
  settings:function(){openSheet({kind:'set'});},
  theme:function(b){themePref=b.dataset.v;try{localStorage.setItem(THEMEKEY,themePref);}catch(e){}applyTheme();drawSheet();},
  npd:function(b){S.set.newPerDay=+b.dataset.v;save();W.q=null;drawSheet();},
  lv:function(b){var l=b.dataset.v;S.set.lv[l]=!S.set.lv[l];save();W.q=null;drawSheet();},
  export:function(){download('wort-yedek-'+today()+'.json',JSON.stringify(S));toast('Yedek indirildi');},
  copy:function(){var t=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Panoya kopyalandı');},function(){toast('Kopyalanamadı');});else toast('Pano desteklenmiyor');},
  importtext:function(){var t=$('impText');if(t&&t.value.trim())importJSON(t.value.trim());},
  reset:function(){if(confirm('Bütün WORT verileri silinecek. Önce yedek aldın mı?')&&confirm('Emin misin? Bu geri alınamaz.')){S=blank();save();W.q=null;lastScore=null;closeSheet();toast('Sıfırlandı');}},
  close:function(){closeSheet();}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e);}
});
document.addEventListener('input',function(e){
  var el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='sch'){var d=day();d.sch=el.value;save();var n=$('schN');if(n)n.textContent=sentN(d.sch)+' / 3 cümle';refreshScore();}
  else if(k==='q'){$('qres').innerHTML=searchHtml(el.value);}
  else if(k==='gnote'){var id=el.dataset.id;if(el.value.trim())S.gnote[id]=el.value;else delete S.gnote[id];save();}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='exam'){S.set.exam=el.value;save();}
  else if(k==='examName'){S.set.examName=el.value;save();}
  else if(k==='importfile'){var f=el.files&&el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importJSON(String(r.result));};r.readAsText(f);}
});
/* gece yarısı açık kalırsa yeni güne geç */
document.addEventListener('visibilitychange',function(){if(!document.hidden&&W.day&&W.day!==today()){W.q=null;if(!X)render();}});

/* ---------------- başlat ---------------- */
applyTheme();
load();
parsePool();
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
/* test ve hata ayıklama için */
window.WORT={get S(){return S;},POOL:POOL,G:G,total:total,streak:streak,rule:rule,plural:plural};
})();
</script>
