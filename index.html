g17:["Ich habe vor, am Samstag ___. (einkaufen)|einzukaufen|zu einkaufen|einkaufen|*vorhaben* (niyetinde olmak) *zu* + mastar ister; ayrılabilen *einkaufen*'de *zu* araya girer: *ein-zu-kaufen*.||*zu einkaufen* olmaz: *zu* başa değil, ön ek ile kökün arasına girer: *einzukaufen*.|*einkaufen* olmaz: *vorhaben*'dan sonra mastar *zu* ile gelir.","Ich habe vergessen, dich ___. (anrufen)|anzurufen|zu anrufen|anrufen|*vergessen*'den sonra *zu* + mastar gelir; ayrılabilen *anrufen*'da *zu* araya girer: *an-zu-rufen*.||*zu anrufen* olmaz: *zu* başa değil, ön ek ile kökün arasına girer: *anzurufen*.|*anrufen* olmaz: *vergessen*'den sonra mastar *zu* ile gelir.","Er hat aufgehört, ___. (rauchen)|zu rauchen|rauchen|geraucht|*aufhören*'den sonra bırakılan eylem *zu* + mastarla gelir: *Er hat aufgehört, zu rauchen*.||*rauchen* olmaz: *aufhören*'den sonra mastarın önüne *zu* gelmeli.|*geraucht* olmaz: Perfekt'i *hat aufgehört* kuruyor; ikinci eylem *zu* + mastar olur.","Wir können heute ___. (schwimmen)|schwimmen|zu schwimmen|geschwommen|*können* modal fiildir: arkasından yalın mastar gelir, *zu* kullanılmaz: *Wir können schwimmen*.||*zu schwimmen* olmaz: *können* gibi modal fiillerden sonra *zu* gelmez.|*geschwommen* olmaz: bu Partizip II; modal fiilden sonra yalın mastar gerekir."],
g18:["Es ist kalt, deshalb ___ ich eine Jacke. (tragen)|trage|trägt|getragen|*deshalb*'dan sonra çekimli fiil hemen gelir; *ich* ile *tragen* → *trage*.||*trägt* olmaz: *trägt* *er/sie/es* çekimidir; *ich* ile *trage*.|*getragen* olmaz: Partizip II tek başına yüklem olamaz; çekimli *trage* gerekir.","Der Kühlschrank ist leer, ___ gehe ich jetzt einkaufen.|darum|weil|obwohl|Sonuç bildiren *darum* 1. yerde durur, çekimli fiil hemen arkasından gelir: *darum gehe ich*.|deshalb/deswegen/daher/also|*weil* olmaz: *weil* sebep bildirir ve fiili sona yollar; burada fiil hemen geliyor.|*obwohl* olmaz: 'rağmen' anlamındadır ve fiili sona yollar; burada sonuç gerekir.","Er hat Kopfschmerzen, deswegen ___ eine Tablette. (nehmen)|nimmt er|er nimmt|nehmt er|*deswegen* 1. yerde; çekimli fiil hemen arkasından, özne fiilden sonra gelir: *deswegen nimmt er*.||*er nimmt* olmaz: *deswegen*'den sonra fiil özneden önce gelir.|*nehmt er* olmaz: *nehmt* *ihr* çekimidir; *er* ile *nimmt*.","Wir haben kein Geld, ___ fahren wir dieses Jahr nicht in den Urlaub.|deshalb|weil|denn|Sonuç bildiren *deshalb* 1. yerde, çekimli fiil hemen arkasında: *deshalb fahren wir*.|deswegen/darum/daher/also|*weil* olmaz: *weil*'den sonra fiil sona gider; burada fiil hemen geliyor.|*denn* olmaz: *denn* sebep bildirir ve sırayı değiştirmez (*denn wir fahren*)."],
g19:["Wir ___ gestern im Kino. (sein)|waren|sind|war|*gestern* geçmişi gösterir; *sein*'in Präteritum'u *wir* ile *waren*.||*sind* olmaz: Präsens; *gestern* ile *waren* gerekir.|*war* olmaz: *ich/er/sie* biçimidir; *wir* ile *waren*.","Letztes Wochenende ___ ihr keine Zeit. (haben)|hattet|habt|hatten|*haben*'in Präteritum kökü *hatt-*; *ihr* ile *-et* eklenir → *hattet*.||*habt* olmaz: Präsens; *letztes Wochenende* geçmiş zaman ister.|*hatten* olmaz: *wir/sie/Sie* çekimidir; *ihr* ile *hattet*.","Letzten Monat ___ er jeden Tag bis 20 Uhr. (arbeiten)|arbeitete|arbeitet|arbeitte|Düzenli fiil: kök + *-te*; kök *-t* ile bittiği için araya *e* girer: *arbeit-e-te*.||*arbeitet* olmaz: Präsens; *letzten Monat* geçmiş zaman ister.|*arbeitte* olmaz: kök *-t* ile bitince araya *e* girer: *arbeitete*.","Früher ___ meine Schwester mit dem Bus zur Arbeit. (fahren)|fuhr|fahrte|fährt|*fahren* düzensiz: Präteritum'da *a* → *u*: *fuhr*; *meine Schwester* ile ek yok.||*fahrte* olmaz: düzensiz fiil *-te* almaz; doğrusu *fuhr*.|*fährt* olmaz: Präsens; *früher* (eskiden) geçmiş zaman ister."],
g20:["Mein Bruder arbeitet ___ Siemens. (Siemens'te)|bei|zu|in|Bir şirkette/iş yerinde (nerede?) *bei* + Dativ: *bei Siemens*.||*zu* olmaz: *zu* yön bildirir (nereye?); iş yerinde çalışmak *bei* ile.|*in* olmaz: şirket adlarıyla *in* kullanılmaz; doğrusu *bei Siemens*.","Ich komme ___ der Schweiz, aber ich wohne in Berlin.|aus|von|nach|Memleket/köken (nereden?) *aus* + Dativ; artikelli ülkede artikel kalır: *aus der Schweiz*.||*von* olmaz: memleketi söylerken *aus* kullanılır: *aus der Schweiz*.|*nach* olmaz: *nach* yön bildirir (nereye?); köken için *aus*.","Ich fahre jeden Morgen ___ Arbeit.|zur|zum|nach|Bir yere/kuruma gidiş *zu* + Dativ; *die Arbeit* dişil: *zu der* → *zur Arbeit*.||*zum* olmaz: *zum* = *zu dem* (eril/nötr); *Arbeit* dişil → *zur*.|*nach* olmaz: *nach* şehir/ülke ve *nach Hause* içindir; işe *zur Arbeit*.","Kommst du gerade ___ deiner Oma? (büyükannenden)|von|aus|bei|Bir kişinin yanından gelince (nereden?) *von* + Dativ: *von deiner Oma*.||*aus* olmaz: *aus* bir yerin içinden ya da memleketten gelmektir; kişiden *von*.|*bei* olmaz: *bei* 'yanında' (nerede?) demek; *kommen* burada 'nereden?' ister."],
g21:["___ es kalt ist, trage ich keine Jacke. (rağmen)|Obwohl|Trotzdem|Trotz|Fiil *ist* sonda, yani bu bir yan cümle: '-mesine rağmen' → *Obwohl es kalt ist, …*|Obgleich|*Trotzdem* olmaz: arkasından fiil hemen gelir; burada fiil *ist* sonda.|*Trotz* olmaz: *trotz* edattır, arkasından isim gelir (*trotz der Kälte*).","Er hat wenig geschlafen, ___ ist er fit. (rağmen)|trotzdem|obwohl|weil|*trotzdem* 1. yerde, çekimli fiil *ist* hemen arkasında: *trotzdem ist er fit*.|dennoch|*obwohl* olmaz: *obwohl*'dan sonra fiil sona gider; burada *ist* hemen geliyor.|*weil* olmaz: *weil* de fiili sona yollar; üstelik sebep bildirir, 'rağmen' değil.","Ich lerne, obwohl ich keine Lust ___. (haben)|habe|haben|habe ich|*obwohl*-cümlesinde çekimli fiil sona gider; *ich* ile *haben* → *habe*.||*haben* olmaz: *ich* ile çekimli biçim *habe* olur.|*habe ich* olmaz: yan cümlede özne başta kalır; *ich* zaten var, yalnız fiil sona gelir.","Trotz ___ Schmerzen trainiert sie. (artikel)|der|die|des|*trotz* Genitiv ister; çoğulda Genitiv artikeli *der*: *trotz der Schmerzen*.||*die* olmaz: bu Nominativ/Akkusativ çoğul; *trotz* Genitiv ister.|*des* olmaz: *des* tekil eril/nötr Genitiv; *Schmerzen* çoğul, artikel *der*."],
g22:["___ ich zum ersten Mal in Deutschland war, habe ich kaum etwas verstanden. (als/wenn/wann)|Als|Wenn|Wann|*zum ersten Mal*: geçmişte tek seferlik bir olay → *als*.||*Wenn* olmaz: geçmişte *wenn* tekrar için; 'ilk sefer' yalnız bir kez olur.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","___ es regnet, bleibe ich zu Hause. (als/wenn/wann)|Wenn|Als|Wann|Şimdiki zaman, genel durum → *wenn*: *Wenn es regnet, …*||*Als* olmaz: *als* yalnız geçmişte tek olay ya da dönem için kullanılır.|*Wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","Ich war sehr glücklich, ___ ich gestern die Nachricht bekam. (als/wenn/wann)|als|wenn|wann|Dün bir kez olan olay → *als*: *als ich gestern die Nachricht bekam*.||*wenn* olmaz: geçmişte *wenn* tekrar için; haber dün bir kez geldi.|*wann* olmaz: *wann* 'ne zaman?' sorusudur; burada zaman bağlacı gerekir.","Als Kind habe ich immer gelesen, ___ ich Zeit hatte. (als/wenn/wann)|wenn|als|wann|Geçmişte tekrarlanan durum (*immer*: vaktim olduğu her seferde) → *wenn*.||*als* olmaz: *als* geçmişte tek olay içindir; burada *immer* tekrarı gösteriyor.|*wann* olmaz: *wann* 'ne zaman?' sorusudur, zaman bağlacı değil."],
g23:["Nachdem die Kinder eingeschlafen ___, haben wir ferngesehen.|waren|hatten|war|*einschlafen* durum değişimi anlatır, *sein* alır; özne çoğul: *eingeschlafen waren*.||*hatten* olmaz: *einschlafen* durum değişimi anlatır, *sein* ile kurulur.|*war* olmaz: özne *die Kinder* çoğul; *waren* gerekir.","Lena ___ schon gegangen, als ich kam.|war|hatte|hat|Lena ben gelmeden önce gitmişti → Plusquamperfekt; *gehen* *sein* alır: *war gegangen*.||*hatte* olmaz: *gehen* yer değiştirme anlatır, *sein* ile kurulur.|*hat* olmaz: *gehen* *sein* alır; üstelik önceki olay için geçmiş biçim *war* gerekir.","Nachdem ich die Wohnung ___ hatte, kamen die Gäste. (aufräumen)|aufgeräumt|geaufräumt|aufräumte|*hatte* + Partizip II; ayrılabilen fiilde *ge-* ön ek ile kökün arasına girer: *auf-ge-räumt*.||*geaufräumt* olmaz: *ge-* başa değil, ön ek ile kökün arasına girer: *aufgeräumt*.|*aufräumte* olmaz: bu Präteritum; *hatte* ile Partizip II gerekir.","Wir hatten den Film schon ___. (sehen)|gesehen|sahen|sehen|Plusquamperfekt = *hatten* + Partizip II; *sehen* düzensiz: *gesehen*.||*sahen* olmaz: bu Präteritum; *hatten* ile Partizip II gerekir.|*sehen* olmaz: bu mastar; *hatten* ile Partizip II gerekir."],
g24:["___ du gehst, mach bitte das Licht aus. (-meden önce)|Bevor|Während|Seit|'-meden önce' → *bevor*: *Bevor du gehst, …* (gitmeden önce). Fiil sonda.|Ehe|*Während* olmaz: '-irken' demektir; burada 'gitmeden önce' gerekiyor.|*Seit* olmaz: '-den beri' demektir; anlam uymuyor.","___ er schläft, ist es ruhig. (-irken)|Während|Bevor|Bis|'-irken' → *während*: o uyurken (aynı zamanda) ortalık sessiz. Fiil *schläft* sonda.||*Bevor* olmaz: '-meden önce' demektir, aynı anda değil.|*Bis* olmaz: '-e kadar' demektir; anlam uymuyor.","Ich warte, ___ der Bus kommt. (-e kadar)|bis|seit|bevor|'-e kadar' → *bis*: *bis der Bus kommt* (otobüs gelene kadar). Fiil sonda.||*seit* olmaz: '-den beri' demektir; otobüs henüz gelmedi.|*bevor* olmaz: '-meden önce' demektir; 'otobüs gelmeden önce bekliyorum' anlamsız.","Ich arbeite heute ___ zum Abend.|bis|seit|während|'-e kadar' edat olarak da *bis*: *bis zum Abend* (akşama kadar).||*seit* olmaz: '-den beri' demektir, başlangıç anlatır; *zum* ile kullanılmaz.|*während* olmaz: '-sırasında' demektir, Genitiv alır; *zum* ile kullanılmaz."],
g25:["Der Kollege, für ___ ich das Geschenk gekauft habe, hat heute Geburtstag.|den|dem|der|İlgi zamirinin hâlini edat belirler: *für* her zaman Akkusativ ister; *der Kollege* eril → *für den*.||*dem* olmaz: *für* Dativ değil, Akkusativ ister.|*der* olmaz: bu eril Nominativ; *für*'dan sonra Akkusativ *den* gelir.","Die Freundin, ___ ich das Geschenk gebe, freut sich.|der|die|den|*geben*: hediyeyi alan kişi Dativ'de (*wem?*). *die Freundin* dişil → Dativ ilgi zamiri *der*.||*die* olmaz: bu Akkusativ; hediyeyi alan kişi Dativ olur.|*den* olmaz: *den* eril Akkusativ; *Freundin* dişil.","Die Kinder, mit ___ ich spiele, sind laut.|denen|den|die|*mit* Dativ ister; *die Kinder* çoğul → çoğul Dativ ilgi zamiri *denen*.||*den* olmaz: çoğul Dativ artikeli *den*'dir ama ilgi zamiri *denen*.|*die* olmaz: bu çoğul Nominativ/Akkusativ; *mit* Dativ ister.","Das Hotel, in ___ wir wohnen, ist schön.|dem|das|den|*wohnen* → *Wo?* → *in* + Dativ; *das Hotel* nötr → *in dem*.||*das* olmaz: *in das* yön (*Wohin?*) anlatır; *wohnen*'de Dativ gerekir.|*den* olmaz: *den* eril Akkusativ; *Hotel* nötr ve Dativ gerekir."],
g26:["Wenn ich früher gekommen ___, hätte ich dich gesehen.|wäre|hätte|bin|*kommen* *sein* ile çekilir; gerçekleşmemiş geçmiş koşulda *wäre … gekommen*.||*hätte* olmaz: *kommen* *sein* alır; *hätte* ana cümledeki *sehen* içindir.|*bin* olmaz: bu gerçek geçmiş (Perfekt); gerçekleşmemiş koşulda *wäre* gerekir.","Ich ___ das gern gemacht. (Konjunktiv II)|hätte|wäre|würde|*machen* *haben* ile çekilir; geçmişte gerçekleşmemiş istek: *hätte … gern gemacht*.||*wäre* olmaz: *machen* yer değiştirme anlatmaz, *haben* alır.|*würde* olmaz: *würde* mastarla gelir (*würde machen*); Partizip II ile *hätte* gerekir.","Wir hätten mehr lernen ___. (sollen)|sollen|gesollt|sollten|Pişmanlık kalıbı *hätte … sollen*: modal fiil sonda çekimsiz mastar olarak kalır.||*gesollt* olmaz: başka bir mastarla birlikteyken modal fiil Partizip değil, mastar olur.|*sollten* olmaz: çekimli fiil zaten *hätten*; sonda çekimsiz mastar *sollen* gelir.","Er ___ fast den Zug verpasst. (Konjunktiv II)|hätte|wäre|würde|*verpassen* Perfekt'te *haben* alır (*er hat verpasst*); neredeyse olan ama olmayan şey: *hätte fast … verpasst*.||*wäre* olmaz: *verpassen* nesne alan bir fiil, *haben* ile çekilir.|*würde* olmaz: *würde* mastarla gelir; Partizip II ile *hätte* gerekir."],
g27:["Das ist die Wohnung ___ Freundin. (meine)|meiner|meine|meinem|Sahiplik Genitiv ile: *meine Freundin* dişil → *meiner Freundin*.||*meine* olmaz: bu Nominativ/Akkusativ; sahip Genitiv'de olur.|*meinem* olmaz: bu eril/nötr Dativ; *Freundin* dişil.","___ des Staus bin ich zu spät gekommen.|Wegen|Trotz|Während|Trafik sıkışıklığı geç kalmanın sebebi; sebep *wegen* + Genitiv ile söylenir. *aufgrund* da olur.|Aufgrund|*Trotz* olmaz: *trotz* 'rağmen' demek; oysa sıkışıklık geç kalmanın sebebi.|*Während* olmaz: *während* 'sırasında' demek; burada sebep anlatılıyor.","Die Zimmer ___ Kinder sind oben. (die)|der|die|den|Çoğulda Genitiv artikeli *der*'dir: *die Kinder* → *die Zimmer der Kinder*.||*die* olmaz: bu çoğul Nominativ/Akkusativ; sahip Genitiv'de olur.|*den* olmaz: bu çoğul Dativ; çoğul Genitiv *der*'dir.","Während ___ Urlaubs habe ich viel gelesen. (der)|des|dem|der|*während* Genitiv ister; *der Urlaub* eril → *des Urlaubs*.||*dem* olmaz: bu Dativ; *Urlaubs*'taki *-s* Genitiv'i gösterir.|*der* olmaz: Genitiv'de *der* dişil/çoğul içindir; *Urlaub* eril → *des*."],
g28:["Ich spare, ___ ich reisen kann.|damit|um|für|Arkada özneli (*ich*) ve çekimli fiilli (*kann*) bir yan cümle var → *damit*. *um … zu* ile: *um reisen zu können*.||*um* olmaz: *um* yalnız *zu* + mastarla kullanılır: *um reisen zu können*.|*für* olmaz: *für* bir edattır, yan cümle başlatamaz.","Er lernt viel, um die Prüfung ___. (bestehen)|zu bestehen|bestehen|besteht|*um … zu* ile amaç: mastar *zu* ile sona gelir. *bestehen* ayrılmaz fiil, *zu* önüne gelir: *zu bestehen*.||*bestehen* olmaz: *um*'dan sonra mastarın önüne *zu* gelmeli.|*besteht* olmaz: *um … zu* cümlesinde çekimli fiil olmaz.","Ich rufe dich an, ___ du Bescheid weißt.|damit|um|für|Özneler farklı (*ich* arıyorum, *du* haberdar oluyorsun) → *damit* + yan cümle, fiil sonda: *weißt*.||*um* olmaz: *um* özneli yan cümleyle değil, *zu* + mastarla kullanılır.|*für* olmaz: *für* bir edattır, yan cümle başlatamaz.","Wir fahren in die Stadt, um ___. (einkaufen)|einzukaufen|zu einkaufen|einkaufen|*einkaufen* ayrılabilen fiil: *zu* araya girer ve tek kelime yazılır: *ein-zu-kaufen*.||*zu einkaufen* olmaz: ayrılabilen fiilde *zu* başa değil, araya girer.|*einkaufen* olmaz: *um … zu* cümlesinde *zu* eksik olmaz."],
g29:["Er spricht ___ Englisch noch Französisch.|weder|sowohl|entweder|*noch* ile eşleşen *weder*'dir: *weder Englisch noch Französisch* = ne İngilizce ne Fransızca.||*sowohl* olmaz: *sowohl*'un eşi *als auch*'tır, *noch* değil.|*entweder* olmaz: *entweder*'in eşi *oder*'dir, *noch* değil.","Ich trinke ___ Kaffee oder Tee.|entweder|weder|sowohl|*oder* ile eşleşen *entweder*'dir: *entweder Kaffee oder Tee* = ya kahve ya çay.||*weder* olmaz: *weder*'in eşi *noch*'tur, *oder* değil.|*sowohl* olmaz: *sowohl*'un eşi *als auch*'tır, *oder* değil.","Sie ist nicht nur klug, ___ auch nett.|sondern|als|oder|*nicht nur …, sondern auch …* kalıbında *auch*'tan önce *sondern* gelir: sadece akıllı değil, nazik de.||*als* olmaz: *als auch* yalnız *sowohl* ile kullanılır; *nicht nur*'un eşi *sondern auch*'tır.|*oder* olmaz: *oder* *entweder* ile eşleşir; *nicht nur*'dan sonra *sondern* gelir.","Wir haben sowohl Hunger ___ Durst.|als auch|noch|oder|*sowohl* hep *als auch* ile tamamlanır: *sowohl Hunger als auch Durst* = hem açız hem susadık.|wie auch|*noch* olmaz: *noch* *weder* ile eşleşir; *sowohl*'un eşi *als auch*'tır.|*oder* olmaz: *oder* *entweder* ile eşleşir; *sowohl*'un eşi *als auch*'tır."],
g30:["Ich ___ dich morgen anrufen.|werde|wird|werden|*ich* ile *werden* → *werde*; ayrılabilen fiil mastarda bitişik kalır ve sona gider: *anrufen*.||*wird* olmaz: *wird* *er/sie/es* çekimidir; *ich* ile *werde* gerekir.|*werden* olmaz: *werden* *wir/sie* çekimidir; *ich* ile *werde* gerekir.","Wir ___ bald umziehen.|werden|wird|werdet|*wir* ile *werden* → *werden*; mastar *umziehen* sonda.||*wird* olmaz: *wird* *er/sie/es* çekimidir; *wir* ile *werden* gerekir.|*werdet* olmaz: *werdet* *ihr* çekimidir; *wir* ile *werden* gerekir.","Morgen ___ es bestimmt schneien.|wird|werden|wurde|*es* ile *wird*; *morgen* geleceği gösterir, mastar *schneien* sonda.||*werden* olmaz: *werden* çoğul çekimdir; *es* ile *wird* gerekir.|*wurde* olmaz: *wurde* geçmiş zamandır; *morgen* ile gelecek için *wird* gerekir.","Was ___ ihr am Wochenende machen?|werdet|werden|wird|*ihr* ile *werdet*; soru kelimesinden hemen sonra çekimli fiil gelir, mastar *machen* sonda.||*werden* olmaz: *werden* *wir/sie* çekimidir; *ihr* ile *werdet* gerekir.|*wird* olmaz: *wird* *er/sie/es* çekimidir; *ihr* ile *werdet* gerekir."],
g31:["Die Brücke ___ letztes Jahr repariert.|wurde|wird|hat|*letztes Jahr* → geçmiş: edilgen Präteritum *wurde* + Partizip II (*repariert*).||*wird* olmaz: *wird* şimdiki/gelecek zaman edilgenidir; *letztes Jahr* ile *wurde* gerekir.|*hat* olmaz: köprü tamir eden değil, tamir edilendir; edilgende *haben* kullanılmaz.","Der Brief ist schon geschrieben ___.|worden|geworden|werden|Edilgen Perfekt: *ist* + Partizip II + *worden* (*ge-* olmadan).||*geworden* olmaz: *geworden* 'olmak' anlamındaki *werden* içindir; edilgende *worden* gelir.|*werden* olmaz: *ist … werden* yanlış; Perfekt edilgen *ist … worden* ile kurulur.","Die Hausaufgaben müssen heute gemacht ___.|werden|worden|wird|Modal fiilli edilgen: *müssen* + Partizip II + *werden*: *müssen gemacht werden*. (*gemacht sein* de doğru.)|sein|*worden* olmaz: *worden* yalnız Perfekt edilgende gelir; modalden sonra *werden* gerekir.|*wird* olmaz: çekimli fiil zaten *müssen*; sonda çekimsiz *werden* olmalı.","Das Fenster kann nicht geöffnet ___.|werden|worden|wird|Modal fiilli edilgen: *kann* + Partizip II + *werden*: *kann nicht geöffnet werden* = açılamıyor.|sein|*worden* olmaz: *worden* yalnız Perfekt edilgende gelir; modalden sonra *werden* gerekir.|*wird* olmaz: çekimli fiil zaten *kann*; sonda çekimsiz *werden* olmalı."],
g32:["Ich kenne den ___ nicht.|Herrn|Herr|Herre|*Herr* tekilde Nominativ dışında *-n* alır: *den Herrn* (çoğulu *die Herren*).||*Herr* olmaz: bu Nominativ; Akkusativ'de *-n* eklenir: *den Herrn*.|*Herre* olmaz: böyle bir biçim yok; tekil Akkusativ *Herrn*'dir.","Wir sprechen mit dem ___.|Präsidenten|Präsident|Präsidente|*mit* Dativ ister; *-ent* ile biten *Präsident* n-Deklination'dır → *dem Präsidenten*.||*Präsident* olmaz: bu Nominativ; Dativ'de *-en* eklenir.|*Präsidente* olmaz: böyle bir biçim yok; ek *-e* değil *-en*'dir.","Die Polizei sucht den ___.|Dieb|Dieben|Diebe|*Dieb* normal eril isimdir, n-Deklination'a girmez: tekil Akkusativ'de ek almaz → *den Dieb*.||*Dieben* olmaz: bu Dativ çoğul biçimi; *Dieb* tekil Akkusativ'de ek almaz.|*Diebe* olmaz: bu çoğul; *den* burada tekil eril Akkusativ, *Dieb* ek almaz.","Das ist das Büro des ___.|Kollegen|Kollege|Kolleges|Genitiv'de n-Deklination isimleri *-s* değil *-n* alır: *des Kollegen*.||*Kollege* olmaz: Genitiv'de ek gerekir: *des Kollegen*.|*Kolleges* olmaz: Genitiv *-s* normal eril isimler içindir; *Kollege* *-n* alır."],
g33:["Je mehr Sport ich mache, ___ fitter bin ich.|desto|als|wie|*je* ile başlayan cümlenin eşi *desto* + karşılaştırma: *desto fitter bin ich*. *umso* da doğru.|umso|*als* olmaz: *als* 'den/dan' anlamında karşılaştırmadır; burada *desto* gerekir.|*wie* olmaz: *wie* eşitlik bildirir; *je*'nin eşi *desto*'dur.","Je wärmer es ist, desto lieber ___ draußen. (ich, sitzen)|sitze ich|ich sitze|sitzen ich|*desto lieber* ilk yeri tutar, çekimli fiil hemen ardından, özne sonra gelir: *sitze ich*.||*ich sitze* olmaz: *desto lieber*'den sonra önce fiil gelmeli: *sitze ich*.|*sitzen ich* olmaz: fiil çekimsiz; *ich* ile *sitze* olur.","___ früher du kommst, desto besser.|Je|Desto|Wenn|Fiili sonda olan ilk kısım *je* ile başlar; *desto besser* = o kadar iyi.||*Desto* olmaz: *desto* ikinci kısmı başlatır; ilk kısım *je* ister.|*Wenn* olmaz: *wenn* + karşılaştırma olmaz; *desto*'nun eşi *je*'dir.","Je länger ich warte, ___ nervöser werde ich.|desto|dann|als|*je* kısmından sonra ana cümle *desto* + karşılaştırma ile başlar: *desto nervöser*. *umso* da doğru.|umso|*dann* olmaz: bu *wenn … dann* kalıbı değil; *je*'nin eşi *desto*'dur.|*als* olmaz: *als* 'den/dan' anlamında karşılaştırmadır, *desto* yerine geçmez."],
g34:["Die ___ Kinder machen viel Lärm. (spielen)|spielenden|gespielten|spielend|Çocuklar şu an oynuyor → Partizip I *spielend*; *die* + çoğul → *-en*: *die spielenden Kinder*.||*gespielten* olmaz: Partizip II edilgen anlam verir ('oynanmış'); çocuklar oynayan → Partizip I.|*spielend* olmaz: isimden önce ek gerekir; *die* + çoğul → *spielenden*.","Wir haben ein frisch ___ Zimmer bekommen. (renovieren)|renoviertes|renovierendes|renoviert|Oda yeni yenilenmiş → Partizip II *renoviert*; *ein* + *das Zimmer* → *-es*: *renoviertes*.||*renovierendes* olmaz: Partizip I 'yenileyen' demek; oda yenilenmiş → Partizip II.|*renoviert* olmaz: isimden önce ek gerekir; *ein* + *das* → *renoviertes*.","Der ___ Brief liegt noch auf dem Tisch. (unterschreiben)|unterschriebene|unterschreibende|unterschrieben|Mektup imzalanmış → Partizip II *unterschrieben*; *der* + tekil → *-e*: *der unterschriebene Brief*.||*unterschreibende* olmaz: Partizip I 'imzalayan' demek; mektup imzalanmış → Partizip II.|*unterschrieben* olmaz: isimden önce sıfat eki gerekir: *der unterschriebene Brief*.","Das ___ Baby braucht seine Mutter. (weinen)|weinende|geweinte|weinend|Bebek şu an ağlıyor → Partizip I *weinend*; *das* + tekil → *-e*: *das weinende Baby*.||*geweinte* olmaz: *weinen* nesnesiz fiil, Partizip II sıfat olmaz; 'ağlayan' → Partizip I.|*weinend* olmaz: isimden önce sıfat eki gerekir: *das weinende Baby*."],
g35:["Sie ging, ohne etwas ___ sagen.|zu|um|für|*ohne* + … + *zu* + mastar: *ohne etwas zu sagen* = bir şey söylemeden.||*um* olmaz: *um* ayrı bir bağlaçtır (*um … zu*); mastardan hemen önce *zu* gelmeli.|*für* olmaz: *für* edattır, mastardan önce kullanılmaz; *zu* gerekir.","Statt ___, spielt er Computer. (lernen)|zu lernen|lernen|gelernt|*statt … zu* + mastar: *statt zu lernen* = ders çalışmak yerine.||*lernen* olmaz: *statt* ile *zu* eksik kalamaz: *statt zu lernen*.|*gelernt* olmaz: Partizip II değil, *zu* + mastar gerekir.","Er fährt los, ohne ___. (tanken)|zu tanken|tanken|getankt|*ohne … zu* + mastar: *ohne zu tanken* = benzin almadan.||*tanken* olmaz: *ohne* ile *zu* eksik kalamaz: *ohne zu tanken*.|*getankt* olmaz: Partizip II değil, *zu* + mastar gerekir.","Ohne dass ich es ___, war er weg. (merken)|merkte|zu merken|gemerkt|*ohne dass* yan cümle kurar: çekimli fiil sonda → *merkte*. *gemerkt habe/hatte/hätte* da doğru.|gemerkt habe/gemerkt hatte/gemerkt hätte|*zu merken* olmaz: *ohne dass* yan cümlesinde *zu* + mastar değil, çekimli fiil gelir.|*gemerkt* olmaz: yardımcı fiil eksik; tek başına Partizip II yetmez."],
g36:["Ich ___ das Paket direkt ins Büro liefern. (lassen)|lasse|lässt|lassen|Paketi başkası getiriyor → *lassen* + mastar; *ich* ile *lasse*.|ließ|*lässt* olmaz: *du/er/sie/es* çekimidir; *ich* ile *lasse*.|*lassen* olmaz: mastar/*wir* hâli; *ich* ile *lasse* gerekir.","Wir haben uns beraten ___. (lassen)|lassen|gelassen|lässt|Önünde mastar (*beraten*) var → Perfekt'te *gelassen* değil *lassen*: *haben uns beraten lassen*.||*gelassen* olmaz: başka mastarla birlikte Perfekt'te *lassen* kullanılır.|*lässt* olmaz: Perfekt'te sonda çekimli fiil olmaz: *haben … beraten lassen*.","Lass mich das ___! (machen)|machen|gemacht|mache|*lassen* + yalın mastar: *Lass mich das machen!* = Bırak bunu ben yapayım!||*gemacht* olmaz: *lassen*'den sonra Partizip değil, mastar gelir.|*mache* olmaz: çekimli fiil *lass*; ikinci fiil mastar kalır.","Er ___ seinen Hund nie allein im Auto. (lassen)|lässt|lasst|lasse|Burada *lassen* = bırakmak; *er* ile kök ünlüsü değişir: *er lässt*.|ließ|*lasst* olmaz: *ihr* çekimi; *er* ile *lässt*.|*lasse* olmaz: *ich* çekimi; *er* ile *lässt*."],
g37:["Sie lernt Vokabeln, ___ sie Karteikarten schreibt. (-erek)|indem|sodass|dadurch|Nasıl öğreniyor? Kelime kartı yazarak → yöntem: *indem*, fiil (*schreibt*) sonda.||*sodass* olmaz: *sodass* sonuç bildirir; kart yazmak öğrenmenin sonucu değil, yolu.|*dadurch* olmaz: *dadurch* zarftır, ardından fiil gelir; yan cümle kuramaz.","Der Zug war voll, ___ wir stehen mussten. (bu yüzden)|sodass|indem|obwohl|Trenin dolu olmasının sonucu: ayakta kaldık → *sodass*. Çekimli fiil (*mussten*) sonda.|so dass/weshalb/weswegen|*indem* olmaz: *indem* yöntem (-erek) bildirir; burada sonuç var.|*obwohl* olmaz: *obwohl* karşıtlık bildirir (-e rağmen); ayakta kalmak dolu trenin beklenen sonucu.","Er war so müde, ___ er sofort einschlief.|dass|indem|ob|*so* + sıfat + *dass* = o kadar … ki: o kadar yorgundu ki hemen uyudu. Fiil (*einschlief*) sonda.||*indem* olmaz: *indem* yöntem bildirir; *so müde*'nin sonucu *dass* ile gelir.|*ob* olmaz: *ob* dolaylı soru kurar; *so … dass* kalıbında yeri yok.","Man spart Energie, indem man das Licht ___. (ausmachen)|ausmacht|macht aus|ausmachen|Yan cümlede ayrılabilen fiil ayrılmaz; bitişik ve en sonda durur: *ausmacht*.||*macht aus* olmaz: bu ana cümle sırası; yan cümlede ön ek fiile yapışık kalır.|*ausmachen* olmaz: bu mastar; *man* ile çekimli *ausmacht* gerekir."],
g38:["Das ist das Schönste, ___ ich je gesehen habe.|was|dass|wo|İsimleşmiş en üstünlükten (*das Schönste*) sonra ilgi zamiri *was* gelir.||*dass* olmaz: *dass* bağlaçtır, ilgi zamiri değil; *das Schönste*'den sonra *was*.|*wo* olmaz: *wo* yer bildirir; *das Schönste* bir yer değil.","Mein Freund hat mir beim Umzug geholfen, ___ mich sehr gefreut hat.|was|das|worüber|*was* bütün ana cümleye (yardım etmesine) gönderme yapar ve yan cümlenin öznesidir: *…, was mich gefreut hat*.||*das* olmaz: önceki cümlenin tamamına *das* ile değil, *was* ile gönderme yapılır.|*worüber* olmaz: yan cümlede özne eksik kalır; *etwas freut mich* kalıbında özne *was* olur.","Das Dorf, ___ meine Oma lebt, ist klein.|wo|was|wann|*das Dorf* bir yer → *wo*. *in dem* de doğru: *das Dorf, in dem meine Oma lebt*.|in dem|*was* olmaz: somut bir yer isminden sonra *was* değil, *wo* ya da *in dem* gelir.|*wann* olmaz: *wann* zaman bildirir; *das Dorf* bir yer.","Er kommt immer zu spät, ___ ich mich sehr ärgere.|worüber|was|wofür|*sich ärgern über* + bütün cümleye gönderme → *worüber*. *über* ünlüyle başladığı için araya *r* girer.||*was* olmaz: *sich ärgern* edat ister (*über*); edatlı fiilde *wo(r)* + edat gelir.|*wofür* olmaz: *sich ärgern* *für* ile değil, *über* ile kullanılır."],
g39:["Er tut so, als ob er krank ___. (sein)|wäre|war|wären|*als ob* + Konjunktiv II: *krank sein* → *krank wäre* (hastaymış gibi). Resmî dilde *sei* de olur.|sei|*war* olmaz: noktasız *war* geçmiş zamandır (hastaydı); -mış gibi için *wäre*.|*wären* olmaz: bu *wir/sie/Sie* çekimi; *er* ile *wäre*.","Wenn ich doch reich ___! (sein)|wäre|bin|war|Gerçekleşmemiş dilek: *Wenn … doch* + Konjunktiv II: *sein* → *wäre* (keşke zengin olsam).|gewesen wäre|*bin* olmaz: bu Präsens (zenginim); dilek Konjunktiv II ister.|*war* olmaz: noktasız *war* geçmiş zamandır (zengindim); keşke için *wäre*.","Ich wünschte, wir ___ mehr Urlaub. (haben)|hätten|haben|hatten|*Ich wünschte* + Konjunktiv II: *haben* → *wir hätten* (keşke daha çok iznimiz olsa).||*haben* olmaz: bu Präsens (iznimiz var); dilek için Konjunktiv II *hätten* gerekir.|*hatten* olmaz: noktasız *hatten* geçmiş zamandır (iznimiz vardı); dilek için *hätten*.","Sie sieht aus, als ob sie geweint ___.|hätte|wäre|hatte|Geçmişte olmuş gibi: *als ob* + Partizip II + *hätte*. *weinen* Perfekt'te *haben* alır → *geweint hätte*.|habe|*wäre* olmaz: *weinen* yer değiştirme anlatmaz, Perfekt'te *haben* alır.|*hatte* olmaz: noktasız *hatte* geçmiş zamandır; -mış gibi için *hätte*."],
g40:["Ich möchte Ihnen einen Rat ___.|geben|stellen|treffen|Kalıp: *jemandem einen Rat geben* = birine tavsiye vermek. (Resmî dilde *erteilen* de olur.)|erteilen|*stellen* olmaz: *stellen* *Frage* ile gider; tavsiye *geben* ile verilir.|*treffen* olmaz: *treffen* *Entscheidung* ile gider; tavsiye için *geben*.","Wir müssen auf die Kinder ___ nehmen.|Rücksicht|Kontakt|Abschied|Kalıp: *auf jemanden Rücksicht nehmen* = birini düşünmek, gözetmek.||*Kontakt* olmaz: iletişim kalıbı *Kontakt aufnehmen mit*; *auf … Kontakt nehmen* olmaz.|*Abschied* olmaz: *Abschied nehmen* vedalaşmaktır ve *von* ile kurulur, *auf* ile değil.","Kannst du mir einen Gefallen ___?|tun|geben|stellen|Kalıp: *jemandem einen Gefallen tun* = birine iyilik yapmak. (Günlük dilde *machen* de çok kullanılır.)|machen|*geben* olmaz: *Gefallen* ile *geben* kullanılmaz; iyilik *tun* ile yapılır.|*stellen* olmaz: *stellen* *Frage* ile gider; doğrusu *einen Gefallen tun*.","Er hat die Verantwortung ___. (üstlenmek)|übernommen|gemacht|getroffen|Kalıp: *Verantwortung übernehmen* = sorumluluk üstlenmek. Partizip II: *übernommen* (*über-* ayrılmaz, *ge-* yok).||*gemacht* olmaz: *Verantwortung machen* diye bir kalıp yok; doğrusu *übernehmen*.|*getroffen* olmaz: *treffen* *Entscheidung* ile gider, *Verantwortung* ile değil."]
};

g21:['Zorluklara rağmen yaptığın 3 şeyi yaz (obwohl, trotzdem).','Obwohl ich müde war, …','obwohl → fiil sonda, trotzdem → fiil hemen sonra mı?'],

/* ---------------- EZBER KÖŞESİ ----------------
   Temel tablolar, seviyeye göre (A1 → A2 → B1). Her tablo: başlık, sütunlar, satırlar,
   hangi sütunların sorulacağı (drill), ezber taktiği (tip) ve örnek cümleler.
   kind:'kural' olanlar tablo değil, cümle kurma kuralıdır; örnek cümlelerle çalışılır. */
var EZ=[
{"id":"satz","lv":1,"cat":"Cümle","kind":"kural","t":"Fiil 2. sırada","s":"Düz cümlede çekimli fiil hep 2. yerde","tip":"Temel kalıp: Özne + Fiil + Zaman + Nesne/Yer: *Ich gehe heute ins Kino.*\nCümle zamanla ya da yerle başlarsa fiil yine 2. sırada kalır, özne fiilin arkasına geçer: *Heute gehe ich ins Kino.*\n1. yer tek kelime olmak zorunda değil, bir öbek de olabilir: *Am Montag habe ich Training.* Soru kelimesiyle başlayan soruda da fiil 2. sırada: *Was machst du heute Abend?* (Evet/hayır sorusunda ise fiil 1. sırada: *Hast du Zeit?*)\nHafıza ipucu: fiil cümlenin \"ikinci çocuğu\", yerini kimseye vermez.","ex":[["Ich gehe heute ins Kino.","Bugün sinemaya gidiyorum.",["21034","34102"]],["Am Montag habe ich Training.","Pazartesi antrenmanım var.",["32014","42301"]],["Morgen fahren wir nach Berlin.","Yarın Berlin'e gidiyoruz.",["21034","34120"]],["Jetzt koche ich das Abendessen.","Şimdi akşam yemeğini pişiriyorum.",["21034","21340","34120"]],["Am Wochenende besuche ich meine Oma.","Hafta sonu büyükannemi ziyaret ediyorum.",["320145","324501","452301"]],["In Köln wohnt meine Schwester.","Kız kardeşim Köln'de oturuyor.",["34201"]],["Was machst du heute Abend?","Bu akşam ne yapıyorsun?"]],"rowAlt":false,"colNote":{},"mem":[{"k":"imge","t":"İkinci sandalye","x":"Cümleyi bir sıra sandalye gibi düşün: 1 numaraya kim oturursa otursun (özne, *heute*, *am Montag*, *was*), 2 numarada hep çekimli fiil oturur. 1 numarada yer kalmayan özne fiilin hemen arkasına geçer: *Heute gehe ich ins Kino.*"},{"k":"desen","t":"Kelimeyi değil öbeği say","x":"1. yerde tek kelime değil bir öbek durur: *[Am Montag] [habe] [ich] Training*, *[Meine Oma] [besuche] [ich] am Wochenende*. Öbekleri say; çekimli fiil hep ikinci öbektir."},{"k":"karşıt","t":"*Heute gehe ich* ✓ ↔ *Heute ich gehe* ✗","x":"En sık hata, İngilizcedeki gibi (Today I go) zamanı başa alıp özneyi fiilin önünde bırakmak. Almancada fiil yerinden kıpırdamaz, özne arkaya geçer: *Heute gehe ich*, *Morgen fahren wir*."},{"k":"köprü","t":"Türkçe sırayla başla, fiili öne çek","x":"Türkçede yüklem sonda: Bugün sinemaya gidiyorum. Almancada çekimli fiil 2. yere öne gelir, özne de hemen arkasına: Bugün + gidiyorum + ben + sinemaya → *Heute gehe ich ins Kino.* Türkçe cümleni kur, sonra yalnız fiili 2. sıraya taşı."},{"k":"hareket","t":"Elleri çaprazla","x":"Özneyi sol elinde, fiili sağ elinde tut: *ich gehe*. Başa *heute* gelince ellerini çaprazla: *heute gehe ich*. Fiil 2. yerde sabit kalır, yalnız özne arkaya geçer."},{"k":"ritim","t":"Terazi ritmi","x":"*ich gehe heute – heute gehe ich*: iki yarımı sallanır gibi söyle; fiil ortada terazinin direği gibi durur, iki yanındakiler yer değiştirir. Aynısını *wir fahren morgen – morgen fahren wir* ile tekrarla."}],"chant":"ich gehe heute – heute gehe ich – wir fahren morgen – morgen fahren wir – ich habe am Montag Training – am Montag habe ich Training"},
{"id":"praes","lv":1,"cat":"Fiil","t":"Şimdiki zaman ekleri","s":"Präsens: düzenli fiiller","cols":["Ek","machen","wohnen","arbeiten"],"rows":[["ich (ben)","-e","mache","wohne","arbeite"],["du (sen)","-st","machst","wohnst","arbeitest"],["er/sie/es (o)","-t","macht","wohnt","arbeitet"],["wir (biz)","-en","machen","wohnen","arbeiten"],["ihr (siz, samimi)","-t","macht","wohnt","arbeitet"],["sie/Sie (onlar / Siz, resmî)","-en","machen","wohnen","arbeiten"]],"drill":[0,1,3],"tip":"Ekleri ritimle söyle: *-e, -st, -t – -en, -t, -en*.\n*wir* ve *sie/Sie* hep mastarla aynıdır (*machen*); *er* ile *ihr* de aynıdır (*macht*).\nKök -t/-d ile bitiyorsa araya e girer: *du arbeitest, er arbeitet, ihr arbeitet*.\nKök -s/-ß/-z ile bitiyorsa du yalnız -t alır: *du heißt, du tanzt*.","ex":[["Ich wohne in Köln.","Köln'de oturuyorum.",["2310"]],["Arbeitest du heute?","Bugün çalışıyor musun?"],["Er arbeitet bei einer Bank.","Bir bankada çalışıyor.",["23410"]],["Was macht ihr am Sonntag?","Pazar günü ne yapıyorsunuz?"]],"rowAlt":false,"acc":{"0-0":["e"],"1-0":["st"],"2-0":["t"],"3-0":["en"],"4-0":["t"],"5-0":["en"]},"ask":"{row} öznesiyle {col} nasıl çekilir?","colAsk":{"0":"{row} öznesiyle fiil kökü hangi eki alır?"},"colNote":{"0":"Ekler iki üçlü: *-e, -st, -t / -en, -t, -en*. *-t* iki kez (*er* ve *ihr*), *-en* iki kez (*wir* ve *sie/Sie*).","1":"Kök *mach-* + ek. *wir* ve *sie/Sie* mastarla aynı: *machen*.","2":"Kök *wohn-* + ek: *machen* ile aynı desen.","3":"Kök *t* ile bitiyor: *du*, *er/sie/es* ve *ihr*'de araya *e* girer: *arbeitest, arbeitet*."},"mem":[{"k":"ritim","t":"İki üçlü: *e-st-t / en-t-en*","x":"Ekleri el çırparak iki nefeste söyle: *-e, -st, -t* (ich, du, er) / *-en, -t, -en* (wir, ihr, sie). Sonra fiille aynı ritim: *mache, machst, macht – machen, macht, machen*."},{"k":"köprü","t":"Türkçe şahıs ekleri","x":"Türkçede de fiil özneye göre ek alır: yapar-ım, yapar-sın, yapar, yapar-ız, yapar-sınız, yapar-lar. Almanca aynı fikir: *mach-e, mach-st, mach-t …*. *du machst* ↔ yaparsın: ikisinde de s sesi var."},{"k":"desen","t":"6 hücre, 4 biçim","x":"*wir* = *sie/Sie* = mastar (*machen*), *er* = *ihr* (*macht*). Altı hücrede yalnız dört farklı biçim var: *mache, machst, macht, machen*."},{"k":"imge","t":"Nefes aldıran e","x":"*arbeit-* kökü t ile bitiyor; *arbeitst* demek dili tıkar. Araya bir *e* girip nefes aldırır: *du arbeitest, er arbeitet, ihr arbeitet*. d ile biten kökte de aynı: *finden → du findest*."},{"k":"hareket","t":"İki el, altı parmak","x":"Sol elin üç parmağı tekil: *ich -e, du -st, er -t*. Sağ elin üç parmağı çoğul: *wir -en, ihr -t, sie -en*. Sağ elde iki dış parmak aynı (*-en*), ortadaki *-t*; her parmağı kaldırırken eki söyle."}],"chant":"ich mache, du machst, er macht – wir machen, ihr macht, sie machen – ich arbeite, du arbeitest, er arbeitet – wir arbeiten, ihr arbeitet, sie arbeiten"},
{"id":"seinhaben","lv":1,"cat":"Fiil","t":"sein ve haben","s":"En önemli iki fiil, şimdiki zaman","cols":["sein","haben"],"rows":[["ich (ben)","bin","habe"],["du (sen)","bist","hast"],["er/sie/es (o)","ist","hat"],["wir (biz)","sind","haben"],["ihr (siz, samimi)","seid","habt"],["sie/Sie (onlar / Siz, resmî)","sind","haben"]],"drill":[0,1],"tip":"sein düzensizdir, ezber: *bin, bist, ist – sind, seid, sind*.\nhaben'de sadece du ve er kısalır: *du hast, er hat* (du habst ya da er habt değil; *habt* yalnız ihr için).\n*ihr seid* d ile yazılır; *seit* (t ile) \"-den beri\" demektir: *seit Montag*.","ex":[["Ich bin müde.","Yorgunum.",["210"]],["Hast du Zeit?","Vaktin var mı?"],["Wir sind heute zu Hause.","Bugün evdeyiz.",["21034","34102"]],["Seid ihr am Samstag zu Hause?","Cumartesi evde misiniz?"],["Er hat zwei Kinder.","İki çocuğu var.",["2310"]]],"rowAlt":false,"ask":"{row} öznesiyle {col} nasıl çekilir?","colNote":{"0":"*sein* tamamen düzensiz: *bin, bist, ist – sind, seid, sind*. *ihr seid* d ile (*seit* = -den beri).","1":"*hab-* + normal ek (*habe, haben, habt*); yalnız *du hast* ve *er hat*'ta b düşer."},"mem":[{"k":"ritim","t":"*bin, bist, ist – sind, seid, sind*","x":"sein'ı iki üçlü söyle: tekil üçlü *bin, bist, ist* (hepsinde i sesi), çoğul üçlü *sind, seid, sind* (hepsi s ile başlar). Çoğul üçlünün başı ve sonu aynı: *sind … sind*."},{"k":"köprü","t":"sein = -im, haben = var","x":"*sein* = olmak; Türkçede çoğu zaman ek olur: *Ich bin müde* = Yorgun-um, *Du bist nett* = Kibar-sın. *haben* = sahip olmak, Türkçede \"var\": *Ich habe Zeit* = Vaktim var. Türkçede \"var\" sonda, Almancada *habe* 2. sırada."},{"k":"desen","t":"haben'de yalnız 2 hücre kısalır","x":"*du hast* ve *er hat*'ta b düşer. Diğer dördü *hab-* + şimdiki zamanın normal ekleri: *habe, haben, habt, haben*; düzenli fiillerin ekleriyle aynı."},{"k":"karşıt","t":"*seid* ↔ *seit*, *sind* ↔ *seid*","x":"*ihr seid* (fiil, d ile) – *seit Montag* (edat, t ile): aynı okunur, farklı yazılır. *wir sind, sie sind* ama *ihr seid*: ortadaki çoğul farklı."},{"k":"köprü","t":"İngilizce biliyorsan","x":"*er ist* ≈ he is, *ich habe* ≈ I have, *er hat* ≈ he has, *du hast* ≈ eski İngilizcedeki thou hast. Aynı Germen kökü; bildiğin kelimeye bağla."}],"chant":"ich bin, du bist, er ist – wir sind, ihr seid, sie sind – ich habe, du hast, er hat – wir haben, ihr habt, sie haben"},
{"id":"unreg","lv":1,"cat":"Fiil","t":"Kök değiştiren fiiller","s":"du ve er/sie/es'te ünlü değişir","cols":["du","er/sie/es"],"rows":[["fahren","fährst","fährt"],["schlafen","schläfst","schläft"],["laufen","läufst","läuft"],["tragen","trägst","trägt"],["essen","isst","isst"],["sprechen","sprichst","spricht"],["helfen","hilfst","hilft"],["nehmen","nimmst","nimmt"],["geben","gibst","gibt"],["treffen","triffst","trifft"],["lesen","liest","liest"],["sehen","siehst","sieht"],["wissen","weißt","weiß"],["werden","wirst","wird"]],"drill":[0,1],"tip":"Değişim yalnız du ve er/sie/es'te olur; ich, wir, ihr, sie/Sie normaldir: *ich fahre, wir fahren* (istisna *wissen*: *ich weiß*).\nİki aile: a/au → ä/äu (*fahren, schlafen, tragen, laufen*) ve e → i / ie (*sprechen, helfen, nehmen, geben, treffen, essen, werden* → i; *sehen, lesen* → ie).\nKök s/ß ile bitince du ile er aynı olur: *du isst / er isst, du liest / er liest*. Özel: *du nimmst*, *er weiß* (ek yok), *du wirst, er wird*.","ex":[["Er fährt jeden Tag mit dem Rad.","Her gün bisikletle gidiyor.",["2310456","4561023"]],["Was isst du gern?","Ne yemeyi seversin?"],["Sprichst du Deutsch?","Almanca konuşuyor musun?"],["Er weiß die Antwort nicht.","Cevabı bilmiyor.",["23104"]]],"rowAlt":true,"ask":"{col} öznesiyle {row} nasıl çekilir?","colNote":{"0":"du: değişen kök + *-st*: *fahr- → du fährst*. Kök s/ß ile bitiyorsa yalnız *-t*: *du isst, du liest, du weißt*.","1":"er/sie/es: değişen kök + *-t*: *er fährt, er spricht*. Dikkat: *er weiß* (ek yok), *er wird*; *essen* ve *lesen*'de du = er: *isst, liest*."},"mem":[{"k":"desen","t":"Bir kök, iki hücre","x":"Her satırda yalnız *du* ve *er/sie/es* değişir; *ich fahre, wir fahren, ihr fahrt, sie fahren* düzenli. Her fiil için tek bir değişmiş kök ezberle (*fähr-, sprich-, sieh-*), iki hücre birden gelir: *fährst, fährt*."},{"k":"renk","t":"Ailelere renk ver","x":"a/au → ä/äu ailesini (*fahren, schlafen, tragen, laufen*) turuncu, e → i ailesini (*sprechen, helfen, nehmen, geben, treffen, essen, werden*) mor, e → ie ailesini (*sehen, lesen*) kahverengi kalemle yaz. Artikel renkleriyle (mavi, kırmızı, yeşil) karışmasın diye başka renk seç; tabloda yalnız du ve er hücrelerini boya."},{"k":"imge","t":"Umlaut = iki göz","x":"*du* ve *er* fiile bakınca fiil şaşırıp gözlerini açar: a → *ä* (iki nokta iki göz): *fahren → du fährst*. e-ailesinde ise e incelir: e → *i* (*sprechen → spricht*) ya da *ie* (*sehen → sieht, lesen → liest*)."},{"k":"karşıt","t":"Aynı görünen hücreler","x":"*du isst / er isst*, *du liest / er liest*: kök s ile bittiği için du yalnız *-t* alır, iki hücre aynı olur. Tersine *wissen*'de *du weißt* ama *er weiß* (hiç ek yok, tıpkı *ich weiß*); *werden*'de *du wirst, er wird*."},{"k":"hikâye","t":"Tom'un günü","x":"On dört fiilin er biçimi tek hikâyede: *Tom fährt zur Arbeit, trägt eine Tasche, isst ein Brot, liest die Zeitung, spricht mit dem Chef, hilft einer Kollegin, nimmt einen Kaffee und gibt ihr auch einen.* *Abends läuft er nach Hause, trifft Freunde, sieht einen Film, weiß nicht, wie spät es ist, wird müde und schläft.* Gözünü kapatıp anlat; takıldığın fiil, çalışman gereken satır."},{"k":"ritim","t":"Üç vuruş: mastar – du – er","x":"Her fiili üç vuruşla söyle: *fahren, fährst, fährt – sprechen, sprichst, spricht – sehen, siehst, sieht*. 1. vuruşta düz kök, 2. ve 3. vuruşta değişmiş kök; sesli söylerken değişen ünlüyü vurgula."}],"chant":"fahren, fährst, fährt – schlafen, schläfst, schläft – laufen, läufst, läuft – tragen, trägst, trägt – essen, isst, isst – sprechen, sprichst, spricht – helfen, hilfst, hilft – nehmen, nimmst, nimmt – geben, gibst, gibt – treffen, triffst, trifft – lesen, liest, liest – sehen, siehst, sieht – wissen, weißt, weiß – werden, wirst, wird"},
{"id":"modal","lv":1,"cat":"Fiil","t":"Modalverben","s":"können, dürfen, müssen, sollen, wollen, mögen, möchten","cols":["können","dürfen","müssen","sollen","wollen","mögen","möchten"],"rows":[["ich (ben)","kann","darf","muss","soll","will","mag","möchte"],["du (sen)","kannst","darfst","musst","sollst","willst","magst","möchtest"],["er/sie/es (o)","kann","darf","muss","soll","will","mag","möchte"],["wir (biz)","können","dürfen","müssen","sollen","wollen","mögen","möchten"],["ihr (siz)","könnt","dürft","müsst","sollt","wollt","mögt","möchtet"],["sie/Sie (onlar, resmî siz)","können","dürfen","müssen","sollen","wollen","mögen","möchten"]],"drill":[0,1,2,3,4,5,6],"tip":"Üç kural yeter:\n1) ich ile er/sie/es aynıdır; er'de sonda -t yoktur: *ich kann, er kann*.\n2) Tekilde (ich, du, er/sie/es) ünlü değişir: können → *kann*, dürfen → *darf*, müssen → *muss*, wollen → *will*, mögen → *mag*. sollen ve möchten değişmez: *soll, möchte*.\n3) Çoğulda (wir, ihr, sie/Sie) mastarın ünlüsü geri gelir: *wir können, ihr könnt, sie können*.\nAsıl fiil mastar hâlinde en sona gider: *Ich kann heute nicht kommen.*\nAnlamlar: können -ebilmek · dürfen izinli olmak · müssen zorunda olmak · sollen -meli (başkası istiyor) · wollen istemek · mögen sevmek · möchten istemek (kibar).\nDikkat: *nicht müssen* = zorunda değil, *nicht dürfen* = yasak.","ex":[["Ich kann heute nicht kommen.","Bugün gelemem.",["21034"]],["Du musst mehr trinken.","Daha çok içmelisin."],["Möchtest du einen Kaffee?","Bir kahve ister misin?"],["Hier darf man nicht rauchen.","Burada sigara içmek yasak.",["21034","41203"]],["Wir wollen im Sommer nach Italien fahren.","Yazın İtalya'ya gitmek istiyoruz.",["2310456","4510236"]]],"rowAlt":false,"ask":"{row} öznesiyle {col} nasıl çekilir?","colNote":{"0":"können = -ebilmek (yetenek, olasılık). Tekilde ö → a: *kann*.","1":"dürfen = izinli olmak. Tekilde ü → a: *darf*. *nicht dürfen* = yasak.","2":"müssen = zorunda olmak, -meli. Tekilde ü → u: *muss*. *nicht müssen* = gerek yok.","3":"sollen = -meli (başkası istiyor, öneri). Ünlü değişmez: *soll, sollst*.","4":"wollen = istemek (kararlı). Tekilde o → i: *will* (gelecek zaman değil, 'istiyorum'). Kibar istek: *möchte*.","5":"mögen = sevmek, hoşlanmak. Tekilde ö → a: *mag*. Çoğunlukla isimle: *Ich mag Kaffee.*","6":"möchten = istemek (kibar). Ünlü değişmez: *ich/er möchte, du möchtest*."},"mem":[{"k":"desen","t":"ich = er/sie/es, sonda -t yok","x":"Her modal sütununda *ich* ve *er/sie/es* satırları ikizdir: *ich kann – er kann*, *ich muss – er muss*. Normal fiilde *er macht* dersin; modalde -t gelmez. *wir* ile *sie/Sie* de ikiz; böylece her fiil için 6 değil 4 biçim ezberlersin."},{"k":"desen","t":"Noktalar tekilde uçar","x":"Umlaut'lu modallar tekilde noktalarını kaybeder: *können → kann*, *dürfen → darf*, *müssen → muss*, *mögen → mag*. Noktasız *wollen* da tekilde ünlüsünü değiştirir: *will*. *sollen* ve *möchten* hiç değişmez. Çoğulda noktalar geri gelir: *wir können, ihr dürft*."},{"k":"köprü","t":"Türkçedeki ek, Almancada ayrı kelime","x":"Türkçede modal bir ektir: gel-ebil-irim, gel-meli-yim. Almancada bu ek ayrı bir fiildir ve 2. yere oturur; asıl fiil mastar hâlinde Türkçedeki gibi en sona gider: *Ich kann morgen kommen.* = Yarın gelebilirim. *Du musst mehr schlafen.* = Daha çok uyumalısın."},{"k":"karşıt","t":"nicht müssen ≠ nicht dürfen","x":"*Du musst nicht kommen.* = Gelmek zorunda değilsin (istersen gel). *Du darfst nicht kommen.* = Gelmen yasak. Olumsuz modalda en sık yapılan hata budur; ikisini hep yan yana söyle."},{"k":"hikâye","t":"Yedi modalla bir gün","x":"Sabah işe gitmek zorundasın: *Ich muss arbeiten.* Patron istedi: *Ich soll den Bericht schreiben.* Öğlen izin var: *Ich darf Pause machen.* Akşam: *Ich kann schwimmen.* *Ich will ins Kino gehen.* Kafede kibarca: *Ich möchte einen Tee.* Filmi seviyorsun: *Ich mag den Film.* Günü sırayla hayal et, yedi cümleyi söyle."},{"k":"ritim","t":"tekil üçlü – çoğul üçlü","x":"Her modalı iki yarımda söyle: *kann, kannst, kann – können, könnt, können*. İlk yarı tekil (kısa, ünlüsü değişmiş), ikinci yarı çoğul (mastarın sesi). Yedi fiili aynı ezgiyle art arda say; 'Ritimle dinle' aynı sırayla okur."}],"chant":"ich kann, du kannst, er kann – wir können, ihr könnt, sie können. ich darf, du darfst, er darf – wir dürfen, ihr dürft, sie dürfen. ich muss, du musst, er muss – wir müssen, ihr müsst, sie müssen. ich soll, du sollst, er soll – wir sollen, ihr sollt, sie sollen. ich will, du willst, er will – wir wollen, ihr wollt, sie wollen. ich mag, du magst, er mag – wir mögen, ihr mögt, sie mögen. ich möchte, du möchtest, er möchte – wir möchten, ihr möchtet, sie möchten."},
{"id":"pron","lv":1,"cat":"Zamir","t":"Kişi zamirleri","s":"Personalpronomen: Nominativ · Akkusativ · Dativ","cols":["Nominativ","Akkusativ","Dativ"],"rows":[["ben","ich","mich","mir"],["sen","du","dich","dir"],["o (eril · der)","er","ihn","ihm"],["o (dişil · die)","sie","sie","ihr"],["o (nötr · das)","es","es","ihm"],["biz","wir","uns","uns"],["siz (samimi)","ihr","euch","euch"],["onlar","sie","sie","ihnen"],["Siz (resmî)","Sie","Sie","Ihnen"]],"drill":[0,1,2],"tip":"Akkusativ = -i hâli (beni, seni): *mich, dich, ihn*. Dativ = -e hâli (bana, sana): *mir, dir, ihm*.\nRitim: *mich, dich, ihn* · *mir, dir, ihm*.\n3. şahısta Akkusativ'de yalnız er değişir (*ihn*); *sie, es, Sie* aynı kalır.\n*wir* ve *ihr*'de Akkusativ = Dativ: *uns, euch*.\ner/sie/es yalnız insan için değil, eşya için de: *der Tisch → er*, *die Lampe → sie*, *das Buch → es*.\nDikkat: *ihr* üç iş yapar: siz (*ihr kommt*), ona-dişil (*ich helfe ihr*), onun-dişil (*ihr Auto*).\nTuzak: Türkçe hâl her zaman tutmaz: *Ich frage dich.* = Sana soruyorum (Akkusativ). *Ich gratuliere dir.* = Seni tebrik ediyorum (Dativ).","ex":[["Ich sehe dich.","Seni görüyorum."],["Kannst du mir helfen?","Bana yardım edebilir misin?"],["Ich gebe ihm das Buch.","Kitabı ona veriyorum.",["34102"]],["Wir besuchen euch am Wochenende.","Hafta sonu sizi ziyaret ediyoruz.",["34102"]],["Ich rufe Sie morgen an.","Sizi yarın ararım.",["31024"]]],"rowAlt":true,"ask":"{row} → {col}?","colAsk":{"0":"{row} → Nominativ (özne)?","1":"{row} → Akkusativ (-i hâli: kimi?)","2":"{row} → Dativ (-e hâli: kime?)"},"colNote":{"0":"Nominativ = özne (kim? ne?): *ich, du, er, sie, es, wir, ihr, sie, Sie*.","1":"Akkusativ = -i hâli (kimi?): *mich* beni, *dich* seni, *ihn* onu, *uns* bizi, *euch* sizi. *sie, es, Sie* değişmez.","2":"Dativ = -e hâli (kime?): *mir* bana, *dir* sana, *ihm* ona, *ihr* ona (dişil), *uns* bize, *euch* size, *ihnen* onlara, *Ihnen* size (resmî)."},"mem":[{"k":"desen","t":"Zamirin son harfi = artikelin son harfi","x":"3. şahıs zamirleri artikelin son harfini taşır: *er – ihn – ihm* ↔ *der – den – dem*; *sie – sie – ihr* ↔ *die – die – der*; *es – es – ihm* ↔ *das – das – dem*; çoğul *sie – sie – ihnen* ↔ *die – die – den*. Artikel tablosunu bilen bu satırları bedava öğrenir."},{"k":"karşıt","t":"-ch = Akkusativ, -r = Dativ","x":"*mich/mir*, *dich/dir*: -ch ile biten -i hâli (beni, seni), -r ile biten -e hâli (bana, sana). 3. şahısta n Akkusativ, m Dativ: *ihn/ihm*, tıpkı *den/dem*. En çok karışan çiftler bunlar; hep yan yana söyle."},{"k":"köprü","t":"kimi? → Akkusativ, kime? → Dativ","x":"*mich* = beni, *mir* = bana; *dich* = seni, *dir* = sana; *ihn* = onu, *ihm* = ona. Türkçede -i diyorsan çoğunlukla Akkusativ, -e diyorsan Dativ: *Ich sehe dich.* = Seni görüyorum. *Ich helfe dir.* = Sana yardım ediyorum. Tuzak: *Ich frage dich.* = Sana soruyorum, ama Akkusativ."},{"k":"ritim","t":"mich, dich, ihn – mir, dir, ihm","x":"Üçlüleri tren gibi söyle: *mich, dich, ihn – mir, dir, ihm*. *mich–dich* kafiyeli, *mir–dir* kafiyeli: mir'i bilen dir'i unutmaz. Sonra çoğulu ekle: *uns, euch, sie – uns, euch, ihnen*."},{"k":"desen","t":"27 hücrede 10 yeni kelime","x":"*sie, es, Sie* Akkusativ'de aynı kalır (tıpkı *die, das*); *uns* ve *euch* Akkusativ'de de Dativ'de de aynı. Nominativ dışında ezberlenecek yalnız 10 biçim var: *mich, dich, ihn, uns, euch* ve *mir, dir, ihm, ihr, ihnen*."},{"k":"renk","t":"3. şahıs = artikel renkleri","x":"3. şahıs satırlarını artikel renkleriyle gör: *er, ihn, ihm* mavi (der, den, dem), *sie, sie, ihr* kırmızı (die, die, der), *es, es, ihm* yeşil (das, das, dem). *der Tisch* mavi ise ona *er* dersin: *Der Tisch ist neu. Er ist schön.*"}],"chant":"ich, du, er, sie, es – wir, ihr, sie, Sie. mich, dich, ihn, sie, es – uns, euch, sie, Sie. mir, dir, ihm, ihr, ihm – uns, euch, ihnen, Ihnen."},
{"id":"art","lv":1,"cat":"Artikel","t":"Belirli artikel","s":"der · die · das: Nominativ · Akkusativ · Dativ","cols":["Nominativ","Akkusativ","Dativ"],"rows":[["eril","der","den","dem"],["dişil","die","die","der"],["nötr","das","das","dem"],["çoğul","die","die","den"]],"drill":[0,1,2],"tip":"Akkusativ'de yalnız eril değişir: *der → den*. Gerisi aynı kalır.\nDativ sonları: m – r – m – n (*dem, der, dem, den*). \"eMeR MeN\" diye ezberle.\nDativ'de eril = nötr (*dem*). Dişil Dativ *der*, eril Nominativ *der* ile aynı yazılır: hâli cümleden anla.\nDativ çoğulda isim de -n alır: *mit den Kindern*. Çoğulu zaten -n ya da -s ile bitiyorsa ek gelmez: *mit den Frauen, mit den Autos*.","ex":[["Der Mann kauft den Tisch.","Adam masayı satın alıyor.",["34201"]],["Ich helfe dem Mann.","Adama yardım ediyorum.",["2310"]],["Ich spreche mit der Frau.","Kadınla konuşuyorum.",["23410"]],["Ich spiele mit den Kindern.","Çocuklarla oynuyorum.",["23410"]]],"rowAlt":true,"ask":"{row} isim + {col}: hangi artikel?","colNote":{"0":"Nominativ = özne (kim? ne?): *der, die, das*; çoğul hep *die*.","1":"Akkusativ = -i hâli (kimi? neyi?): yalnız eril değişir, *der → den*. Gerisi Nominativ ile aynı.","2":"Dativ = -e hâli (kime?): *dem, der, dem, den* (m-r-m-n). Çoğulda isim de -n alır: *den Kindern*."},"mem":[{"k":"kısaltma","t":"Rese – Nese – Mermen","x":"Satır satır son harfler: Nominativ *der, die, das, die* → R-E-S-E; Akkusativ *den, die, das, die* → N-E-S-E; Dativ *dem, der, dem, den* → M-R-M-N. 'Rese, Nese, Mermen' diye üç isim gibi söyle; harfi bilen artikeli bilir."},{"k":"desen","t":"Akkusativ = Nominativ + bir n","x":"Nominativ'den Akkusativ'e geçerken 4 hücreden yalnız biri değişir: *der → den*. Dişil, nötr ve çoğul aynen kalır. Akkusativ satırını ayrıca ezberleme: 'erile n ekle' yeter."},{"k":"desen","t":"Dativ: eril = nötr, çoğula -n","x":"Dativ'de eril ve nötr ikizdir: *dem*. Dişil *der*, çoğul *den* ve çoğul isim de -n alır: *mit den Kindern*. Tablonun 12 hücresinde yalnız 5 farklı kelime var: *der, die, das, den, dem*."},{"k":"köprü","t":"Türkçe ek → Almanca artikel","x":"Türkçede ek ismin sonundadır: masa-yı, masa-ya. Almancada 'ek' artikeldedir, ismin önünde: *den Tisch* ≈ masa-yı, *dem Tisch* ≈ masa-ya. Soru sözcükleri de aynı sonu taşır: *wer → der*, *wen → den*, *wem → dem* (kim? kimi? kime?). W'yi D yap."},{"k":"renk","t":"Dativ'deki kırmızı der","x":"Eril mavi, dişil kırmızı, nötr yeşil, çoğul gri. Dativ satırındaki *der* kırmızıdır (dişil): *mit der Frau*. Nominativ'deki mavi *der* (*der Mann*) ile aynı yazılır ama rengi farklı: rengi gör, hâli bil."},{"k":"hikâye","t":"Erkek Nişan takar, herkes Masaya oturur","x":"Akkusativ'de yalnız erkek Nişan takar (N): *den*. Dativ'de herkes Masaya oturur (M): erkek ve çocuk *dem*; kadın *der* der, kalabalık çoğul *den* der ve hepsinin ismine bir -n takılır: *den Kindern*."}],"chant":"der, die, das, die – den, die, das, die – dem, der, dem, den"},
{"id":"ein","lv":1,"cat":"Artikel","t":"Belirsiz artikel ve kein","s":"ein · eine · kein: Nominativ · Akkusativ · Dativ","cols":["Nominativ","Akkusativ","Dativ"],"rows":[["eril (ein)","ein","einen","einem"],["dişil (ein)","eine","eine","einer"],["nötr (ein)","ein","ein","einem"],["çoğul (ein)","—","—","—"],["eril (kein)","kein","keinen","keinem"],["dişil (kein)","keine","keine","keiner"],["nötr (kein)","kein","kein","keinem"],["çoğul (kein)","keine","keine","keinen"]],"drill":[0,1,2],"tip":"ein, der/die/das'ın sonunu alır: *den → einen, dem → einem, der → einer, die → eine*.\nYalnız 3 hücrede ein ek almaz: eril Nominativ, nötr Nominativ ve nötr Akkusativ (*ein*).\nkein = k + ein; aynen çekimlenir: *keinen, keinem, keiner*.\nÇoğulda ein yoktur (*Ich habe Kinder.*) ama kein vardır: *Ich habe keine Kinder.*\nkein, ein'li ya da artikelsiz ismi olumsuz yapar: *ein Auto → kein Auto*, *Zeit → keine Zeit*. Fiili ya da der/die/das'lı ismi *nicht* olumsuz yapar.","ex":[["Ich habe einen Bruder.","Bir erkek kardeşim var.",["2310"]],["Ich habe keine Zeit.","Vaktim yok."],["Er wohnt in einer Wohnung.","Bir dairede oturuyor.",["23410"]],["Ich esse heute kein Fleisch.","Bugün et yemiyorum.",["21034"]],["Wir haben keine Kinder.","Çocuğumuz yok."]],"rowAlt":true,"ask":"{row} + {col}: hangi biçim?","colNote":{"0":"Nominativ: eril ve nötr ek almaz (*ein, kein*); dişil ve çoğul -e alır (*eine, keine*).","1":"Akkusativ: yalnız eril değişir, *ein → einen*; nötr *ein* ek almadan kalır.","2":"Dativ: *dem → einem*, *der → einer*; çoğul *keinen* ve isim de -n alır: *mit keinen Kindern*."},"mem":[{"k":"desen","t":"ein, der'in sonunu kopyalar","x":"Artikel tablosunu bilen ein tablosunu bilir: *den → einen*, *dem → einem*, *der → einer*, *die → eine*. Sonlar aynı (n, m, r, e); yalnız başa *ein* gelir."},{"k":"desen","t":"ein'ın 3 deliği","x":"Yalnız 3 hücrede ein ek almaz: eril Nominativ (*ein Mann*), nötr Nominativ ve nötr Akkusativ (*ein Kind*). Boş tabloyu doldururken bu üç deliği önce işaretle. B1'de sıfat eki tam bu deliklere girer: *ein alter Mann, ein kleines Kind*."},{"k":"köprü","t":"kein = k + ein = hiç","x":"Her hücrenin başına bir k ekle: *ein → kein, einen → keinen, einer → keiner*. Türkçe 'hiç' gibi düşün: *Ich habe kein Auto.* ≈ Hiç arabam yok. Çoğulda ein yok ama kein var: *keine Kinder* = hiç çocuk yok."},{"k":"karşıt","t":"kein mi, nicht mi?","x":"İsmin önünde *ein* var ya da hiç artikel yoksa olumsuzu *kein*: *ein Auto → kein Auto*, *Zeit → keine Zeit*. Fiil, sıfat ya da der/die/das'lı isim olumsuzsa *nicht*: *Ich komme nicht.* *Das Auto ist nicht neu.* *Ich kaufe das Auto nicht.*"},{"k":"renk","t":"Mavi ayrılır, yeşil yalın kalır","x":"Eril mavi, dişil kırmızı, nötr yeşil. Nominativ'de mavi ve yeşil aynı: *ein*. Akkusativ'de mavi *einen* olur, yeşil *ein* olarak kalır. Dativ'de yine buluşurlar: *einem*. Kırmızı hep -e ya da -er: *eine, eine, einer*."},{"k":"ritim","t":"Artikel ezgisiyle ein","x":"*der, die, das* ezgisini *ein* ile söyle: *ein, eine, ein – einen, eine, ein – einem, einer, einem*. Sonra aynı ezgiyi k ile tekrarla ve çoğulu ekle: *kein, keine, kein, keine – keinen, keine, kein, keine – keinem, keiner, keinem, keinen*."}],"chant":"ein, eine, ein – einen, eine, ein – einem, einer, einem. kein, keine, kein, keine – keinen, keine, kein, keine – keinem, keiner, keinem, keinen."},
{"id":"possnom","lv":1,"cat":"Artikel","t":"İyelik: mein, dein …","s":"Possessivartikel, Nominativ","cols":["der/das","die/çoğul"],"rows":[["ich","mein","meine"],["du","dein","deine"],["er","sein","seine"],["sie","ihr","ihre"],["es","sein","seine"],["wir","unser","unsere"],["ihr","euer","eure"],["sie","ihr","ihre"],["Sie","Ihr","Ihre"]],"drill":[0,1],"tip":"Her zamirin bir \"sahiplik kökü\" var: *mein, dein, sein, ihr, sein, unser, euer, ihr, Ihr*.\nDişil ve çoğulda -e eklenir: *meine Mutter, meine Kinder*.\nDikkat: euer + e → *eure* (ikinci e düşer).","ex":[["Das ist mein Bruder.","Bu benim erkek kardeşim."],["Wo ist deine Tasche?","Çantan nerede?"]]},
{"id":"wo","lv":1,"cat":"Yer","t":"Wo? · Wohin? · Woher?","s":"Nerede · nereye · nereden","cols":["Wo? (nerede)","Wohin? (nereye)","Woher? (nereden)"],"rows":[["Ülke, şehir","in Ägypten","nach Ägypten","aus Ägypten"],["Ev","zu Hause","nach Hause","von zu Hause"],["Kişi, doktor","beim Arzt","zum Arzt","vom Arzt"],["Bina, mekân","im Kino","ins Kino","aus dem Kino"],["Artikelli ülke","in der Türkei","in die Türkei","aus der Türkei"]],"drill":[0,1,2],"tip":"Ok işareti gibi düşün: ● Wo (yerinde) · → Wohin (gidiş) · ← Woher (geliş).\nEv için üçlü ezber: *zu Hause · nach Hause · von zu Hause*.\nKişiye: *bei* (yanında) · *zu* (yanına) · *von* (yanından).","ex":[["Max wohnt in Wien.","Max Viyana'da oturuyor."],["Jana geht nach Hause.","Jana eve gidiyor."],["Ihr kommt aus Syrien.","Suriye'densiniz."],["Ich komme von zu Hause.","Evden geliyorum."]]},
{"id":"wfrage","lv":1,"cat":"Soru","t":"Soru kelimeleri","s":"W-Fragen","cols":["Almanca"],"rows":[["kim","wer"],["ne","was"],["nerede","wo"],["nereye","wohin"],["nereden","woher"],["ne zaman","wann"],["nasıl","wie"],["neden","warum"],["ne kadar (miktar)","wie viel"],["hangi","welcher"],["kimi","wen"],["kime","wem"]],"drill":[0],"tip":"Hepsi W ile başlar ve fiil hemen arkasından gelir: *Wo wohnst du?*\nwer → wen (kimi, Akk.) → wem (kime, Dat.): artikeldeki gibi -n ve -m.","ex":[["Wann beginnt der Kurs?","Kurs ne zaman başlıyor?"],["Wem gehört das?","Bu kimin?"]]},
{"id":"prefix","lv":1,"cat":"Fiil","t":"Ayrılan ve ayrılmayan ön ekler","s":"trennbare / nicht trennbare Verben","cols":["Ayrılır mı?","Örnek"],"rows":[["ab-","ayrılır","abholen → ich hole ab"],["an-","ayrılır","anrufen → ich rufe an"],["auf-","ayrılır","aufstehen → ich stehe auf"],["aus-","ayrılır","aussteigen → ich steige aus"],["ein-","ayrılır","einkaufen → ich kaufe ein"],["mit-","ayrılır","mitkommen → ich komme mit"],["vor-","ayrılır","vorstellen → ich stelle vor"],["zu-","ayrılır","zumachen → ich mache zu"],["zurück-","ayrılır","zurückkommen → ich komme zurück"],["her-/hin-","ayrılır","herkommen → er kommt her"],["be-","ayrılmaz","bekommen → ich bekomme"],["emp-","ayrılmaz","empfehlen → ich empfehle"],["ent-","ayrılmaz","entscheiden → ich entscheide"],["er-","ayrılmaz","erklären → ich erkläre"],["ge-","ayrılmaz","gehören → es gehört"],["ver-","ayrılmaz","verstehen → ich verstehe"],["zer-","ayrılmaz","zerstören → er zerstört"],["miss-","ayrılmaz","missverstehen"]],"drill":[0],"tip":"Ayrılmayanlar kısa bir ezber: *be – emp – ent – er – ge – miss – ver – zer*. (\"Be emp ent er ge, ver zer!\")\nAyrılan ön ek cümlenin sonuna gider: *Ich stehe um 7 Uhr auf.* Perfekt'te ge araya girer: *aufgestanden*.\nAyrılmayanlar Perfekt'te ge- almaz: *bekommen, verstanden*.\nVurgu ipucu: ayrılan ön ek vurgulu okunur (AUFstehen), ayrılmayan vurgusuzdur (verSTEHen).","ex":[["Ich stehe jeden Tag um sechs auf.","Her gün altıda kalkarım."],["Ich verstehe das nicht.","Bunu anlamıyorum."]]},
{"id":"tekamolo","lv":2,"cat":"Cümle","kind":"kural","t":"TeKaMoLo","s":"Zaman · Sebep · Nasıl · Yer sırası","tip":"Fiilden sonra gelen bilgilerin sırası: *Te*mporal (ne zaman) – *Ka*usal (neden) – *Mo*dal (nasıl) – *Lo*kal (nerede).\nÖrnek: *Ich lerne heute (Te) wegen der Prüfung (Ka) intensiv (Mo) zu Hause (Lo).*\nHepsini kullanmak zorunda değilsin; kullandıkların bu sırada dizilir.","ex":[["Ich lerne heute wegen der Prüfung intensiv zu Hause.","Bugün sınav yüzünden evde yoğun çalışıyorum."],["Wir fahren morgen mit dem Zug nach Hamburg.","Yarın trenle Hamburg'a gidiyoruz."],["Er trainiert abends gern im Fitnessstudio.","Akşamları spor salonunda seve seve antrenman yapıyor."],["Ich bleibe heute wegen der Erkältung zu Hause.","Bugün soğuk algınlığı yüzünden evde kalıyorum."]]},
{"id":"konn","lv":2,"cat":"Cümle","t":"Bağlaçlar ve fiilin yeri","s":"Hangi bağlaçtan sonra fiil nereye gider?","cols":["Fiil nerede?"],"rows":[["und","değişmez"],["aber","değişmez"],["oder","değişmez"],["denn","değişmez"],["sondern","değişmez"],["deshalb","hemen sonra"],["trotzdem","hemen sonra"],["dann","hemen sonra"],["danach","hemen sonra"],["außerdem","hemen sonra"],["weil","en sonda"],["dass","en sonda"],["wenn","en sonda"],["ob","en sonda"],["obwohl","en sonda"],["als","en sonda"]],"drill":[0],"tip":"Üç grup:\n1) *ADUSO* (aber, denn, und, sondern, oder): sayılmaz, fiil yerinde kalır.\n2) deshalb, trotzdem, dann …: 1. yeri kaplar, fiil hemen arkasından gelir.\n3) weil, dass, wenn, ob, obwohl, als: yan cümle, fiil en sona.","ex":[["Ich bin müde, aber ich trainiere.","Yorgunum ama antrenman yapıyorum."],["Ich bin müde, deshalb gehe ich ins Bett.","Yorgunum, bu yüzden yatıyorum."],["Ich gehe ins Bett, weil ich müde bin.","Yorgun olduğum için yatıyorum."]]},
{"id":"possakk","lv":2,"cat":"Artikel","t":"İyelik, Akkusativ","s":"meinen · meine · mein","cols":["der","die","das"],"rows":[["ich","meinen","meine","mein"],["du","deinen","deine","dein"],["er","seinen","seine","sein"],["sie","ihren","ihre","ihr"],["es","seinen","seine","sein"],["wir","unseren","unsere","unser"],["ihr","euren","eure","euer"],["sie","ihren","ihre","ihr"],["Sie","Ihren","Ihre","Ihr"]],"drill":[0,1,2],"tip":"Senin defterindeki tablo; başlığı *Akkusativ* olmalı (Dativ değil).\nKural: iyelik sözcüğü *ein* gibi çekimlenir. Akkusativ'te yalnız eril -en alır: *einen → meinen*.","ex":[["Ich suche meinen Schlüssel.","Anahtarımı arıyorum."],["Kennst du ihren Bruder?","Onun (kadının) erkek kardeşini tanıyor musun?"]]},

hal:{t:'Hâller: -i, -e, -in',de:'Kasus',s:'Nominativ · Akkusativ · Dativ · Genitiv',
 x:'Almanca hâlleri Türkçeden zaten tanıyorsun: *Akkusativ* = -i hâli (kimi? neyi?), *Dativ* = -e/-de hâli (kime? nerede?), *Genitiv* = -in hâli (kimin?). Fark şu: Türkçe eki ismin sonuna takar, Almanca hâli *artikele* (ve zamire, sıfata) yükler.\nHâli kim seçer? 1) kelimenin görevi (özne → Nominativ), 2) fiil (*helfen* → Dativ), 3) edat (*mit* → Dativ, *für* → Akkusativ, *in* → Wo? Dativ / Wohin? Akkusativ).',
 tb:[['Hâl','Soru','Türkçe','Örnek'],['Nominativ','kim? ne?','özne','*Der Mann* trainiert.'],['Akkusativ','kimi? neyi?','-i hâli','Ich sehe *den Mann*.'],['Dativ','kime? nerede?','-e / -de hâli','Ich helfe *dem Mann*.'],['Genitiv','kimin?','-in hâli','das Auto *des Mannes*']],
 rows:[],mem:['ez:art','ez:ein','ez:pron','ez:possend','ez:pdat','ez:pakk','ez:pwechsel','ez:reflex','ez:gen','ez:relativ'],
 tr:'Türkçe "adam*a* yardım ediyorum" der, Almanca "ich helfe *dem* Mann": -e hâli kelimenin sonundan artikele taşındı. Artikeli hâl eki gibi düşün.'},
ek:{t:'Sıfat ekleri: bilgiyi biri taşır',de:'Adjektivendungen',s:'Artikel söylüyorsa sıfat dinlenir',
 x:'İsmin cinsini ve hâlini birinin açıkça göstermesi gerekir. Artikel bunu gösteriyorsa (*der, den, dem*) sıfat kısa bir ekle yetinir: *-e* ya da *-en*. Artikel göstermiyorsa (*ein*, artikel yok) bilgiyi sıfat kendisi taşır: *ein neu-er Ball, neu-es Auto*.\nYani sıfat ekleri rastgele değil: eksik kalan bilgiyi tamamlıyorlar.',
 tb:[['Örnek','Bilgiyi kim taşıyor?'],['*der* neu*e* Ball','artikel (der) → sıfat -e'],['*ein* neu*er* Ball','ein cinsi göstermiyor → sıfat -er ile gösterir'],['neu*er* Ball (artikelsiz)','artikel yok → sıfat bütün bilgiyi taşır'],['mit *dem* neu*en* Ball','Dativ: artikel gösteriyor → sıfat -en']],
 rows:[],mem:['ez:adjbest','ez:adjein','ez:adjnull','ez:art','ez:ein'],
 tr:'Türkçede sıfat hiç ek almaz ("yeni top, yeni topu"). Almancada ek almasının tek sebebi, artikelin eksik bıraktığı bilgiyi tamamlamak.'},
zaman:{t:'Zaman çizgisi',de:'Zeitformen',s:'Plusquamperfekt ← Perfekt / Präteritum ← Präsens → Futur',
 x:'Zamanlar bir çizgi üzerinde dizilir. Konuşmada geçmiş için *Perfekt* (ich habe gemacht), yazıda *Präteritum* (ich machte). Ama *sein, haben* ve modallar konuşmada da Präteritum: *ich war, ich hatte, ich musste*.\nBir geçmişten daha önceki geçmiş: *Plusquamperfekt* (ich hatte gemacht). Kuruluşu Perfekt ile aynı, sadece yardımcı fiil geçmişte.',
 tb:[['Zaman','Örnek','Ne zaman?'],['Plusquamperfekt','ich *hatte* gegessen','geçmişten önceki geçmiş'],['Perfekt','ich *habe* gegessen','konuşmada geçmiş'],['Präteritum','ich *aß* · ich *war*','yazıda; sein/haben/modal her yerde'],['Präsens','ich *esse*','şimdi ve yakın gelecek'],['Futur I','ich *werde* essen','gelecek, tahmin, söz']],
 rows:[],mem:['g:g1','g:g2','g:g19','g:g23','g:g30','ez:praet','ez:partizip','ez:praetunreg'],
 tr:'Türkçe "-dı" çoğu zaman Perfekt\'e denk gelir: "Pizza yedim" = *Ich habe Pizza gegessen*. "-mıştı" = Plusquamperfekt: *Ich hatte gegessen*.'},
konj:{t:'Hayal dünyası: Umlaut',de:'Konjunktiv II',s:'konnte ↔ könnte · wurde ↔ würde · war ↔ wäre',
 x:'Konjunktiv II gerçek olmayanı, kibar olanı, dileği anlatır. Biçimi çoğu zaman Präteritum + *Umlaut*: *konnte* (yapabildi, gerçek) → *könnte* (yapabilirdi, hayal). İki noktayı eklemek seni gerçeklikten hayale taşır.\nDiğer fiillerde kısa yol: *würde* + mastar (yine mengene!): *Ich würde gern reisen.*',
 tb:[['Gerçek geçmiş','Hayal / kibar','Türkçe'],['*konnte*','*könnte*','yapabildi → yapabilirdi'],['*wurde*','*würde*','oldu → olurdu'],['*war*','*wäre*','idi → olsaydı / olurdu'],['*hatte*','*hätte*','vardı → olsaydı'],['*musste*','*müsste*','zorundaydı → zorunda olurdu']],
 rows:[],mem:['g:g8','g:g14','g:g26','g:g39','ez:konj2','ez:praet'],
 tr:'Türkçede bu iş -sa, -ardı, -meli ekleriyle yapılır: "Vaktim olsa gelirdim" = *Wenn ich Zeit hätte, würde ich kommen.*'},
zu:{t:'zu + mastar ailesi',de:'Infinitiv mit zu',s:'Modal fiilden sonra zu yok, diğerlerinden sonra var',
 x:'İkinci bir fiil mastar hâlinde sona gittiğinde (yine mengene!) önüne çoğu zaman *zu* gelir: *Ich versuche, pünktlich zu sein.* İstisna: modal fiiller, *werden* ve *lassen*: *Ich muss arbeiten* (zu yok).\nAyrılan fiilde zu araya girer, tıpkı Perfekt\'teki ge gibi: *auf-zu-stehen* ↔ *auf-ge-standen*.',
 tb:[['Yapı','Örnek','Anlam'],['Modal + mastar','Ich *muss* arbeiten.','zu yok'],['fiil + zu','Ich habe Lust, ins Kino *zu* gehen.','-meye'],['um … zu','Ich lerne, *um* in Berlin *zu* arbeiten.','-mek için'],['ohne … zu','Er geht, *ohne* Tschüss *zu* sagen.','-meden'],['statt … zu','*Statt* zu lernen, spielt er.','-mek yerine']],
 rows:[],mem:['g:g17','g:g28','g:g35','ez:modal','ez:prefix'],
 tr:'Türkçe bunları fiile ek takarak yapar: gel*mek için*, söyle*meden*, öğren*mek yerine*. Almancada ek yerine *um/ohne/statt … zu* çerçevesi var.'},
prap:{t:'Fiil + edat bütünleri',de:'Verben mit Präpositionen',s:'warten auf, denken an … tek kelime gibi',
 x:'Bazı fiiller belli bir edatla birlikte anlam kazanır: *warten auf* (beklemek), *denken an* (düşünmek), *Angst haben vor* (korkmak). Edatı ve hâlini fiille birlikte, tek kelime gibi öğren.\nSoru ve cevapta edat *wo(r)-* / *da(r)-* ile birleşir: *Worauf wartest du? – Darauf.* İlgi cümlesinde edat başa geçer: *der Bus, auf den ich warte*.',
 tb:[['Fiil + edat','Örnek','Türkçe'],['warten *auf* + A','Ich warte auf den Bus.','otobüsü beklemek'],['denken *an* + A','Ich denke an dich.','seni düşünmek'],['Angst haben *vor* + D','Ich habe Angst vor Hunden.','köpeklerden korkmak'],['sich freuen *auf* + A','Ich freue mich auf das Wochenende.','hafta sonunu dört gözle beklemek']],
 rows:[],mem:['g:g12','g:g25','g:g38','g:g40','ez:vprep'],
 tr:'Türkçede de fiil hâl ekini kendisi seçer: "-den korkmak, -e güvenmek, -i beklemek". Almancada bu seçim edatla yapılır; aynı mantık, farklı araç.'}
};

  hatirla:["*Ich kann heute nicht kommen.* cümlesinde *kommen* nerede duruyor?","En sonda. Çekimli fiil (*kann*) 2. yerde, ikinci parça en sonda."],
  mantik:"Almanca cümle bir mengene gibidir: çekimli fiil 2. yerde bir çeneyi, ikinci fiil parçası en sonda öbür çeneyi tutar; zaman, yer, nesne arada sıkışır. Perfekt bu mengenenin en sık kullanılan hâli: *habe/bin* öne, Partizip II arkaya. Neden iki parça? *habe* sana kimin yaptığını (ich, du, er) söyler, Partizip ise ne olduğunu; dinleyen asıl eylemi cümlenin sonunda öğrenir. haben mi sein mi sorusunun da bir mantığı var: bir yerden başka bir yere geçtiysen ya da bir durumdan başka bir duruma geçtiysen (yatıyordun → kalktın, uyanıktın → uyudun) *sein*; geri kalan her şey *haben*.",
  adim:{tr:"Dün akşam spor salonuna gittim.",s:[
    ["„Gitmek“ = *gehen*. Yer değiştiriyorsun → yardımcı fiil *sein*. ich → *bin*, 2. yere.","Ich bin"],
    ["Zaman ve yer bilgisi mengenenin ortasına girer: önce zaman, sonra yer.","Ich bin gestern Abend ins Fitnessstudio"],

  tr:[
    ["Dün pizza yedim.","Ich habe gestern Pizza gegessen.","Türkçe tek kelime (ye-di-m), Almanca iki parça: *habe* + *gegessen*. Kişi bilgisi Türkçede -m ekinde, Almancada *habe*'de."],
    ["Çok çalıştım.","Ich habe viel gearbeitet.","Yardım eden yer: Türkçede anlamı taşıyan fiil hep sondadır; Partizip de sonda. Asıl eylemi sona saklama alışkanlığın burada işe yarar."],
    ["Eve gittim. / Kahve içtim.","Ich bin nach Hause gegangen. / Ich habe Kaffee getrunken.","Yanıltan yer: Türkçede hepsi -dı ile kurulur, yardımcı seçmezsin. Almancada hareket ve durum değişimi *sein*, gerisi *haben*. Türkçe burada ipucu vermez, fiilin anlamına bakmalısın."],
    ["Kahvaltı ettin mi?","Hast du schon gefrühstückt?","Türkçe soruyu sondaki „mi“ ile yapar; Almanca çekimli parçayı (*hast*) başa alır. Partizip yine en sonda bekler."]
  ],
  neden:[
    ["Geçmişten bahsediyorsun ama *habe* şimdiki zamanda. Neden?","Perfekt'in kökü „elimde bitmiş bir iş var“ fikridir: *Ich habe die Pizza gegessen* ≈ „pizzayı yenmiş olarak elimde tutuyorum“, Türkçedeki „yemiş bulunuyorum“ gibi. Zamanla bu kalıp sıradan geçmiş zamana dönüştü. Bu yüzden *habe/bin* şimdiki zamanda kalır, geçmişi Partizip taşır."],
    ["*laufen* de *trainieren* de hareket. Neden *ich bin gelaufen* ama *ich habe trainiert*?","Ölçüt „kıpırdadın mı“ değil, „fiil yol almayı ya da bir durum değişimini mi anlatıyor“. *laufen*, tıpkı *gehen* ve *fahren* gibi, yol almaktır → *sein*. *trainieren* bir faaliyettir, kimseyi bir yerden bir yere götürmez → *haben*. *aufstehen* (yatıyordun → ayaktasın) ve *einschlafen* (uyanıktın → uyudun) da durum değişimi olduğu için *sein* alır."],
    ["Neden *trainiert* ve *besucht* ge- almaz?","ge- vurgusuz bir hecedir ve kelimenin vurgulu ilk hecesinin önüne gelir: *GEmacht*. *traiNIEren*, *beSUCHen* zaten vurgusuz bir heceyle başlıyor; önüne bir vurgusuz hece daha eklemek dile ağır gelir, ge- düşer. Ayrılan fiilde vurgu ön ekte (*AUFstehen*), ge- vurgunun arkasına girer: *aufgestanden*."]
  ],
  karis:[
    ["*Ich habe gegangen.* ✗","*Ich bin gegangen.* ✓","Kendine sor: sonunda başka bir yerde ya da başka bir durumda mıyım? Evet → *sein*. *bleiben* ve *sein* de *sein* alır (*ich bin geblieben, ich bin gewesen*), onları ayrıca ezberle."],
    ["*Ich habe gestern gearbeitet viel.* ✗","*Ich habe gestern viel gearbeitet.* ✓","Partizip cümlenin son kelimesidir, araya ne girerse girsin. Türkçede de „çalıştım çok“ demezsin."],
    ["*getrainiert*, *geverstanden* ✗","*trainiert*, *verstanden* ✓","-ieren ile biten ve be-, ver-, er-, ent- ile başlayan fiillerde ilk hece vurgusuz; ge- eklenmez."]
  ],
  kanca:"Perfekt bir sandviçtir: üst ekmek *habe/bin*, alt ekmek Partizip, dünün bütün malzemesi ortada.",
  ileri:[
    {to:"g:g23",t:"Plusquamperfekt aynı sandviçtir, sadece üst ekmek geçmişe kayar: *Ich hatte gegessen, ich war gegangen.* haben/sein seçimini burada öğrendiğin gibi yaparsın."},
    {to:"g:g15",t:"Passiv'de aynı Partizip II yine en sona gider, bu kez *werden* ile: *Das Essen wird gekocht.*"}
  ]

GL.g2={

    {to:"ez:modal",t:"Modal fiilleri şimdiki zamanda biliyorsun: *Ich muss heute arbeiten.* Geçmişe geçince kalıp aynen kalır, sadece *muss* → *musste* olur: *Ich musste gestern arbeiten.* Tablodaki ilk kural da geçerli: ich = er, ek yok (*ich konnte, er konnte*)."},

    ["Çalışmak zorundaydım.","Ich musste arbeiten.","Yardım eden yer: Türkçede de mastar var (çalış-mak) ve geçmişi mastar değil „zorundaydım“ taşır. Almancada da geçmiş *musste*'de, *arbeiten* değişmez."],
    ["Çocukken futbolcu olmak istiyordum.","Als Kind wollte ich Fußballspieler werden.","Yanıltan yer: Türkçe „istiyordum“ (süregiden) ile „istedim“ (bir kere) ayrımı yapar; Almanca ikisine de *wollte* der. Fark bağlamdan anlaşılır."],
    ["Bir kahve istedim.","Ich wollte einen Kaffee.","*möchte*'nin geçmiş biçimi yok. Kibar *möchte* ile düz *will* geçmişte tek kelimede birleşir: *wollte*."]
  ],
  neden:[
    ["Neden konuşurken *Ich habe arbeiten müssen* değil de *Ich musste arbeiten* deriz?","Perfekt'te modal üçüncü bir parça ister, üstelik Partizip yerine mastar kullanılır (*habe … müssen*). Fazla ağır. sein, haben ve modallar dilin en sık fiilleri; sık kullanılan şey kısalır. Bu yüzden onlar konuşmada da Präteritum ile söylenir: *war, hatte, musste*."],
    ["Modallarda ich ile er neden şimdiki zamanda bile aynı (*ich kann, er kann*)?","Çünkü modalların şimdiki zamanı aslında çok eski bir geçmiş zaman biçimidir! Almancada geçmiş zamanda ich ve er hep aynı ve eksizdir: *ich machte, er machte; ich ging, er ging*. Modallar bu izi şimdiki zamanda taşır. Yani A1'de öğrendiğin tuhaflık bir geçmiş zaman kuralı."],
    ["Noktalar neden düşüyor: *können* → *konnte*?","Almancada noktalar (Umlaut) „gerçek dışı / kibar“ anlamını taşıyacak: *Könnten Sie mir helfen?* Gerçek bir olayı anlatırken hayal yok, nokta yok: *Ich konnte nicht kommen.* Tek bir nokta çifti „yapamadım“ ile „yapabilirdim“ arasındaki fark."]
  ],
  karis:[
    ["*konnte* (yapabildi)","*könnte* (yapabilirdi / kibar rica)","Noktasız = gerçekten oldu, geçmiş. Noktalı = hayal ya da kibarlık. Dinlerken o ↔ ö'ye dikkat et."],
    ["*Ich musste gestern gearbeitet.* ✗","*Ich musste gestern arbeiten.* ✓","Modalın yanında hep mastar. Geçmişi *musste* zaten taşıyor, ikinci bir geçmiş işareti koyma."],
    ["*Ich möchtete …* ✗","*Ich wollte …* ✓","*möchte*'nin geçmişi yok. „İstedim / istiyordum“ = *wollte*."]
  ],
  kanca:"Noktaları sil, -te ekle, geçmişe git: *können → konnte, müssen → musste*; noktalar hayal ülkesinde (*könnte*) seni bekliyor.",
  ileri:[
    {to:"g:g8",t:"Aynı fiillere noktalar geri gelince kibar rica olur: *konnte → könnte*. Biçimi şimdiden biliyorsun."},
    {to:"g:g19",t:"Präteritum bütün fiillere yayılır: *machte, ging, kam*. -te eki ve ich = er kuralı orada da aynen geçerli."}
  ]
};

    ["yağmur yağarsa","wenn es regnet","Türkçede koşul fiile ek olarak yapışır (-sa); Almancada başa ayrı bir kelime (*wenn*) gelir. Ama sıra aynı: koşul önce söylenir, fiil sonda."],
    ["Antrenmanın iptal olduğunu düşünüyorum.","Ich glaube, dass das Training ausfällt.","Yanıltan yer: Türkçede yan cümle hep öne gelir (…olduğunu düşünüyorum). Almancada ana cümle çoğu zaman önde, yan cümle virgülle arkada. Ayrılan fiil yan cümlede birleşir: *ausfällt*."],
    ["Yorgunum, çünkü çok çalıştım.","Ich bin müde, denn ich habe viel gearbeitet. / Ich bin müde, weil ich viel gearbeitet habe.","Türkçe „çünkü“ sırayı değiştirmez; Almanca *denn* de değiştirmez. Ama *weil* fiili sona yollar. Aynı anlam, iki farklı sıra."]
  ],
  neden:[
    ["Neden yan cümlede fiil sona gidiyor?","Fiilin sona gitmesi „bu cümle tek başına değil, bir parça“ sinyalidir. Dinleyen çekimli fiili duyunca yan cümlenin bittiğini anlar; fiil bir kapanış zili gibidir. Ana cümle ise fiili 2. yerde erkenden söyleyerek „ben bağımsızım“ der."],
    ["Yan cümle öne gelince ana cümle neden fiille başlıyor?","Çünkü bütün yan cümle tek bir „1. yer“ sayılır, tıpkı *heute* gibi. *Heute gehe ich …* ile *Wenn es regnet, gehe ich …* aynı kural: 1. yer dolu, fiil 2. yerde. Yeni bir kural yok; eski kural büyük bir kutuyla uygulanıyor."],
    ["*weil* ve *denn* ikisi de „çünkü“. Almanca neden ikisini birden tutuyor?","*denn* sadece iki ana cümleyi yan yana dizer ve hep arkada durur. *weil* ise sebebi bir paket yapar: paketi başa koyabilir (*Weil ich müde bin, …*) ya da tek başına cevap verebilirsin: *Warum? – Weil ich müde bin.* *denn* ile bunların hiçbiri olmaz."]
  ],
  karis:[
    ["*…, weil ich bin müde.* ✗","*…, weil ich müde bin.* ✓","*weil* kapı açar, fiil sona. Fiili yerinde bırakmak istiyorsan *denn* kullan: *…, denn ich bin müde.*"],
    ["*Wenn es regnet, ich laufe …* ✗","*Wenn es regnet, laufe ich …* ✓","Yan cümle 1. yer sayılır, ana cümle fiille başlar. Formül: fiil, virgül, fiil (*regnet, laufe*)."],
    ["*…, dass ich kann morgen kommen.* ✗","*…, dass ich morgen kommen kann.* ✓","Yan cümlede son kelime çekimli fiildir; modal da, Perfekt'in *habe*'si de mastarın/Partizipin arkasına geçer."]
  ],
  kanca:"*weil, dass, wenn* bir kapıdır: kapıdan giren fiil koridorun sonuna kadar yürür, tıpkı Türkçede olduğu gibi.",
  ileri:[
    {to:"g:g13",t:"Dolaylı sorular da aynı kapıyı kullanır: *Weißt du, wann das Training beginnt?* Fiil yine en sonda."},
    {to:"g:g16",t:"İlgi cümleleri de yan cümledir: *der Trainer, der mir hilft*. Kapı burada *der/die/das*."}
  ]
};

  tr:[

    ["Kitabı masaya koyuyorum.","Ich lege das Buch auf den Tisch.","Yanıltan yer: Türkçe „masaya“ -e hâlinde, ama Almanca burada Dativ değil Akkusativ! Kişiye -e (bana = *mir*) Dativ'dir; bu edatlarla yere doğru -e Akkusativ'dir."],
    ["Resmi duvara asıyor. / Resim duvarda asılı.","Er hängt das Bild an die Wand. / Das Bild hängt an der Wand.","*hängen* iki anlamda da aynı kelime; farkı sadece hâl söyler: *an die* (oraya) ↔ *an der* (orada). Türkçe -e / -de ile birebir."],
    ["Spor salonunun önünde buluşuyoruz.","Wir treffen uns vor dem Fitnessstudio.","Türkçe „önünde“ = isim + iyelik + -de. Almancada *vor* + Dativ yeter. Buluşmak hareket gibi gelse de buluşma noktası bir yer: Wo? → Dativ."]

    ["Neden *legen* ve *liegen* gibi iki ayrı fiil var?","Biri sebep, biri sonuç: sen bir şeyi *legst* (yatırırsın), sonra o *liegt* (yatar). *setzen → sitzen*, *stellen → stehen* de böyle. Sebep fiili hareket demek, Akkusativ alır; sonuç fiili durum demek, Dativ alır. *legen/liegen* ve *setzen/sitzen*'de ünlü bile ipucu verir: e = koymak, i/ie = durmak."],
    ["Bu ayrım için neden ayrı bir hâl gerekiyor?","Türkçe tam olarak bunu yapar: -de ↔ -e. Almanca da yapıyor, sadece eki ismin sonuna değil artikele koyuyor: *dem* ↔ *den*. İki dil aynı ayrımı yapıyor; Almanca eki öne almış."]

  karis:[

    ["Kişiye -e: *Ich helfe dir.* (Dativ)","Yere -e: *Ich gehe in den Park.* (Akkusativ)","Türkçe „-e“ iki işi birden yapıyor. Kişiye -e → Dativ; bu dokuz edatla bir yere -e → Akkusativ."],
    ["*Ich lege das Handy auf dem Tisch.* ✗","*Ich lege das Handy auf den Tisch.* ✓","*legen, stellen, setzen, hängen* (asmak) her zaman bir hedef ister → Akkusativ."]

  kanca:"● nokta = Dativ (orada duruyor), → ok = Akkusativ (oraya gidiyor): *im Kino* noktadır, *ins Kino* oktur.",
  ileri:[

    ["Neden *gut → besser* gibi bambaşka kelimeler var?","En sık kullanılan kelimeler en eski biçimlerini korur; her gün söylendikleri için düzensizlikleri unutulmaz. İngilizce biliyorsan aynısını tanırsın: good → better → best. *besser* ile *better* kardeştir."],
    ["*am schnellsten* ile *der schnellste* arasındaki fark ne?","*am …sten* fiilden ya da *sein*'dan sonra tek başına durur: *Er läuft am schnellsten.* İsmin önünde ise artikel + normal sıfat eki gelir: *der schnellste Läufer, die beste Pizza*."]

  karis:[
