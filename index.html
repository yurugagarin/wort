    '<p class="muted" style="margin-top:6px">'+(acc>=.9?'Çok iyi! Bu konu oturuyor.':acc>=.7?'İyi gidiyor.':'Bu konuya yarın tekrar bakalım.')+'</p></div>'+
    '<div class="card"><div class="row"><span class="small muted">Konu ilerlemesi</span><div class="sp"></div><b class="num">%'+pct(X.p0)+' → %'+pct(p1)+'</b></div><div style="margin-top:8px">'+bar(p1,'var(--ok)','thick')+'</div>'+
    '<p class="small muted" style="margin-top:8px">'+nextReview(id).replace(/^./,function(c){return c.toUpperCase();})+'. Uygulama seni o gün hatırlatacak.</p></div>'+
    (added<wl.length?'<button class="btn dark big wide" data-act="gwadd" data-id="'+id+'">Konunun '+(wl-added)+' kelimesini kelime tekrarına ekle</button>':'')+
    (wrong.length?'<button class="btn big wide" data-act="lwrong">Yanlış yaptığım '+wrong.length+' soruyu tekrar et</button>':'')+
    '<button class="btn big wide" data-act="topic" data-id="'+id+'">Konuya dön</button><button class="btn lime big wide" data-act="closeall">Bitti</button>';
}

/* --- cümle kurma (ders ve alıştırma ortak) --- */
function prepSatz(o,it){
  var m=it.de.match(/^(.*?)([.!?…]*)$/);o.end=m[2];o.sol=m[1].trim().split(/\s+/);
  var idx=o.sol.map(function(_,i){return i;}),tries=0;
  do{shuffle(idx);tries++;}while(idx.length>1&&tries<9&&idx.every(function(v,i){return v===i;}));
  o.bank=idx;o.placed=[];o.state=null;
}
function satzBody(o,it){
  var b='<div class="eyebrow center" style="margin-top:8px">Cümleyi kur</div><p class="sz-tr">'+esc(it.tr)+'</p>';
  b+='<div class="sz-ans'+(o.state?' '+o.state:'')+'">'+o.placed.map(function(i,j){return '<button class="tok" lang="de" data-act="szrem" data-j="'+j+'">'+esc(o.sol[i])+'</button>';}).join('')+
    (o.placed.length?'':'<span class="small muted" style="padding:8px 4px">Aşağıdaki kelimelere sırayla dokun</span>')+'</div>';
  if(!o.state){
    b+='<div class="sz-bank">'+o.bank.map(function(i,j){return '<button class="tok" lang="de" data-act="szadd" data-j="'+j+'">'+esc(o.sol[i])+'</button>';}).join('')+'</div>';
    if(o.placed.length)b+='<button class="link center" data-act="szclear">Temizle</button>';
  }else if(o.state==='ok')b+='<div class="fb ok"><b>Richtig!</b><span lang="de">'+esc(it.de)+'</span></div><button class="btn dark big wide" data-act="sznext">Devam</button>';
  else b+='<div class="fb no"><b>Doğrusu:</b><span lang="de">'+esc(it.de)+'</span></div><div class="row"><button class="btn big wide" data-act="szaccept">Benimki de doğru</button><button class="btn dark big wide" data-act="sznext">Devam</button></div>';
  if(it.hint)b+='<p class="note center">'+it.hint+'</p>';
  return b;
}
function szCheck(){
  var ok=X.placed.map(function(i){return X.sol[i];}).join(' ')===X.sol.join(' ');
  X.state=ok?'ok':'no';
  if(X.kind==='lesson')lessonRecord(ok);else{X.res[X.i]=ok?'ok':'no';if(ok)X.ok++;}
}
function advance(){
  X.i++;X.pick=null;X.state=null;
  var it=X.items[X.i];if(it&&(it.t==='sz'||X.kind==='satz'))prepSatz(X,it);
  drawPage();$('page').scrollTop=0;
}

/* --- kelime tekrarı: anlam odaklı ---
   Yeni kelime önce tanıtılır (Almanca + Türkçe + örnek), birkaç kart sonra sorulur.
   Soru türü kelimenin aşamasına göre: Almanca→Türkçe seç, Türkçe→Almanca seç,
   sonra Almancasını kendin hatırla. Artikel ayrıca sorulmaz; kelimenin önünde
   renkli durur (der mavi, die gül, das yeşil) ve böyle akılda kalır. */
function deLabel(c){var a=ART(c.a);return (a?'<span class="art" style="color:var(--'+a+')">'+a+'</span> ':'')+esc(c.w);}
function deText(c){var a=ART(c.a);return (a?a+' ':'')+c.w;}
function rvType(id){
  var s=S.srs[id];
  if(!s&&!W.seen[id])return 'intro';
  if(!s||s.n===0)return 'de2tr';
  if(s.n===1)return 'tr2de';
  return hash(id+today())%2?'recall':'tr2de';
}
function rvOpts(c,type){
  var src=c.kalip?KL.map(function(k,i){return card('k:'+i);}):POOL.filter(function(e){return e.p===c.p&&Math.abs(e.l-(c.l||2))<=1;});
  if(src.length<8)src=POOL;
  var key=type==='de2tr'?function(x){return x.tr;}:deText,right=key(c),o=[right],g=0;
  while(o.length<4&&g++<80){var d=src[Math.floor(Math.random()*src.length)];if(!d||d.id===c.id)continue;var v=key(d);if(v&&o.indexOf(v)<0&&v.length<70)o.push(v);}
  return {right:right,o:shuffle(o)};
}
function rvCard(c,big){
  var pl=plural(c),ru=ART(c.a)&&c.p==='n'?rule(c):'';
  return '<div class="de" lang="de" style="font-size:'+(big?'30':'24')+'px;font-family:var(--f-disp)">'+deLabel(c)+'</div>'+
    '<div class="tr" style="font-size:'+(big?'24':'20')+'px">'+esc(c.tr)+'</div>'+
    (pl?'<div class="pl" lang="de">çoğul: die '+esc(pl)+'</div>':c.f?'<div class="pl" lang="de">'+esc(c.f)+'</div>':'')+
    (c.ex?'<div class="ex" lang="de">'+hl(c.ex)+'</div>':'')+(ru?'<div class="rule">'+esc(ru)+'</div>':'');
}
function pReview(){
  var q=W.q,b='';
  if(!q.length){
    var d=peek(today())||{};
    b='<div class="card rv"><div class="eyebrow">Kelime tekrarı</div><div class="tr">Bugünlük tamam!</div><p class="muted">'+(d.w||0)+' cevap verdin. Yarın tekrar zamanı gelenler burada olacak.</p>'+
      '<button class="btn dark big wide" data-act="more">5 yeni kelime daha öğren</button><button class="btn lime big wide" data-act="close">Kapat</button></div>';
    return {t:'Kelime tekrarı',b:b};
  }
  var id=q[0],c=card(id);
  if(!c){q.shift();return pReview();}
  if(!W.cur||W.cur.id!==id){var ty=rvType(id);W.cur={id:id,type:ty};if(ty==='de2tr'||ty==='tr2de'){var r=rvOpts(c,ty);W.cur.right=r.right;W.cur.o=r.o;}W.step='q';W.pick=null;}
  var cu=W.cur,done=W.n0-q.length;
  b=progBar(done,Math.max(W.n0,done+1));
  if(cu.type==='intro'){
    b+='<div class="card rv"><div class="src">Yeni kelime · '+esc(srcLabel(c))+'</div>'+rvCard(c,true)+'</div>'+
      '<p class="note center">Okunuşunu içinden söyle, örnek cümleyi oku. Birkaç kart sonra sorulacak.</p>'+
      '<button class="btn lime big wide" data-act="rvok">Tamam, devam</button><button class="link center" data-act="rvknown">Bunu zaten biliyorum · 30 gün sorma</button>';
    return {t:'Kelime tekrarı',b:b};
  }
  if(cu.type==='recall'){
    if(W.step==='q')return {t:'Kelime tekrarı',b:b+'<div class="card rv front"><div class="src">'+esc(srcLabel(c))+'</div><div class="ask">Almancası ne?</div><div class="tr">'+esc(c.tr)+'</div>'+
      '<p class="note">Önce kafanda söyle (artikeliyle), sonra kontrol et.</p></div><button class="btn dark big wide" data-act="rvshow">Göster</button>'};
    return {t:'Kelime tekrarı',b:b+'<div class="card rv">'+rvCard(c,true)+'</div><div class="ask center">Doğru hatırladın mı?</div>'+
      '<div class="row"><button class="btn big wide" style="border-color:var(--bad)" data-act="rvself" data-v="0">Hayır</button><button class="btn big wide" style="border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))" data-act="rvself" data-v="1">Evet</button></div>'};
  }
  var de2tr=cu.type==='de2tr';
  b+='<div class="card rv"><div class="src">'+esc(srcLabel(c))+'</div><div class="ask">'+(de2tr?'Türkçesi hangisi?':'Almancası hangisi?')+'</div>'+
    (de2tr?'<div class="word" lang="de">'+deLabel(c)+'</div>':'<div class="tr">'+esc(c.tr)+'</div>')+'</div>';
  b+='<div class="opts">'+cu.o.map(function(o){var cl=W.pick?(o===cu.right?'ok':o===W.pick?'no':''):'';return '<button'+(de2tr?'':' lang="de"')+' class="'+cl+'" data-act="rvpick" data-v="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';
  if(W.pick){var ok=W.pick===cu.right;
    b+='<div class="row"><b class="res" style="flex:1;color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'Richtig!':'Yanlış · birazdan yine sorulacak')+'</b><button class="btn dark big" style="flex:1" data-act="rvnext">Devam</button></div>'+
      '<div class="card rv" style="padding:14px">'+rvCard(c,false)+'</div>';}
  return {t:'Kelime tekrarı',b:b};
}
function rvAdvance(requeue){
  var id=W.q.shift();if(requeue)W.q.splice(Math.min(3,W.q.length),0,id);
  W.cur=null;W.pick=null;W.step='q';drawPage();$('page').scrollTop=0;setStreak();
  if(!W.q.length&&wordDone(peek(today())))toast('Kelime görevi tamam · +30 puan');

/* --- alıştırma: kelimelerle cümle kur --- */
function wordSatzItems(n){
  var ids=Object.keys(S.srs).map(card).filter(Boolean),c=[];
  function ok(e){if(!e.ex)return false;var k=plain(e.ex).split(/\s+/).length;return k>=4&&k<=10;}
  shuffle(ids).forEach(function(e){if(ok(e))c.push(e);});
  if(c.length<n)shuffle(POOL.slice()).forEach(function(e){if(c.length<n*3&&ok(e)&&S.set.lv[e.l]&&c.indexOf(e)<0)c.push(e);});
  return c.slice(0,n).map(function(e){var a=ART(e.a);return {t:'sz',de:plain(e.ex),tr:'İpucu: '+(a?a+' ':'')+e.w+' = '+e.tr};});
}
function pSatz(){
  var n=X.items.length,b='';
  if(X.i>=n)return {t:'Satzbau',b:'<div class="center" style="padding:20px 0"><div class="big">'+X.ok+' / '+n+'</div><p class="muted" style="margin-top:6px">Cümle kurma bitti.</p></div><button class="btn big wide" data-act="satzw">Yeniden</button><button class="btn lime big wide" data-act="close">Bitti</button>'};
  b=progBar(X.i,n)+satzBody(X,X.items[X.i]);
  return {t:'Satzbau · cümle kur',b:b};
}

/* --- Lücke --- */
function startLuck(){
  var ids=Object.keys(S.srs).map(card).filter(function(e){return e&&/\*[^*]+\*/.test(e.ex||'');});
  var c=shuffle(ids).slice(0,10);
  if(c.length<10)shuffle(POOL.filter(function(e){return S.set.lv[e.l]&&/\*[^*]+\*/.test(e.ex);})).forEach(function(e){if(c.length<10&&c.indexOf(e)<0)c.push(e);});
  var items=c.map(function(e){
    var m=e.ex.match(/^(.*?)\*([^*]+)\*(.*)$/),ans=m[2],opts=[ans],guard=0,same=POOL.filter(function(o){return o.p===e.p&&o!==e;});
    while(opts.length<4&&guard++<60){var o=same[Math.floor(Math.random()*same.length)];if(!o)break;var mm=o.ex.match(/\*([^*]+)\*/);if(mm&&opts.indexOf(mm[1])<0)opts.push(mm[1]);}
    return {e:e,pre:m[1].replace(/\*/g,''),ans:ans,post:m[3].replace(/\*/g,''),opts:shuffle(opts)};
  });
  openPage({kind:'luck',items:items,i:0,ok:0,res:[],pick:null});
}
function pLuck(){
  var n=X.items.length;
  if(X.i>=n)return {t:'Lücke',b:'<div class="center" style="padding:20px 0"><div class="big">'+X.ok+' / '+n+'</div><p class="muted" style="margin-top:6px">Boşluk doldurma bitti.</p></div><button class="btn big wide" data-act="luecke">Yeniden</button><button class="btn lime big wide" data-act="close">Bitti</button>'};

function lookDe(t){
  var toks=(t.toLowerCase().match(/[a-zäöüß]{3,}/g)||[]),seen={},found=[],unk=[];
  toks.forEach(function(w){if(seen[w]||STOPDE[w])return;seen[w]=1;
    var cands=[w,w.replace(/(en|er|es|em|e|n|s|st|t|et)$/,''),w+'en',w+'n',w.replace(/(e|st|t|et)$/,'')+'en'],hit=null;
    for(var i=0;i<POOL.length&&!hit;i++){var e=POOL[i],lw=e.w.toLowerCase();if(cands.indexOf(lw)>=0)hit=e;}
    if(hit){if(found.indexOf(hit)<0)found.push(hit);}else unk.push(w);});
  return {found:found.slice(0,12),unk:unk.slice(0,12)};
}
function lookTr(t){
  var toks=(t.toLowerCase().replace(/[^a-zçğıöşüâîû ]/g,' ').split(/\s+/).filter(function(w){return w.length>=4;})),out=[],seen={};
  toks.forEach(function(w){var st=w.slice(0,Math.min(5,Math.max(4,w.length-2)));
    POOL.forEach(function(e){if(out.length>=10||seen[e.id])return;
      var parts=e.tr.toLowerCase().split(/[ ,;·()\/]+/);
      for(var i=0;i<parts.length;i++)if(parts[i].length>=4&&parts[i].indexOf(st)===0){seen[e.id]=1;out.push(e);break;}});});
  out.sort(function(a,b){return a.l-b.l;});

  if(ids.length>1&&ids.indexOf('g1')>=0)ids.splice(ids.indexOf('g1'),1);
  if((ids.indexOf('g26')>=0||ids.indexOf('g39')>=0)&&ids.indexOf('g14')>=0)ids.splice(ids.indexOf('g14'),1);
  return {de:de,topics:ids,words:de?lookDe(t):{found:lookTr(t),unk:[]}};

function pNote(){

  var b='<div><div class="eyebrow">'+trDate(n.d)+' · '+(n.k==='heard'?'duydum / gördüm':'demek istedim')+'</div><h1 style="font-size:24px"'+(n.k==='heard'?' lang="de"':'')+'>'+esc(n.t)+'</h1></div>'+
    '<div class="eyebrow">Uygulamanın ön analizi</div>'+analysisHtml(n)+
    '<div class="field"><span>Doğrusu / Claude\'un cevabı</span><textarea class="inp" style="min-height:120px" data-in="nans" data-id="'+n.id+'" placeholder="Doğru Almancasını ya da Claude\'un cevabını buraya yapıştır" spellcheck="false">'+esc(n.ans||'')+'</textarea></div>'+
    '<div class="field"><span>Kelime tekrarına eklemek için doğru Almanca cümle</span><input class="inp" id="nde" lang="de" spellcheck="false" placeholder="z. B. Können wir die Besprechung auf morgen verschieben?" value="'+esc(n.de||'')+'"></div>'+
    '<button class="btn dark big wide" data-act="ncard" data-id="'+n.id+'">Cümleyi kelime tekrarına ekle</button>'+
    '<div class="row"><button class="btn wide" data-act="nclaude1" data-id="'+n.id+'">Sadece bunu Claude için kopyala</button><button class="btn wide" data-act="ndone" data-id="'+n.id+'">'+(n.done?'Tekrar aç':'Çözüldü')+'</button></div>'+
    '<button class="link center" style="color:var(--bad)" data-act="ndel" data-id="'+n.id+'">Notu sil</button>';
  return {t:'Not',b:b};
}
function copyText(t,ok){
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok);}catch(e){toast('Kopyalanamadı');}ta.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(ok);},fb);else fb();
}

/* ================= KALIPLAR ================= */
function pKalip(){
  var lv=X.lv||0,cats=[],by={};
  KL.forEach(function(k,i){if(lv&&k[0]!==lv)return;if(!by[k[1]]){by[k[1]]=[];cats.push(k[1]);}by[k[1]].push(i);});
  var b='<div><div class="eyebrow">Kalıplar</div><h1>Hazır cümleler</h1></div><p class="small muted">Kitaplarda az geçen ama her gün işine yarayan kısa cümleler. Tekrarına eklediklerin kelime tekrarında sorulur.</p>'+
    '<div class="seg">'+[[0,'Hepsi'],[1,'A1'],[2,'A2'],[3,'B1']].map(function(o){return '<button class="'+(lv===o[0]?'on':'')+'" data-act="klv" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  cats.forEach(function(c){
    var ids=by[c],rest=ids.filter(function(i){return !S.srs['k:'+i];}).length;
    b+='<div class="card" style="padding:12px 16px 4px"><div class="row"><div class="eyebrow">'+esc(c)+'</div><div class="sp"></div>'+(rest?'<button class="btn sm" data-act="kadd" data-ids="'+ids.join(',')+'">Hepsini ekle ('+rest+')</button>':'<span class="tag ok">eklendi</span>')+'</div>'+
      ids.map(function(i){var k=KL[i],s=S.srs['k:'+i];return '<div class="wl"><div class="w"><b lang="de">'+esc(k[2])+'</b><span>'+esc(k[3])+' · '+LV[k[0]]+'</span></div>'+(s?'<span class="tag'+(s.n>=1?' ok':'')+'">'+(s.n>=1?'öğrenildi':'eklendi')+'</span>':'<button class="btn sm" data-act="kadd" data-ids="'+i+'">+</button>')+'</div>';}).join('')+'</div>';
  });
  return {t:'Kalıplar',b:b};
}

ACT.nk=function(b){var t=$('noteText'),v=t?t.value:'';NK=b.dataset.v;render();var t2=$('noteText');if(t2)t2.value=v;};
ACT.nsave=function(){var t=$('noteText');if(!t||!t.value.trim()){toast('Önce bir şey yaz');return;}var n={id:'n'+(++S.seq),d:today(),k:NK,t:t.value.trim()};S.notes.push(n);save();render();openPage({kind:'note',id:n.id});};
ACT.note=function(b){openPage({kind:'note',id:b.dataset.id});};
ACT.nclaude=function(){var o=S.notes.filter(function(n){return !n.done;});if(!o.length)return;copyText(claudePrompt(o),'Kopyalandı · Claude\'a yapıştır');};
ACT.nclaude1=function(b){var o=S.notes.filter(function(n){return n.id===b.dataset.id;});copyText(claudePrompt(o),'Kopyalandı · Claude\'a yapıştır');};
ACT.ndone=function(b){S.notes.forEach(function(n){if(n.id===b.dataset.id)n.done=!n.done;});save();drawPage();};
ACT.ndel=function(b){if(!confirm('Not silinsin mi?'))return;S.notes=S.notes.filter(function(n){return n.id!==b.dataset.id;});save();closePage();};
ACT.ncard=function(b){
  var n=null;S.notes.forEach(function(x){if(x.id===b.dataset.id)n=x;});var de=($('nde').value||'').trim();
  if(!de){toast('Önce doğru Almanca cümleyi yaz');return;}
  n.de=de;var id='m:'+(++S.seq),t=today();
  S.mine.push({id:id,a:'',w:de,f:'',tr:n.k==='say'?n.t:(n.ans||'').slice(0,120)||'Defterimden',ex:'',src:'defter',p:'x',l:0});
  S.srs[id]={i:0,e:2.5,n:0,d:t,a:t};n.done=true;save();if(W.q&&W.day===t){W.q.push(id);W.n0=(W.n0||0)+1;}
  drawPage();toast('Kelime tekrarına eklendi');
};
ACT.kalip=function(){openPage({kind:'kalip',lv:0});};
ACT.klv=function(b){X.lv=+b.dataset.v;drawPage();};
ACT.kadd=function(b){var t=today(),n=0,redraw=X?drawPage:render;b.dataset.ids.split(',').forEach(function(i){var k='k:'+i;if(!S.srs[k]){S.srs[k]={i:0,e:2.5,n:0,d:t,a:t};n++;if(W.q&&W.day===t){W.q.push(k);W.n0=(W.n0||0)+1;}}});save();redraw();toast(n+' kalıp tekrarına eklendi');};

/* ---------------- başlat ---------------- */
applyTheme();
load();
parsePool();
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
window.WORT={get S(){return S;},POOL:POOL,G:G,total:total,streak:streak,rule:rule,plural:plural,tprog:tprog,levels:levels};
})();
</script>
